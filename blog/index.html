<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — Pulsly</title>
  <meta name="description" content="Neuigkeiten, Tipps und Einblicke rund um Pulsly, Fitness und Outdoor-Training." />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="/shared/pulsly-styles.css" />
  <style>
    .blog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      margin-top: 56px;
    }
    .blog-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      text-decoration: none;
      display: block;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }
    .blog-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      border-color: var(--glass-border);
      text-decoration: none;
    }
    .blog-card-date {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .blog-card-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .blog-card-teaser {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="pulsly-nav"></div>

  <section class="section">
    <div class="container">
      <h1 class="section-title">Blog</h1>
      <p class="section-subtitle">Neuigkeiten, Tipps und Einblicke</p>

      <div class="blog-grid">
        <a href="/blog/2026-04-06-pulsly-relaunch" class="blog-card">
          <div class="blog-card-date">6. April 2026</div>
          <div class="blog-card-title">Von Projekt Fit zu Pulsly</div>
          <p class="blog-card-teaser">Warum wir uns umbenennen und was sich ändert.</p>
        </a>
      </div>
    </div>
  </section>

  <div id="pulsly-footer"></div>

  <script src="/shared/pulsly-nav.js"></script>
  <script>
    renderPulslyNav('blog');
    renderPulslyFooter();
  </script>
</body>
</html>
