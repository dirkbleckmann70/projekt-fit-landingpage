<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verfügbarkeit – Trainer-Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="../shared/tabler-custom.css">
  <style>
    /* ── Availability Grid (unique to this page) ─── */
    .avail-day-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--tblr-border-color);
    }
    .avail-day-row:last-child { border-bottom: none; }
    .avail-day-label {
      width: 36px;
      font-size: 13px;
      font-weight: 700;
      color: var(--tblr-secondary-color);
      padding-top: 8px;
      flex-shrink: 0;
    }
    .avail-slots {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      flex: 1;
    }
    .avail-slot {
      width: 38px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      background: rgba(255,255,255,0.03);
      color: var(--tblr-secondary-color);
      border: 1px solid transparent;
      transition: all 0.12s;
      user-select: none;
    }
    .avail-slot:hover { background: rgba(255,255,255,0.06); }
    .avail-slot.active {
      background: rgba(64,145,108,0.2);
      border-color: var(--tblr-primary);
      color: var(--tblr-primary);
      font-weight: 700;
    }
  </style>
</head>
<body class="page">
<script src="../shared/theme.js"></script>

<div id="sidebar"></div>

<div class="page-wrapper">
  <div class="page-header d-print-none" id="header"></div>
  <div class="page-body" style="padding-bottom:80px">
    <div class="container-xl">

      <div id="alert-box" class="alert d-none"></div>

      <!-- Urlaubs-Toggle -->
      <div class="card mb-3">
        <div class="card-body d-flex align-items-center justify-content-between">
          <div>
            <div style="font-size:15px;font-weight:700" id="status-label">Status wird geladen...</div>
            <small class="form-hint">Wenn deaktiviert, bist du für Kunden nicht sichtbar.</small>
          </div>
          <button class="btn btn-sm" id="toggle-btn" onclick="toggleAvailability()" disabled>
            <span class="spinner-border spinner-border-sm"></span>
          </button>
        </div>
      </div>

      <!-- Wochenkalender -->
      <div class="card mb-3">
        <div class="card-header">
          <h3 class="card-title">Wöchentliche Verfügbarkeit</h3>
        </div>
        <div class="card-body">
          <small class="form-hint d-block mb-3">Tippe auf Zeitslots um sie zu aktivieren/deaktivieren</small>
          <div id="avail-grid">
            <div class="spinner-border spinner-border-sm me-2"></div> Laden...
          </div>
        </div>
      </div>

      <button class="btn btn-primary w-100 btn-lg mb-3" id="save-btn" onclick="saveAvailability()" disabled>
        Verfügbarkeit speichern
      </button>

    </div>
  </div>
</div>

<div id="bottom-nav"></div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/js/tabler.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/constants.js"></script>
<script src="../shared/layout.js"></script>
<script src="../shared/toast.js"></script>
<script src="auth-check.js"></script>
<script>
  // ISO 8601: 1=Mo, 2=Di, 3=Mi, 4=Do, 5=Fr, 6=Sa, 7=So
  const DAYS = { 1: 'Mo', 2: 'Di', 3: 'Mi', 4: 'Do', 5: 'Fr', 6: 'Sa', 7: 'So' };
  const DAY_NAMES = { 1: 'Montag', 2: 'Dienstag', 3: 'Mittwoch', 4: 'Donnerstag', 5: 'Freitag', 6: 'Samstag', 7: 'Sonntag' };
  const HOURS = [];
  for (let h = 5; h <= 22; h++) HOURS.push(h);

  const DISPLAY_ORDER = [1, 2, 3, 4, 5, 6, 7];

  function toISODay(d) { return d.getDay() === 0 ? 7 : d.getDay(); }

  let availState = {};
  Object.values(DAYS).forEach(d => availState[d] = []);

  let isMouseDown = false;
  let paintMode = true;

  (async () => {
    const trainer = await checkTrainerAuth();
    if (!trainer) return;

    document.getElementById('sidebar').innerHTML = renderTrainerSidebar('availability');
    document.getElementById('bottom-nav').innerHTML = renderTrainerBottomNav('availability');
    document.getElementById('header').innerHTML = renderTrainerHeader('Verfügbarkeit');
    initRealtimeToasts(getSupabase(), 'trainer');

    if (!trainer.id) {
      document.getElementById('avail-grid').innerHTML =
        '<div class="text-center text-secondary py-3">Kein Trainer-Profil verknüpft.</div>';
      return;
    }

    // ─── Status Toggle ────────────────────────────────────────────
    updateStatusUI(trainer.is_active);
    document.getElementById('toggle-btn').disabled = false;

    // ─── Verfügbarkeit laden ──────────────────────────────────────
    await loadAvailability();
    renderGrid();
    document.getElementById('save-btn').disabled = false;
  })();

  function updateStatusUI(isActive) {
    const label = document.getElementById('status-label');
    const btn = document.getElementById('toggle-btn');

    if (isActive) {
      label.textContent = 'Ich bin verfügbar';
      label.style.color = 'var(--tblr-primary)';
      btn.className = 'btn btn-danger btn-sm';
      btn.textContent = 'Deaktivieren';
    } else {
      label.textContent = 'Ich bin im Urlaub / Pause';
      label.style.color = 'var(--tblr-danger)';
      btn.className = 'btn btn-success btn-sm';
      btn.textContent = 'Aktivieren';
    }
  }

  async function toggleAvailability() {
    const sb = getSupabase();
    const trainer = window.currentTrainer;
    const newState = !trainer.is_active;

    const btn = document.getElementById('toggle-btn');
    btn.disabled = true;

    try {
      const { error } = await sb
        .from('trainer_profiles')
        .update({ is_active: newState })
        .eq('id', trainer.id);

      if (error) throw error;

      trainer.is_active = newState;
      updateStatusUI(newState);
      showAlert('alert-box', newState ? 'Du bist jetzt verfügbar!' : 'Du bist jetzt auf Pause.', 'success');
    } catch (err) {
      showAlert('alert-box', 'Fehler: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  }

  // ─── Availability laden ─────────────────────────────────────────
  async function loadAvailability() {
    const sb = getSupabase();
    try {
      const { data, error } = await sb
        .from('trainer_availability')
        .select('*')
        .eq('trainer_id', window.currentTrainer.id);

      if (error) {
        if (error.code === '42P01') return;
        throw error;
      }

      (data || []).forEach(row => {
        const dayIndex = row.day_of_week;
        if (dayIndex >= 1 && dayIndex <= 7) {
          const dayKey = DAYS[dayIndex];
          const startHour = row.start_hour;
          const endHour = row.end_hour;
          if (startHour != null && endHour != null) {
            for (let h = startHour; h < endHour; h++) {
              if (!availState[dayKey].includes(h)) {
                availState[dayKey].push(h);
              }
            }
          }
        }
      });
    } catch (err) {
      console.error('Verfügbarkeit laden:', err);
    }
  }

  // ─── Grid rendern ───────────────────────────────────────────────
  function renderGrid() {
    const grid = document.getElementById('avail-grid');

    grid.innerHTML = DISPLAY_ORDER.map(isoDay => {
      const day = DAYS[isoDay];
      return `
      <div class="avail-day-row">
        <div class="avail-day-label">${day}</div>
        <div class="avail-slots">
          ${HOURS.map(h => {
            const isActive = availState[day].includes(h);
            return `<div class="avail-slot ${isActive ? 'active' : ''}"
              data-day="${day}" data-hour="${h}"
              onmousedown="startPaint(event, '${day}', ${h})"
              onmouseenter="continuePaint(event, '${day}', ${h})"
              ontouchstart="startPaint(event, '${day}', ${h})"
              ontouchmove="handleTouchMove(event)"
            >${h}:00</div>`;
          }).join('')}
        </div>
      </div>
    `}).join('');

    document.addEventListener('mouseup', () => { isMouseDown = false; });
    document.addEventListener('touchend', () => { isMouseDown = false; });
  }

  function startPaint(e, day, hour) {
    e.preventDefault();
    isMouseDown = true;
    const isActive = availState[day].includes(hour);
    paintMode = !isActive;
    toggleSlot(day, hour);
  }

  function continuePaint(e, day, hour) {
    if (!isMouseDown) return;
    toggleSlot(day, hour);
  }

  function handleTouchMove(e) {
    e.preventDefault();
    const touch = e.touches[0];
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    if (el && el.classList.contains('avail-slot')) {
      const day = el.dataset.day;
      const hour = parseInt(el.dataset.hour);
      toggleSlot(day, hour);
    }
  }

  function toggleSlot(day, hour) {
    const idx = availState[day].indexOf(hour);
    if (paintMode && idx === -1) {
      availState[day].push(hour);
    } else if (!paintMode && idx !== -1) {
      availState[day].splice(idx, 1);
    }

    const el = document.querySelector(`[data-day="${day}"][data-hour="${hour}"]`);
    if (el) {
      el.classList.toggle('active', availState[day].includes(hour));
    }
  }

  // ─── Speichern ──────────────────────────────────────────────────
  async function saveAvailability() {
    const btn = document.getElementById('save-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Wird gespeichert...';

    const sb = getSupabase();
    const trainerId = window.currentTrainer.id;

    try {
      const { error: delError } = await sb
        .from('trainer_availability')
        .delete()
        .eq('trainer_id', trainerId);

      if (delError && delError.code !== '42P01') {
        console.error('Delete error:', delError);
        if (delError.message?.includes('row-level security') || delError.code === '42501') {
          throw new Error('Keine Berechtigung zum Löschen. Bitte den Admin kontaktieren (RLS-Konfiguration fehlt).');
        }
        throw delError;
      }

      const rows = [];
      DISPLAY_ORDER.forEach(isoDay => {
        const day = DAYS[isoDay];
        const hours = availState[day].sort((a, b) => a - b);
        if (hours.length === 0) return;

        let blockStart = hours[0];
        let prev = hours[0];

        for (let i = 1; i <= hours.length; i++) {
          if (i === hours.length || hours[i] !== prev + 1) {
            rows.push({
              trainer_id: trainerId,
              day_of_week: isoDay,
              start_hour: blockStart,
              end_hour: prev + 1,
              is_active: true,
            });
            if (i < hours.length) blockStart = hours[i];
          }
          if (i < hours.length) prev = hours[i];
        }
      });

      if (rows.length > 0) {
        const { error: insError } = await sb
          .from('trainer_availability')
          .insert(rows);

        if (insError) {
          console.error('Insert error:', insError, 'Rows:', JSON.stringify(rows));
          if (insError.message?.includes('row-level security') || insError.code === '42501') {
            throw new Error('Keine Berechtigung. Bitte den Admin kontaktieren (RLS-Konfiguration fehlt).');
          }
          throw new Error('Speichern fehlgeschlagen: ' + (insError.message || 'Unbekannter Fehler'));
        }
      }

      showAlert('alert-box', 'Verfügbarkeit gespeichert!', 'success');
    } catch (err) {
      showAlert('alert-box', 'Fehler: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Verfügbarkeit speichern';
    }
  }
</script>

</body>
</html>
