<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finanzen – Trainer-Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="../shared/tabler-custom.css">
  <style>
    .fin-month-highlight td { background: rgba(64,145,108,0.07); }
    .fin-total-row td {
      font-weight: 700;
      border-top: 1px solid rgba(255,255,255,0.12) !important;
    }
  </style>
</head>
<body class="page">
<script src="../shared/theme.js"></script>

<div id="sidebar"></div>

<div class="page-wrapper">
  <div class="page-header d-print-none" id="header"></div>
  <div class="page-body" style="padding-bottom:80px">
    <div class="container-xl">

      <div class="d-flex align-items-center justify-content-between mb-3">
        <div class="d-flex align-items-center gap-2">
          <a href="/trainer-portal/invoices.html" class="btn btn-ghost-secondary btn-sm">Gutschriften</a>
          <select id="year-select" class="form-select" style="width:auto" onchange="onYearChange()"></select>
          <button class="btn btn-ghost-secondary btn-sm" onclick="exportCSV()"><i class="ti ti-download me-1"></i>CSV Export</button>
        </div>
      </div>

      <!-- Ebene 1: Jahres-KPIs -->
      <div class="row row-deck row-cards mb-3">
        <div class="col-6 col-lg">
          <div class="card"><div class="card-body">
            <div class="kpi-label">Vergütung brutto</div>
            <div class="kpi-value" id="kpi-brutto"><div class="spinner-border spinner-border-sm"></div></div>
          </div></div>
        </div>
        <div class="col-6 col-lg">
          <div class="card"><div class="card-body">
            <div class="kpi-label" id="kpi-mwst-label">MwSt 19%</div>
            <div class="kpi-value" id="kpi-mwst"><div class="spinner-border spinner-border-sm"></div></div>
          </div></div>
        </div>
        <div class="col-6 col-lg">
          <div class="card"><div class="card-body">
            <div class="kpi-label">Vergütung netto</div>
            <div class="kpi-value" id="kpi-netto"><div class="spinner-border spinner-border-sm"></div></div>
          </div></div>
        </div>
        <div class="col-6 col-lg">
          <div class="card"><div class="card-body">
            <div class="kpi-label">Abzüge</div>
            <div class="kpi-value" id="kpi-abzuege"><div class="spinner-border spinner-border-sm"></div></div>
          </div></div>
        </div>
        <div class="col-6 col-lg">
          <div class="card"><div class="card-body">
            <div class="kpi-label">Auszahlung</div>
            <div class="kpi-value" style="color:var(--tblr-primary)" id="kpi-auszahlung"><div class="spinner-border spinner-border-sm"></div></div>
          </div></div>
        </div>
      </div>

      <!-- Ebene 2: Monatsübersicht -->
      <div class="card mb-3">
        <div class="card-header"><h3 class="card-title">Monatsübersicht</h3></div>
        <div class="table-responsive">
          <table class="table table-vcenter card-table" id="month-table">
            <thead>
              <tr>
                <th>Monat</th>
                <th>Trainings</th>
                <th>Vergütung brutto</th>
                <th>MwSt</th>
                <th>Vergütung netto</th>
                <th>Abzüge</th>
                <th>Auszahlung</th>
              </tr>
            </thead>
            <tbody id="month-body">
              <tr><td colspan="7" class="text-center"><div class="spinner-border spinner-border-sm me-2"></div> Laden...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Ebene 3: Einzelbuchungen -->
      <div class="card mb-3">
        <div class="card-header"><h3 class="card-title">Einzelbuchungen</h3></div>
        <div class="table-responsive">
          <table class="table table-vcenter card-table" id="finance-table">
            <thead>
              <tr id="finance-sum-row" style="display:none;font-size:12px" class="text-secondary">
                <td colspan="6" style="text-align:right;font-style:italic" id="fin-count-cell"></td>
                <td style="font-weight:700;color:var(--tblr-primary)" id="fin-vergutung-sum"></td>
                <td></td>
              </tr>
              <tr>
                <th>Datum</th>
                <th>Uhrzeit</th>
                <th>Kunde</th>
                <th>Art</th>
                <th>Stadt</th>
                <th>Status</th>
                <th>Vergütung</th>
                <th>Details</th>
              </tr>
            </thead>
            <tbody id="revenue-body">
              <tr><td colspan="8" class="text-center"><div class="spinner-border spinner-border-sm me-2"></div> Daten werden geladen...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<div id="bottom-nav"></div>

<!-- Detail Modal -->
<div class="modal modal-blur fade" id="finance-detail-modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Buchungs-Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="finance-modal-body"></div>
      <div class="modal-footer">
        <button class="btn btn-ghost-secondary btn-sm" data-bs-dismiss="modal">Schließen</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/js/tabler.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/constants.js"></script>
<script src="../shared/layout.js"></script>
<script src="../shared/toast.js"></script>
<script src="../shared/table-utils.js"></script>
<script src="auth-check.js"></script>
<script>
  let allData      = [];
  let yearData     = [];
  let tableFilter  = null;
  let selectedYear = new Date().getFullYear();
  let _trainerRate = 0;
  let _mwstSatz    = 19;

  const FIN_CANCELLED = ['cancelled', 'refunded', 'cancelled_by_trainer'];
  const MONTHS_DE     = ['Januar','Februar','März','April','Mai','Juni','Juli','August',
                         'September','Oktober','November','Dezember'];

  function effBrutto(b)     { return b.status === 'completed' ? (b.trainer_payout_cents ?? _trainerRate) : 0; }
  function effNetto(b)      { return _mwstSatz > 0 ? Math.round(effBrutto(b) / (1 + _mwstSatz / 100)) : effBrutto(b); }
  function effMwSt(b)       { return effBrutto(b) - effNetto(b); }
  function effAuszahlung(b) { return effNetto(b); }

  function f(cents) {
    return (cents / 100).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
  }

  function vergütungCell(b) {
    if (FIN_CANCELLED.includes((b.status || '').toLowerCase()))
      return '<span class="text-secondary">0,00 €</span>';
    if (b.status === 'expired')
      return '<span style="color:var(--tblr-warning)">0,00 € (ausstehend)</span>';
    if (b.status === 'pending' || b.status === 'confirmed')
      return '<span class="text-secondary">–</span>';
    const v = b.trainer_payout_cents ?? _trainerRate;
    return `<span style="color:var(--tblr-primary);font-weight:600">${f(v)}</span>`;
  }

  (async () => {
    const trainer = await checkTrainerAuth();
    if (!trainer) return;

    document.getElementById('sidebar').innerHTML = renderTrainerSidebar('finances');
    document.getElementById('bottom-nav').innerHTML = renderTrainerBottomNav('finances');
    document.getElementById('header').innerHTML = renderTrainerHeader('Finanzen', window.currentTrainer?.email || '');
    initRealtimeToasts(getSupabase(), 'trainer');

    if (!trainer.id) {
      ['kpi-brutto','kpi-mwst','kpi-netto','kpi-abzuege','kpi-auszahlung'].forEach(id =>
        document.getElementById(id).textContent = '–');
      document.getElementById('month-body').innerHTML =
        '<tr><td colspan="7" class="text-secondary" style="padding:16px">Kein Trainer-Profil verknüpft.</td></tr>';
      return;
    }

    _trainerRate = trainer.payout_cents || 0;
    _mwstSatz    = trainer.mwst_satz ?? 19;
    await loadFinances(trainer.id);
  })();

  async function loadFinances(trainerId) {
    const sb = getSupabase();
    try {
      const { data, error } = await sb
        .from('bookings')
        .select('id, scheduled_date, scheduled_time, customer_id, location_name, location_address, status, trainer_payout_cents, booking_type, notes, created_at')
        .eq('trainer_id', trainerId)
        .order('scheduled_date', { ascending: false });

      if (error) throw error;

      const customerIds = [...new Set((data || []).map(b => b.customer_id).filter(Boolean))];
      const customerNames = {};
      if (customerIds.length > 0) {
        const { data: customers } = await sb
          .from('customers')
          .select('id, first_name, last_name, full_name')
          .in('id', customerIds);
        (customers || []).forEach(c => {
          customerNames[c.id] = c.full_name || [c.first_name, c.last_name].filter(Boolean).join(' ') || 'Kunde';
        });
      }

      allData = (data || []).map(b => ({
        ...b,
        customer_name: customerNames[b.customer_id] || 'Kunde',
      }));

      const years = [...new Set(allData.map(b => (b.scheduled_date || '').slice(0, 4)).filter(Boolean))].sort().reverse();
      if (!years.includes(String(selectedYear))) years.unshift(String(selectedYear));
      const sel = document.getElementById('year-select');
      sel.innerHTML = years.map(y =>
        `<option value="${y}"${y == selectedYear ? ' selected' : ''}>${y}</option>`
      ).join('');

      applyYearFilter();
    } catch (err) {
      document.getElementById('revenue-body').innerHTML =
        `<tr><td colspan="8" class="text-danger" style="padding:20px">Fehler: ${err.message}</td></tr>`;
      ['kpi-brutto','kpi-mwst','kpi-netto','kpi-abzuege','kpi-auszahlung'].forEach(id =>
        document.getElementById(id).textContent = '–');
    }
  }

  function onYearChange() {
    selectedYear = parseInt(document.getElementById('year-select').value);
    applyYearFilter();
  }

  function applyYearFilter() {
    yearData = allData.filter(b => (b.scheduled_date || '').startsWith(String(selectedYear)));
    updateKPIs();
    renderMonthTable();

    if (!tableFilter) {
      tableFilter = initSortableTable('finance-table', [
        { key: 'date',       type: 'date',   getValue: b => b.scheduled_date || '' },
        { key: 'time',       type: 'select', getValue: b => (b.scheduled_time || '').slice(0, 5) },
        { key: 'customer',   type: 'text',   getValue: b => b.customer_name || '' },
        { key: 'type',       type: 'select', getValue: b => b.booking_type === 'group' ? 'GT' : 'PT' },
        { key: 'city',       type: 'select', getValue: b => b.location_name || '' },
        { key: 'status',     type: 'select', getValue: b => b.status || '' },
        { key: 'verguetung', type: 'number', getValue: b => effBrutto(b) / 100 },
        null,
      ]);
      tableFilter.onFilterChange(() => renderBookingsTable());
    }
    renderBookingsTable();
  }

  function updateKPIs() {
    const brutto  = yearData.reduce((s, b) => s + effBrutto(b), 0);
    const netto   = _mwstSatz > 0 ? Math.round(brutto / (1 + _mwstSatz / 100)) : brutto;
    const mwst    = brutto - netto;
    document.getElementById('kpi-brutto').textContent    = f(brutto);
    document.getElementById('kpi-mwst-label').textContent = `MwSt ${_mwstSatz}%`;
    document.getElementById('kpi-mwst').textContent      = f(mwst);
    document.getElementById('kpi-netto').textContent     = f(netto);
    document.getElementById('kpi-abzuege').textContent   = f(0);
    document.getElementById('kpi-auszahlung').textContent = f(netto);
  }

  function renderMonthTable() {
    const now          = new Date();
    const currentMonth = now.getFullYear() === selectedYear ? now.getMonth() : -1;
    let totCount = 0, totB = 0, totM = 0, totN = 0;

    const rows = MONTHS_DE.map((name, mi) => {
      const prefix = `${selectedYear}-${String(mi + 1).padStart(2, '0')}`;
      const mb     = yearData.filter(b => (b.scheduled_date || '').startsWith(prefix));
      const count  = mb.length;
      const brutto = mb.reduce((s, b) => s + effBrutto(b), 0);
      const netto  = _mwstSatz > 0 ? Math.round(brutto / (1 + _mwstSatz / 100)) : brutto;
      const mwst   = brutto - netto;
      totCount += count; totB += brutto; totM += mwst; totN += netto;

      const cls = mi === currentMonth ? ' class="fin-month-highlight"' : '';
      if (count === 0) {
        return `<tr${cls}><td>${name}</td><td class="text-secondary">–</td><td class="text-secondary">–</td><td class="text-secondary">–</td><td class="text-secondary">–</td><td class="text-secondary">–</td><td class="text-secondary">–</td></tr>`;
      }
      return `<tr${cls}>
        <td>${name}</td>
        <td>${count}</td>
        <td>${f(brutto)}</td>
        <td class="text-secondary">${f(mwst)}</td>
        <td>${f(netto)}</td>
        <td class="text-secondary">${f(0)}</td>
        <td>${f(netto)}</td>
      </tr>`;
    });

    rows.push(`<tr class="fin-total-row">
      <td>Gesamt ${selectedYear}</td>
      <td>${totCount}</td>
      <td>${f(totB)}</td>
      <td>${f(totM)}</td>
      <td>${f(totN)}</td>
      <td>${f(0)}</td>
      <td>${f(totN)}</td>
    </tr>`);

    document.getElementById('month-body').innerHTML = rows.join('');
  }

  function renderBookingsTable() {
    const filtered = tableFilter ? tableFilter.apply(yearData) : yearData;
    const tbody    = document.getElementById('revenue-body');
    const sumRow   = document.getElementById('finance-sum-row');

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center text-secondary" style="padding:24px">Keine Buchungen gefunden</td></tr>';
      sumRow.style.display = 'none';
      return;
    }

    tbody.innerHTML = filtered.map(b => {
      const city     = b.location_name || b.location_address || '–';
      const artBadge = b.booking_type === 'group'
        ? '<span class="badge" style="background:rgba(64,145,108,0.12);color:var(--tblr-primary)">GT</span>'
        : '<span class="badge" style="background:rgba(46,117,182,0.12);color:#5BB8FF">PT</span>';
      return `<tr>
        <td style="white-space:nowrap">${formatDate(b.scheduled_date)}</td>
        <td style="white-space:nowrap" class="text-secondary">${b.scheduled_time ? b.scheduled_time.slice(0,5) : '–'}</td>
        <td>${b.customer_name || '–'}</td>
        <td>${artBadge}</td>
        <td>${city}</td>
        <td>${statusBadge(b.status)}</td>
        <td>${vergütungCell(b)}</td>
        <td><button class="btn btn-ghost-secondary btn-sm" onclick="openFinanceDetail('${b.id}')">Details</button></td>
      </tr>`;
    }).join('');

    const sumB = filtered.reduce((s, b) => s + effBrutto(b), 0);
    sumRow.style.display = '';
    document.getElementById('fin-count-cell').textContent   = `${filtered.length} von ${yearData.length} Buchungen`;
    document.getElementById('fin-vergutung-sum').textContent = f(sumB);
  }

  function exportCSV() {
    if (yearData.length === 0) { alert('Keine Daten für ' + selectedYear + '.'); return; }
    const headers = ['Datum','Uhrzeit','Kunde','Art','Stadt','Status',
                     'Vergütung brutto (EUR)','MwSt (EUR)','Vergütung netto (EUR)','Auszahlung (EUR)'];
    const rows = yearData.map(b => [
      b.scheduled_date || '',
      b.scheduled_time ? b.scheduled_time.slice(0, 5) : '',
      b.customer_name  || '',
      b.booking_type === 'group' ? 'GT' : 'PT',
      b.location_name || '',
      b.status || '',
      (effBrutto(b)     / 100).toFixed(2).replace('.', ','),
      (effMwSt(b)       / 100).toFixed(2).replace('.', ','),
      (effNetto(b)      / 100).toFixed(2).replace('.', ','),
      (effAuszahlung(b) / 100).toFixed(2).replace('.', ','),
    ]);
    let csv = '\uFEFF' + headers.join(';') + '\n';
    rows.forEach(r => { csv += r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';') + '\n'; });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = `trainer-finanzen-${selectedYear}.csv`; a.click();
    URL.revokeObjectURL(url);
  }

  let _financeModal;
  function openFinanceDetail(id) {
    const b = allData.find(x => x.id === id);
    if (!b) return;
    const brutto = effBrutto(b);
    const netto  = effNetto(b);
    const mwst   = effMwSt(b);
    document.getElementById('finance-modal-body').innerHTML = `
      <div class="row mb-3">
        <div class="col-6"><label class="form-label text-secondary">Kunde</label><div>${b.customer_name || '–'}</div></div>
        <div class="col-6"><label class="form-label text-secondary">Art</label><div>${b.booking_type === 'group' ? 'Gruppentraining' : 'Personal Training'}</div></div>
      </div>
      <div class="row mb-3">
        <div class="col-6"><label class="form-label text-secondary">Datum</label><div>${formatDate(b.scheduled_date)}</div></div>
        <div class="col-6"><label class="form-label text-secondary">Uhrzeit</label><div>${b.scheduled_time ? b.scheduled_time.slice(0,5) : '–'}</div></div>
      </div>
      <div class="row mb-3">
        <div class="col-6"><label class="form-label text-secondary">Stadt</label><div>${b.location_name || '–'}</div></div>
        <div class="col-6"><label class="form-label text-secondary">Status</label><div>${statusBadge(b.status)}</div></div>
      </div>
      <div class="row mb-3">
        <div class="col-6"><label class="form-label text-secondary">Vergütung brutto</label><div style="color:var(--tblr-primary);font-weight:700">${f(brutto)}</div></div>
        <div class="col-6"><label class="form-label text-secondary">MwSt (${_mwstSatz}%)</label><div class="text-secondary">${f(mwst)}</div></div>
      </div>
      <div class="row mb-3">
        <div class="col-6"><label class="form-label text-secondary">Vergütung netto</label><div style="font-weight:600">${f(netto)}</div></div>
        <div class="col-6"><label class="form-label text-secondary">Auszahlung</label><div style="color:var(--tblr-primary);font-weight:700">${f(netto)}</div></div>
      </div>
      ${b.notes ? `<div class="mb-3"><label class="form-label text-secondary">Notizen</label><div class="text-secondary" style="font-size:14px">${b.notes}</div></div>` : ''}
      <div class="text-secondary" style="font-size:11px;border-top:1px solid var(--tblr-border-color);padding-top:12px">Buchungs-ID: ${b.id}</div>
    `;
    if (!_financeModal) _financeModal = new bootstrap.Modal(document.getElementById('finance-detail-modal'));
    _financeModal.show();
  }
</script>

</body>
</html>
