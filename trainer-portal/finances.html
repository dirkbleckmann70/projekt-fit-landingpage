<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finanzen – Trainer-Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../shared/table-utils.css">
  <style>
    /* Volle Seitenbreite – überschreibt max-width aus style.css */
    .content { max-width: none !important; }

    .fin-kpi-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .fin-kpi-card {
      flex: 1;
      background: #161625;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 16px 18px;
      min-width: 0;
    }
    .fin-kpi-label {
      font-size: 11px;
      color: #55556A;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
      white-space: nowrap;
    }
    .fin-kpi-value {
      font-size: 20px;
      font-weight: 700;
      color: #F0F0F5;
      letter-spacing: -0.4px;
      white-space: nowrap;
    }
    .fin-month-highlight td { background: rgba(46,117,182,0.07); }
    .fin-total-row td {
      font-weight: 700;
      border-top: 1px solid rgba(255,255,255,0.12) !important;
      color: #F0F0F5;
    }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); z-index: 200;
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 16px; width: 100%; max-width: 560px;
      max-height: 90vh; overflow-y: auto;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 24px; border-bottom: 1px solid #2a2a2a;
    }
    .modal-title  { font-size: 18px; font-weight: 700; }
    .modal-close  { background: none; border: none; color: #55556a; font-size: 24px; cursor: pointer; padding: 4px; line-height: 1; }
    .modal-close:hover { color: #f0f0f5; }
    .modal-body   { padding: 24px; }
    .modal-footer { display: flex; justify-content: flex-end; padding: 16px 24px; border-top: 1px solid #2a2a2a; }
    .detail-row   { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .detail-field label { display: block; font-size: 12px; font-weight: 600; color: #8888a0; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .detail-field .dv   { font-size: 15px; color: #f0f0f5; }
    .detail-id    { font-size: 11px; color: #55556a; margin-top: 16px; padding-top: 16px; border-top: 1px solid #2a2a2a; }
  </style>
</head>
<body>

<header class="top-header" id="top-header"></header>

<div class="content">

  <!-- Kopfzeile -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
    <h1 class="page-title" style="margin:0">Finanzen</h1>
    <div style="display:flex;align-items:center;gap:10px">
      <select id="year-select" class="form-control" style="width:auto;padding:6px 14px;font-size:14px" onchange="onYearChange()"></select>
      <button class="btn btn-ghost btn-sm" onclick="exportCSV()">CSV Export</button>
    </div>
  </div>

  <!-- Ebene 1: Jahres-KPIs -->
  <div class="fin-kpi-bar">
    <div class="fin-kpi-card"><div class="fin-kpi-label">Vergütung brutto</div><div class="fin-kpi-value" id="kpi-brutto"><span class="spinner"></span></div></div>
    <div class="fin-kpi-card"><div class="fin-kpi-label">MwSt 19%</div><div class="fin-kpi-value" id="kpi-mwst"><span class="spinner"></span></div></div>
    <div class="fin-kpi-card"><div class="fin-kpi-label">Vergütung netto</div><div class="fin-kpi-value" id="kpi-netto"><span class="spinner"></span></div></div>
    <div class="fin-kpi-card"><div class="fin-kpi-label">Abzüge</div><div class="fin-kpi-value" id="kpi-abzuege"><span class="spinner"></span></div></div>
    <div class="fin-kpi-card"><div class="fin-kpi-label">Auszahlung</div><div class="fin-kpi-value" style="color:#27ae60" id="kpi-auszahlung"><span class="spinner"></span></div></div>
  </div>

  <!-- Ebene 2: Monatsübersicht -->
  <div class="table-wrap mb-2">
    <div class="table-header">
      <div class="table-title">Monatsübersicht</div>
    </div>
    <table id="month-table">
      <thead>
        <tr>
          <th>Monat</th>
          <th>Trainings</th>
          <th>Vergütung brutto</th>
          <th>MwSt</th>
          <th>Vergütung netto</th>
          <th>Abzüge</th>
          <th>Auszahlung</th>
        </tr>
      </thead>
      <tbody id="month-body">
        <tr><td colspan="7" class="loading-overlay"><span class="spinner"></span> Laden...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Ebene 3: Einzelbuchungen -->
  <div class="table-wrap mb-2">
    <div class="table-header">
      <div class="table-title">Einzelbuchungen</div>
    </div>
    <div style="overflow-x:auto">
      <table id="finance-table">
        <thead>
          <tr id="finance-sum-row" style="display:none;border-bottom:1px solid rgba(255,255,255,0.1);font-size:12px;color:var(--text-secondary)">
            <td colspan="6" style="padding:6px 12px;text-align:right;font-style:italic" id="fin-count-cell"></td>
            <td style="padding:6px 12px;font-weight:700;color:var(--accent)" id="fin-vergutung-sum"></td>
            <td></td>
          </tr>
          <tr>
            <th>Datum</th>
            <th>Uhrzeit</th>
            <th>Kunde</th>
            <th>Art</th>
            <th>Stadt</th>
            <th>Status</th>
            <th>Vergütung</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody id="revenue-body">
          <tr><td colspan="8" class="loading-overlay"><span class="spinner"></span> Daten werden geladen...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<nav class="bottom-nav" id="bottom-nav"></nav>

<!-- Detail Modal -->
<div class="modal-overlay" id="finance-detail-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Buchungs-Details</div>
      <button class="modal-close" onclick="closeFinanceModal()">&times;</button>
    </div>
    <div class="modal-body" id="finance-modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" onclick="closeFinanceModal()">Schließen</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-check.js"></script>
<script src="../shared/table-utils.js"></script>
<script>
  let allData      = [];
  let yearData     = [];
  let tableFilter  = null;
  let selectedYear = new Date().getFullYear();
  let _trainerRate = 0;

  const FIN_CANCELLED = ['cancelled', 'refunded', 'cancelled_by_trainer'];
  const MONTHS_DE     = ['Januar','Februar','März','April','Mai','Juni','Juli','August',
                         'September','Oktober','November','Dezember'];

  // ── Berechnungen ──────────────────────────────────────────────────────────
  function effBrutto(b)     { return b.status === 'completed' ? (b.trainer_payout_cents ?? _trainerRate) : 0; }
  function effNetto(b)      { return Math.round(effBrutto(b) / 1.19); }
  function effMwSt(b)       { return effBrutto(b) - effNetto(b); }
  function effAuszahlung(b) { return effNetto(b); } // Abzüge = 0

  function f(cents) {
    return (cents / 100).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
  }

  function vergütungCell(b) {
    if (FIN_CANCELLED.includes((b.status || '').toLowerCase()))
      return '<span style="color:var(--text-muted)">0,00 €</span>';
    if (b.status === 'pending' || b.status === 'confirmed')
      return '<span style="color:var(--text-muted)">–</span>';
    const v = b.trainer_payout_cents ?? _trainerRate;
    return `<span style="color:var(--accent);font-weight:600">${f(v)}</span>`;
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  (async () => {
    const trainer = await checkTrainerAuth();
    if (!trainer) return;

    document.getElementById('top-header').innerHTML = renderTopHeader();
    document.getElementById('bottom-nav').innerHTML  = renderNav('finances');

    if (!trainer.id) {
      ['kpi-brutto','kpi-mwst','kpi-netto','kpi-abzuege','kpi-auszahlung'].forEach(id =>
        document.getElementById(id).textContent = '–');
      document.getElementById('month-body').innerHTML =
        '<tr><td colspan="7" class="text-muted" style="padding:16px">Kein Trainer-Profil verknüpft.</td></tr>';
      return;
    }

    _trainerRate = trainer.payout_cents || 0;
    await loadFinances(trainer.id);
  })();

  // ── Daten laden ───────────────────────────────────────────────────────────
  async function loadFinances(trainerId) {
    const sb = getSupabase();
    try {
      const { data, error } = await sb
        .from('bookings')
        .select('id, scheduled_date, scheduled_time, customer_id, location_name, location_address, status, trainer_payout_cents, booking_type, notes, created_at')
        .eq('trainer_id', trainerId)
        .order('scheduled_date', { ascending: false });

      if (error) throw error;

      // Kundennamen nachladen
      const customerIds = [...new Set((data || []).map(b => b.customer_id).filter(Boolean))];
      const customerNames = {};
      if (customerIds.length > 0) {
        const { data: customers } = await sb
          .from('customers')
          .select('id, first_name, last_name, full_name')
          .in('id', customerIds);
        (customers || []).forEach(c => {
          customerNames[c.id] = c.full_name || [c.first_name, c.last_name].filter(Boolean).join(' ') || 'Kunde';
        });
      }

      allData = (data || []).map(b => ({
        ...b,
        customer_name: customerNames[b.customer_id] || 'Kunde',
      }));

      // Jahres-Dropdown
      const years = [...new Set(allData.map(b => (b.scheduled_date || '').slice(0, 4)).filter(Boolean))].sort().reverse();
      if (!years.includes(String(selectedYear))) years.unshift(String(selectedYear));
      const sel = document.getElementById('year-select');
      sel.innerHTML = years.map(y =>
        `<option value="${y}"${y == selectedYear ? ' selected' : ''}>${y}</option>`
      ).join('');

      applyYearFilter();
    } catch (err) {
      document.getElementById('revenue-body').innerHTML =
        `<tr><td colspan="8" class="text-error" style="padding:20px">Fehler: ${err.message}</td></tr>`;
      ['kpi-brutto','kpi-mwst','kpi-netto','kpi-abzuege','kpi-auszahlung'].forEach(id =>
        document.getElementById(id).textContent = '–');
    }
  }

  function onYearChange() {
    selectedYear = parseInt(document.getElementById('year-select').value);
    applyYearFilter();
  }

  function applyYearFilter() {
    yearData = allData.filter(b => (b.scheduled_date || '').startsWith(String(selectedYear)));
    updateKPIs();
    renderMonthTable();

    if (!tableFilter) {
      tableFilter = initSortableTable('finance-table', [
        { key: 'date',       type: 'date',   getValue: b => b.scheduled_date || '' },
        { key: 'time',       type: 'select', getValue: b => (b.scheduled_time || '').slice(0, 5) },
        { key: 'customer',   type: 'text',   getValue: b => b.customer_name || '' },
        { key: 'type',       type: 'select', getValue: b => b.booking_type === 'group' ? 'GT' : 'PT' },
        { key: 'city',       type: 'select', getValue: b => b.location_name || '' },
        { key: 'status',     type: 'select', getValue: b => b.status || '' },
        { key: 'verguetung', type: 'number', getValue: b => effBrutto(b) / 100 },
        null,
      ]);
      tableFilter.onFilterChange(() => renderBookingsTable());
    }
    renderBookingsTable();
  }

  // ── Ebene 1: KPIs ─────────────────────────────────────────────────────────
  function updateKPIs() {
    const brutto  = yearData.reduce((s, b) => s + effBrutto(b), 0);
    const netto   = Math.round(brutto / 1.19);
    const mwst    = brutto - netto;
    document.getElementById('kpi-brutto').textContent    = f(brutto);
    document.getElementById('kpi-mwst').textContent      = f(mwst);
    document.getElementById('kpi-netto').textContent     = f(netto);
    document.getElementById('kpi-abzuege').textContent   = f(0);
    document.getElementById('kpi-auszahlung').textContent = f(netto);
  }

  // ── Ebene 2: Monatsübersicht ───────────────────────────────────────────────
  function renderMonthTable() {
    const now          = new Date();
    const currentMonth = now.getFullYear() === selectedYear ? now.getMonth() : -1;
    let totCount = 0, totB = 0, totM = 0, totN = 0;

    const rows = MONTHS_DE.map((name, mi) => {
      const prefix = `${selectedYear}-${String(mi + 1).padStart(2, '0')}`;
      const mb     = yearData.filter(b => (b.scheduled_date || '').startsWith(prefix));
      const count  = mb.length;
      const brutto = mb.reduce((s, b) => s + effBrutto(b), 0);
      const netto  = Math.round(brutto / 1.19);
      const mwst   = brutto - netto;
      totCount += count; totB += brutto; totM += mwst; totN += netto;

      const cls = mi === currentMonth ? ' class="fin-month-highlight"' : '';
      if (count === 0) {
        return `<tr${cls}><td>${name}</td><td class="text-muted">–</td><td class="text-muted">–</td><td class="text-muted">–</td><td class="text-muted">–</td><td class="text-muted">–</td><td class="text-muted">–</td></tr>`;
      }
      return `<tr${cls}>
        <td>${name}</td>
        <td>${count}</td>
        <td>${f(brutto)}</td>
        <td class="text-muted">${f(mwst)}</td>
        <td>${f(netto)}</td>
        <td class="text-muted">${f(0)}</td>
        <td>${f(netto)}</td>
      </tr>`;
    });

    rows.push(`<tr class="fin-total-row">
      <td>Gesamt ${selectedYear}</td>
      <td>${totCount}</td>
      <td>${f(totB)}</td>
      <td>${f(totM)}</td>
      <td>${f(totN)}</td>
      <td>${f(0)}</td>
      <td>${f(totN)}</td>
    </tr>`);

    document.getElementById('month-body').innerHTML = rows.join('');
  }

  // ── Ebene 3: Einzelbuchungen ──────────────────────────────────────────────
  function renderBookingsTable() {
    const filtered = tableFilter ? tableFilter.apply(yearData) : yearData;
    const tbody    = document.getElementById('revenue-body');
    const sumRow   = document.getElementById('finance-sum-row');

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted" style="padding:24px">Keine Buchungen gefunden</td></tr>';
      sumRow.style.display = 'none';
      return;
    }

    tbody.innerHTML = filtered.map(b => {
      const city     = b.location_name || b.location_address || '–';
      const artBadge = b.booking_type === 'group'
        ? '<span class="badge" style="background:rgba(45,106,79,0.12);color:#40916C;border:1px solid rgba(64,145,108,0.25)">GT</span>'
        : '<span class="badge" style="background:rgba(46,117,182,0.12);color:#5BB8FF;border:1px solid rgba(91,184,255,0.25)">PT</span>';
      return `<tr>
        <td style="white-space:nowrap">${formatDate(b.scheduled_date)}</td>
        <td style="white-space:nowrap;color:var(--text-secondary)">${b.scheduled_time ? b.scheduled_time.slice(0,5) : '–'}</td>
        <td>${b.customer_name || '–'}</td>
        <td>${artBadge}</td>
        <td>${city}</td>
        <td>${statusBadge(b.status)}</td>
        <td>${vergütungCell(b)}</td>
        <td><button class="btn btn-ghost btn-sm" onclick="openFinanceDetail('${b.id}')">Details</button></td>
      </tr>`;
    }).join('');

    const sumB = filtered.reduce((s, b) => s + effBrutto(b), 0);
    sumRow.style.display = '';
    document.getElementById('fin-count-cell').textContent   = `${filtered.length} von ${yearData.length} Buchungen`;
    document.getElementById('fin-vergutung-sum').textContent = f(sumB);
  }

  // ── CSV Export ────────────────────────────────────────────────────────────
  function exportCSV() {
    if (yearData.length === 0) { alert('Keine Daten für ' + selectedYear + '.'); return; }
    const headers = ['Datum','Uhrzeit','Kunde','Art','Stadt','Status',
                     'Vergütung brutto (EUR)','MwSt (EUR)','Vergütung netto (EUR)','Auszahlung (EUR)'];
    const rows = yearData.map(b => [
      b.scheduled_date || '',
      b.scheduled_time ? b.scheduled_time.slice(0, 5) : '',
      b.customer_name  || '',
      b.booking_type === 'group' ? 'GT' : 'PT',
      b.location_name || '',
      b.status || '',
      (effBrutto(b)     / 100).toFixed(2).replace('.', ','),
      (effMwSt(b)       / 100).toFixed(2).replace('.', ','),
      (effNetto(b)      / 100).toFixed(2).replace('.', ','),
      (effAuszahlung(b) / 100).toFixed(2).replace('.', ','),
    ]);
    let csv = '\uFEFF' + headers.join(';') + '\n';
    rows.forEach(r => { csv += r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';') + '\n'; });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = `trainer-finanzen-${selectedYear}.csv`; a.click();
    URL.revokeObjectURL(url);
  }

  // ── Detail Modal ──────────────────────────────────────────────────────────
  function openFinanceDetail(id) {
    const b = allData.find(x => x.id === id);
    if (!b) return;
    const brutto = effBrutto(b);
    const netto  = effNetto(b);
    const mwst   = effMwSt(b);
    document.getElementById('finance-modal-body').innerHTML = `
      <div class="detail-row">
        <div class="detail-field"><label>Kunde</label><div class="dv">${b.customer_name || '–'}</div></div>
        <div class="detail-field"><label>Art</label><div class="dv">${b.booking_type === 'group' ? 'Gruppentraining' : 'Personal Training'}</div></div>
      </div>
      <div class="detail-row">
        <div class="detail-field"><label>Datum</label><div class="dv">${formatDate(b.scheduled_date)}</div></div>
        <div class="detail-field"><label>Uhrzeit</label><div class="dv">${b.scheduled_time ? b.scheduled_time.slice(0,5) : '–'}</div></div>
      </div>
      <div class="detail-row">
        <div class="detail-field"><label>Stadt</label><div class="dv">${b.location_name || '–'}</div></div>
        <div class="detail-field"><label>Status</label><div class="dv">${statusBadge(b.status)}</div></div>
      </div>
      <div class="detail-row">
        <div class="detail-field"><label>Vergütung brutto</label><div class="dv" style="color:var(--accent);font-weight:700">${f(brutto)}</div></div>
        <div class="detail-field"><label>MwSt (19%)</label><div class="dv" style="color:var(--text-secondary)">${f(mwst)}</div></div>
      </div>
      <div class="detail-row">
        <div class="detail-field"><label>Vergütung netto</label><div class="dv" style="font-weight:600">${f(netto)}</div></div>
        <div class="detail-field"><label>Auszahlung</label><div class="dv" style="color:#27ae60;font-weight:700">${f(netto)}</div></div>
      </div>
      ${b.notes ? `<div class="detail-field" style="margin-bottom:16px"><label>Notizen</label><div class="dv" style="font-size:14px;color:#8888a0">${b.notes}</div></div>` : ''}
      <div class="detail-id">Buchungs-ID: ${b.id}</div>
    `;
    document.getElementById('finance-detail-modal').classList.add('open');
  }

  function closeFinanceModal() {
    document.getElementById('finance-detail-modal').classList.remove('open');
  }

  document.getElementById('finance-detail-modal').addEventListener('click', e => {
    if (e.target === document.getElementById('finance-detail-modal')) closeFinanceModal();
  });
</script>

</body>
</html>
