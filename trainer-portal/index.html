<!DOCTYPE html>
<html lang="de" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trainer Login – Projekt Fit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="../shared/tabler-custom.css">
</head>
<body class="page page-center">
<script src="../shared/theme.js"></script>

<div class="container container-tight py-4">
  <div class="card card-md">
    <div class="card-body">
      <h1 class="navbar-brand navbar-brand-autodark text-center mb-1" style="font-size:1.6rem">
        Projekt <span>Fit</span>
      </h1>
      <p class="text-secondary text-center mb-4">Trainer-Portal</p>

      <div class="alert alert-danger d-none" id="error-msg"></div>
      <div class="alert alert-success d-none" id="success-msg"></div>

      <!-- Login Form -->
      <div id="login-view">
        <h2 class="h3 text-center mb-3">Anmelden</h2>
        <form id="login-form" novalidate autocomplete="on">
          <div class="mb-3">
            <label class="form-label" for="email">E-Mail</label>
            <input type="email" class="form-control" id="email" placeholder="deine@email.de" autocomplete="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Passwort</label>
            <input type="password" class="form-control" id="password" placeholder="Passwort" autocomplete="current-password" required>
          </div>
          <div class="form-footer">
            <button type="submit" class="btn btn-primary w-100" id="submit-btn">Einloggen</button>
          </div>
        </form>
        <div class="text-center mt-3">
          <a href="#" id="forgot-link" class="text-secondary">Passwort vergessen?</a>
        </div>
      </div>

      <!-- Password Reset Form -->
      <div id="reset-view" style="display:none">
        <h2 class="h3 text-center mb-3">Passwort zurücksetzen</h2>
        <form id="reset-form" novalidate>
          <div class="mb-3">
            <label class="form-label" for="reset-email">E-Mail</label>
            <input type="email" class="form-control" id="reset-email" placeholder="deine@email.de" autocomplete="email" required>
          </div>
          <div class="form-footer">
            <button type="submit" class="btn btn-primary w-100" id="reset-btn">Link senden</button>
          </div>
        </form>
        <div class="text-center mt-3">
          <a href="#" id="back-link" class="text-secondary">Zurück zum Login</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/js/tabler.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://ahsjydgknmysircubjsk.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_8tZaFMrIrzJXjDbYAF2huw_ygDY9K2Q';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { storageKey: 'sb-trainer-auth' } });

  const errorMsg = document.getElementById('error-msg');
  const successMsg = document.getElementById('success-msg');

  // Check if already logged in
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session && session.user.user_metadata?.role?.includes('trainer')) {
      window.location.href = '/trainer-portal/dashboard.html';
    }
  })();

  // URL error params
  const urlError = new URLSearchParams(window.location.search).get('error');
  if (urlError === 'no_trainer') {
    errorMsg.textContent = 'Kein Trainer-Zugang. Bitte melde dich mit deinem Trainer-Account an.';
    errorMsg.classList.remove('d-none');
  } else if (urlError === 'deactivated') {
    errorMsg.textContent = 'Dein Trainer-Account ist derzeit deaktiviert. Bitte kontaktiere den Admin.';
    errorMsg.classList.remove('d-none');
  } else if (urlError === 'no_profile') {
    errorMsg.textContent = 'Kein Trainer-Profil gefunden. Bitte kontaktiere den Admin.';
    errorMsg.classList.remove('d-none');
  }

  // ─── Login ──────────────────────────────────────────────────────
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.classList.add('d-none');
    successMsg.classList.add('d-none');

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      errorMsg.textContent = 'Bitte E-Mail und Passwort eingeben.';
      errorMsg.classList.remove('d-none');
      return;
    }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Wird geprüft...';

    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        errorMsg.textContent = 'Login fehlgeschlagen: ' + error.message;
        errorMsg.classList.remove('d-none');
        btn.disabled = false;
        btn.textContent = 'Einloggen';
        return;
      }

      const role = data.user?.user_metadata?.role || '';
      if (!role.includes('trainer')) {
        await sb.auth.signOut();
        errorMsg.textContent = 'Kein Trainer-Zugang. Nur Trainer-Accounts können sich hier einloggen.';
        errorMsg.classList.remove('d-none');
        btn.disabled = false;
        btn.textContent = 'Einloggen';
        return;
      }

      window.location.href = '/trainer-portal/dashboard.html';
    } catch (err) {
      errorMsg.textContent = 'Verbindungsfehler: ' + err.message;
      errorMsg.classList.remove('d-none');
      btn.disabled = false;
      btn.textContent = 'Einloggen';
    }
  });

  // ─── Forgot / Reset Toggle ─────────────────────────────────────
  document.getElementById('forgot-link').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('reset-view').style.display = 'block';
    errorMsg.classList.add('d-none');
    successMsg.classList.add('d-none');
  });

  document.getElementById('back-link').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('reset-view').style.display = 'none';
    document.getElementById('login-view').style.display = 'block';
    errorMsg.classList.add('d-none');
    successMsg.classList.add('d-none');
  });

  // ─── Password Reset ────────────────────────────────────────────
  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.classList.add('d-none');
    successMsg.classList.add('d-none');

    const email = document.getElementById('reset-email').value.trim();
    if (!email) {
      errorMsg.textContent = 'Bitte E-Mail eingeben.';
      errorMsg.classList.remove('d-none');
      return;
    }

    const btn = document.getElementById('reset-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Wird gesendet...';

    try {
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: 'https://projektfit.net/trainer-portal/set-password/',
      });

      if (error) {
        errorMsg.textContent = 'Fehler: ' + error.message;
        errorMsg.classList.remove('d-none');
      } else {
        successMsg.textContent = 'Reset-Link wurde an ' + email + ' gesendet. Prüfe dein Postfach.';
        successMsg.classList.remove('d-none');
      }
    } catch (err) {
      errorMsg.textContent = 'Verbindungsfehler: ' + err.message;
      errorMsg.classList.remove('d-none');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Link senden';
    }
  });
</script>

</body>
</html>
