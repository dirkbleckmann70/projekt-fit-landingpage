<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – Trainer-Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="../shared/tabler-custom.css">
</head>
<body class="page">
<script src="../shared/theme.js"></script>

<!-- Desktop Sidebar (hidden on mobile) -->
<div id="sidebar"></div>

<!-- Page Wrapper -->
<div class="page-wrapper">
  <div class="page-header d-print-none" id="header"></div>
  <div class="page-body" style="padding-bottom:80px">
    <div class="container-xl">

      <h1 class="mb-3" id="welcome">Willkommen!</h1>

      <!-- KPIs -->
      <div class="row row-deck row-cards mb-3">
        <div class="col-6 col-lg-3">
          <div class="card">
            <div class="card-body">
              <div class="kpi-label">Nächste Buchung</div>
              <div class="kpi-value" id="kpi-next" style="font-size:1rem"><div class="spinner-border spinner-border-sm"></div></div>
            </div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="card">
            <div class="card-body">
              <div class="kpi-label">Buchungen (Monat)</div>
              <div class="kpi-value" id="kpi-month"><div class="spinner-border spinner-border-sm"></div></div>
              <div class="kpi-sub" id="kpi-month-total"></div>
            </div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="card">
            <div class="card-body">
              <div class="kpi-label">Bewertung</div>
              <div class="kpi-value" style="color:var(--tblr-warning)" id="kpi-rating"><div class="spinner-border spinner-border-sm"></div></div>
            </div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="card">
            <div class="card-body">
              <div class="kpi-label">Verdienst (Monat)</div>
              <div class="kpi-value" style="color:var(--tblr-primary)" id="kpi-earnings"><div class="spinner-border spinner-border-sm"></div></div>
              <div class="kpi-sub" id="kpi-earnings-total"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Pending Requests -->
      <div class="card mb-3">
        <div class="card-header">
          <h3 class="card-title">Neue Anfragen</h3>
        </div>
        <div id="pending-list">
          <div class="card-body"><div class="spinner-border spinner-border-sm me-2"></div> Laden...</div>
        </div>
      </div>

      <!-- Upcoming Bookings -->
      <div class="card mb-3">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h3 class="card-title">Nächste Termine</h3>
          <a href="/trainer-portal/bookings.html" class="btn btn-ghost-secondary btn-sm">Alle</a>
        </div>
        <div id="upcoming-list">
          <div class="card-body"><div class="spinner-border spinner-border-sm me-2"></div> Laden...</div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Mobile Bottom Nav -->
<div id="bottom-nav"></div>

<!-- Detail Modal -->
<div class="modal modal-blur fade" id="detail-modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Buchungs-Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="detail-modal-body"></div>
      <div class="modal-footer" id="detail-modal-footer">
        <button class="btn btn-ghost-secondary btn-sm" data-bs-dismiss="modal">Schliessen</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/js/tabler.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/constants.js"></script>
<script src="../shared/layout.js"></script>
<script src="../shared/toast.js"></script>
<script src="auth-check.js"></script>
<script>
  (async () => {
    const trainer = await checkTrainerAuth();
    if (!trainer) return;

    document.getElementById('sidebar').innerHTML = renderTrainerSidebar('dashboard');
    document.getElementById('bottom-nav').innerHTML = renderTrainerBottomNav('dashboard');
    document.getElementById('header').innerHTML = renderTrainerHeader('Dashboard', window.currentTrainer?.email || '');
    initRealtimeToasts(getSupabase(), 'trainer');

    document.getElementById('welcome').textContent = `Willkommen, ${trainer.full_name || 'Trainer'}!`;

    const sb = getSupabase();
    const trainerId = trainer.id;

    if (!trainerId) {
      document.getElementById('kpi-next').textContent = '–';
      document.getElementById('kpi-month').textContent = '–';
      document.getElementById('kpi-rating').textContent = '–';
      document.getElementById('kpi-earnings').textContent = '–';
      document.getElementById('upcoming-list').innerHTML = '<div class="card-body text-center text-secondary">Trainer-Profil nicht verknüpft.</div>';
      document.getElementById('pending-list').innerHTML = '';
      return;
    }

    // ─── KPI: Rating ──────────────────────────────────────────────
    sb.from('trainer_reviews')
      .select('rating')
      .eq('trainer_id', trainerId)
      .then(({ data: reviews }) => {
        const r = reviews || [];
        if (r.length === 0) {
          document.getElementById('kpi-rating').textContent = '–';
        } else {
          const avg = r.reduce((s, x) => s + (x.rating || 0), 0) / r.length;
          document.getElementById('kpi-rating').textContent =
            `${(Math.round(avg * 10) / 10).toFixed(1)} ★ (${r.length})`;
        }
      })
      .catch(() => {
        document.getElementById('kpi-rating').textContent =
          trainer.rating ? `${trainer.rating} ★` : '–';
      });

    // ─── KPI: Bookungen + Verdienst (Monat + Gesamt) ──────────────
    const monthStart = new Date();
    monthStart.setDate(1);
    const monthISO = monthStart.toISOString().slice(0, 10);

    try {
      const { data: allBookings } = await sb
        .from('bookings')
        .select('id, trainer_payout_cents, status, scheduled_date')
        .eq('trainer_id', trainerId)
        .in('status', [BOOKING_STATUS.CONFIRMED, BOOKING_STATUS.COMPLETED]);

      const all = allBookings || [];

      const monthActive = all.filter(b => b.scheduled_date >= monthISO);
      document.getElementById('kpi-month').textContent = monthActive.length;

      const monthEarnings = monthActive
        .filter(b => b.status === BOOKING_STATUS.COMPLETED)
        .reduce((sum, b) => sum + (b.trainer_payout_cents || 0), 0);
      document.getElementById('kpi-earnings').textContent = formatEuro(monthEarnings);

      document.getElementById('kpi-month-total').textContent = `Gesamt: ${all.length}`;
      const totalEarnings = all
        .filter(b => b.status === BOOKING_STATUS.COMPLETED)
        .reduce((sum, b) => sum + (b.trainer_payout_cents || 0), 0);
      document.getElementById('kpi-earnings-total').textContent = `Gesamt: ${formatEuro(totalEarnings)}`;
    } catch (err) {
      console.error('KPIs:', err);
      document.getElementById('kpi-month').textContent = '–';
      document.getElementById('kpi-earnings').textContent = '–';
    }

    // ─── Upcoming Bookings ────────────────────────────────────────
    const today = new Date().toISOString().slice(0, 10);
    try {
      const { data: upcoming } = await sb
        .from('bookings')
        .select('*')
        .eq('trainer_id', trainerId)
        .eq('status', BOOKING_STATUS.CONFIRMED)
        .gte('scheduled_date', today)
        .order('scheduled_date', { ascending: true })
        .limit(5);

      const list = document.getElementById('upcoming-list');
      if (!upcoming || upcoming.length === 0) {
        list.innerHTML = '<div class="card-body text-center text-secondary"><i class="ti ti-calendar-off mb-2" style="font-size:2rem"></i><br>Keine kommenden Termine</div>';
        document.getElementById('kpi-next').textContent = 'Keine';
      } else {
        document.getElementById('kpi-next').textContent =
          formatDate(upcoming[0].scheduled_date) + ' ' + formatTime(upcoming[0].scheduled_time);

        list.innerHTML = '<div class="card-body p-0">' + upcoming.map(b => `
          <div class="p-3 border-bottom" style="border-color:var(--tblr-border-color)!important">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <div class="fw-bold">${b.customer_name || 'Kunde'}</div>
                <div class="text-secondary" style="font-size:13px">
                  <i class="ti ti-calendar" style="font-size:14px"></i> ${formatDate(b.scheduled_date)} · ${formatTime(b.scheduled_time)}<br>
                  <i class="ti ti-map-pin" style="font-size:14px"></i> ${b.location_name || b.location || '–'}
                </div>
              </div>
              ${statusBadge(b.status)}
            </div>
          </div>
        `).join('') + '</div>';
      }
    } catch (err) {
      console.error('Upcoming:', err);
      document.getElementById('upcoming-list').innerHTML = '<div class="card-body text-danger">Fehler beim Laden</div>';
      document.getElementById('kpi-next').textContent = '–';
    }

    // ─── Pending Requests ─────────────────────────────────────────
    try {
      const { data: pending } = await sb
        .from('bookings')
        .select('*')
        .eq('trainer_id', trainerId)
        .eq('status', BOOKING_STATUS.PENDING)
        .order('created_at', { ascending: false })
        .limit(5);

      // Kundennamen nachladen
      var pendingBookings = pending || [];
      if (pendingBookings.length > 0) {
        var custIds = [...new Set(pendingBookings.map(b => b.customer_id).filter(Boolean))];
        if (custIds.length > 0) {
          var { data: custs } = await sb.from('customers').select('id, full_name, first_name, last_name').in('id', custIds);
          var custMap = {};
          (custs || []).forEach(function(c) { custMap[c.id] = c.full_name || [c.first_name, c.last_name].filter(Boolean).join(' ') || 'Kunde'; });
          pendingBookings = pendingBookings.map(function(b) { return Object.assign({}, b, { customer_name: custMap[b.customer_id] || b.customer_name || 'Kunde' }); });
        }
      }
      window._dashPending = pendingBookings;

      const pList = document.getElementById('pending-list');
      if (pendingBookings.length === 0) {
        pList.innerHTML = '<div class="card-body text-center text-secondary">Keine offenen Anfragen</div>';
      } else {
        pList.innerHTML = '<div class="card-body p-0">' + pendingBookings.map(b => `
          <div class="p-3 border-bottom" style="border-color:var(--tblr-border-color)!important">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <div>
                <div class="fw-bold">${b.customer_name || 'Kunde'}</div>
                <div class="text-secondary" style="font-size:13px">
                  <i class="ti ti-calendar" style="font-size:14px"></i> ${formatDate(b.scheduled_date)} · ${formatTime(b.scheduled_time)}<br>
                  <i class="ti ti-map-pin" style="font-size:14px"></i> ${b.location_name || b.location || '–'}
                </div>
              </div>
              ${statusBadge(BOOKING_STATUS.PENDING)}
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-outline-primary btn-sm" onclick="showPendingDetail('${b.id}')"><i class="ti ti-eye"></i> Details</button>
              <button class="btn btn-success btn-sm" onclick="updateBooking('${b.id}', BOOKING_STATUS.CONFIRMED)"><i class="ti ti-check"></i> Bestätigen</button>
              <button class="btn btn-outline-danger btn-sm" onclick="updateBooking('${b.id}', BOOKING_STATUS.CANCELLED_BY_TRAINER)"><i class="ti ti-x"></i> Ablehnen</button>
            </div>
          </div>
        `).join('') + '</div>';
      }
    } catch (err) {
      console.error('Pending:', err);
    }
  })();

  async function updateBooking(bookingId, status) {
    const sb = getSupabase();
    const { error } = await sb.from('bookings').update({ status }).eq('id', bookingId);
    if (error) {
      alert('Fehler: ' + error.message);
    } else {
      window.location.reload();
    }
  }

  function renderHealthSection(hd) {
    if (!hd || typeof hd !== 'object') return '';
    var labels = {
      heart_disease: 'Herz-/Kreislauferkrankung', joint_problems: 'Gelenkprobleme',
      respiratory: 'Atemwegserkrankung', medical_treatment: 'Aktuell in Behandlung',
      medication: 'Medikamente', recent_surgery: 'Kürzliche OP',
      pregnant: 'Schwangerschaft', other_conditions: 'Sonstige Erkrankungen'
    };
    var flags = Object.keys(labels).filter(function(k) { return hd[k] === true; });
    var html = '<div class="mb-3"><label class="form-label text-secondary">Gesundheitserklaerung</label>';
    if (flags.length === 0) {
      html += '<div class="text-success" style="font-size:13px"><i class="ti ti-check"></i> Keine gesundheitlichen Einschraenkungen angegeben</div>';
    } else {
      html += '<div class="alert alert-warning" style="font-size:13px"><i class="ti ti-alert-triangle me-1"></i><strong>Hinweise:</strong><ul class="mb-0 mt-1">';
      flags.forEach(function(k) { html += '<li>' + labels[k] + '</li>'; });
      html += '</ul></div>';
    }
    if (hd.additional_notes) {
      html += '<div class="text-secondary" style="font-size:13px"><strong>Anmerkungen:</strong> ' + hd.additional_notes + '</div>';
    }
    html += '</div>';
    return html;
  }

  var _detailModal = null;

  async function showPendingDetail(bookingId) {
    var b = (window._dashPending || []).find(function(x) { return x.id === bookingId; });
    if (!b) return;

    var healthHtml = '';
    var contactHtml = '';
    if (b.customer_id) {
      try {
        var sb = getSupabase();
        var { data: cust } = await sb.from('customers').select('health_declaration, phone, email').eq('id', b.customer_id).single();
        healthHtml = renderHealthSection(cust?.health_declaration);
        if (cust?.phone || cust?.email) {
          contactHtml = '<div class="alert alert-success mb-3"><div class="text-secondary text-uppercase fw-bold" style="font-size:11px;letter-spacing:0.5px;margin-bottom:6px">Kontakt zum Kunden</div>';
          if (cust.phone) contactHtml += '<a href="tel:' + cust.phone + '" style="color:var(--tblr-primary);font-size:16px;font-weight:700;text-decoration:none"><i class="ti ti-phone me-1"></i>' + cust.phone + '</a><br>';
          if (cust.email) contactHtml += '<a href="mailto:' + cust.email + '" style="color:var(--tblr-primary);text-decoration:none"><i class="ti ti-mail me-1"></i>' + cust.email + '</a>';
          contactHtml += '</div>';
        }
      } catch { /* no customer data */ }
    }

    // Vorgeschlagene Treffpunkte
    var locationHtml = '';
    try {
      var resp = await adminApi('/api/admin?action=data&type=booking_locations&bookingId=' + bookingId);
      var locs = Array.isArray(resp.data) ? resp.data : [];
      if (locs.length > 0) {
        locationHtml = '<div class="mb-3"><label class="form-label text-secondary">Vorgeschlagene Treffpunkte</label>';
        locs.forEach(function(loc) {
          var addr = [loc.street, loc.zip_code, loc.city].filter(Boolean).join(', ') || loc.address || '';
          locationHtml += '<div class="d-flex align-items-start gap-2 mb-1"><i class="ti ti-map-pin text-secondary" style="margin-top:2px"></i><div><strong>' + (loc.name || loc.location_name || 'Treffpunkt') + '</strong>' + (addr ? '<br><span class="text-secondary" style="font-size:12px">' + addr + '</span>' : '') + '</div></div>';
        });
        locationHtml += '</div>';
      }
    } catch { /* no locations */ }

    document.getElementById('detail-modal-body').innerHTML =
      '<div class="row mb-3">' +
        '<div class="col-6"><label class="form-label text-secondary">Kunde</label><div class="fw-bold">' + (b.customer_name || '–') + '</div></div>' +
        '<div class="col-6"><label class="form-label text-secondary">Art</label><div>Personal Training</div></div>' +
      '</div>' +
      '<div class="row mb-3">' +
        '<div class="col-6"><label class="form-label text-secondary">Datum</label><div>' + formatDate(b.scheduled_date) + '</div></div>' +
        '<div class="col-6"><label class="form-label text-secondary">Uhrzeit</label><div>' + (b.scheduled_time ? b.scheduled_time.slice(0,5) : '–') + '</div></div>' +
      '</div>' +
      '<div class="row mb-3">' +
        '<div class="col-6"><label class="form-label text-secondary">Stadt / Ort</label><div>' + (b.city || b.location_name || b.location || '–') + '</div></div>' +
        '<div class="col-6"><label class="form-label text-secondary">Status</label><div>' + statusBadge(b.status) + '</div></div>' +
      '</div>' +
      contactHtml +
      locationHtml +
      healthHtml +
      (b.notes ? '<div class="mb-3"><label class="form-label text-secondary">Notizen</label><div class="text-secondary" style="font-size:14px">' + b.notes + '</div></div>' : '');

    // Footer mit Aktions-Buttons
    document.getElementById('detail-modal-footer').innerHTML =
      '<button class="btn btn-success btn-sm" onclick="updateBooking(\'' + b.id + '\', BOOKING_STATUS.CONFIRMED)"><i class="ti ti-check"></i> Bestätigen</button>' +
      '<button class="btn btn-outline-danger btn-sm" onclick="updateBooking(\'' + b.id + '\', BOOKING_STATUS.CANCELLED_BY_TRAINER)"><i class="ti ti-x"></i> Ablehnen</button>' +
      '<button class="btn btn-ghost-secondary btn-sm" data-bs-dismiss="modal">Schliessen</button>';

    if (!_detailModal) _detailModal = new bootstrap.Modal(document.getElementById('detail-modal'));
    _detailModal.show();
  }
</script>

</body>
</html>
