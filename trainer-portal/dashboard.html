<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – Trainer-Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top-header" id="top-header"></header>

<div class="content">
  <h1 class="page-title" id="welcome">Willkommen!</h1>

  <!-- KPIs -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-label">Nächste Buchung</div>
      <div class="kpi-value" id="kpi-next" style="font-size:16px"><span class="spinner"></span></div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Buchungen (Monat)</div>
      <div class="kpi-value" id="kpi-month"><span class="spinner"></span></div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Bewertung</div>
      <div class="kpi-value text-accent" id="kpi-rating"><span class="spinner"></span></div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Verdienst (Monat)</div>
      <div class="kpi-value text-success" id="kpi-earnings"><span class="spinner"></span></div>
    </div>
  </div>

  <!-- Upcoming Bookings -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">Nächste Termine</div>
      <a href="/trainer-portal/bookings.html" class="btn btn-ghost btn-sm">Alle</a>
    </div>
    <div id="upcoming-list">
      <div class="loading-center"><span class="spinner"></span> Laden...</div>
    </div>
  </div>

  <!-- Pending Requests -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">Neue Anfragen</div>
    </div>
    <div id="pending-list">
      <div class="loading-center"><span class="spinner"></span> Laden...</div>
    </div>
  </div>
</div>

<nav class="bottom-nav" id="bottom-nav"></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-check.js"></script>
<script>
  (async () => {
    const trainer = await checkTrainerAuth();
    if (!trainer) return;

    document.getElementById('top-header').innerHTML = renderTopHeader();
    document.getElementById('bottom-nav').innerHTML = renderNav('dashboard');
    document.getElementById('welcome').textContent = `Willkommen, ${trainer.full_name || 'Trainer'}!`;

    const sb = getSupabase();
    const trainerId = trainer.id;

    if (!trainerId) {
      document.getElementById('kpi-next').textContent = '–';
      document.getElementById('kpi-month').textContent = '–';
      document.getElementById('kpi-rating').textContent = '–';
      document.getElementById('kpi-earnings').textContent = '–';
      document.getElementById('upcoming-list').innerHTML = '<div class="empty-state"><div class="empty-state-text">Trainer-Profil nicht verknüpft.</div></div>';
      document.getElementById('pending-list').innerHTML = '';
      return;
    }

    // ─── KPI: Rating ──────────────────────────────────────────────
    document.getElementById('kpi-rating').textContent =
      trainer.rating ? `${trainer.rating} ★` : '–';

    // ─── KPI: Bookings this month + earnings ──────────────────────
    const monthStart = new Date();
    monthStart.setDate(1);
    monthStart.setHours(0, 0, 0, 0);

    try {
      const { data: monthBookings } = await sb
        .from('bookings')
        .select('id, price_cents, status, session_date, session_time, customer_name, customer_id, location')
        .eq('trainer_id', trainerId)
        .gte('session_date', monthStart.toISOString().slice(0, 10));

      const confirmed = (monthBookings || []).filter(b => b.status !== 'CANCELLED');
      document.getElementById('kpi-month').textContent = confirmed.length;

      const earnings = confirmed
        .filter(b => b.status === 'COMPLETED' || b.status === 'CONFIRMED')
        .reduce((sum, b) => sum + (trainer.payout_cents || b.price_cents || 0), 0);
      document.getElementById('kpi-earnings').textContent = formatEuro(earnings);
    } catch (err) {
      console.error('Monats-KPIs:', err);
      document.getElementById('kpi-month').textContent = '–';
      document.getElementById('kpi-earnings').textContent = '–';
    }

    // ─── Upcoming Bookings ────────────────────────────────────────
    const today = new Date().toISOString().slice(0, 10);
    try {
      const { data: upcoming } = await sb
        .from('bookings')
        .select('*')
        .eq('trainer_id', trainerId)
        .eq('status', 'CONFIRMED')
        .gte('session_date', today)
        .order('session_date', { ascending: true })
        .limit(5);

      const list = document.getElementById('upcoming-list');
      if (!upcoming || upcoming.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📅</div><div class="empty-state-text">Keine kommenden Termine</div></div>';
        document.getElementById('kpi-next').textContent = 'Keine';
      } else {
        document.getElementById('kpi-next').textContent =
          formatDate(upcoming[0].session_date) + ' ' + formatTime(upcoming[0].session_time);

        list.innerHTML = upcoming.map(b => `
          <div class="booking-item">
            <div class="booking-top">
              <div class="booking-customer">${b.customer_name || 'Kunde'}</div>
              ${statusBadge(b.status)}
            </div>
            <div class="booking-meta">
              📅 ${formatDate(b.session_date)} · ${formatTime(b.session_time)}<br>
              📍 ${b.location || '–'}
            </div>
          </div>
        `).join('');
      }
    } catch (err) {
      console.error('Upcoming:', err);
      document.getElementById('upcoming-list').innerHTML = '<div class="empty-state text-error">Fehler beim Laden</div>';
      document.getElementById('kpi-next').textContent = '–';
    }

    // ─── Pending Requests ─────────────────────────────────────────
    try {
      const { data: pending } = await sb
        .from('bookings')
        .select('*')
        .eq('trainer_id', trainerId)
        .eq('status', 'PENDING')
        .order('created_at', { ascending: false })
        .limit(5);

      const pList = document.getElementById('pending-list');
      if (!pending || pending.length === 0) {
        pList.innerHTML = '<div class="empty-state"><div class="empty-state-text text-muted">Keine offenen Anfragen</div></div>';
      } else {
        pList.innerHTML = pending.map(b => `
          <div class="booking-item">
            <div class="booking-top">
              <div class="booking-customer">${b.customer_name || 'Kunde'}</div>
              ${statusBadge('PENDING')}
            </div>
            <div class="booking-meta">
              📅 ${formatDate(b.session_date)} · ${formatTime(b.session_time)}<br>
              📍 ${b.location || '–'}
            </div>
            <div class="booking-actions">
              <button class="btn btn-success btn-sm" onclick="updateBooking('${b.id}', 'CONFIRMED')">Bestätigen</button>
              <button class="btn btn-danger btn-sm" onclick="updateBooking('${b.id}', 'CANCELLED')">Ablehnen</button>
            </div>
          </div>
        `).join('');
      }
    } catch (err) {
      console.error('Pending:', err);
    }
  })();

  async function updateBooking(bookingId, status) {
    const sb = getSupabase();
    const { error } = await sb.from('bookings').update({ status }).eq('id', bookingId);
    if (error) {
      alert('Fehler: ' + error.message);
    } else {
      window.location.reload();
    }
  }
</script>

</body>
</html>
