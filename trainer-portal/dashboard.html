<!DOCTYPE html>
<html lang="de" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – Trainer-Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="../shared/tabler-custom.css">
  <script src="../shared/design-tokens.js"></script>
</head>
<body class="page">
<script src="../shared/theme.js"></script>

<!-- Desktop Sidebar (hidden on mobile) -->
<div id="sidebar"></div>

<!-- Page Wrapper -->
<div class="page-wrapper">
  <div class="page-header d-print-none" id="header"></div>
  <div class="page-body" style="padding-bottom:80px">
    <div class="container-xl">

      <h1 class="mb-3" id="welcome">Willkommen!</h1>

      <!-- KPIs -->
      <div class="row row-deck row-cards mb-3">
        <div class="col-6 col-lg-3">
          <div class="pf-stat-card">
            <div class="pf-stat-label">Nächste Buchung</div>
            <div class="pf-stat-num" id="kpi-next" style="font-size:1rem"><div class="spinner-border spinner-border-sm"></div></div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="pf-stat-card">
            <div class="pf-stat-label">Buchungen (Monat)</div>
            <div class="pf-stat-num" id="kpi-month"><div class="spinner-border spinner-border-sm"></div></div>
            <div class="kpi-sub" id="kpi-month-total"></div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="pf-stat-card">
            <div class="pf-stat-label">Bewertung</div>
            <div class="pf-stat-num" id="kpi-rating"><div class="spinner-border spinner-border-sm"></div></div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="pf-stat-card">
            <div class="pf-stat-label">Verdienst (Monat)</div>
            <div class="pf-stat-num" id="kpi-earnings"><div class="spinner-border spinner-border-sm"></div></div>
            <div class="kpi-sub" id="kpi-earnings-total"></div>
          </div>
        </div>
      </div>

      <!-- Pending Requests -->
      <div class="card mb-3">
        <div class="card-header">
          <h3 class="card-title">Neue Anfragen</h3>
        </div>
        <div id="pending-list">
          <div class="card-body"><div class="spinner-border spinner-border-sm me-2"></div> Laden...</div>
        </div>
      </div>

      <!-- Upcoming Bookings -->
      <div class="card mb-3">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h3 class="card-title">Nächste Termine</h3>
          <a href="/trainer-portal/bookings.html" class="pf-btn pf-btn-neutral">Alle</a>
        </div>
        <div id="upcoming-list">
          <div class="card-body"><div class="spinner-border spinner-border-sm me-2"></div> Laden...</div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Mobile Bottom Nav -->
<div id="bottom-nav"></div>


<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/js/tabler.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/constants.js"></script>
<script src="../shared/layout.js"></script>
<script src="../shared/toast.js"></script>
<script src="auth-check.js"></script>
<script>
  (async () => {
    const trainer = await checkTrainerAuth();
    if (!trainer) return;

    document.getElementById('sidebar').innerHTML = renderTrainerSidebar('dashboard');
    document.getElementById('bottom-nav').innerHTML = renderTrainerBottomNav('dashboard');
    document.getElementById('header').innerHTML = renderTrainerHeader('Dashboard', window.currentTrainer?.email || '');
    initRealtimeToasts(getSupabase(), 'trainer');

    document.getElementById('welcome').textContent = `Willkommen, ${trainer.full_name || 'Trainer'}!`;

    const sb = getSupabase();
    const trainerId = trainer.id;

    if (!trainerId) {
      document.getElementById('kpi-next').textContent = '–';
      document.getElementById('kpi-month').textContent = '–';
      document.getElementById('kpi-rating').textContent = '–';
      document.getElementById('kpi-earnings').textContent = '–';
      document.getElementById('upcoming-list').innerHTML = '<div class="card-body text-center text-secondary">Trainer-Profil nicht verknüpft.</div>';
      document.getElementById('pending-list').innerHTML = '';
      return;
    }

    // ─── KPI: Rating ──────────────────────────────────────────────
    sb.from('trainer_reviews')
      .select('rating')
      .eq('trainer_id', trainerId)
      .then(({ data: reviews }) => {
        const r = reviews || [];
        if (r.length === 0) {
          document.getElementById('kpi-rating').textContent = '–';
        } else {
          const avg = r.reduce((s, x) => s + (x.rating || 0), 0) / r.length;
          document.getElementById('kpi-rating').textContent =
            `${(Math.round(avg * 10) / 10).toFixed(1)} ★ (${r.length})`;
        }
      })
      .catch(() => {
        document.getElementById('kpi-rating').textContent =
          trainer.rating ? `${trainer.rating} ★` : '–';
      });

    // ─── KPI: Bookungen + Verdienst (Monat + Gesamt) ──────────────
    const monthStart = new Date();
    monthStart.setDate(1);
    const monthISO = monthStart.toISOString().slice(0, 10);

    try {
      // Teilspec 1: 7-Wert-Kanon. PT-Einzeltrainings filtern (GT-Statistik haengt im Trainer-Portal nicht hier).
      const { data: allBookings } = await sb
        .from('bookings')
        .select('id, trainer_payout_cents, status, scheduled_date')
        .eq('trainer_id', trainerId)
        .eq('art', 'pt_einzel')
        .in('status', ['bestaetigt', 'laeuft gerade', 'abgeschlossen']);

      const all = allBookings || [];

      const monthActive = all.filter(b => b.scheduled_date >= monthISO);
      document.getElementById('kpi-month').textContent = monthActive.length;

      const monthEarnings = monthActive
        .filter(b => b.status === 'abgeschlossen')
        .reduce((sum, b) => sum + (b.trainer_payout_cents || 0), 0);
      document.getElementById('kpi-earnings').textContent = formatEuro(monthEarnings);

      document.getElementById('kpi-month-total').textContent = `Gesamt: ${all.length}`;
      const totalEarnings = all
        .filter(b => b.status === 'abgeschlossen')
        .reduce((sum, b) => sum + (b.trainer_payout_cents || 0), 0);
      document.getElementById('kpi-earnings-total').textContent = `Gesamt: ${formatEuro(totalEarnings)}`;
    } catch (err) {
      console.error('KPIs:', err);
      document.getElementById('kpi-month').textContent = '–';
      document.getElementById('kpi-earnings').textContent = '–';
    }

    // ─── Upcoming Bookings ────────────────────────────────────────
    const today = new Date().toISOString().slice(0, 10);
    try {
      const { data: upcoming } = await sb
        .from('bookings')
        .select('*')
        .eq('trainer_id', trainerId)
        .eq('art', 'pt_einzel')
        .eq('status', 'bestaetigt')
        .gte('scheduled_date', today)
        .order('scheduled_date', { ascending: true })
        .limit(5);

      const list = document.getElementById('upcoming-list');
      if (!upcoming || upcoming.length === 0) {
        list.innerHTML = '<div class="card-body text-center text-secondary"><i class="ti ti-calendar-off mb-2" style="font-size:2rem"></i><br>Keine kommenden Termine</div>';
        document.getElementById('kpi-next').textContent = 'Keine';
      } else {
        document.getElementById('kpi-next').textContent =
          formatDate(upcoming[0].scheduled_date) + ' ' + formatTime(upcoming[0].scheduled_time);

        list.innerHTML = '<div class="card-body p-0">' + upcoming.map(b => `
          <div class="p-3 border-bottom" style="border-color:var(--tblr-border-color)!important">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <div class="fw-bold">${b.customer_name || 'Kunde'}</div>
                <div class="text-secondary" style="font-size:13px">
                  <i class="ti ti-calendar" style="font-size:14px"></i> ${formatDate(b.scheduled_date)} · ${formatTime(b.scheduled_time)}<br>
                  <i class="ti ti-map-pin" style="font-size:14px"></i> ${b.location_name || b.location || '–'}
                </div>
              </div>
              ${statusBadge(b.status)}
            </div>
          </div>
        `).join('') + '</div>';
      }
    } catch (err) {
      console.error('Upcoming:', err);
      document.getElementById('upcoming-list').innerHTML = '<div class="card-body text-danger">Fehler beim Laden</div>';
      document.getElementById('kpi-next').textContent = '–';
    }

    // ─── Pending Requests ─────────────────────────────────────────
    try {
      const { data: pending } = await sb
        .from('bookings')
        .select('*')
        .eq('trainer_id', trainerId)
        .eq('art', 'pt_einzel')
        .in('status', ['angefragt'])
        .order('created_at', { ascending: false })
        .limit(5);

      // Kundennamen nachladen
      var pendingBookings = pending || [];
      if (pendingBookings.length > 0) {
        var custIds = [...new Set(pendingBookings.map(b => b.customer_id).filter(Boolean))];
        if (custIds.length > 0) {
          try {
            var custResp = await adminApi('/api/admin?action=data&type=customer_names&ids=' + custIds.join(','));
            var custs = custResp.data || [];
            var custMap = {};
            custs.forEach(function(c) { custMap[c.id] = c.full_name || [c.first_name, c.last_name].filter(Boolean).join(' ') || 'Kunde'; });
            pendingBookings = pendingBookings.map(function(b) { return Object.assign({}, b, { customer_name: custMap[b.customer_id] || b.customer_name || 'Kunde' }); });
          } catch(e) { console.warn('Kundennamen laden fehlgeschlagen:', e.message); }
        }
      }
      window._dashPending = pendingBookings;

      const pList = document.getElementById('pending-list');
      if (pendingBookings.length === 0) {
        pList.innerHTML = '<div class="card-body text-center text-secondary">Keine offenen Anfragen</div>';
      } else {
        pList.innerHTML = '<div class="card-body p-0">' + pendingBookings.map(b => `
          <div class="p-3 border-bottom" style="border-color:var(--tblr-border-color)!important">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <div>
                <div class="fw-bold">${b.customer_name || 'Kunde'}</div>
                <div class="text-secondary" style="font-size:13px">
                  <i class="ti ti-calendar" style="font-size:14px"></i> ${formatDate(b.scheduled_date)} · ${formatTime(b.scheduled_time)}<br>
                  <i class="ti ti-map-pin" style="font-size:14px"></i> ${b.location_name || b.location || '–'}
                </div>
              </div>
              ${statusBadge(BOOKING_STATUS.PENDING)}
            </div>
            <div class="d-flex gap-2">
              <a class="pf-btn pf-btn-neutral" href="/trainer-portal/bookings.html"><i class="ti ti-eye me-1"></i>Details & Aktionen</a>
            </div>
          </div>
        `).join('') + '</div>';
      }
    } catch (err) {
      console.error('Pending:', err);
    }
  })();

  async function updateBooking(bookingId, status) {
    // Alle offenen Modals schliessen
    document.querySelectorAll('.modal.show').forEach(function(m) {
      var inst = bootstrap.Modal.getInstance(m);
      if (inst) inst.hide();
    });
    // Teilspec 1: Update geht ueber Admin-API — die mappt Legacy-Status auf neuen Kanon.
    try {
      await adminApi('/api/admin?action=bookings', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bookingId, status }),
      });
      window.location.reload();
    } catch (e) {
      alert('Fehler: ' + (e.message || e));
    }
  }

</script>

</body>
</html>
