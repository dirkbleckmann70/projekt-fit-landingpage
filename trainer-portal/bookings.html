<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buchungen – Trainer-Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../shared/table-utils.css">
  <style>
    .bk-page  { padding: 20px 24px 16px; }
    .bk-outer { padding: 0 24px 24px; }
    @media (max-width: 768px) {
      .bk-page  { padding: 16px 16px 12px; }
      .bk-outer { padding: 0 16px 16px; }
    }

    .bk-table-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    #bookings-table {
      width: 100%;
      border-collapse: collapse;
    }

    #bookings-table thead th {
      text-align: left;
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    #bookings-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    #bookings-table tbody tr:last-child  { border-bottom: none; }
    #bookings-table tbody tr:hover       { background: rgba(255,255,255,0.025); }
    #bookings-table tbody tr.row-pending { background: rgba(231,76,60,0.05); }
    #bookings-table tbody tr.row-pending:hover { background: rgba(231,76,60,0.09); }
    #bookings-table tbody tr.row-done    { opacity: 0.55; }

    #bookings-table tbody td {
      padding: 12px 16px;
      font-size: 14px;
      vertical-align: middle;
    }

    .bk-sub     { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .bk-actions { display: flex; gap: 6px; flex-wrap: nowrap; align-items: center; }

    .badge-neue-anfrage { background: rgba(231,76,60,0.15); color: #e74c3c; border: 1px solid rgba(231,76,60,0.4); }
    .badge-bestaetigt   { background: rgba(39,174,96,0.15);  color: #27ae60; border: 1px solid rgba(39,174,96,0.4); }
    .badge-erledigt     { background: rgba(136,136,160,0.12); color: #8888a0; border: 1px solid rgba(136,136,160,0.3); }
    .badge-storniert    { background: rgba(85,85,106,0.12);   color: #55556a; border: 1px solid rgba(85,85,106,0.3); }

    .btn-confirm { color: #27ae60; border: 1px solid rgba(39,174,96,0.5); background: rgba(39,174,96,0.08); }
    .btn-confirm:hover { background: rgba(39,174,96,0.18); }
    .btn-decline { color: #e74c3c; border: 1px solid rgba(231,76,60,0.5); background: rgba(231,76,60,0.08); }
    .btn-decline:hover { background: rgba(231,76,60,0.18); }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); z-index: 200;
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 16px; width: 100%; max-width: 560px;
      max-height: 90vh; overflow-y: auto;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 24px; border-bottom: 1px solid #2a2a2a;
    }
    .modal-title  { font-size: 18px; font-weight: 700; }
    .modal-close  { background: none; border: none; color: #55556a; font-size: 24px; cursor: pointer; padding: 4px; line-height: 1; }
    .modal-close:hover { color: #f0f0f5; }
    .modal-body   { padding: 24px; }
    .modal-footer { display: flex; justify-content: flex-end; padding: 16px 24px; border-top: 1px solid #2a2a2a; }
    .detail-row   { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .detail-field label { display: block; font-size: 12px; font-weight: 600; color: #8888a0; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .detail-field .dv   { font-size: 15px; color: #f0f0f5; }
    .detail-id    { font-size: 11px; color: #55556a; margin-top: 16px; padding-top: 16px; border-top: 1px solid #2a2a2a; }
  </style>
</head>
<body>

<header class="top-header" id="top-header"></header>

<div class="bk-page">
  <h1 class="page-title">Meine Buchungen</h1>
  <div id="alert-box" class="alert"></div>
</div>

<div id="bk-tfoot" style="display:none;text-align:right;padding:0 24px 10px;font-size:14px;color:var(--text-secondary)">
  Gesamt (best. + erl.): <strong id="bk-sum-value" style="color:var(--accent)">–</strong>
</div>

<div class="bk-outer">
  <div class="bk-table-wrap">
    <div style="overflow-x:auto">
      <table id="bookings-table">
        <thead>
          <tr>
            <th>Status</th>
            <th>Datum</th>
            <th>Uhrzeit</th>
            <th>Kunde</th>
            <th>Kurs</th>
            <th>Art</th>
            <th>Stadt</th>
            <th>Vergütung</th>
            <th>Aktion</th>
          </tr>
        </thead>
        <tbody id="bookings-body">
          <tr><td colspan="9" class="loading-overlay"><span class="spinner"></span> Laden...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<nav class="bottom-nav" id="bottom-nav"></nav>

<!-- Detail Modal -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Buchungs-Details</div>
      <button class="modal-close" onclick="closeDetailModal()">&times;</button>
    </div>
    <div class="modal-body" id="detail-modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" onclick="closeDetailModal()">Schließen</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-check.js"></script>
<script src="../shared/table-utils.js"></script>
<script>
  let allBookings  = [];
  let allGTClasses = [];
  let tableFilter;

  const CANCELLED = ['cancelled', 'cancelled_by_trainer', 'refunded'];

  // Sortier-Priorität: pending=0, confirmed=1, completed=2, cancelled+=3
  function statusPriority(item) {
    if (item._type === 'gt') return item.is_active ? 1 : 3;
    if (item.status === 'pending')            return 0;
    if (item.status === 'confirmed')          return 1;
    if (item.status === 'completed')          return 2;
    return 3;
  }

  function getAllItems() {
    const all = [...allBookings, ...allGTClasses];
    return all.sort((a, b) => {
      const pa = statusPriority(a), pb = statusPriority(b);
      if (pa !== pb) return pa - pb;
      // Bestätigt: aufsteigend nach Datum (nächster Termin oben)
      if (pa === 1) return (a.scheduled_date || '').localeCompare(b.scheduled_date || '');
      // Alle anderen: absteigend nach Datum (neueste oben)
      return (b.scheduled_date || '').localeCompare(a.scheduled_date || '');
    });
  }

  function statusBadgeBK(item) {
    if (item._type === 'gt') {
      return item.is_active
        ? '<span class="badge badge-bestaetigt">Aktiv</span>'
        : '<span class="badge badge-storniert">Inaktiv</span>';
    }
    switch (item.status) {
      case 'pending':            return '<span class="badge badge-neue-anfrage">Neue Anfrage</span>';
      case 'confirmed':          return '<span class="badge badge-bestaetigt">Bestätigt</span>';
      case 'completed':          return '<span class="badge badge-erledigt">Erledigt</span>';
      case 'expired':            return '<span class="badge badge-expired" style="background:rgba(243,156,18,0.15);color:#f39c12;border:1px solid rgba(243,156,18,0.4)">Abgelaufen</span>';
      case 'cancelled':
      case 'cancelled_by_trainer':
      case 'refunded':           return '<span class="badge badge-storniert">Storniert</span>';
      default:                   return `<span class="badge badge-erledigt">${item.status}</span>`;
    }
  }

  function rowClass(item) {
    if (item._type === 'gt') return item.is_active ? '' : 'row-done';
    if (item.status === 'pending') return 'row-pending';
    if (item.status === 'completed' || item.status === 'expired' || CANCELLED.includes(item.status)) return 'row-done';
    return '';
  }

  function calcRevenue(item) {
    const rate = window.currentTrainer?.payout_cents ?? null;
    if (item._type === 'gt') {
      if (!item.is_active) return '<span style="color:var(--text-muted)">0,00 €</span>';
      const share = (rate && item.participant_count > 0) ? Math.round(rate / item.participant_count) : rate;
      return share ? formatEuro(share) : '–';
    }
    if (CANCELLED.includes(item.status)) return '<span style="color:var(--text-muted)">0,00 €</span>';
    if (item.status === 'expired') return '<span style="color:var(--text-muted)">0,00 € (ausstehend)</span>';
    if (item.status === 'pending') return '–';
    const payout = item.payout_cents ?? rate;
    return payout ? formatEuro(payout) : '–';
  }

  (async () => {
    const trainer = await checkTrainerAuth();
    if (!trainer) return;

    document.getElementById('top-header').innerHTML = renderTopHeader();
    document.getElementById('bottom-nav').innerHTML  = renderNav('bookings');

    if (!trainer.id) {
      document.getElementById('bookings-body').innerHTML =
        '<tr><td colspan="9" class="text-muted" style="padding:20px">Kein Trainer-Profil verknüpft.</td></tr>';
      return;
    }

    tableFilter = initSortableTable('bookings-table', [
      { key: 'status',   type: 'select', getValue: item => {
          if (item._type === 'gt') return item.is_active ? 'Aktiv' : 'Inaktiv';
          const map = { pending: 'Neue Anfrage', confirmed: 'Bestätigt', completed: 'Erledigt', cancelled: 'Storniert', cancelled_by_trainer: 'Storniert', refunded: 'Storniert' };
          return map[item.status] || item.status;
        } },
      { key: 'date',     type: 'date',   getValue: item => item.scheduled_date || '' },
      { key: 'time',     type: 'select', getValue: item => (item.scheduled_time || '').slice(0,5) || '–' },
      { key: 'customer', type: 'text',   getValue: item => item._type === 'gt' ? '' : (item.customer_name || '') },
      { key: 'course',   type: 'text',   getValue: item => item._type === 'gt' ? item.group_class_name : '' },
      { key: 'type',     type: 'select', getValue: item => item._type === 'gt' ? 'GT' : 'PT' },
      { key: 'city',     type: 'select', getValue: item => item._type === 'gt' ? (item.city || '') : (item.city || item.location_name || item.location || '') },
      { key: 'revenue',  type: 'number', getValue: item => {
          const rate = window.currentTrainer?.payout_cents ?? 0;
          if (item._type === 'gt') return item.is_active ? rate / 100 : 0;
          if (CANCELLED.includes(item.status) || item.status === 'pending') return 0;
          return (item.payout_cents ?? rate) / 100;
        } },
      null,
    ]);
    tableFilter.onFilterChange(() => renderBookings());

    await loadBookings();

    const sb = getSupabase();
    sb.channel('bookings-realtime')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings', filter: `trainer_id=eq.${trainer.id}` },
        () => loadBookings())
      .subscribe();
  })();

  async function loadBookings() {
    const sb = getSupabase();
    const trainerId = window.currentTrainer.id;

    try {
      const { data, error } = await sb
        .from('bookings')
        .select('*')
        .eq('trainer_id', trainerId)
        .order('scheduled_date', { ascending: false });

      if (error) throw error;

      const customerIds = [...new Set((data || []).map(b => b.customer_id).filter(Boolean))];
      const customerNames = {};
      if (customerIds.length > 0) {
        const { data: customers } = await sb
          .from('customers')
          .select('id, first_name, last_name, full_name')
          .in('id', customerIds);
        if (customers) {
          customers.forEach(c => {
            customerNames[c.id] = c.full_name || [c.first_name, c.last_name].filter(Boolean).join(' ') || 'Kunde';
          });
        }
      }

      allBookings = (data || []).map(b => ({
        ...b,
        _type: 'pt',
        customer_name: customerNames[b.customer_id] || b.customer_name || 'Kunde',
      }));

      const { data: gtClasses } = await sb
        .from('group_classes')
        .select('*')
        .eq('trainer_id', trainerId)
        .order('scheduled_date', { ascending: false });

      allGTClasses = [];
      if (gtClasses && gtClasses.length > 0) {
        const classIds = gtClasses.map(c => c.id);
        // Nur aktive Teilnehmer (status != 'cancelled') zählen
        const { data: ptcps, error: ptcpErr } = await sb
          .from('group_participants')
          .select('group_class_id, status')
          .in('group_class_id', classIds)
          .neq('status', 'cancelled');

        const pcMap = {};
        (ptcps || []).forEach(p => {
          pcMap[p.group_class_id] = (pcMap[p.group_class_id] || 0) + 1;
        });

        allGTClasses = gtClasses.map(gc => ({
          _type:                  'gt',
          id:                     'gc_' + gc.id,
          gc_id:                  gc.id,
          scheduled_date:         gc.scheduled_date,
          scheduled_time:         gc.scheduled_time,
          city:                   gc.city,
          is_active:              gc.is_active,
          group_class_name:       gc.name || 'Gruppentraining',
          participant_count:      pcMap[gc.id] || 0,
          max_participants:       gc.max_participants,
          price_per_person_cents: gc.price_per_person_cents,
        }));
      }

      renderBookings();
    } catch (err) {
      document.getElementById('bookings-body').innerHTML =
        `<tr><td colspan="9" class="text-error" style="padding:20px">Fehler: ${err.message}</td></tr>`;
    }
  }

  function calcSumCents(items) {
    const rate = window.currentTrainer?.payout_cents ?? 0;
    return items.reduce((sum, item) => {
      if (item._type === 'gt') {
        return item.is_active ? sum + rate : sum;
      }
      if (item.status === 'confirmed' || item.status === 'completed') {
        return sum + (item.payout_cents ?? rate ?? 0);
      }
      return sum;
    }, 0);
  }

  function renderBookings() {
    const items = tableFilter ? tableFilter.apply(getAllItems()) : getAllItems();
    const tbody = document.getElementById('bookings-body');

    if (items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted" style="padding:24px">Keine Buchungen vorhanden</td></tr>';
      document.getElementById('bk-tfoot').style.display = 'none';
      return;
    }

    tbody.innerHTML = items.map(item =>
      item._type === 'gt' ? renderGTRow(item) : renderPTRow(item)
    ).join('');

    const sumCents = calcSumCents(items);
    document.getElementById('bk-sum-value').textContent = formatEuro(sumCents);
    document.getElementById('bk-tfoot').style.display = '';
  }

  function renderPTRow(b) {
    const city    = b.city || b.location_name || b.location || '–';
    const revenue = calcRevenue(b);
    const actions = b.status === 'pending'
      ? `<button class="btn btn-sm btn-confirm" onclick="updateBooking('${b.id}','confirmed')">Bestätigen</button>
         <button class="btn btn-sm btn-decline" onclick="updateBooking('${b.id}','cancelled_by_trainer')">Ablehnen</button>`
      : `<button class="btn btn-ghost btn-sm" onclick="showDetail('${b.id}')">Details</button>`;
    return `
      <tr class="${rowClass(b)}">
        <td>${statusBadgeBK(b)}</td>
        <td style="white-space:nowrap">${b.scheduled_date ? formatDate(b.scheduled_date) : '–'}</td>
        <td style="white-space:nowrap;color:var(--text-secondary)">${b.scheduled_time ? b.scheduled_time.slice(0,5) : '–'}</td>
        <td>${b.customer_name || 'Kunde'}</td>
        <td style="color:var(--text-muted)">–</td>
        <td><span class="badge" style="background:rgba(46,117,182,0.12);color:#5BB8FF;border:1px solid rgba(91,184,255,0.25)">PT</span></td>
        <td>${city}</td>
        <td class="text-accent">${revenue}</td>
        <td><div class="bk-actions">${actions}</div></td>
      </tr>`;
  }

  function renderGTRow(gc) {
    const ptLabel = gc.max_participants
      ? `${gc.group_class_name} (${gc.participant_count}/${gc.max_participants})`
      : `${gc.group_class_name} (${gc.participant_count})`;
    const revenue = calcRevenue(gc);
    return `
      <tr class="${rowClass(gc)}">
        <td>${statusBadgeBK(gc)}</td>
        <td style="white-space:nowrap">${gc.scheduled_date ? formatDate(gc.scheduled_date) : '–'}</td>
        <td style="white-space:nowrap;color:var(--text-secondary)">${gc.scheduled_time ? gc.scheduled_time.slice(0,5) : '–'}</td>
        <td style="color:var(--text-muted)">–</td>
        <td style="font-weight:600">${ptLabel}</td>
        <td><span class="badge" style="background:rgba(45,106,79,0.12);color:#40916C;border:1px solid rgba(64,145,108,0.25)">GT</span></td>
        <td>${gc.city || '–'}</td>
        <td class="text-accent">${revenue}</td>
        <td><div class="bk-actions"><button class="btn btn-ghost btn-sm" onclick="showGTDetail('${gc.gc_id}')">Details</button></div></td>
      </tr>`;
  }

  function showGTDetail(gcId) {
    const gc = allGTClasses.find(x => x.gc_id === gcId);
    if (!gc) return;
    const revenue = calcRevenue(gc).replace(/<[^>]+>/g, '');
    const participants = gc.max_participants
      ? `${gc.participant_count} / ${gc.max_participants}`
      : String(gc.participant_count);
    document.getElementById('detail-modal-body').innerHTML = `
      <div class="detail-row">
        <div class="detail-field"><label>Kurs</label><div class="dv">${gc.group_class_name}</div></div>
        <div class="detail-field"><label>Art</label><div class="dv">Gruppentraining</div></div>
      </div>
      <div class="detail-row">
        <div class="detail-field"><label>Datum</label><div class="dv">${gc.scheduled_date ? formatDate(gc.scheduled_date) : '–'}</div></div>
        <div class="detail-field"><label>Uhrzeit</label><div class="dv">${gc.scheduled_time ? gc.scheduled_time.slice(0,5) : '–'}</div></div>
      </div>
      <div class="detail-row">
        <div class="detail-field"><label>Stadt</label><div class="dv">${gc.city || '–'}</div></div>
        <div class="detail-field"><label>Status</label><div class="dv">${statusBadgeBK(gc)}</div></div>
      </div>
      <div class="detail-row">
        <div class="detail-field"><label>Teilnehmer</label><div class="dv">👥 ${participants}</div></div>
        <div class="detail-field"><label>Vergütung</label><div class="dv" style="color:var(--accent);font-weight:700">${revenue}</div></div>
      </div>
      <div class="detail-id">Kurs-ID: ${gcId}</div>
    `;
    document.getElementById('detail-modal').classList.add('open');
  }

  const HEALTH_LABELS = {
    heart_disease: 'Herz-Kreislauf-Erkrankungen',
    joint_problems: 'Gelenkprobleme / Rückenbeschwerden',
    respiratory: 'Atemwegserkrankungen',
    medical_treatment: 'In ärztlicher Behandlung',
    medication: 'Regelmäßige Medikamente',
    recent_surgery: 'OP in den letzten 6 Monaten',
    pregnant: 'Schwangerschaft',
    other_conditions: 'Sonstige Einschränkungen',
  };

  function renderHealthSection(hd) {
    if (!hd) return '<div style="padding:12px;border-radius:10px;background:rgba(64,145,108,0.08);border:1px solid rgba(64,145,108,0.25);margin-bottom:16px"><span style="color:#40916C;font-weight:700">✅ Keine besonderen Gesundheitshinweise</span></div>';

    const concerns = Object.entries(HEALTH_LABELS).filter(([k]) => hd[k] === true).map(([,v]) => v);
    const notes = typeof hd.additional_notes === 'string' && hd.additional_notes.trim() ? hd.additional_notes.trim() : null;

    if (concerns.length === 0 && !notes) {
      return '<div style="padding:12px;border-radius:10px;background:rgba(64,145,108,0.08);border:1px solid rgba(64,145,108,0.25);margin-bottom:16px"><span style="color:#40916C;font-weight:700">✅ Keine besonderen Gesundheitshinweise</span></div>';
    }

    let html = '<div style="padding:12px;border-radius:10px;background:rgba(224,85,85,0.08);border:1px solid rgba(224,85,85,0.25);margin-bottom:16px">';
    html += '<div style="color:#E05555;font-weight:700;margin-bottom:8px">⚠️ Gesundheitshinweise</div>';
    html += '<ul style="margin:0;padding-left:18px;color:#f0f0f5;font-size:13px;line-height:1.8">';
    concerns.forEach(c => { html += `<li>${c}</li>`; });
    html += '</ul>';
    if (notes) html += `<div style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.06);font-size:13px;color:#8888a0"><strong>Ergänzung:</strong> ${notes}</div>`;
    html += '</div>';
    return html;
  }

  async function showDetail(bookingId) {
    const b = allBookings.find(x => x.id === bookingId);
    if (!b) return;

    const vergütung = calcRevenue(b).replace(/<[^>]+>/g, '');
    const hasRating = b.rating && b.rating > 0;

    // Kundendaten laden (Gesundheit + Telefon)
    let healthHtml = '';
    let contactHtml = '';
    if (b.customer_id) {
      try {
        const sb = getSupabase();
        const { data: cust } = await sb.from('customers').select('health_declaration, phone').eq('id', b.customer_id).single();
        healthHtml = renderHealthSection(cust?.health_declaration);

        // Telefonnummer nur bei confirmed/checked_in anzeigen
        const showContact = ['confirmed', 'checked_in', 'checked_in_trainer'].includes(b.status);
        if (showContact && cust?.phone) {
          contactHtml = `<div style="padding:12px;border-radius:10px;background:rgba(64,145,108,0.08);border:1px solid rgba(64,145,108,0.25);margin-bottom:16px">
            <div style="font-size:11px;font-weight:600;color:#8888a0;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">Kontakt zum Kunden</div>
            <a href="tel:${cust.phone}" style="color:#40916C;font-size:16px;font-weight:700;text-decoration:none">📞 ${cust.phone}</a>
            <div style="font-size:12px;color:#55556a;margin-top:4px">Bei Verspätung oder Fragen zum Treffpunkt</div>
          </div>`;
        }
      } catch {
        healthHtml = '';
      }
    }

    document.getElementById('detail-modal-body').innerHTML = `
      <div class="detail-row">
        <div class="detail-field"><label>Kunde</label><div class="dv">${b.customer_name || '–'}</div></div>
        <div class="detail-field"><label>Art</label><div class="dv">Personal Training</div></div>
      </div>
      <div class="detail-row">
        <div class="detail-field"><label>Datum</label><div class="dv">${b.scheduled_date ? formatDate(b.scheduled_date) : '–'}</div></div>
        <div class="detail-field"><label>Uhrzeit</label><div class="dv">${b.scheduled_time ? b.scheduled_time.slice(0,5) : '–'}</div></div>
      </div>
      <div class="detail-row">
        <div class="detail-field"><label>Stadt / Ort</label><div class="dv">${b.city || b.location_name || b.location || '–'}</div></div>
        <div class="detail-field"><label>Status</label><div class="dv">${statusBadgeBK(b)}</div></div>
      </div>
      <div class="detail-row">
        <div class="detail-field"><label>Vergütung</label><div class="dv" style="color:var(--accent);font-weight:700">${vergütung}</div></div>
        ${hasRating ? `<div class="detail-field"><label>Bewertung</label><div class="dv">⭐ ${b.rating}/5${b.review_comment ? '<br><span style="font-size:13px;color:#8888a0">„' + b.review_comment + '"</span>' : ''}</div></div>` : '<div></div>'}
      </div>
      ${contactHtml}
      ${healthHtml}
      ${b.notes ? `<div class="detail-field" style="margin-bottom:16px"><label>Notizen</label><div class="dv" style="font-size:14px;color:#8888a0">${b.notes}</div></div>` : ''}
      <div class="detail-id">Buchungs-ID: ${b.id}</div>
    `;
    document.getElementById('detail-modal').classList.add('open');
  }

  function closeDetailModal() {
    document.getElementById('detail-modal').classList.remove('open');
  }

  document.addEventListener('click', e => {
    if (e.target === document.getElementById('detail-modal')) closeDetailModal();
  });

  async function updateBooking(bookingId, status) {
    const sb = getSupabase();
    const { error } = await sb.from('bookings').update({ status }).eq('id', bookingId);
    if (error) {
      showAlert('alert-box', 'Fehler: ' + error.message, 'error');
    } else {
      showAlert('alert-box', status === 'confirmed' ? 'Buchung bestätigt!' : 'Buchung abgelehnt.', 'success');
      await loadBookings();
    }
  }
</script>

</body>
</html>
