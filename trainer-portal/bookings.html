<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buchungen – Trainer-Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top-header" id="top-header"></header>

<div class="content">
  <h1 class="page-title">Meine Buchungen</h1>

  <div id="alert-box" class="alert"></div>

  <div class="tab-bar" id="tab-bar">
    <button class="tab-btn active" data-tab="pending">Neue Anfragen <span id="pending-count"></span></button>
    <button class="tab-btn" data-tab="confirmed">Bestätigt</button>
    <button class="tab-btn" data-tab="past">Vergangen</button>
  </div>

  <div id="bookings-list">
    <div class="loading-center"><span class="spinner"></span> Buchungen laden...</div>
  </div>
</div>

<nav class="bottom-nav" id="bottom-nav"></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-check.js"></script>
<script>
  let allBookings = [];
  let allGTClasses = [];
  let currentTab = 'pending';

  (async () => {
    const trainer = await checkTrainerAuth();
    if (!trainer) return;

    document.getElementById('top-header').innerHTML = renderTopHeader();
    document.getElementById('bottom-nav').innerHTML = renderNav('bookings');

    if (!trainer.id) {
      document.getElementById('bookings-list').innerHTML = '<div class="empty-state"><div class="empty-state-text">Kein Trainer-Profil verknüpft.</div></div>';
      return;
    }

    // Tab clicks
    document.querySelectorAll('#tab-bar .tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#tab-bar .tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        renderBookings();
      });
    });

    await loadBookings();

    // ─── Realtime: Neue Buchungen ───────────────────────────────
    const sb = getSupabase();
    sb.channel('bookings-realtime')
      .on('postgres_changes', {
        event: '*',
        schema: 'public',
        table: 'bookings',
        filter: `trainer_id=eq.${trainer.id}`,
      }, (payload) => {
        console.log('Realtime Buchungs-Update:', payload);
        loadBookings(); // Reload
      })
      .subscribe();
  })();

  async function loadBookings() {
    const sb = getSupabase();
    const trainerId = window.currentTrainer.id;
    const authUserId = window.currentTrainer.auth_user_id;

    console.log('[Bookings] Lade für trainer_id:', trainerId, 'auth_user_id:', authUserId);

    try {
      // Erst prüfen ob der Trainer sich selbst sehen kann
      const { data: selfCheck, error: selfErr } = await sb
        .from('trainer_profiles')
        .select('id, full_name')
        .eq('id', trainerId)
        .single();
      console.log('[Bookings] Trainer self-check:', selfCheck, selfErr?.message);

      // Buchungen laden (KEIN JOIN auf customers – FK fehlt im Schema)
      const { data, error } = await sb
        .from('bookings')
        .select('*')
        .eq('trainer_id', trainerId)
        .order('scheduled_date', { ascending: false });

      console.log('[Bookings] Query result:', data?.length, 'Buchungen', error?.message);
      if (data) console.log('[Bookings] Statuses:', data.map(b => b.status).join(', '));

      if (error) throw error;

      // Kundennamen separat laden
      const customerIds = [...new Set((data || []).map(b => b.customer_id).filter(Boolean))];
      const customerNames = {};
      if (customerIds.length > 0) {
        const { data: customers } = await sb
          .from('customers')
          .select('id, first_name, last_name, full_name')
          .in('id', customerIds);
        if (customers) {
          customers.forEach(c => {
            customerNames[c.id] = c.full_name || [c.first_name, c.last_name].filter(Boolean).join(' ') || 'Kunde';
          });
        }
      }

      allBookings = (data || []).map(b => ({
        ...b,
        _type: 'pt',
        customer_name: customerNames[b.customer_id] || b.customer_name || 'Kunde',
      }));

      // ─── Gruppentrainings laden ───────────────────────────────
      const { data: gtClasses } = await sb
        .from('group_classes')
        .select('*')
        .eq('trainer_id', trainerId)
        .order('scheduled_date', { ascending: false });

      allGTClasses = [];
      if (gtClasses && gtClasses.length > 0) {
        const classIds = gtClasses.map(c => c.id);
        const { data: ptcps } = await sb
          .from('group_participants')
          .select('group_class_id, status')
          .in('group_class_id', classIds);

        const pcMap = {};
        (ptcps || []).forEach(p => {
          if (!['cancelled', 'refunded'].includes((p.status || '').toLowerCase())) {
            pcMap[p.group_class_id] = (pcMap[p.group_class_id] || 0) + 1;
          }
        });

        allGTClasses = gtClasses.map(gc => ({
          _type:                  'gt',
          id:                     'gc_' + gc.id,
          gc_id:                  gc.id,
          scheduled_date:         gc.scheduled_date,
          scheduled_time:         gc.scheduled_time,
          location_name:          gc.city,
          is_active:              gc.is_active,
          group_class_name:       gc.name || 'Gruppentraining',
          participant_count:      pcMap[gc.id] || 0,
          max_participants:       gc.max_participants,
          price_per_person_cents: gc.price_per_person_cents,
        }));
      }

      // Update pending count (Supabase speichert lowercase)
      const pendingCount = allBookings.filter(b => b.status === 'pending').length;
      document.getElementById('pending-count').textContent = pendingCount > 0 ? `(${pendingCount})` : '';

      renderBookings();
    } catch (err) {
      document.getElementById('bookings-list').innerHTML =
        `<div class="empty-state text-error">Fehler: ${err.message}</div>`;
    }
  }

  function renderBookings() {
    const today = new Date().toISOString().slice(0, 10);
    let filtered;

    switch (currentTab) {
      case 'pending':
        // GT braucht keine Trainer-Bestätigung
        filtered = allBookings.filter(b => b.status === 'pending');
        break;
      case 'confirmed':
        filtered = [
          ...allBookings.filter(b => b.status === 'confirmed' && b.scheduled_date >= today),
          ...allGTClasses.filter(gc => gc.is_active && gc.scheduled_date >= today),
        ].sort((a, b) => (a.scheduled_date || '').localeCompare(b.scheduled_date || ''));
        break;
      case 'past':
        filtered = [
          ...allBookings.filter(b =>
            b.status === 'completed' || b.status === 'cancelled' || b.status === 'cancelled_by_trainer' ||
            (b.status === 'confirmed' && b.scheduled_date < today)
          ),
          ...allGTClasses.filter(gc => !gc.is_active || gc.scheduled_date < today),
        ].sort((a, b) => (b.scheduled_date || '').localeCompare(a.scheduled_date || ''));
        break;
      default:
        filtered = [...allBookings, ...allGTClasses];
    }

    const container = document.getElementById('bookings-list');

    if (filtered.length === 0) {
      const messages = {
        pending:   'Keine neuen Anfragen',
        confirmed: 'Keine bestätigten Termine',
        past:      'Noch keine vergangenen Buchungen',
      };
      container.innerHTML = `<div class="empty-state">
        <div class="empty-state-icon">📋</div>
        <div class="empty-state-text">${messages[currentTab]}</div>
      </div>`;
      return;
    }

    container.innerHTML = filtered.map(item =>
      item._type === 'gt' ? renderGTCard(item) : renderPTCard(item)
    ).join('');
  }

  function renderPTCard(b) {
    const isPending = b.status === 'pending';
    const hasRating = b.rating && b.rating > 0;
    return `
      <div class="booking-item">
        <div class="booking-top">
          <div class="booking-customer">${b.customer_name || 'Kunde'}</div>
          ${statusBadge(b.status)}
        </div>
        <div class="booking-meta">
          📅 ${formatDate(b.scheduled_date)} · ${formatTime(b.scheduled_time)}<br>
          📍 ${b.location_name || b.location || '–'}
          ${b.price_cents ? '<br>💰 ' + formatEuro(b.price_cents) : ''}
          ${hasRating ? '<br>⭐ ' + b.rating + '/5' + (b.review_comment ? ' – „' + b.review_comment + '"' : '') : ''}
        </div>
        ${isPending ? `
          <div class="booking-actions">
            <button class="btn btn-success btn-sm" onclick="updateBooking('${b.id}', 'confirmed')">Bestätigen</button>
            <button class="btn btn-danger btn-sm" onclick="updateBooking('${b.id}', 'cancelled_by_trainer')">Ablehnen</button>
          </div>
        ` : ''}
      </div>`;
  }

  function renderGTCard(gc) {
    const spotsText = gc.max_participants
      ? `${gc.participant_count} / ${gc.max_participants} Teilnehmer`
      : `${gc.participant_count} Teilnehmer`;
    return `
      <div class="booking-item">
        <div class="booking-top">
          <div class="booking-customer">🏃 ${gc.group_class_name}</div>
          <span class="badge badge-paused">Gruppentraining</span>
        </div>
        <div class="booking-meta">
          📅 ${formatDate(gc.scheduled_date)} · ${formatTime(gc.scheduled_time)}<br>
          📍 ${gc.location_name || '–'}<br>
          👥 ${spotsText}
          ${gc.price_per_person_cents ? '<br>💰 ' + formatEuro(gc.price_per_person_cents) + ' / Person' : ''}
        </div>
      </div>`;
  }

  async function updateBooking(bookingId, status) {
    const sb = getSupabase();
    const { error } = await sb.from('bookings').update({ status }).eq('id', bookingId);
    if (error) {
      showAlert('alert-box', 'Fehler: ' + error.message, 'error');
    } else {
      showAlert('alert-box', status === 'confirmed' ? 'Buchung bestätigt!' : 'Buchung abgelehnt.', 'success');
      await loadBookings();
    }
  }
</script>

</body>
</html>
