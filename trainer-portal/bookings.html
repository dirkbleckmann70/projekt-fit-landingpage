<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buchungen – Trainer-Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../shared/table-utils.css">
  <style>
    .bk-page   { padding: 20px 24px 8px; }
    .bk-outer  { padding: 0 24px 24px; }

    @media (max-width: 768px) {
      .bk-page  { padding: 16px 16px 8px; }
      .bk-outer { padding: 0 16px 16px; }
    }

    .bk-table-wrap {
      background: #161625;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      overflow: hidden;
    }

    #bookings-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    #bookings-table thead th {
      padding: 12px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      color: #8888A0;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      background: rgba(0,0,0,0.2);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      white-space: nowrap;
    }

    #bookings-table tbody td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      vertical-align: middle;
      color: #F0F0F5;
      line-height: 1.4;
    }

    #bookings-table tbody tr:last-child td { border-bottom: none; }
    #bookings-table tbody tr:hover td { background: rgba(255,255,255,0.02); }

    .bk-date-main  { font-weight: 600; white-space: nowrap; }
    .bk-date-time  { font-size: 12px; color: #8888A0; margin-top: 2px; }
    .bk-sub        { font-size: 12px; color: #8888A0; margin-top: 2px; }

    .bk-actions { display: flex; gap: 6px; flex-wrap: nowrap; align-items: center; }

    .btn-confirm { color: #27ae60; border: 1px solid rgba(39,174,96,0.5); background: rgba(39,174,96,0.08); }
    .btn-confirm:hover { background: rgba(39,174,96,0.18); }
    .btn-decline { color: #e74c3c; border: 1px solid rgba(231,76,60,0.5); background: rgba(231,76,60,0.08); }
    .btn-decline:hover { background: rgba(231,76,60,0.18); }
  </style>
</head>
<body>

<header class="top-header" id="top-header"></header>

<div class="bk-page">
  <h1 class="page-title">Meine Buchungen</h1>
  <div id="alert-box" class="alert"></div>
  <div class="tab-bar" id="tab-bar">
    <button class="tab-btn active" data-tab="pending">Neue Anfragen <span id="pending-count"></span></button>
    <button class="tab-btn" data-tab="confirmed">Bestätigt</button>
    <button class="tab-btn" data-tab="past">Vergangen</button>
  </div>
</div>

<div class="bk-outer">
  <div class="bk-table-wrap">
    <div style="overflow-x:auto">
      <table id="bookings-table">
        <thead>
          <tr>
            <th>Datum</th>
            <th>Kunde / Kurs</th>
            <th>Art</th>
            <th>Stadt</th>
            <th>Status</th>
            <th>Vergütung</th>
            <th>Aktion</th>
          </tr>
        </thead>
        <tbody id="bookings-body">
          <tr><td colspan="7" class="loading-overlay"><span class="spinner"></span> Laden...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<nav class="bottom-nav" id="bottom-nav"></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-check.js"></script>
<script src="../shared/table-utils.js"></script>
<script>
  let allBookings  = [];
  let allGTClasses = [];
  let currentTab   = 'pending';
  let tableFilter;

  (async () => {
    const trainer = await checkTrainerAuth();
    if (!trainer) return;

    document.getElementById('top-header').innerHTML = renderTopHeader();
    document.getElementById('bottom-nav').innerHTML  = renderNav('bookings');

    if (!trainer.id) {
      document.getElementById('bookings-body').innerHTML =
        '<tr><td colspan="7" class="text-muted" style="padding:20px">Kein Trainer-Profil verknüpft.</td></tr>';
      return;
    }

    document.querySelectorAll('#tab-bar .tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#tab-bar .tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        renderBookings();
      });
    });

    tableFilter = initSortableTable('bookings-table', [
      { key: 'date',     type: 'date',   getValue: item => item.scheduled_date || '' },
      { key: 'name',     type: 'text',   getValue: item => item._type === 'gt' ? item.group_class_name : (item.customer_name || '') },
      { key: 'type',     type: 'select', getValue: item => item._type === 'gt' ? 'GT' : 'PT' },
      { key: 'city',     type: 'select', getValue: item => item._type === 'gt' ? (item.location_name || '') : (item.location_name || item.location || '') },
      { key: 'status',   type: 'select', getValue: item => item._type === 'gt' ? (item.is_active ? 'Aktiv' : 'Inaktiv') : (item.status || '') },
      { key: 'revenue',  type: 'number', getValue: item => {
          const rate = window.currentTrainer?.payout_cents ?? 0;
          if (item._type === 'gt') return item.participant_count > 0 ? Math.round(rate / item.participant_count) / 100 : rate / 100;
          return (item.payout_cents ?? rate) / 100;
        } },
      null,
    ]);
    tableFilter.onFilterChange(() => renderBookings());

    await loadBookings();

    // Realtime
    const sb = getSupabase();
    sb.channel('bookings-realtime')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings', filter: `trainer_id=eq.${trainer.id}` },
        () => loadBookings())
      .subscribe();
  })();

  async function loadBookings() {
    const sb = getSupabase();
    const trainerId = window.currentTrainer.id;

    try {
      const { data, error } = await sb
        .from('bookings')
        .select('*')
        .eq('trainer_id', trainerId)
        .order('scheduled_date', { ascending: false });

      if (error) throw error;

      // Kundennamen laden
      const customerIds = [...new Set((data || []).map(b => b.customer_id).filter(Boolean))];
      const customerNames = {};
      if (customerIds.length > 0) {
        const { data: customers } = await sb
          .from('customers')
          .select('id, first_name, last_name, full_name')
          .in('id', customerIds);
        if (customers) {
          customers.forEach(c => {
            customerNames[c.id] = c.full_name || [c.first_name, c.last_name].filter(Boolean).join(' ') || 'Kunde';
          });
        }
      }

      allBookings = (data || []).map(b => ({
        ...b,
        _type: 'pt',
        customer_name: customerNames[b.customer_id] || b.customer_name || 'Kunde',
      }));

      // Gruppentrainings laden
      const { data: gtClasses } = await sb
        .from('group_classes')
        .select('*')
        .eq('trainer_id', trainerId)
        .order('scheduled_date', { ascending: false });

      allGTClasses = [];
      if (gtClasses && gtClasses.length > 0) {
        const classIds = gtClasses.map(c => c.id);
        const { data: ptcps } = await sb
          .from('group_participants')
          .select('group_class_id, status')
          .in('group_class_id', classIds);

        const pcMap = {};
        (ptcps || []).forEach(p => {
          if (!['cancelled', 'refunded'].includes((p.status || '').toLowerCase())) {
            pcMap[p.group_class_id] = (pcMap[p.group_class_id] || 0) + 1;
          }
        });

        allGTClasses = gtClasses.map(gc => ({
          _type:                  'gt',
          id:                     'gc_' + gc.id,
          gc_id:                  gc.id,
          scheduled_date:         gc.scheduled_date,
          scheduled_time:         gc.scheduled_time,
          location_name:          gc.city,
          is_active:              gc.is_active,
          group_class_name:       gc.name || 'Gruppentraining',
          participant_count:      pcMap[gc.id] || 0,
          max_participants:       gc.max_participants,
          price_per_person_cents: gc.price_per_person_cents,
        }));
      }

      const pendingCount = allBookings.filter(b => b.status === 'pending').length;
      document.getElementById('pending-count').textContent = pendingCount > 0 ? `(${pendingCount})` : '';

      renderBookings();
    } catch (err) {
      document.getElementById('bookings-body').innerHTML =
        `<tr><td colspan="7" class="text-error" style="padding:20px">Fehler: ${err.message}</td></tr>`;
    }
  }

  function getTabItems() {
    const today = new Date().toISOString().slice(0, 10);
    switch (currentTab) {
      case 'pending':
        return allBookings.filter(b => b.status === 'pending');
      case 'confirmed':
        return [
          ...allBookings.filter(b => b.status === 'confirmed' && b.scheduled_date >= today),
          ...allGTClasses.filter(gc => gc.is_active && gc.scheduled_date >= today),
        ].sort((a, b) => (a.scheduled_date || '').localeCompare(b.scheduled_date || ''));
      case 'past':
        return [
          ...allBookings.filter(b =>
            b.status === 'completed' || b.status === 'cancelled' || b.status === 'cancelled_by_trainer' ||
            (b.status === 'confirmed' && b.scheduled_date < today)
          ),
          ...allGTClasses.filter(gc => !gc.is_active || gc.scheduled_date < today),
        ].sort((a, b) => (b.scheduled_date || '').localeCompare(a.scheduled_date || ''));
      default:
        return [...allBookings, ...allGTClasses];
    }
  }

  function renderBookings() {
    const items = tableFilter ? tableFilter.apply(getTabItems()) : getTabItems();
    const tbody = document.getElementById('bookings-body');

    if (items.length === 0) {
      const messages = {
        pending:   'Keine neuen Anfragen',
        confirmed: 'Keine bestätigten Termine',
        past:      'Noch keine vergangenen Buchungen',
      };
      tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted" style="padding:24px">${messages[currentTab] || 'Keine Einträge'}</td></tr>`;
      return;
    }

    tbody.innerHTML = items.map(item =>
      item._type === 'gt' ? renderGTRow(item) : renderPTRow(item)
    ).join('');
  }

  function renderPTRow(b) {
    const isPending    = b.status === 'pending';
    const city         = b.location_name || b.location || '–';
    const trainerRate  = window.currentTrainer?.payout_cents ?? null;
    const payoutCents  = b.payout_cents ?? trainerRate;
    const revenue      = payoutCents ? formatEuro(payoutCents) : '–';
    const dateHtml  = b.scheduled_date
      ? `<div class="bk-date-main">${formatDate(b.scheduled_date)}</div>${b.scheduled_time ? '<div class="bk-date-time">' + formatTime(b.scheduled_time) + '</div>' : ''}`
      : '–';
    const actions = isPending
      ? `<button class="btn btn-sm btn-confirm" onclick="updateBooking('${b.id}','confirmed')">Bestätigen</button>
         <button class="btn btn-sm btn-decline" onclick="updateBooking('${b.id}','cancelled_by_trainer')">Ablehnen</button>`
      : `<button class="btn btn-ghost btn-sm" onclick="showDetail('${b.id}')">Details</button>`;
    return `
      <tr>
        <td>${dateHtml}</td>
        <td>${b.customer_name || 'Kunde'}</td>
        <td><span class="badge" style="background:rgba(46,117,182,0.12);color:#5BB8FF;border:1px solid rgba(91,184,255,0.25)">PT</span></td>
        <td>${city}</td>
        <td>${statusBadge(b.status)}</td>
        <td class="text-accent">${revenue}</td>
        <td><div class="bk-actions">${actions}</div></td>
      </tr>`;
  }

  function renderGTRow(gc) {
    const participants = gc.max_participants
      ? `${gc.participant_count} / ${gc.max_participants}`
      : gc.participant_count;
    const trainerRate  = window.currentTrainer?.payout_cents ?? null;
    const payoutShare  = (trainerRate && gc.participant_count > 0)
      ? Math.round(trainerRate / gc.participant_count)
      : null;
    const revenue      = payoutShare ? formatEuro(payoutShare) : (trainerRate ? formatEuro(trainerRate) : '–');
    const statusEl  = gc.is_active
      ? '<span class="badge badge-active">Aktiv</span>'
      : '<span class="badge badge-paused">Inaktiv</span>';
    const dateHtml  = gc.scheduled_date
      ? `<div class="bk-date-main">${formatDate(gc.scheduled_date)}</div>${gc.scheduled_time ? '<div class="bk-date-time">' + formatTime(gc.scheduled_time) + '</div>' : ''}`
      : '–';
    return `
      <tr>
        <td>${dateHtml}</td>
        <td>
          <div style="font-weight:600">${gc.group_class_name}</div>
          <div class="bk-sub">👥 ${participants} Teilnehmer</div>
        </td>
        <td><span class="badge" style="background:rgba(45,106,79,0.12);color:#40916C;border:1px solid rgba(64,145,108,0.25)">GT</span></td>
        <td>${gc.location_name || '–'}</td>
        <td>${statusEl}</td>
        <td class="text-accent">${revenue}</td>
        <td><div class="bk-actions"></div></td>
      </tr>`;
  }

  function showDetail(bookingId) {
    const b = allBookings.find(x => x.id === bookingId);
    if (!b) return;
    const hasRating = b.rating && b.rating > 0;
    alert(
      `📅 ${formatDate(b.scheduled_date)} · ${formatTime(b.scheduled_time)}\n` +
      `👤 ${b.customer_name}\n` +
      `📍 ${b.location_name || b.location || '–'}\n` +
      `💰 ${b.price_cents ? formatEuro(b.price_cents) : '–'}\n` +
      (hasRating ? `⭐ ${b.rating}/5${b.review_comment ? ' – „' + b.review_comment + '"' : ''}` : '')
    );
  }

  async function updateBooking(bookingId, status) {
    const sb = getSupabase();
    const { error } = await sb.from('bookings').update({ status }).eq('id', bookingId);
    if (error) {
      showAlert('alert-box', 'Fehler: ' + error.message, 'error');
    } else {
      showAlert('alert-box', status === 'confirmed' ? 'Buchung bestätigt!' : 'Buchung abgelehnt.', 'success');
      await loadBookings();
    }
  }
</script>

</body>
</html>
