<!DOCTYPE html>
<html lang="de" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gutschriften – Trainer-Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="../shared/tabler-custom.css">
  <script src="../shared/design-tokens.js"></script>
  <style>
    /* ── Stripe Onboarding Banner ─────────────────────────────────── */
    .stripe-banner {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 14px 18px; border-radius: 12px; margin-bottom: 20px;
      font-size: 14px; font-weight: 600;
    }
    .stripe-banner.pending {
      background: rgba(224, 122, 58, 0.12); border: 1px solid rgba(224, 122, 58, 0.35); color: #E07A3A;
    }
    .stripe-banner.active {
      background: rgba(64, 145, 108, 0.12); border: 1px solid rgba(64, 145, 108, 0.35); color: var(--tblr-primary);
    }
    .stripe-banner-left { display: flex; align-items: center; gap: 10px; }
    .stripe-banner-btn {
      background: #E07A3A; color: #fff; border: none; border-radius: 8px;
      padding: 8px 16px; font-size: 13px; font-weight: 700; font-family: inherit;
      cursor: pointer; white-space: nowrap; transition: opacity 0.2s;
    }
    .stripe-banner-btn:hover { opacity: 0.85; }
    .stripe-banner-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Typ-Badges werden via DESIGN.badge() gerendert */

    tr.storno-row td { color: #e74c3c !important; }
    .sum-row td { font-weight:700; border-top:2px solid rgba(255,255,255,0.12)!important; padding-top:12px!important; padding-bottom:12px!important; }
  </style>
</head>
<body class="page">
<script src="../shared/theme.js"></script>

<div id="sidebar"></div>

<div class="page-wrapper">
  <div class="page-header d-print-none" id="header"></div>
  <div class="page-body" style="padding-bottom:80px">
    <div class="container-fluid">

      <div class="d-flex align-items-center justify-content-between mb-3">
        <button class="pf-btn pf-btn-neutral" onclick="exportCSV()"><i class="ti ti-download me-1"></i>CSV Export</button>
      </div>

      <!-- Stripe Onboarding Banner -->
      <div id="stripe-banner" style="display:none"></div>

      <!-- KPI-Leiste -->
      <div class="row row-deck row-cards mb-3">
        <div class="col-6 col-lg-3">
          <div class="pf-stat-card">
            <div class="pf-stat-label">Gutschriften</div>
            <div class="pf-stat-num" id="kpi-count"><div class="spinner-border spinner-border-sm"></div></div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="pf-stat-card">
            <div class="pf-stat-label">Gesamt Netto</div>
            <div class="pf-stat-num" id="kpi-netto"><div class="spinner-border spinner-border-sm"></div></div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="pf-stat-card">
            <div class="pf-stat-label">MwSt</div>
            <div class="pf-stat-num" id="kpi-mwst"><div class="spinner-border spinner-border-sm"></div></div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="pf-stat-card">
            <div class="pf-stat-label">Gesamt Brutto</div>
            <div class="pf-stat-num" id="kpi-brutto"><div class="spinner-border spinner-border-sm"></div></div>
          </div>
        </div>
      </div>

      <!-- Tabelle -->
      <div class="card mb-3">
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
          <h3 class="card-title">Gutschriften &amp; Stornobelege</h3>
          <div class="d-flex gap-2 flex-wrap">
            <div class="pf-field" style="width:auto;margin-bottom:0"><select id="year-select" class="form-select" onchange="applyFilters()"></select></div>
            <div class="pf-field" style="width:auto;margin-bottom:0"><select id="month-select" class="form-select" onchange="applyFilters()">
              <option value="">Alle Monate</option>
              <option value="01">Januar</option><option value="02">Februar</option><option value="03">März</option>
              <option value="04">April</option><option value="05">Mai</option><option value="06">Juni</option>
              <option value="07">Juli</option><option value="08">August</option><option value="09">September</option>
              <option value="10">Oktober</option><option value="11">November</option><option value="12">Dezember</option>
            </select></div>
            <div class="pf-field" style="width:auto;margin-bottom:0"><select id="type-select" class="form-select" onchange="applyFilters()">
              <option value="">Alle Typen</option>
              <option value="pt">PT</option><option value="gt">GT</option><option value="storno">Storno</option>
            </select></div>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-vcenter card-table" id="invoices-table">
            <thead>
              <tr>
                <th>Nr.</th><th>Datum</th><th>Typ</th><th>Teilnehmer / Kunde</th>
                <th style="text-align:right">Netto</th><th style="text-align:right">MwSt</th>
                <th style="text-align:right">Brutto</th>
                <th style="text-align:center">Öffnen</th>
                <th style="text-align:center">PDF</th>
                <th style="text-align:center">Druck</th>
              </tr>
            </thead>
            <tbody id="invoices-body">
              <tr><td colspan="10" class="text-center"><div class="spinner-border spinner-border-sm me-2"></div> Laden...</td></tr>
            </tbody>
            <tfoot id="invoices-foot" style="display:none">
              <tr class="sum-row">
                <td colspan="4" class="text-secondary" style="font-size:13px" id="sum-label">Gesamt</td>
                <td style="text-align:right" id="sum-netto"></td>
                <td style="text-align:right" class="text-secondary" id="sum-mwst"></td>
                <td class="text-primary" style="text-align:right" id="sum-brutto"></td>
                <td></td><td></td><td></td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<div id="bottom-nav"></div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/js/tabler.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/constants.js"></script>
<script src="../shared/layout.js"></script>
<script src="../shared/toast.js"></script>
<script src="auth-check.js"></script>
<script>
  let allInvoices  = [];
  let trainerId    = null;
  let selectedYear = new Date().getFullYear();

  function f(cents) {
    return (cents / 100).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
  }

  function fSigned(cents) {
    const val = cents / 100;
    const formatted = Math.abs(val).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
    return cents < 0 ? '−' + formatted : formatted;
  }

  function isStorno(inv) { return (inv.type || '').toLowerCase() === 'stornobeleg'; }

  function getBookingType(inv) {
    const bt = (inv.booking_type || inv.session_type || '').toLowerCase();
    if (bt === 'group' || bt === 'gt') return 'gt';
    return 'pt';
  }

  // ── Stripe Onboarding Banner ──────────────────────────────────────────────
  async function loadStripeStatus(userId) {
    const sb = getSupabase();
    const { data: profile } = await sb
      .from('trainer_profiles')
      .select('stripe_onboarding_complete, stripe_account_id')
      .eq('auth_user_id', userId)
      .single();

    const banner = document.getElementById('stripe-banner');
    if (!profile) { banner.style.display = 'none'; return; }

    if (profile.stripe_onboarding_complete) {
      banner.className = 'stripe-banner active';
      banner.innerHTML = `
        <div class="stripe-banner-left">
          <i class="ti ti-circle-check" style="font-size:18px"></i>
          Auszahlung aktiv – Stripe Connect verbunden
        </div>
      `;
    } else {
      banner.className = 'stripe-banner pending';
      banner.innerHTML = `
        <div class="stripe-banner-left">
          <i class="ti ti-alert-circle" style="font-size:18px"></i>
          Auszahlung noch nicht eingerichtet – verbinde jetzt dein Stripe-Konto
        </div>
        <button class="pf-btn pf-btn-primary" id="stripe-onboard-btn" onclick="startStripeOnboarding()">
          Auszahlung einrichten
        </button>
      `;
    }
    banner.style.display = 'flex';
  }

  async function startStripeOnboarding() {
    const btn = document.getElementById('stripe-onboard-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Wird geladen...'; }
    const sb = getSupabase();
    try {
      const { data, error } = await sb.functions.invoke('stripe-connect-onboard', {
        body: { trainer_id: trainerId },
      });
      if (error) throw error;
      if (data?.url) {
        window.location.href = data.url;
      } else {
        alert('Fehler: Keine Redirect-URL erhalten.');
        if (btn) { btn.disabled = false; btn.textContent = 'Auszahlung einrichten'; }
      }
    } catch (err) {
      alert('Fehler beim Stripe Onboarding: ' + err.message);
      if (btn) { btn.disabled = false; btn.textContent = 'Auszahlung einrichten'; }
    }
  }

  function handleOnboardingReturn() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('onboarding') === 'complete') {
      const banner = document.getElementById('stripe-banner');
      if (banner) {
        banner.className = 'stripe-banner active';
        banner.innerHTML = `
          <div class="stripe-banner-left">
            <i class="ti ti-circle-check" style="font-size:18px"></i>
            Stripe-Onboarding abgeschlossen – Auszahlung ist jetzt aktiv
          </div>
        `;
        banner.style.display = 'flex';
      }
    } else if (params.get('onboarding') === 'refresh') {
      const banner = document.getElementById('stripe-banner');
      if (banner) {
        banner.className = 'stripe-banner pending';
        banner.innerHTML = `
          <div class="stripe-banner-left">
            <i class="ti ti-alert-circle" style="font-size:18px"></i>
            Onboarding nicht abgeschlossen – bitte versuche es erneut
          </div>
          <button class="pf-btn pf-btn-primary" id="stripe-onboard-btn" onclick="startStripeOnboarding()">
            Erneut versuchen
          </button>
        `;
        banner.style.display = 'flex';
      }
    }
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  (async () => {
    const trainer = await checkTrainerAuth();
    if (!trainer) return;

    document.getElementById('sidebar').innerHTML = renderTrainerSidebar('invoices');
    document.getElementById('bottom-nav').innerHTML = renderTrainerBottomNav('invoices');
    document.getElementById('header').innerHTML = renderTrainerHeader('Gutschriften', window.currentTrainer?.email || '');
    initRealtimeToasts(getSupabase(), 'trainer');

    handleOnboardingReturn();

    if (!trainer.id) {
      ['kpi-count','kpi-netto','kpi-mwst','kpi-brutto'].forEach(id =>
        document.getElementById(id).textContent = '–');
      document.getElementById('invoices-body').innerHTML =
        '<tr><td colspan="10" class="text-secondary text-center" style="padding:16px">Kein Trainer-Profil verknüpft.</td></tr>';
      return;
    }

    trainerId = trainer.id;

    const sbUser = getSupabase();
    const { data: { session } } = await sbUser.auth.getSession();
    loadStripeStatus(session.user.id);

    await loadInvoices(trainerId);
  })();

  async function loadInvoices(tid) {
    const sb = getSupabase();
    const year = selectedYear;

    try {
      // Schritt 1: alle Trainer-Belege (Gutschrift + Stornobelege) des Jahres.
      // NUR 'gutschrift' + 'stornobeleg' laden — NICHT 'stornobeleg_gt_card':
      // GT-Karten-Stornos betreffen die Prepaid-10er-Karte des KUNDEN und sind
      // nie Trainer-eigen. (B-07-03)
      const { data: raw, error } = await sb
        .from('invoices')
        .select('*')
        .eq('trainer_id', tid)
        .in('type', ['gutschrift', 'stornobeleg'])
        .gte('issued_at', `${year}-01-01`)
        .lte('issued_at', `${year}-12-31`)
        .order('issued_at', { ascending: false });
      if (error) throw error;

      allInvoices = await filterTrainerOwnInvoices(sb, raw || []);

      // Jahres-Auswahl: ueber ALLE Jahre, ebenfalls gefiltert auf Trainer-eigen.
      const { data: yearRaw } = await sb
        .from('invoices')
        .select('id, type, storno_ref, issued_at')
        .eq('trainer_id', tid)
        .in('type', ['gutschrift', 'stornobeleg'])
        .order('issued_at', { ascending: false });
      const yearOwn = await filterTrainerOwnInvoices(sb, yearRaw || []);

      const years = [...new Set(yearOwn.map(r => (r.issued_at || '').slice(0, 4)).filter(Boolean))].sort().reverse();
      if (!years.includes(String(selectedYear))) years.unshift(String(selectedYear));

      const sel = document.getElementById('year-select');
      sel.innerHTML = years.map(y =>
        `<option value="${y}"${y == selectedYear ? ' selected' : ''}>${y}</option>`
      ).join('');

      applyFilters();
    } catch (err) {
      document.getElementById('invoices-body').innerHTML =
        `<tr><td colspan="10" class="text-danger text-center" style="padding:20px">Fehler: ${err.message}</td></tr>`;
      ['kpi-count','kpi-netto','kpi-mwst','kpi-brutto'].forEach(id =>
        document.getElementById(id).textContent = '–');
    }
  }

  // Behaelt nur Trainer-eigene Belege: Gutschriften IMMER; Stornobelege NUR,
  // wenn ihr Original (storno_ref -> invoice_number) selbst eine Gutschrift ist.
  // Verhindert, dass der Kunden-Stornobeleg (traegt nur zur Zuordnung die
  // trainer_id) mit Kundenpreis in der Trainer-Ansicht erscheint. Default =
  // ausblenden (kein Original lesbar/keine Gutschrift -> raus). (B-07-03)
  async function filterTrainerOwnInvoices(sb, rows) {
    const gutschriften = rows.filter(inv => (inv.type || '') === 'gutschrift');
    const stornos = rows.filter(inv => isStorno(inv));
    if (stornos.length === 0) return gutschriften;

    const refs = [...new Set(stornos.map(s => s.storno_ref).filter(Boolean))];
    let gutschriftRefs = new Set();
    if (refs.length > 0) {
      const { data: origs } = await sb
        .from('invoices')
        .select('invoice_number, type')
        .in('invoice_number', refs);
      (origs || []).forEach(o => { if ((o.type || '') === 'gutschrift') gutschriftRefs.add(o.invoice_number); });
    }
    const ownStornos = stornos.filter(s => s.storno_ref && gutschriftRefs.has(s.storno_ref));
    return gutschriften.concat(ownStornos);
  }

  function applyFilters() {
    const yearVal  = document.getElementById('year-select').value  || String(selectedYear);
    const monthVal = document.getElementById('month-select').value;
    const typeVal  = document.getElementById('type-select').value;

    selectedYear = parseInt(yearVal);

    let filtered = allInvoices.filter(inv => {
      const d = inv.issued_at || '';
      if (!d.startsWith(yearVal)) return false;
      if (monthVal && !d.startsWith(`${yearVal}-${monthVal}`)) return false;
      if (typeVal === 'storno' && !isStorno(inv)) return false;
      if (typeVal === 'pt' && (isStorno(inv) || getBookingType(inv) !== 'pt')) return false;
      if (typeVal === 'gt' && (isStorno(inv) || getBookingType(inv) !== 'gt')) return false;
      return true;
    });

    renderTable(filtered);
    updateKPIs(filtered);
  }

  function renderTable(data) {
    const tbody = document.getElementById('invoices-body');
    const tfoot = document.getElementById('invoices-foot');

    if (data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="10" class="text-center text-secondary" style="padding:32px">Keine Gutschriften gefunden</td></tr>';
      tfoot.style.display = 'none';
      return;
    }

    tbody.innerHTML = data.map(inv => {
      const storno     = isStorno(inv);
      const bt         = getBookingType(inv);
      const bruttoCents = storno ? -(Math.abs(inv.total_cents || 0)) : (inv.total_cents || 0);
      const nettoCents  = storno ? -(Math.abs(inv.net_amount_cents || 0)) : (inv.net_amount_cents || 0);
      const mwstCents   = bruttoCents - nettoCents;
      const rowClass   = storno ? ' class="storno-row"' : '';

      const typeBadge  = storno
        ? `<span class="pf-badge" style="background:#fef2f2;color:#dc2626">Storno</span>`
        : bt === 'gt'
          ? `<span class="pf-badge" style="background:#f5f3ff;color:#7c3aed">GT</span>`
          : `<span class="pf-badge" style="background:#eff6ff;color:#0369a1">PT</span>`;

      const kundenName = inv.customer_name || inv.recipient_name || '–';
      const nummer     = inv.invoice_number || inv.number || '–';
      const datum      = formatDate(inv.issued_at);

      const bruttoCell = storno
        ? `<td style="text-align:right;font-weight:700;color:#e74c3c">${fSigned(bruttoCents)}</td>`
        : `<td style="text-align:right;font-weight:700;color:var(--tblr-primary)">${fSigned(bruttoCents)}</td>`;

      return `<tr${rowClass}>
        <td class="text-secondary" style="font-size:12px">
          <div style="white-space:nowrap">${nummer}</div>
          <div style="font-size:10px;color:#94a3b8;font-family:monospace;word-break:break-all" title="Buchungs-ID">${inv.booking_id || inv.group_class_id || '–'}</div>
        </td>
        <td style="white-space:nowrap">${datum}</td>
        <td>${typeBadge}</td>
        <td>${kundenName}</td>
        <td style="text-align:right">${fSigned(nettoCents)}</td>
        <td style="text-align:right;font-size:13px" class="text-secondary">${fSigned(mwstCents)}</td>
        ${bruttoCell}
        <td style="text-align:center">
          ${inv.pdf_path
            ? `<button class="pf-btn pf-btn-neutral" onclick="openPdf('${inv.pdf_path}')" title="Beleg anzeigen"><i class="ti ti-eye"></i></button>`
            : '<span class="text-secondary" style="font-size:12px">–</span>'
          }
        </td>
        <td style="text-align:center">
          ${inv.pdf_path
            ? `<button class="pf-btn pf-btn-neutral" onclick="downloadPdf('${inv.pdf_path}')" title="PDF herunterladen"><i class="ti ti-download"></i></button>`
            : '<span class="text-secondary" style="font-size:12px">–</span>'
          }
        </td>
        <td style="text-align:center">
          <button class="pf-btn pf-btn-neutral" onclick="printInvoice('${inv.id}')" title="Drucken"><i class="ti ti-printer"></i></button>
        </td>
      </tr>`;
    }).join('');

    const sumNetto  = data.reduce((s, inv) => {
      const storno = isStorno(inv);
      return s + (storno ? -(Math.abs(inv.net_amount_cents || 0)) : (inv.net_amount_cents || 0));
    }, 0);
    const sumBrutto = data.reduce((s, inv) => {
      const storno = isStorno(inv);
      return s + (storno ? -(Math.abs(inv.total_cents || 0)) : (inv.total_cents || 0));
    }, 0);
    const sumMwst   = sumBrutto - sumNetto;

    document.getElementById('sum-label').textContent = `Gesamt (${data.length} Belege)`;
    document.getElementById('sum-netto').textContent  = fSigned(sumNetto);
    document.getElementById('sum-mwst').textContent   = fSigned(sumMwst);
    document.getElementById('sum-brutto').textContent = fSigned(sumBrutto);
    tfoot.style.display = '';
  }

  function updateKPIs(data) {
    const gutschriften = data.filter(inv => !isStorno(inv));
    const sumBrutto = data.reduce((s, inv) =>
      s + (isStorno(inv) ? -(Math.abs(inv.total_cents || 0)) : (inv.total_cents || 0)), 0);
    const sumNetto = data.reduce((s, inv) =>
      s + (isStorno(inv) ? -(Math.abs(inv.net_amount_cents || 0)) : (inv.net_amount_cents || 0)), 0);
    const sumMwst = sumBrutto - sumNetto;

    document.getElementById('kpi-count').textContent  = gutschriften.length;
    document.getElementById('kpi-netto').textContent  = fSigned(sumNetto);
    document.getElementById('kpi-mwst').textContent   = fSigned(sumMwst);
    document.getElementById('kpi-brutto').textContent = fSigned(sumBrutto);
  }

  async function openPdf(pdfPath) {
    const sb = getSupabase();
    try {
      const { data, error } = await sb.storage.from('invoices').createSignedUrl(pdfPath, 3600);
      if (error) throw error;
      if (data?.signedUrl) { window.open(data.signedUrl, '_blank'); }
      else { alert('Beleg konnte nicht geladen werden.'); }
    } catch (err) { alert('Fehler beim Öffnen des Belegs: ' + err.message); }
  }

  async function downloadPdf(pdfPath) {
    const sb = getSupabase();
    try {
      const { data, error } = await sb.storage.from('invoices').createSignedUrl(pdfPath, 3600);
      if (error) throw error;
      if (data?.signedUrl) { window.open(data.signedUrl, '_blank'); }
      else { alert('PDF konnte nicht geladen werden.'); }
    } catch (err) { alert('Fehler beim Laden der PDF: ' + err.message); }
  }

  async function printInvoice(invoiceId) {
    const inv = allInvoices.find(x => x.id === invoiceId);
    if (!inv) return;
    if (inv.pdf_path) {
      const sb = getSupabase();
      try {
        const { data } = await sb.storage.from('invoices').createSignedUrl(inv.pdf_path, 3600);
        if (data?.signedUrl) {
          const w = window.open(data.signedUrl, '_blank');
          if (w) { setTimeout(() => { try { w.print(); } catch(e) {} }, 1500); }
          return;
        }
      } catch(e) {}
    }
    window.print();
  }

  function exportCSV() {
    const yearVal  = document.getElementById('year-select').value  || String(selectedYear);
    const monthVal = document.getElementById('month-select').value;
    const typeVal  = document.getElementById('type-select').value;

    let filtered = allInvoices.filter(inv => {
      const d = inv.issued_at || '';
      if (!d.startsWith(yearVal)) return false;
      if (monthVal && !d.startsWith(`${yearVal}-${monthVal}`)) return false;
      if (typeVal === 'storno' && !isStorno(inv)) return false;
      if (typeVal === 'pt' && (isStorno(inv) || getBookingType(inv) !== 'pt')) return false;
      if (typeVal === 'gt' && (isStorno(inv) || getBookingType(inv) !== 'gt')) return false;
      return true;
    });

    if (filtered.length === 0) { alert('Keine Daten für den gewählten Filter.'); return; }

    const headers = ['Nr.','Datum','Typ','Kunde','Netto (EUR)','MwSt (EUR)','Brutto (EUR)'];
    const rows = filtered.map(inv => {
      const storno      = isStorno(inv);
      const bruttoCents = storno ? -(Math.abs(inv.total_cents || 0)) : (inv.total_cents || 0);
      const nettoCents  = storno ? -(Math.abs(inv.net_amount_cents || 0)) : (inv.net_amount_cents || 0);
      const mwstCents   = bruttoCents - nettoCents;
      return [
        inv.invoice_number || inv.number || '',
        inv.issued_at ? formatDate(inv.issued_at) : '',
        storno ? 'Storno' : (getBookingType(inv) === 'gt' ? 'GT' : 'PT'),
        inv.customer_name || inv.recipient_name || '',
        (nettoCents  / 100).toFixed(2).replace('.', ','),
        (mwstCents   / 100).toFixed(2).replace('.', ','),
        (bruttoCents / 100).toFixed(2).replace('.', ','),
      ];
    });

    let csv = '\uFEFF' + headers.join(';') + '\n';
    rows.forEach(r => { csv += r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';') + '\n'; });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = `trainer-gutschriften-${yearVal}${monthVal ? '-' + monthVal : ''}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }
</script>
