<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – Projekt Fit Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="header" id="header"></header>
    <div class="content">

      <!-- KPI Cards -->
      <div class="kpi-grid" id="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-label">Aktive Trainer</div>
          <div class="kpi-value" id="kpi-trainers"><span class="spinner"></span></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Offene Bewerbungen</div>
          <div class="kpi-value" id="kpi-pending"><span class="spinner"></span></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Buchungen diese Woche</div>
          <div class="kpi-value" id="kpi-bookings"><span class="spinner"></span></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Umsatz diesen Monat</div>
          <div class="kpi-value" id="kpi-revenue"><span class="spinner"></span></div>
        </div>
      </div>

      <!-- Recent Trainers -->
      <div class="table-wrap mb-2">
        <div class="table-header">
          <div class="table-title">Neueste Bewerbungen</div>
          <a href="/admin/trainers.html" class="btn btn-ghost btn-sm">Alle anzeigen</a>
        </div>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>E-Mail</th>
              <th>Stadt</th>
              <th>Status</th>
              <th>Datum</th>
            </tr>
          </thead>
          <tbody id="recent-trainers">
            <tr><td colspan="5" class="loading-overlay"><span class="spinner"></span> Laden...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Recent Bookings -->
      <div class="table-wrap">
        <div class="table-header">
          <div class="table-title">Letzte Buchungen</div>
          <a href="/admin/bookings.html" class="btn btn-ghost btn-sm">Alle anzeigen</a>
        </div>
        <table>
          <thead>
            <tr>
              <th>Kunde</th>
              <th>Trainer</th>
              <th>Datum</th>
              <th>Status</th>
              <th>Preis</th>
            </tr>
          </thead>
          <tbody id="recent-bookings">
            <tr><td colspan="5" class="loading-overlay"><span class="spinner"></span> Laden...</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-guard.js"></script>
<script>
  (async () => {
    const user = await checkAdminAuth();
    if (!user) return;

    document.getElementById('sidebar').innerHTML = renderSidebar('dashboard');
    document.getElementById('header').innerHTML = renderHeader('Dashboard');

    const sb = getSupabase();

    // ─── KPIs laden (direkt aus Supabase) ──────────────────────────

    // Montag dieser Woche berechnen
    const now = new Date();
    const dayOfWeek = now.getDay(); // 0=So, 1=Mo, ...
    const monday = new Date(now);
    monday.setDate(now.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
    const mondayISO = monday.toISOString().slice(0, 10);

    // Monatsanfang
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const monthISO = monthStart.toISOString().slice(0, 10);

    try {
      const [trainersRes, pendingRes, weekBookingsRes, monthRevenueRes] = await Promise.allSettled([
        sb.from('trainer_profiles').select('id', { count: 'exact', head: true }).eq('status', 'active'),
        sb.from('trainer_profiles').select('id', { count: 'exact', head: true }).eq('status', 'pending'),
        sb.from('bookings').select('id', { count: 'exact', head: true }).gte('scheduled_date', mondayISO).in('status', ['confirmed', 'completed']),
        sb.from('bookings').select('price_cents').eq('status', 'completed').gte('scheduled_date', monthISO),
      ]);

      document.getElementById('kpi-trainers').textContent =
        trainersRes.status === 'fulfilled' ? (trainersRes.value.count ?? '–') : '–';
      document.getElementById('kpi-pending').textContent =
        pendingRes.status === 'fulfilled' ? (pendingRes.value.count ?? '–') : '–';
      document.getElementById('kpi-bookings').textContent =
        weekBookingsRes.status === 'fulfilled' ? (weekBookingsRes.value.count ?? '–') : '–';

      if (monthRevenueRes.status === 'fulfilled' && monthRevenueRes.value.data) {
        const totalCents = monthRevenueRes.value.data.reduce((sum, b) => sum + (b.price_cents || 0), 0);
        document.getElementById('kpi-revenue').textContent = formatEuro(totalCents);
      } else {
        document.getElementById('kpi-revenue').textContent = '–';
      }
    } catch (err) {
      console.error('KPIs laden fehlgeschlagen:', err);
    }

    // ─── Neueste Bewerbungen (direkt aus Supabase) ─────────────────
    try {
      const { data: trainers, error: tErr } = await sb
        .from('trainer_profiles')
        .select('full_name, email, city, status, created_at')
        .order('created_at', { ascending: false })
        .limit(5);

      if (tErr) throw tErr;
      const tbody = document.getElementById('recent-trainers');
      if (!trainers || trainers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted" style="padding:24px">Keine Bewerbungen vorhanden</td></tr>';
      } else {
        tbody.innerHTML = trainers.map(t => `
          <tr>
            <td><strong>${t.full_name || '–'}</strong></td>
            <td class="text-secondary">${t.email || '–'}</td>
            <td>${t.city || '–'}</td>
            <td>${statusBadge(t.status)}</td>
            <td class="text-muted">${formatDate(t.created_at)}</td>
          </tr>
        `).join('');
      }
    } catch (err) {
      document.getElementById('recent-trainers').innerHTML =
        `<tr><td colspan="5" class="text-error" style="padding:16px">Fehler: ${err.message}</td></tr>`;
    }

    // ─── Letzte Buchungen (direkt aus Supabase) ──────────────────
    try {
      const { data: bookings, error: bErr } = await sb
        .from('bookings')
        .select('customer_id, trainer_id, scheduled_date, status, price_cents')
        .order('created_at', { ascending: false })
        .limit(5);

      if (bErr) throw bErr;

      const tbody = document.getElementById('recent-bookings');
      if (!bookings || bookings.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted" style="padding:24px">Keine Buchungen vorhanden</td></tr>';
      } else {
        // Trainer- und Kundennamen nachladen
        const trainerIds = [...new Set(bookings.map(b => b.trainer_id).filter(Boolean))];
        const customerIds = [...new Set(bookings.map(b => b.customer_id).filter(Boolean))];

        const [trainerRes, customerRes] = await Promise.all([
          trainerIds.length > 0 ? sb.from('trainer_profiles').select('id, full_name').in('id', trainerIds) : { data: [] },
          customerIds.length > 0 ? sb.from('customers').select('id, first_name, last_name, full_name').in('id', customerIds) : { data: [] },
        ]);

        const trainerNames = {};
        (trainerRes.data || []).forEach(t => { trainerNames[t.id] = t.full_name || '–'; });
        const customerNames = {};
        (customerRes.data || []).forEach(c => {
          customerNames[c.id] = c.full_name || [c.first_name, c.last_name].filter(Boolean).join(' ') || '–';
        });

        tbody.innerHTML = bookings.map(b => `
          <tr>
            <td>${customerNames[b.customer_id] || '–'}</td>
            <td>${trainerNames[b.trainer_id] || '–'}</td>
            <td>${formatDate(b.scheduled_date)}</td>
            <td>${statusBadge(b.status)}</td>
            <td class="text-accent">${formatEuro(b.price_cents)}</td>
          </tr>
        `).join('');
      }
    } catch (err) {
      document.getElementById('recent-bookings').innerHTML =
        `<tr><td colspan="5" class="text-error" style="padding:16px">Fehler: ${err.message}</td></tr>`;
    }
  })();
</script>

</body>
</html>
