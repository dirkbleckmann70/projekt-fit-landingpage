<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – Projekt Fit Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="../shared/tabler-custom.css">
</head>
<body class="page">
<script src="../shared/theme.js"></script>

<div id="sidebar"></div>

<div class="page-wrapper">
  <div class="page-header d-print-none" id="header"></div>
  <div class="page-body">
    <div class="container-xl">

      <!-- KPI Cards -->
      <div class="row row-deck row-cards mb-3">
        <div class="col-sm-6 col-lg-3">
          <div class="pf-stat-card">
            <div class="pf-stat-num" id="kpi-trainers"><div class="spinner-border spinner-border-sm"></div></div>
            <div class="pf-stat-label">Aktive Trainer</div>
          </div>
        </div>
        <div class="col-sm-6 col-lg-3">
          <div class="pf-stat-card">
            <div class="pf-stat-num" id="kpi-pending"><div class="spinner-border spinner-border-sm"></div></div>
            <div class="pf-stat-label">Offene Bewerbungen</div>
          </div>
        </div>
        <div class="col-sm-6 col-lg-3">
          <div class="pf-stat-card">
            <div class="pf-stat-num" id="kpi-bookings"><div class="spinner-border spinner-border-sm"></div></div>
            <div class="pf-stat-label">Buchungen diese Woche</div>
          </div>
        </div>
        <div class="col-sm-6 col-lg-3">
          <div class="pf-stat-card">
            <div class="pf-stat-num" id="kpi-revenue"><div class="spinner-border spinner-border-sm"></div></div>
            <div class="pf-stat-label">Umsatz diesen Monat</div>
          </div>
        </div>
      </div>

      <!-- Recent Trainers -->
      <div class="card mb-3">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h3 class="card-title">Neueste Bewerbungen</h3>
          <a href="/admin/trainers.html" class="pf-btn pf-btn-neutral">Alle anzeigen</a>
        </div>
        <div class="table-responsive">
          <table class="table table-vcenter card-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>E-Mail</th>
                <th>Stadt</th>
                <th>Status</th>
                <th>Datum</th>
              </tr>
            </thead>
            <tbody id="recent-trainers">
              <tr><td colspan="5" class="loading-overlay"><div class="spinner-border spinner-border-sm"></div> Laden...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Recent Bookings -->
      <div class="card mb-3">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h3 class="card-title">Letzte Buchungen</h3>
          <a href="/admin/bookings.html" class="pf-btn pf-btn-neutral">Alle anzeigen</a>
        </div>
        <div class="table-responsive">
          <table class="table table-vcenter card-table">
            <thead>
              <tr>
                <th>Kunde</th>
                <th>Trainer</th>
                <th>Datum</th>
                <th>Status</th>
                <th>Preis</th>
              </tr>
            </thead>
            <tbody id="recent-bookings">
              <tr><td colspan="5" class="loading-overlay"><div class="spinner-border spinner-border-sm"></div> Laden...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/js/tabler.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/design-tokens.js"></script>
<script src="../shared/constants.js"></script>
<script src="../shared/layout.js"></script>
<script src="../shared/toast.js"></script>
<script src="auth-guard.js"></script>
<script>
  (async () => {
    const user = await checkAdminAuth();
    if (!user) return;

    document.getElementById('sidebar').innerHTML = renderAdminSidebar('dashboard');
    document.getElementById('header').innerHTML = renderAdminHeader('Dashboard', user.email);
    initRealtimeToasts(getSupabase(), 'admin');

    // ─── KPIs laden (über Admin-API) ──────────────────────────

    // Montag dieser Woche berechnen
    const now = new Date();
    const dayOfWeek = now.getDay(); // 0=So, 1=Mo, ...
    const monday = new Date(now);
    monday.setDate(now.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
    const mondayISO = monday.toISOString().slice(0, 10);

    // Monatsanfang
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const monthISO = monthStart.toISOString().slice(0, 10);

    try {
      const kpis = await adminApi(`/api/admin?action=data&type=dashboard_kpis&monday=${mondayISO}&month_start=${monthISO}`);

      document.getElementById('kpi-trainers').textContent = kpis.active_trainers ?? '–';
      document.getElementById('kpi-pending').textContent = kpis.pending_trainers ?? '–';
      document.getElementById('kpi-bookings').textContent = kpis.week_bookings ?? '–';
      document.getElementById('kpi-revenue').textContent = formatEuro(kpis.month_revenue_cents);
    } catch (err) {
      console.error('KPIs laden fehlgeschlagen:', err);
    }

    // ─── Neueste Bewerbungen (über Admin-API) ─────────────────
    try {
      const { data: trainers } = await adminApi('/api/admin?action=data&type=recent_trainers&limit=5');

      const tbody = document.getElementById('recent-trainers');
      if (!trainers || trainers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted" style="padding:24px">Keine Bewerbungen vorhanden</td></tr>';
      } else {
        tbody.innerHTML = trainers.map(t => `
          <tr>
            <td><strong>${t.full_name || '–'}</strong></td>
            <td class="text-secondary">${t.email || '–'}</td>
            <td>${t.city || '–'}</td>
            <td>${statusBadge(t.status)}</td>
            <td class="text-muted">${formatDate(t.created_at)}</td>
          </tr>
        `).join('');
      }
    } catch (err) {
      document.getElementById('recent-trainers').innerHTML =
        `<tr><td colspan="5" class="text-error" style="padding:16px">Fehler: ${err.message}</td></tr>`;
    }

    // ─── Letzte Buchungen (über Admin-API, bereits enriched) ──────────────────
    try {
      const { data: bookings } = await adminApi('/api/admin?action=data&type=recent_bookings&limit=5');

      const tbody = document.getElementById('recent-bookings');
      if (!bookings || bookings.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted" style="padding:24px">Keine Buchungen vorhanden</td></tr>';
      } else {
        tbody.innerHTML = bookings.map(b => `
          <tr>
            <td>${b.customer_name || '–'}</td>
            <td>${b.trainer_name || '–'}</td>
            <td>${formatDate(b.scheduled_date)}</td>
            <td>${statusBadge(b.status)}</td>
            <td class="text-accent">${formatEuro(b.price_cents)}</td>
          </tr>
        `).join('');
      }
    } catch (err) {
      document.getElementById('recent-bookings').innerHTML =
        `<tr><td colspan="5" class="text-error" style="padding:16px">Fehler: ${err.message}</td></tr>`;
    }
  })();
</script>

</body>
</html>
