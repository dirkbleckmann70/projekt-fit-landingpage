<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trainer – Projekt Fit Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="header" id="header"></header>
    <div class="content">

      <div id="alert-box" class="alert"></div>

      <!-- Trainer Table -->
      <div class="table-wrap">
        <div class="table-header">
          <div class="table-title">Trainer-Verwaltung</div>
          <div class="table-actions">
            <input type="text" class="search-input" id="search" placeholder="Name oder E-Mail suchen...">
            <div class="filter-tabs" id="filter-tabs">
              <button class="filter-tab active" data-filter="all">Alle</button>
              <button class="filter-tab" data-filter="pending">Pending</button>
              <button class="filter-tab" data-filter="active">Aktiv</button>
              <button class="filter-tab" data-filter="gesperrt">Gesperrt</button>
            </div>
            <button class="btn btn-primary" onclick="openNewTrainerModal()">+ Neuer Trainer</button>
          </div>
        </div>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>E-Mail</th>
              <th>Stadt</th>
              <th>Status</th>
              <th>Lizenzen</th>
              <th>Bewertung</th>
              <th>Erstellt am</th>
              <th>Aktionen</th>
            </tr>
          </thead>
          <tbody id="trainers-body">
            <tr><td colspan="8" class="loading-overlay"><span class="spinner"></span> Trainer werden geladen...</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<!-- ─── Trainer Detail Modal ──────────────────────────────────────── -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal" style="max-width:700px">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Trainer-Details</div>
      <button class="modal-close" onclick="closeModal('detail-modal')">&times;</button>
    </div>
    <div class="modal-body" id="modal-body">
      <!-- Filled dynamically -->
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('detail-modal')">Abbrechen</button>
      <button class="btn btn-primary" id="modal-save-btn" onclick="saveTrainer()">Speichern</button>
    </div>
  </div>
</div>

<!-- ─── New Trainer Modal ─────────────────────────────────────────── -->
<div class="modal-overlay" id="new-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Neuen Trainer anlegen</div>
      <button class="modal-close" onclick="closeModal('new-modal')">&times;</button>
    </div>
    <div class="modal-body">
      <form id="new-trainer-form">
        <div class="two-col">
          <div class="form-group">
            <label>Vorname *</label>
            <input class="form-control" id="new-firstname" required>
          </div>
          <div class="form-group">
            <label>Nachname *</label>
            <input class="form-control" id="new-lastname" required>
          </div>
        </div>
        <div class="two-col">
          <div class="form-group">
            <label>E-Mail *</label>
            <input class="form-control" type="email" id="new-email" required>
          </div>
          <div class="form-group">
            <label>Telefon</label>
            <input class="form-control" id="new-phone">
          </div>
        </div>

        <hr style="border-color:#2a2a2a;margin:20px 0">
        <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Adresse</h3>

        <div class="form-group">
          <label>Straße und Hausnummer</label>
          <input class="form-control" id="new-street">
        </div>
        <div class="two-col">
          <div class="form-group">
            <label>PLZ</label>
            <input class="form-control" id="new-postal">
          </div>
          <div class="form-group">
            <label>Ort (Wohnort)</label>
            <input class="form-control" id="new-wohnort">
          </div>
        </div>
        <div class="form-group">
          <label>Einsatzort *</label>
          <select class="form-control" id="new-city" required>
            <option value="">Einsatzort wählen...</option>
          </select>
        </div>

        <hr style="border-color:#2a2a2a;margin:20px 0">
        <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Profil</h3>

        <div class="form-group">
          <label>Qualifikation / Spezialisierung</label>
          <textarea class="form-control" id="new-specializations" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label>Bio</label>
          <textarea class="form-control" id="new-bio" rows="3"></textarea>
        </div>

        <hr style="border-color:#2a2a2a;margin:20px 0">
        <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Steuerdaten & Preise</h3>

        <div class="two-col">
          <div class="form-group">
            <label>Steuernummer</label>
            <input class="form-control" id="new-steuernummer">
          </div>
          <div class="form-group" style="display:flex;align-items:center;padding-top:24px">
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
              <input type="checkbox" id="new-kleinunternehmer"> Kleinunternehmer
            </label>
          </div>
        </div>
        <div class="two-col">
          <div class="form-group">
            <label>Stundensatz (EUR)</label>
            <input class="form-control" type="number" id="new-hourly-rate" placeholder="79.00" step="0.01" min="0">
          </div>
          <div class="form-group">
            <label>Auszahlung (EUR)</label>
            <input class="form-control" type="number" id="new-payout" placeholder="35.00" step="0.01" min="0">
          </div>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select class="form-control" id="new-status">
            <option value="pending">Pending</option>
            <option value="active">Active</option>
          </select>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('new-modal')">Abbrechen</button>
      <button class="btn btn-primary" onclick="createTrainer()">Anlegen</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-guard.js"></script>
<script>
  let allTrainers = [];
  let serviceLocations = [];
  let currentFilter = 'all';
  let currentSearch = '';
  let editingTrainerId = null;

  (async () => {
    const user = await checkAdminAuth();
    if (!user) return;

    document.getElementById('sidebar').innerHTML = renderSidebar('trainers');
    document.getElementById('header').innerHTML = renderHeader('Trainer-Verwaltung');

    // Load service locations for city dropdowns
    try {
      const res = await adminApi('/api/admin/data?type=active_locations');
      serviceLocations = res.data || [];
      const citySel = document.getElementById('new-city');
      serviceLocations.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l.city;
        opt.textContent = l.city;
        citySel.appendChild(opt);
      });
    } catch (err) {
      console.error('Einsatzorte laden fehlgeschlagen:', err);
    }

    await loadTrainers();

    // Filter tabs
    document.querySelectorAll('#filter-tabs .filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('#filter-tabs .filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.filter;
        renderTrainers();
      });
    });

    // Search
    document.getElementById('search').addEventListener('input', (e) => {
      currentSearch = e.target.value.toLowerCase();
      renderTrainers();
    });
  })();

  async function loadTrainers() {
    try {
      const res = await adminApi('/api/admin/data?type=all_trainers');
      allTrainers = res.data || [];
      renderTrainers();
    } catch (err) {
      document.getElementById('trainers-body').innerHTML =
        `<tr><td colspan="8" class="text-error" style="padding:20px">Fehler: ${err.message}</td></tr>`;
    }
  }

  function renderTrainers() {
    let filtered = allTrainers;

    if (currentFilter !== 'all') {
      filtered = filtered.filter(t => t.status === currentFilter);
    }
    if (currentSearch) {
      filtered = filtered.filter(t =>
        (t.full_name || '').toLowerCase().includes(currentSearch) ||
        (t.email || '').toLowerCase().includes(currentSearch)
      );
    }

    const tbody = document.getElementById('trainers-body');

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted" style="padding:24px">Keine Trainer gefunden</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map(t => {
      const rating = t.rating ? `${t.rating} ★ (${t.review_count || 0})` : '–';
      const canActivate = t.status === 'pending' || t.status === 'gesperrt';
      const canDeactivate = t.status === 'active' && t.is_active;
      const licenseCount = (t.license_files || []).length;
      const licenseBadge = licenseCount > 0
        ? `<span class="badge badge-active">${licenseCount} Datei${licenseCount > 1 ? 'en' : ''}</span>`
        : '<span class="badge" style="background:rgba(232,147,10,0.12);color:#e8930a">Keine</span>';
      return `
        <tr>
          <td><strong>${t.full_name || '–'}</strong></td>
          <td class="text-secondary">${t.email || '–'}</td>
          <td>${t.city || '–'}</td>
          <td>${statusBadge(t.status)}</td>
          <td>${licenseBadge}</td>
          <td class="text-accent">${rating}</td>
          <td class="text-muted">${formatDate(t.created_at)}</td>
          <td>
            <div style="display:flex;gap:6px">
              ${canActivate ? `<button class="btn btn-success btn-sm" onclick="activateTrainer('${t.id}')">Aktivieren</button>` : ''}
              ${canDeactivate ? `<button class="btn btn-danger btn-sm" onclick="deactivateTrainer('${t.id}')">Deaktivieren</button>` : ''}
              <button class="btn btn-secondary btn-sm" onclick="openDetailModal('${t.id}')">Details</button>
            </div>
          </td>
        </tr>
      `;
    }).join('');
  }

  // ─── Activate Trainer ─────────────────────────────────────────────
  async function activateTrainer(id) {
    if (!confirm('Trainer aktivieren und Einladungs-E-Mail senden?')) return;
    try {
      const res = await adminApi('/api/admin/activate-trainer', {
        method: 'POST',
        body: JSON.stringify({ trainerId: id }),
      });
      showAlert('alert-box', res.message || 'Trainer aktiviert!', 'success');
      await loadTrainers();
    } catch (err) {
      showAlert('alert-box', 'Fehler: ' + err.message, 'error');
    }
  }

  // ─── Deactivate Trainer ──────────────────────────────────────
  async function deactivateTrainer(id) {
    if (!confirm('Trainer wirklich deaktivieren? Er wird für Kunden nicht mehr sichtbar sein.')) return;
    try {
      const res = await adminApi('/api/admin/deactivate-trainer', {
        method: 'POST',
        body: JSON.stringify({ trainerId: id }),
      });
      showAlert('alert-box', res.message || 'Trainer deaktiviert!', 'success');
      await loadTrainers();
    } catch (err) {
      showAlert('alert-box', 'Fehler: ' + err.message, 'error');
    }
  }

  // ─── Detail Modal ─────────────────────────────────────────────────
  function openDetailModal(id) {
    const t = allTrainers.find(tr => tr.id === id);
    if (!t) return;
    editingTrainerId = id;

    const nameParts = (t.full_name || '').split(' ');
    const firstName = nameParts[0] || '';
    const lastName = nameParts.slice(1).join(' ') || '';

    document.getElementById('modal-title').textContent = t.full_name || 'Trainer-Details';
    document.getElementById('modal-body').innerHTML = `
      <div class="two-col">
        <div class="form-group">
          <label>Vorname *</label>
          <input class="form-control" id="edit-firstname" value="${firstName}">
        </div>
        <div class="form-group">
          <label>Nachname *</label>
          <input class="form-control" id="edit-lastname" value="${lastName}">
        </div>
      </div>
      <div class="two-col">
        <div class="form-group">
          <label>E-Mail</label>
          <input class="form-control" id="edit-email" type="email" value="${t.email || ''}">
        </div>
        <div class="form-group">
          <label>Telefon</label>
          <input class="form-control" id="edit-phone" value="${t.phone || ''}">
        </div>
      </div>

      <hr style="border-color:#2a2a2a;margin:20px 0">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Adresse</h3>

      <div class="form-group">
        <label>Straße und Hausnummer</label>
        <input class="form-control" id="edit-street" value="${t.street_address || ''}">
      </div>
      <div class="two-col">
        <div class="form-group">
          <label>PLZ</label>
          <input class="form-control" id="edit-postal" value="${t.postal_code || ''}">
        </div>
        <div class="form-group">
          <label>Ort (Wohnort)</label>
          <input class="form-control" id="edit-wohnort" value="${t.wohnort || ''}">
        </div>
      </div>
      <div class="form-group">
        <label>Einsatzort</label>
        <select class="form-control" id="edit-city">
          <option value="">Einsatzort wählen...</option>
          ${serviceLocations.map(l => `<option value="${l.city}" ${t.city === l.city ? 'selected' : ''}>${l.city}</option>`).join('')}
        </select>
      </div>

      <hr style="border-color:#2a2a2a;margin:20px 0">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Profil</h3>

      <div class="form-group">
        <label>Qualifikation / Spezialisierung</label>
        <textarea class="form-control" id="edit-specializations" rows="2">${t.specializations || ''}</textarea>
      </div>
      <div class="form-group">
        <label>Bio</label>
        <textarea class="form-control" id="edit-bio" rows="3">${t.bio || ''}</textarea>
      </div>

      <hr style="border-color:#2a2a2a;margin:20px 0">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Steuerdaten & Preise</h3>

      <div class="two-col">
        <div class="form-group">
          <label>Steuernummer</label>
          <input class="form-control" id="edit-steuernummer" value="${t.steuernummer || ''}">
        </div>
        <div class="form-group" style="display:flex;align-items:center;padding-top:24px">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <input type="checkbox" id="edit-kleinunternehmer" ${t.is_kleinunternehmer ? 'checked' : ''}> Kleinunternehmer
          </label>
        </div>
      </div>

      <hr style="border-color:#2a2a2a;margin:20px 0">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Status & Preise</h3>

      <div class="two-col">
        <div class="form-group">
          <label>Status</label>
          <select class="form-control" id="edit-status">
            <option value="pending" ${t.status === 'pending' ? 'selected' : ''}>Pending</option>
            <option value="active" ${t.status === 'active' ? 'selected' : ''}>Active</option>
            <option value="pausiert" ${t.status === 'pausiert' ? 'selected' : ''}>Pausiert</option>
            <option value="gesperrt" ${t.status === 'gesperrt' ? 'selected' : ''}>Gesperrt</option>
          </select>
        </div>
        <div class="form-group">
          <label>Aktiv (sichtbar für Kunden)</label>
          <select class="form-control" id="edit-is-active">
            <option value="false" ${!t.is_active ? 'selected' : ''}>Nein</option>
            <option value="true" ${t.is_active ? 'selected' : ''}>Ja</option>
          </select>
        </div>
      </div>
      <div class="two-col">
        <div class="form-group">
          <label>Stundensatz (EUR)</label>
          <input class="form-control" type="number" id="edit-hourly-rate" step="0.01" min="0" value="${t.hourly_rate_cents ? (t.hourly_rate_cents / 100).toFixed(2) : ''}">
        </div>
        <div class="form-group">
          <label>Auszahlung (EUR)</label>
          <input class="form-control" type="number" id="edit-payout" step="0.01" min="0" value="${t.payout_cents ? (t.payout_cents / 100).toFixed(2) : ''}">
        </div>
      </div>

      ${t.auth_user_id ? `<p class="text-muted mt-2" style="font-size:12px">Auth User ID: ${t.auth_user_id}</p>` : ''}

      <hr style="border-color:#2a2a2a;margin:20px 0">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Lizenzen & Zertifikate</h3>

      <div id="license-list">
        ${renderLicenseList(t.license_files || [], id)}
      </div>

      <div style="margin-top:12px">
        <label class="btn btn-secondary btn-sm" style="cursor:pointer;display:inline-flex;align-items:center;gap:6px">
          <input type="file" id="admin-file-upload" multiple accept=".pdf,.jpg,.jpeg,.png" style="display:none"
            onchange="adminUploadFiles('${id}')">
          + Neue Lizenz hochladen
        </label>
        <span id="admin-upload-status" style="font-size:12px;color:#8888A0;margin-left:8px"></span>
      </div>
    `;

    document.getElementById('detail-modal').classList.add('open');
  }

  function renderLicenseList(files, trainerId) {
    if (!files || files.length === 0) {
      return '<p style="color:#8888A0;font-size:13px">Keine Lizenzen hochgeladen.</p>';
    }
    return files.map(f => {
      const date = f.uploaded_at ? new Date(f.uploaded_at).toLocaleDateString('de-DE') : '–';
      const size = f.size_bytes ? formatFileSize(f.size_bytes) : '–';
      const icon = (f.content_type === 'application/pdf' || f.filename.endsWith('.pdf')) ? 'PDF' : 'IMG';
      return `
        <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#161625;border:1px solid rgba(255,255,255,0.06);border-radius:10px;margin-bottom:8px">
          <div style="width:36px;height:36px;border-radius:8px;background:rgba(232,147,10,0.12);color:#e8930a;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0">${icon}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.filename}</div>
            <div style="font-size:11px;color:#8888A0">${date} &middot; ${size}</div>
          </div>
          <button class="btn btn-secondary btn-sm" style="font-size:11px;padding:4px 10px" onclick="viewLicense('${f.path}')">Anzeigen</button>
          <button class="btn btn-danger btn-sm" style="font-size:11px;padding:4px 10px" onclick="deleteLicense('${trainerId}','${f.path}')">L&ouml;schen</button>
        </div>
      `;
    }).join('');
  }

  function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  async function viewLicense(path) {
    try {
      const res = await adminApi('/api/admin/license?path=' + encodeURIComponent(path));
      if (res.url) window.open(res.url, '_blank');
    } catch (err) {
      showAlert('alert-box', 'Fehler: ' + err.message, 'error');
    }
  }

  async function deleteLicense(trainerId, path) {
    if (!confirm('Lizenz-Datei wirklich löschen?')) return;
    try {
      await adminApi('/api/admin/license', {
        method: 'DELETE',
        body: JSON.stringify({ trainerId, path }),
      });
      showAlert('alert-box', 'Lizenz gelöscht!', 'success');
      await loadTrainers();
      // Modal aktualisieren
      const t = allTrainers.find(tr => tr.id === trainerId);
      if (t) {
        document.getElementById('license-list').innerHTML = renderLicenseList(t.license_files || [], trainerId);
      }
    } catch (err) {
      showAlert('alert-box', 'Fehler: ' + err.message, 'error');
    }
  }

  async function adminUploadFiles(trainerId) {
    const input = document.getElementById('admin-file-upload');
    const status = document.getElementById('admin-upload-status');
    const files = input.files;
    if (!files || files.length === 0) return;

    status.textContent = 'Hochladen...';

    const formData = new FormData();
    formData.append('trainerId', trainerId);
    for (let i = 0; i < files.length; i++) {
      formData.append('files', files[i]);
    }

    try {
      const token = localStorage.getItem('admin_token');
      const resp = await fetch('/api/upload-license', {
        method: 'POST',
        body: formData,
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Upload fehlgeschlagen');

      status.textContent = '';
      showAlert('alert-box', `${result.files.length} Datei(en) hochgeladen!`, 'success');
      await loadTrainers();
      const t = allTrainers.find(tr => tr.id === trainerId);
      if (t) {
        document.getElementById('license-list').innerHTML = renderLicenseList(t.license_files || [], trainerId);
      }
    } catch (err) {
      status.textContent = '';
      showAlert('alert-box', 'Upload-Fehler: ' + err.message, 'error');
    }

    input.value = '';
  }

  async function saveTrainer() {
    if (!editingTrainerId) return;

    const btn = document.getElementById('modal-save-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Speichern...';

    const payload = {
      trainerId: editingTrainerId,
      full_name: (document.getElementById('edit-firstname').value.trim() + ' ' + document.getElementById('edit-lastname').value.trim()).trim(),
      email: document.getElementById('edit-email').value.trim(),
      phone: document.getElementById('edit-phone').value.trim() || null,
      street_address: document.getElementById('edit-street').value.trim() || null,
      postal_code: document.getElementById('edit-postal').value.trim() || null,
      wohnort: document.getElementById('edit-wohnort').value.trim() || null,
      city: document.getElementById('edit-city').value.trim(),
      specializations: document.getElementById('edit-specializations').value.trim() || null,
      bio: document.getElementById('edit-bio').value.trim() || null,
      steuernummer: document.getElementById('edit-steuernummer').value.trim() || null,
      is_kleinunternehmer: document.getElementById('edit-kleinunternehmer').checked,
      status: document.getElementById('edit-status').value,
      is_active: document.getElementById('edit-is-active').value === 'true',
      hourly_rate_cents: document.getElementById('edit-hourly-rate').value ? Math.round(parseFloat(document.getElementById('edit-hourly-rate').value) * 100) : null,
      payout_cents: document.getElementById('edit-payout').value ? Math.round(parseFloat(document.getElementById('edit-payout').value) * 100) : null,
    };

    try {
      await adminApi('/api/admin/trainers', {
        method: 'PUT',
        body: JSON.stringify(payload),
      });
      closeModal('detail-modal');
      showAlert('alert-box', 'Trainer gespeichert!', 'success');
      await loadTrainers();
    } catch (err) {
      showAlert('alert-box', 'Fehler: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Speichern';
    }
  }

  // ─── New Trainer ──────────────────────────────────────────────────
  function openNewTrainerModal() {
    document.getElementById('new-trainer-form').reset();
    document.getElementById('new-modal').classList.add('open');
  }

  async function createTrainer() {
    const firstname = document.getElementById('new-firstname').value.trim();
    const lastname = document.getElementById('new-lastname').value.trim();
    const email = document.getElementById('new-email').value.trim();
    const city = document.getElementById('new-city').value.trim();

    if (!firstname || !lastname || !email || !city) {
      alert('Vorname, Nachname, E-Mail und Einsatzort sind Pflichtfelder.');
      return;
    }

    try {
      await adminApi('/api/admin/trainers', {
        method: 'POST',
        body: JSON.stringify({
          full_name: firstname + ' ' + lastname,
          email: email,
          phone: document.getElementById('new-phone').value.trim() || null,
          city: city,
          street_address: document.getElementById('new-street').value.trim() || null,
          postal_code: document.getElementById('new-postal').value.trim() || null,
          wohnort: document.getElementById('new-wohnort').value.trim() || null,
          specializations: document.getElementById('new-specializations').value.trim() || null,
          bio: document.getElementById('new-bio').value.trim() || null,
          steuernummer: document.getElementById('new-steuernummer').value.trim() || null,
          is_kleinunternehmer: document.getElementById('new-kleinunternehmer').checked,
          hourly_rate_cents: document.getElementById('new-hourly-rate').value ? Math.round(parseFloat(document.getElementById('new-hourly-rate').value) * 100) : null,
          payout_cents: document.getElementById('new-payout').value ? Math.round(parseFloat(document.getElementById('new-payout').value) * 100) : null,
          status: document.getElementById('new-status').value,
        }),
      });
      closeModal('new-modal');
      showAlert('alert-box', 'Trainer angelegt!', 'success');
      await loadTrainers();
    } catch (err) {
      showAlert('alert-box', 'Fehler: ' + err.message, 'error');
    }
  }

  // ─── Modal Helpers ────────────────────────────────────────────────
  function closeModal(id) {
    document.getElementById(id).classList.remove('open');
    editingTrainerId = null;
  }

  // Close modal on overlay click
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.remove('open');
    });
  });
</script>

</body>
</html>
