<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trainer – Projekt Fit Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="../shared/tabler-custom.css">
  <link rel="stylesheet" href="../shared/table-utils.css">
</head>
<body class="page">
<script src="../shared/theme.js"></script>

<div id="sidebar"></div>

<div class="page-wrapper">
  <div class="page-header d-print-none" id="header"></div>
  <div class="page-body">
    <div class="container-xl">

      <div id="alert-box" class="alert"></div>

      <!-- Trainer Table -->
      <div class="card">
        <div class="table-responsive">
          <table class="table table-vcenter card-table table-hover" id="trainers-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Stadt</th>
                <th>E-Mail</th>
                <th>Status</th>
                <th>Lizenzen</th>
                <th>Bewertung</th>
                <th>Erstellt am</th>
                <th>Aktionen</th>
              </tr>
            </thead>
            <tbody id="trainers-body">
              <tr><td colspan="8" class="loading-overlay"><div class="spinner-border spinner-border-sm"></div> Trainer werden geladen...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- ─── Trainer Detail Modal ──────────────────────────────────────── -->
<div class="modal modal-blur fade" id="detail-modal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-title">Trainer-Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Filled dynamically -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost-secondary" onclick="closeModal('detail-modal')">Abbrechen</button>
        <button class="btn btn-primary" id="modal-save-btn" onclick="saveTrainer()">Speichern</button>
      </div>
    </div>
  </div>
</div>

<!-- ─── New Trainer Modal ─────────────────────────────────────────── -->
<div class="modal modal-blur fade" id="new-modal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Neuen Trainer anlegen</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="new-trainer-form">
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label">Vorname *</label>
              <input class="form-control" id="new-firstname" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Nachname *</label>
              <input class="form-control" id="new-lastname" required>
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label">E-Mail *</label>
              <input class="form-control" type="email" id="new-email" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Telefon</label>
              <input class="form-control" id="new-phone">
            </div>
          </div>

          <hr style="border-color:#2a2a2a;margin:20px 0">
          <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Adresse</h3>

          <div class="mb-3">
            <label class="form-label">Straße und Hausnummer</label>
            <input class="form-control" id="new-street">
          </div>
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label">PLZ</label>
              <input class="form-control" id="new-postal">
            </div>
            <div class="col-md-6">
              <label class="form-label">Ort (Wohnort)</label>
              <input class="form-control" id="new-wohnort">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Einsatzort *</label>
            <select class="form-select" id="new-city" required>
              <option value="">Einsatzort wählen...</option>
            </select>
          </div>

          <hr style="border-color:#2a2a2a;margin:20px 0">
          <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Profil</h3>

          <div class="mb-3">
            <label class="form-label">Qualifikation / Spezialisierung</label>
            <textarea class="form-control" id="new-specializations" rows="2"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Bio</label>
            <textarea class="form-control" id="new-bio" rows="3"></textarea>
          </div>

          <hr style="border-color:#2a2a2a;margin:20px 0">
          <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Steuerdaten & Preise</h3>

          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label">Steuernummer</label>
              <input class="form-control" id="new-steuernummer">
            </div>
            <div class="col-md-6" style="display:flex;align-items:center;padding-top:24px">
              <label class="form-check">
                <input class="form-check-input" type="checkbox" id="new-kleinunternehmer">
                <span class="form-check-label">Kleinunternehmer</span>
              </label>
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label">Kundenpreis / Stundensatz (EUR)</label>
              <input class="form-control" type="number" id="new-hourly-rate" placeholder="79.00" step="0.01" min="0">
            </div>
            <div class="col-md-6">
              <label class="form-label">Trainer-Vergütung (EUR)</label>
              <input class="form-control" type="number" id="new-payout" placeholder="35.00" step="0.01" min="0">
            </div>
          </div>
          <hr style="border-color:#2a2a2a;margin:20px 0">
          <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Lizenzen & Zertifikate</h3>

          <div class="mb-3">
            <label class="btn btn-secondary btn-sm" style="cursor:pointer;display:inline-flex;align-items:center;gap:6px">
              <input type="file" id="new-license-files" multiple accept=".pdf,.jpg,.jpeg,.png" style="display:none"
                onchange="updateNewFilePreview()">
              + Lizenzen hochladen
            </label>
            <span style="font-size:12px;color:var(--text-muted);margin-left:8px">PDF, JPG, PNG – max 10 MB</span>
          </div>
          <div id="new-file-preview"></div>
          <p style="font-size:12px;color:var(--text-muted);margin-top:4px">Optional – Lizenzen können auch später im Trainer-Detail hochgeladen werden</p>

          <hr style="border-color:#2a2a2a;margin:20px 0">

          <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" id="new-status">
              <option value="pending">Pending</option>
              <option value="active">Active</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost-secondary" data-bs-dismiss="modal">Abbrechen</button>
        <button class="btn btn-primary" onclick="createTrainer()">Anlegen</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/js/tabler.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/constants.js"></script>
<script src="../shared/table-utils.js"></script>
<script src="../shared/layout.js"></script>
<script src="../shared/toast.js"></script>
<script src="auth-guard.js"></script>
<script src="../shared/form-dirty.js"></script>
<script>
  let allTrainers = [];
  let serviceLocations = [];
  let editingTrainerId = null;
  let tableFilter;

  (async () => {
    const user = await checkAdminAuth();
    if (!user) return;

    document.getElementById('sidebar').innerHTML = renderAdminSidebar('trainers');
    document.getElementById('header').innerHTML = renderAdminHeader('Trainer-Verwaltung', user.email);
    initRealtimeToasts(getSupabase(), 'admin');

    // Load service locations for city dropdowns
    try {
      const res = await adminApi('/api/admin?action=data&type=active_locations');
      serviceLocations = res.data || [];
      const citySel = document.getElementById('new-city');
      serviceLocations.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l.city;
        opt.textContent = l.city;
        citySel.appendChild(opt);
      });
    } catch (err) {
      console.error('Einsatzorte laden fehlgeschlagen:', err);
    }

    await loadTrainers();

    tableFilter = initSortableTable('trainers-table', [
      { key: 'full_name',     type: 'text',   getValue: t => t.full_name || '' },
      { key: 'city',          type: 'select', getValue: t => t.city || '\u2013' },
      { key: 'email',         type: 'text',   getValue: t => t.email || '' },
      { key: 'status',        type: 'select', getValue: t => t.status || '\u2013' },
      { key: 'license_count', type: 'select', getValue: t => (t.license_files || []).length > 0 ? `${(t.license_files || []).length} Datei(en)` : 'Keine' },
      { key: 'rating',        type: 'number', getValue: t => t.rating || 0 },
      { key: 'created_at',    type: 'date',   getValue: t => t.created_at ? t.created_at.slice(0, 10) : '' },
      null,
    ], {
      extraButtons: [
        { label: 'Neuer Trainer', icon: 'ti-plus', className: 'btn btn-sm btn-primary', onClick: 'openNewTrainerModal()' }
      ],
      countLabel: 'Trainern'
    });
    tableFilter.onFilterChange(() => renderTrainers());
  })();

  async function loadTrainers() {
    try {
      const res = await adminApi('/api/admin?action=data&type=all_trainers');
      allTrainers = res.data || [];
      renderTrainers();
    } catch (err) {
      document.getElementById('trainers-body').innerHTML =
        `<tr><td colspan="8" class="text-error" style="padding:20px">Fehler: ${err.message}</td></tr>`;
    }
  }

  function renderTrainers() {
    let filtered = tableFilter ? tableFilter.apply(allTrainers) : allTrainers;

    const tbody = document.getElementById('trainers-body');

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted" style="padding:24px">Keine Trainer gefunden</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map(t => {
      const rating = t.rating ? `${t.rating} ★ (${t.review_count || 0})` : '–';
      const canActivate = t.status === 'pending' || t.status === 'gesperrt';
      const canDeactivate = t.status === 'active' && t.is_active;
      const licenseCount = (t.license_files || []).length;
      const licenseBadge = licenseCount > 0
        ? `<span class="badge badge-active">${licenseCount} Datei${licenseCount > 1 ? 'en' : ''}</span>`
        : '<span class="badge" style="background:rgba(232,147,10,0.12);color:#e8930a">Keine</span>';
      return `
        <tr>
          <td style="display:flex;align-items:center;gap:8px">
            ${t.avatar_url
              ? `<img src="${t.avatar_url}" style="width:32px;height:32px;border-radius:50%;object-fit:cover">`
              : `<div style="width:32px;height:32px;border-radius:50%;background:#374151;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0">${(t.full_name||'T').charAt(0)}</div>`
            }
            <strong>${t.full_name || '–'}</strong>
          </td>
          <td>${t.city || '–'}</td>
          <td class="text-secondary">${t.email || '–'}</td>
          <td>${statusBadge(t.status)}</td>
          <td>${licenseBadge}</td>
          <td class="text-accent">${rating}</td>
          <td class="text-muted">${formatDate(t.created_at)}</td>
          <td>
            <div class="d-flex gap-1">
              <button class="btn btn-sm btn-ghost-secondary" title="Details" onclick="openDetailModal('${t.id}')"><i class="ti ti-eye"></i></button>
              ${canActivate ? `<button class="btn btn-sm btn-ghost-secondary" title="Aktivieren" onclick="activateTrainer('${t.id}')" style="color:var(--tblr-success)"><i class="ti ti-check"></i></button>` : ''}
              ${canDeactivate ? `<button class="btn btn-sm btn-ghost-secondary" title="Deaktivieren" onclick="deactivateTrainer('${t.id}')" style="color:var(--tblr-danger)"><i class="ti ti-player-pause"></i></button>` : ''}
              ${t.status !== 'active'
                ? `<button class="btn btn-sm btn-ghost-secondary" title="Trainer löschen" onclick="deleteTrainer('${t.id}','${(t.full_name||'').replace(/'/g,"\\'")}')" style="color:var(--tblr-danger)"><i class="ti ti-trash"></i></button>`
                : ''}
            </div>
          </td>
        </tr>
      `;
    }).join('');
  }

  // ─── Activate Trainer ─────────────────────────────────────────────
  async function activateTrainer(id) {
    if (!confirm('Trainer aktivieren und Einladungs-E-Mail senden?')) return;
    try {
      const res = await adminApi('/api/admin?action=activate-trainer', {
        method: 'POST',
        body: JSON.stringify({ trainerId: id }),
      });
      showAlert('alert-box', res.message || 'Trainer aktiviert!', 'success');
      await loadTrainers();
    } catch (err) {
      showAlert('alert-box', 'Fehler: ' + err.message, 'error');
    }
  }

  async function activateFromModal(id) {
    if (!confirm('Trainer aktivieren und Onboarding-E-Mail senden?')) return;
    try {
      const res = await adminApi('/api/admin?action=activate-trainer', {
        method: 'POST',
        body: JSON.stringify({ trainerId: id }),
      });
      if (res.onboardingLink) {
        // E-Mail fehlgeschlagen — Link manuell anzeigen
        prompt('Trainer aktiviert! E-Mail konnte nicht gesendet werden.\n\nBitte sende diesen Link manuell an den Trainer:', res.onboardingLink);
      } else {
        alert(res.message || 'Trainer aktiviert!');
      }
      bootstrap.Modal.getOrCreateInstance(document.getElementById('detail-modal')).hide();
      await loadTrainers();
    } catch (err) {
      alert('Aktivierung fehlgeschlagen: ' + err.message);
    }
  }

  // ─── Deactivate Trainer ──────────────────────────────────────
  async function deactivateTrainer(id) {
    if (!confirm('Trainer wirklich deaktivieren? Er wird für Kunden nicht mehr sichtbar sein.')) return;
    try {
      const res = await adminApi('/api/admin?action=deactivate-trainer', {
        method: 'POST',
        body: JSON.stringify({ trainerId: id }),
      });
      showAlert('alert-box', res.message || 'Trainer deaktiviert!', 'success');
      await loadTrainers();
    } catch (err) {
      showAlert('alert-box', 'Fehler: ' + err.message, 'error');
    }
  }

  // ─── Detail Modal ─────────────────────────────────────────────────
  function openDetailModal(id) {
    const t = allTrainers.find(tr => tr.id === id);
    if (!t) return;
    editingTrainerId = id;

    const nameParts = (t.full_name || '').split(' ');
    const firstName = nameParts[0] || '';
    const lastName = nameParts.slice(1).join(' ') || '';

    document.getElementById('modal-title').textContent = t.full_name || 'Trainer-Details';
    document.getElementById('modal-body').innerHTML = `
      <form id="trainer-detail-form">
      <!-- Avatar -->
      <div id="avatar-section" style="text-align:center;margin-bottom:20px">
        <div id="avatar-preview" style="margin-bottom:10px">
          ${t.avatar_url
            ? `<img id="avatar-img" src="${t.avatar_url}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.1)">`
            : `<div id="avatar-placeholder" style="width:80px;height:80px;border-radius:50%;background:#374151;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff">${(t.full_name||'T').charAt(0)}</div>`
          }
        </div>
        <div style="display:flex;gap:8px;justify-content:center;align-items:center">
          <label class="btn btn-secondary btn-sm" style="cursor:pointer;margin:0">
            <input type="file" id="avatar-file-input" accept="image/jpeg,image/png" style="display:none"
              onchange="handleAvatarFileChange(this)">
            Bild ändern
          </label>
          ${t.avatar_url
            ? `<button class="btn btn-sm" style="background:transparent;color:var(--error);border:1px solid var(--error);cursor:pointer"
                onclick="deleteTrainerAvatar()">Bild löschen</button>`
            : ''
          }
        </div>
        <div id="avatar-status" style="font-size:12px;color:var(--text-secondary);margin-top:6px;min-height:18px"></div>
      </div>
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Vorname *</label>
          <input class="form-control" id="edit-firstname" value="${firstName}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Nachname *</label>
          <input class="form-control" id="edit-lastname" value="${lastName}">
        </div>
      </div>
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">E-Mail</label>
          <input class="form-control" id="edit-email" type="email" value="${t.email || ''}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Telefon</label>
          <input class="form-control" id="edit-phone" value="${t.phone || ''}">
        </div>
      </div>

      <hr style="border-color:#2a2a2a;margin:20px 0">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Adresse</h3>

      <div class="mb-3">
        <label class="form-label">Straße und Hausnummer</label>
        <input class="form-control" id="edit-street" value="${t.street_address || ''}">
      </div>
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">PLZ</label>
          <input class="form-control" id="edit-postal" value="${t.postal_code || ''}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Ort (Wohnort)</label>
          <input class="form-control" id="edit-wohnort" value="${t.wohnort || ''}">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Einsatzort</label>
        <select class="form-select" id="edit-city">
          <option value="">Einsatzort wählen...</option>
          ${serviceLocations.map(l => `<option value="${l.city}" ${t.city === l.city ? 'selected' : ''}>${l.city}</option>`).join('')}
        </select>
      </div>

      <hr style="border-color:#2a2a2a;margin:20px 0">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Profil</h3>

      <div class="mb-3">
        <label class="form-label">Qualifikation / Spezialisierung</label>
        <textarea class="form-control" id="edit-specializations" rows="2">${t.specializations || ''}</textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Bio</label>
        <textarea class="form-control" id="edit-bio" rows="3">${t.bio || ''}</textarea>
      </div>

      <hr style="border-color:#2a2a2a;margin:20px 0">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Steuerdaten & Preise</h3>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Steuernummer</label>
          <input class="form-control" id="edit-steuernummer" value="${t.steuernummer || ''}">
        </div>
        <div class="col-md-6" style="display:flex;align-items:center;padding-top:24px">
          <label class="form-check">
            <input class="form-check-input" type="checkbox" id="edit-kleinunternehmer" ${t.is_kleinunternehmer ? 'checked' : ''}>
            <span class="form-check-label">Kleinunternehmer</span>
          </label>
        </div>
      </div>

      <hr style="border-color:#2a2a2a;margin:20px 0">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Status & Preise</h3>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Status</label>
          <select class="form-select" id="edit-status">
            <option value="pending" ${t.status === 'pending' ? 'selected' : ''}>Pending</option>
            <option value="active" ${t.status === 'active' ? 'selected' : ''}>Active</option>
            <option value="pausiert" ${t.status === 'pausiert' ? 'selected' : ''}>Pausiert</option>
            <option value="gesperrt" ${t.status === 'gesperrt' ? 'selected' : ''}>Gesperrt</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Aktiv (sichtbar für Kunden)</label>
          <select class="form-select" id="edit-is-active">
            <option value="false" ${!t.is_active ? 'selected' : ''}>Nein</option>
            <option value="true" ${t.is_active ? 'selected' : ''}>Ja</option>
          </select>
        </div>
      </div>
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Kundenpreis / Stundensatz (EUR)</label>
          <input class="form-control" type="number" id="edit-hourly-rate" step="0.01" min="0" value="${t.hourly_rate_cents ? (t.hourly_rate_cents / 100).toFixed(2) : ''}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Trainer-Vergütung (EUR)</label>
          <input class="form-control" type="number" id="edit-payout" step="0.01" min="0" value="${t.payout_cents ? (t.payout_cents / 100).toFixed(2) : ''}">
        </div>
      </div>
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">MwSt-Satz (%)</label>
          <input class="form-control" type="number" id="edit-mwst-satz" step="1" min="0" max="100" value="${t.mwst_satz ?? 19}">
          <div class="form-hint">Standard 19. Kleinunternehmer (§19 UStG) = 0.</div>
        </div>
      </div>

      <!-- Aktivieren-Button fuer nicht-aktive Trainer -->
      ${t.status !== 'active' && t.status === 'pending' && !t.auth_user_id ? `
      <div class="alert alert-warning mt-3 d-flex align-items-center justify-content-between">
        <span><i class="ti ti-alert-circle me-2"></i>Neuer Trainer — noch nicht aktiviert.</span>
        <button class="btn btn-success btn-sm" onclick="activateFromModal('${t.id}')"><i class="ti ti-check me-1"></i>Aktivieren & Onboarding-E-Mail senden</button>
      </div>` : ''}
      ${t.status !== 'active' && t.auth_user_id ? `

  // ─── Availability Grid ────────────────────────────────────────────────────

  // ISO 8601: 1=Mo, ..., 7=So
  const AVAIL_DAYS = { 1: 'Mo', 2: 'Di', 3: 'Mi', 4: 'Do', 5: 'Fr', 6: 'Sa', 7: 'So' };
  const AVAIL_HOURS_START = 5;
  const AVAIL_HOURS_END = 23;
  let availabilitySlots = {}; // key: "day-hour" → true/false

  async function loadAvailability(trainerId) {
    const grid = document.getElementById('availability-grid');
    try {
      const result = await adminApi(`/api/admin?action=trainer-availability&trainerId=${trainerId}`);
      console.log('Availability API response:', result);

      availabilitySlots = {};
      if (result.data) {
        console.log('Availability entries:', result.data.length, result.data);
        for (const row of result.data) {
          for (let h = row.start_hour; h < row.end_hour; h++) {
            availabilitySlots[`${row.day_of_week}-${h}`] = true;
          }
        }
      }
      console.log('Mapped slots:', Object.keys(availabilitySlots).filter(k => availabilitySlots[k]));

      renderAvailabilityGrid();
      document.getElementById('save-availability-btn').style.display = 'inline-flex';
    } catch (err) {
      grid.innerHTML = '<div style="color:#E74C3C;font-size:13px">Fehler beim Laden der Verfügbarkeit.</div>';
      console.error('Availability load error:', err);
    }
  }

  function renderAvailabilityGrid() {
    const grid = document.getElementById('availability-grid');

    let html = '<div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;font-size:11px">';

    // Header row with hours
    html += '<tr><td style="padding:4px 6px;font-weight:700;color:#8888A0;min-width:32px"></td>';
    for (let h = AVAIL_HOURS_START; h < AVAIL_HOURS_END; h++) {
      html += `<td style="padding:4px 2px;text-align:center;color:#8888A0;font-weight:600;min-width:28px">${h}</td>`;
    }
    html += '</tr>';

    // Day rows (ISO: 1=Mo, ..., 7=So)
    for (let d = 1; d <= 7; d++) {
      html += renderAvailDayRow(d);
    }

    html += '</table></div>';
    html += '<div style="font-size:11px;color:#8888A0;margin-top:8px">Klicke auf Zeitslots um sie zu aktivieren/deaktivieren</div>';

    grid.innerHTML = html;
  }

  function renderAvailDayRow(dayIndex) {
    let html = `<tr><td style="padding:4px 6px;font-weight:700;color:#e0e0e0">${AVAIL_DAYS[dayIndex]}</td>`;
    for (let h = AVAIL_HOURS_START; h < AVAIL_HOURS_END; h++) {
      const key = `${dayIndex}-${h}`;
      const active = !!availabilitySlots[key];
      const bg = active ? 'rgba(232,147,10,0.3)' : 'rgba(255,255,255,0.03)';
      const border = active ? '#e8930a' : 'rgba(255,255,255,0.08)';
      html += `<td style="padding:2px" onclick="toggleAvailSlot(${dayIndex},${h})">
        <div style="width:24px;height:24px;border-radius:4px;background:${bg};border:1px solid ${border};cursor:pointer;margin:auto"
             id="avail-${key}" title="${AVAIL_DAYS[dayIndex]} ${h}:00-${h+1}:00"></div>
      </td>`;
    }
    html += '</tr>';
    return html;
  }

  function toggleAvailSlot(day, hour) {
    const key = `${day}-${hour}`;
    availabilitySlots[key] = !availabilitySlots[key];

    const el = document.getElementById(`avail-${key}`);
    if (el) {
      const active = availabilitySlots[key];
      el.style.background = active ? 'rgba(232,147,10,0.3)' : 'rgba(255,255,255,0.03)';
      el.style.borderColor = active ? '#e8930a' : 'rgba(255,255,255,0.08)';
    }
  }

  async function saveAvailability(trainerId) {
    const btn = document.getElementById('save-availability-btn');
    const status = document.getElementById('availability-status');
    btn.disabled = true;
    status.textContent = 'Wird gespeichert...';
    status.style.color = '#8888A0';

    // Convert grid slots to consecutive hour ranges per day (ISO: 1=Mo, ..., 7=So)
    const slots = [];
    for (let d = 1; d <= 7; d++) {
      let startHour = null;
      for (let h = AVAIL_HOURS_START; h <= AVAIL_HOURS_END; h++) {
        const active = !!availabilitySlots[`${d}-${h}`];
        if (active && startHour === null) {
          startHour = h;
        } else if (!active && startHour !== null) {
          slots.push({ day_of_week: d, start_hour: startHour, end_hour: h, is_active: true });
          startHour = null;
        }
      }
      if (startHour !== null) {
        slots.push({ day_of_week: d, start_hour: startHour, end_hour: AVAIL_HOURS_END, is_active: true });
      }
    }

    try {
      const result = await adminApi('/api/admin?action=trainer-availability', {
        method: 'POST',
        body: JSON.stringify({ trainerId, slots })
      });

      if (result.success) {
        status.textContent = `Gespeichert (${result.count} Einträge)`;
        status.style.color = '#27AE60';
      } else {
        status.textContent = result.error || 'Fehler beim Speichern';
        status.style.color = '#E74C3C';
      }
    } catch (err) {
      status.textContent = 'Netzwerkfehler';
      status.style.color = '#E74C3C';
      console.error('Availability save error:', err);
    } finally {
      btn.disabled = false;
      setTimeout(() => { status.textContent = ''; }, 4000);
    }
  }

  function renderLicenseList(files, trainerId) {
    if (!files || files.length === 0) {
      return '<p style="color:#8888A0;font-size:13px">Keine Lizenzen hochgeladen.</p>';
    }
    return files.map(f => {
      const date = f.uploaded_at ? new Date(f.uploaded_at).toLocaleDateString('de-DE') : '–';
      const size = f.size_bytes ? formatFileSize(f.size_bytes) : '–';
      const icon = (f.content_type === 'application/pdf' || f.filename.endsWith('.pdf')) ? 'PDF' : 'IMG';
      return `
        <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#161625;border:1px solid rgba(255,255,255,0.06);border-radius:10px;margin-bottom:8px">
          <div style="width:36px;height:36px;border-radius:8px;background:rgba(232,147,10,0.12);color:#e8930a;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0">${icon}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.filename}</div>
            <div style="font-size:11px;color:#8888A0">${date} &middot; ${size}</div>
          </div>
          <button class="btn btn-secondary btn-sm" style="font-size:11px;padding:4px 10px" onclick="viewLicense('${f.path}')">Anzeigen</button>
          <button class="btn btn-danger btn-sm" style="font-size:11px;padding:4px 10px" onclick="deleteLicense('${trainerId}','${f.path}')">L&ouml;schen</button>
        </div>
      `;
    }).join('');
  }

  function renderContractList(files, trainerId) {
    if (!files || files.length === 0) {
      return '<p style="color:#8888A0;font-size:13px">Kein Vertrag hochgeladen.</p>';
    }
    return files.map(f => {
      const date = f.uploaded_at ? new Date(f.uploaded_at).toLocaleDateString('de-DE') : '–';
      const size = f.size_bytes ? formatFileSize(f.size_bytes) : '–';
      const icon = (f.content_type === 'application/pdf' || f.filename.endsWith('.pdf')) ? 'PDF' : 'IMG';
      return `
        <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#161625;border:1px solid rgba(255,255,255,0.06);border-radius:10px;margin-bottom:8px">
          <div style="width:36px;height:36px;border-radius:8px;background:rgba(46,117,182,0.12);color:#2E75B6;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0">${icon}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.filename}</div>
            <div style="font-size:11px;color:#8888A0">${date} &middot; ${size}</div>
          </div>
          <button class="btn btn-secondary btn-sm" style="font-size:11px;padding:4px 10px" onclick="viewLicense('${f.path}')">Anzeigen</button>
          <button class="btn btn-danger btn-sm" style="font-size:11px;padding:4px 10px" onclick="deleteContract('${trainerId}','${f.path}')">L&ouml;schen</button>
        </div>
      `;
    }).join('');
  }

  function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  async function adminUploadFiles(trainerId, type = 'license') {
    const isContract = type === 'contract';
    const input = document.getElementById(isContract ? 'admin-contract-upload' : 'admin-file-upload');
    const status = document.getElementById(isContract ? 'admin-contract-upload-status' : 'admin-upload-status');
    const files = input.files;
    if (!files || files.length === 0) return;

    status.textContent = 'Hochladen...';

    const formData = new FormData();
    formData.append('trainerId', trainerId);
    if (isContract) formData.append('subfolder', 'contracts');
    for (let i = 0; i < files.length; i++) {
      formData.append('files', files[i]);
    }

    try {
      const resp = await fetch('/api/upload-license', {
        method: 'POST',
        body: formData,
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Upload fehlgeschlagen');

      status.textContent = '';
      showAlert('alert-box', `${result.files.length} Datei(en) hochgeladen!`, 'success');
      await loadTrainers();
      const t = allTrainers.find(tr => tr.id === trainerId);
      if (t) {
        document.getElementById('license-list').innerHTML = renderLicenseList(t.license_files || [], trainerId);
        const contractListEl = document.getElementById('contract-list');
        if (contractListEl) contractListEl.innerHTML = renderContractList(t.contract_files || [], trainerId);
      }
    } catch (err) {
      status.textContent = '';
      showAlert('alert-box', 'Upload-Fehler: ' + err.message, 'error');
    }

    input.value = '';
  }

  async function deleteContract(trainerId, path) {
    if (!confirm('Vertragsdatei wirklich löschen?')) return;
    try {
      // Delete from storage
      await adminApi('/api/admin?action=license', {
        method: 'DELETE',
        body: JSON.stringify({ trainerId, path }),
      });
      // Update contract_files in trainer profile
      const t = allTrainers.find(tr => tr.id === trainerId);
      if (t) {
        const updatedContracts = (t.contract_files || []).filter(f => f.path !== path);
        await adminApi('/api/admin?action=trainers', {
          method: 'PUT',
          body: JSON.stringify({ trainerId, contract_files: updatedContracts }),
        });
      }
      showAlert('alert-box', 'Vertrag gelöscht!', 'success');
      await loadTrainers();
      const updated = allTrainers.find(tr => tr.id === trainerId);
      if (updated) {
        document.getElementById('license-list').innerHTML = renderLicenseList(updated.license_files || [], trainerId);
        const contractListEl = document.getElementById('contract-list');
        if (contractListEl) contractListEl.innerHTML = renderContractList(updated.contract_files || [], trainerId);
      }
    } catch (err) {
      showAlert('alert-box', 'Fehler: ' + err.message, 'error');
    }
  }

  async function handleAvatarFileChange(input) {
    const file = input.files && input.files[0];
    if (!file) return;

    if (!['image/jpeg', 'image/png'].includes(file.type)) {
      alert('Nur JPG und PNG sind erlaubt.');
      input.value = '';
      return;
    }
    if (file.size > 2 * 1024 * 1024) {
      alert('Maximale Dateigröße: 2 MB');
      input.value = '';
      return;
    }

    const status = document.getElementById('avatar-status');
    status.innerHTML = '<div class="spinner-border spinner-border-sm"></div> Wird hochgeladen...';

    try {
      const session = (await getSupabase().auth.getSession()).data.session;
      const token = session?.access_token;

      const formData = new FormData();
      formData.append('trainerId', editingTrainerId);
      formData.append('file', file);

      const resp = await fetch('/api/admin?action=trainer-avatar', {
        method: 'POST',
        headers: token ? { Authorization: `Bearer ${token}` } : {},
        body: formData,
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Upload fehlgeschlagen');

      // Vorschau sofort aktualisieren
      const preview = document.getElementById('avatar-preview');
      preview.innerHTML = `<img id="avatar-img" src="${result.url}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.1)">`;

      // "Bild löschen" Button einblenden falls noch nicht vorhanden
      const section = document.getElementById('avatar-section');
      if (!section.querySelector('[onclick="deleteTrainerAvatar()"]')) {
        const btnRow = section.querySelector('div[style*="display:flex"]');
        const delBtn = document.createElement('button');
        delBtn.className = 'btn btn-sm';
        delBtn.style.cssText = 'background:transparent;color:var(--error);border:1px solid var(--error);cursor:pointer';
        delBtn.setAttribute('onclick', 'deleteTrainerAvatar()');
        delBtn.textContent = 'Bild löschen';
        btnRow.appendChild(delBtn);
      }

      // Cache aktualisieren
      const cached = allTrainers.find(tr => tr.id === editingTrainerId);
      if (cached) cached.avatar_url = result.url;

      status.textContent = 'Bild gespeichert!';
      setTimeout(() => { status.textContent = ''; }, 3000);
    } catch (err) {
      status.textContent = 'Fehler: ' + err.message;
    }
    input.value = '';
  }

  async function deleteTrainerAvatar() {

        method: 'DELETE',
        body: JSON.stringify({ trainerId: editingTrainerId }),
      });

      // Vorschau durch Initialen-Placeholder ersetzen
      const t = allTrainers.find(tr => tr.id === editingTrainerId) || {};
      const initial = (t.full_name || 'T').charAt(0);
      document.getElementById('avatar-preview').innerHTML =
        `<div id="avatar-placeholder" style="width:80px;height:80px;border-radius:50%;background:#374151;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff">${initial}</div>`;

      // "Bild löschen" Button entfernen
      const delBtn = document.querySelector('[onclick="deleteTrainerAvatar()"]');
      if (delBtn) delBtn.remove();

      // Cache aktualisieren
      if (t) t.avatar_url = null;

      status.textContent = 'Bild gelöscht.';
      setTimeout(() => { status.textContent = ''; }, 3000);
    } catch (err) {
      status.textContent = 'Fehler: ' + err.message;
    }
  }

  // ─── New Trainer ──────────────────────────────────────────────────
  let newTrainerFiles = []; // Ausgewählte Dateien für neuen Trainer

  function openNewTrainerModal() {
    document.getElementById('new-trainer-form').reset();
    newTrainerFiles = [];
    document.getElementById('new-file-preview').innerHTML = '';
    new bootstrap.Modal(document.getElementById('new-modal')).show();
  }

  function updateNewFilePreview() {
    const input = document.getElementById('new-license-files');
    const added = Array.from(input.files || []);
    added.forEach(f => {
      if (f.size > 10 * 1024 * 1024) {
        alert(`${f.name} ist zu groß (max 10 MB)`);
        return;
      }
      if (!newTrainerFiles.some(ef => ef.name === f.name && ef.size === f.size)) {
        newTrainerFiles.push(f);
      }
    });
    input.value = '';
    renderNewFilePreview();
  }

  function removeNewFile(idx) {
    newTrainerFiles.splice(idx, 1);
    renderNewFilePreview();
  }

  function renderNewFilePreview() {
    const container = document.getElementById('new-file-preview');
    if (newTrainerFiles.length === 0) { container.innerHTML = ''; return; }
    container.innerHTML = newTrainerFiles.map((f, i) => `
      <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:#161625;border:1px solid rgba(255,255,255,0.06);border-radius:8px;margin-bottom:6px;font-size:13px">
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</span>
        <span style="color:var(--text-muted);font-size:11px;flex-shrink:0">${formatFileSize(f.size)}</span>
        <button type="button" class="btn btn-icon btn-icon-delete" style="font-size:12px;padding:2px 6px;min-width:auto" onclick="removeNewFile(${i})">&times;</button>
      </div>
    `).join('');
  }

  async function createTrainer() {
    const firstname = document.getElementById('new-firstname').value.trim();
    const lastname = document.getElementById('new-lastname').value.trim();
    const email = document.getElementById('new-email').value.trim();
    const city = document.getElementById('new-city').value.trim();

    if (!firstname || !lastname || !email || !city) {
      alert('Vorname, Nachname, E-Mail und Einsatzort sind Pflichtfelder.');
      return;
    }

    try {
      const res = await adminApi('/api/admin?action=trainers', {
        method: 'POST',
        body: JSON.stringify({
          full_name: firstname + ' ' + lastname,
          email: email,
          phone: document.getElementById('new-phone').value.trim() || null,
          city: city,
          street_address: document.getElementById('new-street').value.trim() || null,
          postal_code: document.getElementById('new-postal').value.trim() || null,
          wohnort: document.getElementById('new-wohnort').value.trim() || null,
          specializations: document.getElementById('new-specializations').value.trim() || null,
          bio: document.getElementById('new-bio').value.trim() || null,
          steuernummer: document.getElementById('new-steuernummer').value.trim() || null,
          is_kleinunternehmer: document.getElementById('new-kleinunternehmer').checked,
          hourly_rate_cents: document.getElementById('new-hourly-rate').value ? Math.round(parseFloat(document.getElementById('new-hourly-rate').value) * 100) : null,
          payout_cents: document.getElementById('new-payout').value ? Math.round(parseFloat(document.getElementById('new-payout').value) * 100) : null,
          mwst_satz: parseInt(document.getElementById('new-mwst-satz')?.value) || 19,
          status: document.getElementById('new-status').value,
        }),
      });

      const trainerId = res.data?.id;

      // Dateien hochladen falls vorhanden
      if (newTrainerFiles.length > 0 && trainerId) {
        try {
          const formData = new FormData();
          formData.append('trainerId', trainerId);
          newTrainerFiles.forEach(f => formData.append('files', f));

          const token = (await getSupabase().auth.getSession()).data.session?.access_token;
          const uploadRes = await fetch('/api/upload-license', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` },
            body: formData,
          });
          const uploadResult = await uploadRes.json();

          if (!uploadRes.ok) {
            closeModal('new-modal');
            showAlert('alert-box', `Trainer angelegt, aber Datei-Upload fehlgeschlagen: ${uploadResult.error || 'Unbekannter Fehler'}`, 'error');
            await loadTrainers();
            return;
          }
        } catch (uploadErr) {
          closeModal('new-modal');
          showAlert('alert-box', `Trainer angelegt, aber Datei-Upload fehlgeschlagen: ${uploadErr.message}`, 'error');
          await loadTrainers();
          return;
        }
      }

      closeModal('new-modal');
      showAlert('alert-box', newTrainerFiles.length > 0 ? 'Trainer angelegt mit Lizenzen!' : 'Trainer angelegt!', 'success');
      newTrainerFiles = [];
      await loadTrainers();
    } catch (err) {
      showAlert('alert-box', 'Fehler: ' + err.message, 'error');
    }
  }

  // ─── Delete Trainer ──────────────────────────────────────────────
  async function deleteTrainer(id, name) {
    // Prüfe ob der Trainer aktive Buchungen oder Gruppentrainings hat
    const t = allTrainers.find(tr => tr.id === id);
    let warnings = [];

    try {
      const [bookingsRes, groupsRes] = await Promise.all([
        adminApi(`/api/admin?action=data&type=all_bookings`),
        adminApi(`/api/admin?action=data&type=all_groups`),
      ]);
      const trainerBookings = (bookingsRes.data || []).filter(b => b.trainer_id === id && b.status !== 'CANCELLED');
      const trainerGroups = (groupsRes.data || []).filter(g => g.trainer_id === id);

      if (trainerBookings.length > 0) warnings.push(`${trainerBookings.length} aktive Buchung(en)`);
      if (trainerGroups.length > 0) warnings.push(`${trainerGroups.length} Gruppentraining(s)`);
    } catch (e) {
      // Falls Prüfung fehlschlägt, trotzdem weiter mit Standard-Warnung
      console.error('Vorprüfung fehlgeschlagen:', e);
    }

    let confirmMsg = `Trainer "${name}" wirklich löschen?\n\nAlle zugehörigen Daten werden entfernt.`;
    if (warnings.length > 0) {
      confirmMsg = `Trainer "${name}" hat noch:\n\n- ${warnings.join('\n- ')}\n\nDiese werden beim Löschen dem Trainer entzogen.\n\nTrotzdem löschen?`;
    }
    if (!confirm(confirmMsg)) return;

    try {
      const res = await adminApi('/api/admin?action=delete-trainer', {
        method: 'DELETE',
        body: JSON.stringify({ trainerId: id }),
      });
      closeModal('detail-modal');
      showAlert('alert-box', res.message || 'Trainer gelöscht!', 'success');
      await loadTrainers();
    } catch (err) {
      showAlert('alert-box', err.message, 'error');
    }
  }

  // ─── Modal Helpers ────────────────────────────────────────────────
  function closeModal(id) {
    if (id === 'detail-modal' && window._trainerDirty && window._trainerDirty.isDirty()) {
      window._trainerDirty.confirmDiscard(function () {
        window._trainerDirty = null;
        editingTrainerId = null;
        const el = document.getElementById('detail-modal');
        const inst = bootstrap.Modal.getInstance(el);
        if (inst) inst.hide();
      });
      return;
    }
    if (id === 'detail-modal' && window._trainerDirty) {
      window._trainerDirty.destroy();
      window._trainerDirty = null;
    }
    const el = document.getElementById(id);
    const inst = bootstrap.Modal.getInstance(el);
    if (inst) inst.hide();
    editingTrainerId = null;
  }
  // ─── Vacation Management ─────────────────────────────────────────────────

  async function loadTrainerVacations(trainerId) {
    try {
      var res = await adminApi('/api/admin?action=data&type=trainer_vacations&trainer_ids=' + trainerId);
      var tbody = document.getElementById('vacation-list');
      var vacations = res.data || [];
      if (vacations.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-secondary p-3">Keine Urlaubseintraege</td></tr>';
        return;
      }
      tbody.innerHTML = vacations.map(function(v) {
        var days = Math.ceil((new Date(v.end_date) - new Date(v.start_date)) / 86400000) + 1;
        var reasonMap = { urlaub: 'Urlaub', krank: 'Krank', privat: 'Privat', sonstiges: 'Sonstiges' };
        return '<tr>' +
          '<td>' + formatDate(v.start_date) + '</td>' +
          '<td>' + formatDate(v.end_date) + '</td>' +
          '<td>' + days + ' Tage</td>' +
          '<td>' + (reasonMap[v.reason] || v.reason || '–') + '</td>' +
          '<td><button class="btn btn-sm btn-outline-danger" onclick="deleteVacation(\'' + v.id + '\', \'' + v.trainer_id + '\')"><i class="ti ti-trash"></i></button></td>' +
          '</tr>';
      }).join('');
    } catch(e) {
      console.error('Vacations load error:', e);
      document.getElementById('vacation-list').innerHTML = '<tr><td colspan="5" class="text-secondary p-3">Fehler beim Laden</td></tr>';
    }
  }

  async function createVacation(trainerId) {
    var startDate = document.getElementById('admin-vac-start').value;
    var endDate = document.getElementById('admin-vac-end').value;
    var reason = document.getElementById('admin-vac-reason').value;
    if (!startDate || !endDate) { alert('Bitte Von und Bis angeben'); return; }
    if (new Date(endDate) < new Date(startDate)) { alert('Bis-Datum muss nach Von-Datum liegen'); return; }
    try {
      await adminApi('/api/admin?action=trainer_vacation', {
        method: 'POST',
        body: JSON.stringify({ trainer_id: trainerId, start_date: startDate, end_date: endDate, reason: reason })
      });
      document.getElementById('vacation-form').classList.add('d-none');
      document.getElementById('admin-vac-start').value = '';
      document.getElementById('admin-vac-end').value = '';
      document.getElementById('admin-vac-reason').value = 'urlaub';
      loadTrainerVacations(trainerId);
    } catch(e) { alert('Fehler: ' + e.message); }
  }

  async function deleteVacation(vacId, trainerId) {
    if (!confirm('Urlaub loeschen?')) return;
    try {
      await adminApi('/api/admin?action=trainer_vacation', {
        method: 'DELETE',
        body: JSON.stringify({ id: vacId })
      });
      loadTrainerVacations(trainerId);
    } catch(e) { alert('Fehler: ' + e.message); }
  }

</script>
