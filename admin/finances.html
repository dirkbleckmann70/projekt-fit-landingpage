<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finanzen – Projekt Fit Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../shared/table-utils.css">
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="header" id="header"></header>
    <div class="content">

      <!-- KPI Finance -->
      <div class="kpi-grid" id="finance-kpis">
        <div class="kpi-card">
          <div class="kpi-label">Gesamtumsatz</div>
          <div class="kpi-value" id="kpi-total"><span class="spinner"></span></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Trainer-Auszahlungen</div>
          <div class="kpi-value" id="kpi-payouts"><span class="spinner"></span></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Projekt Fit Marge</div>
          <div class="kpi-value" id="kpi-margin"><span class="spinner"></span></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Gutschriften</div>
          <div class="kpi-value" id="kpi-credits"><span class="spinner"></span></div>
        </div>
      </div>

      <!-- Revenue Table -->
      <div class="table-wrap mb-2">
        <div class="table-header">
          <div class="table-title">Umsatz pro Buchung</div>
          <div class="table-actions">
            <button class="btn btn-ghost btn-sm" onclick="exportCSV()">CSV Export</button>
          </div>
        </div>
        <table id="finance-table">
          <thead>
            <tr id="finance-sum-row" style="display:none;border-bottom:1px solid rgba(255,255,255,0.1);font-size:12px;color:var(--text-secondary)">
              <td colspan="3" style="padding:6px 12px;text-align:right;font-style:italic" id="fin-count-cell"></td>
              <td style="padding:6px 12px" class="text-accent"  id="fin-brutto-sum"></td>
              <td style="padding:6px 12px" class="text-muted"   id="fin-netto-sum"></td>
              <td style="padding:6px 12px" class="text-muted"   id="fin-kosten-sum"></td>
              <td style="padding:6px 12px" class="text-success" id="fin-erloese-sum"></td>
              <td colspan="2"></td>
            </tr>
            <tr>
              <th>Datum</th>
              <th>Kunde</th>
              <th>Trainer</th>
              <th>Einnahme brutto</th>
              <th>Einnahme netto</th>
              <th>Trainer Kosten</th>
              <th>Erlöse</th>
              <th>Status</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody id="revenue-body">
            <tr><td colspan="9" class="loading-overlay"><span class="spinner"></span> Daten werden geladen...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Credits Table -->
      <div class="table-wrap">
        <div class="table-header">
          <div class="table-title">Gutschriften</div>
        </div>
        <table>
          <thead>
            <tr>
              <th>GS-Nr.</th>
              <th>Datum</th>
              <th>Trainer</th>
              <th>Netto</th>
              <th>MwSt</th>
              <th>Brutto</th>
              <th>Leistung</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="credits-body">
            <tr><td colspan="8" class="loading-overlay"><span class="spinner"></span> Laden...</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<!-- Finance Detail Modal -->
<div class="modal-overlay" id="finance-detail-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Buchungs-Details</div>
      <button class="modal-close" onclick="closeFinanceModal()">&times;</button>
    </div>
    <div class="modal-body" id="finance-modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeFinanceModal()">Schließen</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-guard.js"></script>
<script src="../shared/table-utils.js"></script>
<script>
  let financeData = [];
  let tableFilter;

  const FIN_CANCELLED = ['cancelled', 'refunded', 'cancelled_by_trainer'];

  function effBrutto(b)  { return FIN_CANCELLED.includes((b.status||'').toLowerCase()) ? 0 : (b.price_cents || b.final_price_cents || 0); }
  function effNetto(b)   { return Math.round(effBrutto(b) / 1.19); }
  function effKosten(b)  { return FIN_CANCELLED.includes((b.status||'').toLowerCase()) ? 0 : (b.payout_cents || b.trainer_rate_cents || 0); }
  function effErloese(b) { return effNetto(b) - effKosten(b); }

  (async () => {
    const user = await checkAdminAuth();
    if (!user) return;

    document.getElementById('sidebar').innerHTML = renderSidebar('finances');
    document.getElementById('header').innerHTML = renderHeader('Finanzen');

    await Promise.all([loadFinances(), loadCredits()]);

    tableFilter = initSortableTable('finance-table', [
      { key: 'scheduled_date', type: 'date',   getValue: b => b.scheduled_date || '' },
      { key: 'customer_name',  type: 'text',   getValue: b => b.customer_name || '' },
      { key: 'trainer_name',   type: 'text',   getValue: b => b.trainer_name || '' },
      { key: 'brutto',         type: 'number', getValue: b => effBrutto(b) / 100 },
      { key: 'netto',          type: 'number', getValue: b => effNetto(b) / 100 },
      { key: 'kosten',         type: 'number', getValue: b => effKosten(b) / 100 },
      { key: 'erloese',        type: 'number', getValue: b => effErloese(b) / 100 },
      { key: 'status',         type: 'select', getValue: b => b.status || '\u2013' },
    ]);
    tableFilter.onFilterChange(() => renderFinanceTable());
  })();

  async function loadFinances() {
    try {
      const res = await adminApi('/api/admin?action=data&type=finances');
      financeData = res.data || [];
      renderFinanceTable();
    } catch (err) {
      document.getElementById('revenue-body').innerHTML =
        `<tr><td colspan="8" class="text-error" style="padding:20px">Fehler: ${err.message}</td></tr>`;
      document.getElementById('kpi-total').textContent = '–';
      document.getElementById('kpi-payouts').textContent = '–';
      document.getElementById('kpi-margin').textContent = '–';
    }
  }

  function renderFinanceTable() {
    let filtered = tableFilter ? tableFilter.apply(financeData) : financeData;

    // KPIs (nur nicht-stornierte)
    let totalBrutto = 0, totalNetto = 0, totalKosten = 0;
    filtered.forEach(b => {
      totalBrutto += effBrutto(b);
      totalNetto  += effNetto(b);
      totalKosten += effKosten(b);
    });
    document.getElementById('kpi-total').textContent   = formatEuro(totalBrutto);
    document.getElementById('kpi-payouts').textContent = formatEuro(totalKosten);
    document.getElementById('kpi-margin').textContent  = formatEuro(totalNetto - totalKosten);

    const tbody  = document.getElementById('revenue-body');
    const sumRow = document.getElementById('finance-sum-row');

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted" style="padding:24px">Keine Buchungen gefunden</td></tr>';
      sumRow.style.display = 'none';
      return;
    }

    tbody.innerHTML = filtered.map(b => {
      const brutto  = effBrutto(b);
      const netto   = effNetto(b);
      const kosten  = effKosten(b);
      const erloese = effErloese(b);
      return `
        <tr>
          <td>${formatDate(b.scheduled_date)}</td>
          <td>${b.customer_name || '–'}</td>
          <td>${b.trainer_name || '–'}</td>
          <td class="text-accent">${formatEuro(brutto)}</td>
          <td class="text-muted">${formatEuro(netto)}</td>
          <td class="text-muted">${formatEuro(kosten)}</td>
          <td class="${erloese > 0 ? 'text-success' : ''}">${formatEuro(erloese)}</td>
          <td>${statusBadge(b.status)}</td>
          <td><button class="btn btn-secondary btn-sm" onclick="openFinanceDetail('${b.id}')">Details</button></td>
        </tr>
      `;
    }).join('');

    // Summenzeile
    let sumBrutto = 0, sumNetto = 0, sumKosten = 0, sumErloese = 0;
    filtered.forEach(b => { sumBrutto += effBrutto(b); sumNetto += effNetto(b); sumKosten += effKosten(b); sumErloese += effErloese(b); });
    sumRow.style.display = '';
    document.getElementById('fin-count-cell').textContent  = `${filtered.length} von ${financeData.length} Buchungen`;
    document.getElementById('fin-brutto-sum').textContent  = formatEuro(sumBrutto);
    document.getElementById('fin-netto-sum').textContent   = formatEuro(sumNetto);
    document.getElementById('fin-kosten-sum').textContent  = formatEuro(sumKosten);
    document.getElementById('fin-erloese-sum').textContent = formatEuro(sumErloese);
  }

  async function loadCredits() {
    try {
      const res = await adminApi('/api/admin?action=data&type=credits');
      const credits = res.data || [];

      let totalCredits = 0;
      credits.forEach(c => { totalCredits += (c.bruttobetrag_cent || 0); });
      document.getElementById('kpi-credits').textContent = formatEuro(totalCredits);

      const tbody = document.getElementById('credits-body');
      if (credits.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted" style="padding:24px">Keine Gutschriften vorhanden</td></tr>';
        return;
      }

      tbody.innerHTML = credits.map(c => `
        <tr>
          <td><strong>${c.gs_nummer || '–'}</strong></td>
          <td>${formatDate(c.ausgestellt_am)}</td>
          <td>${c.trainer_name || '–'}</td>
          <td>${formatEuro(c.nettobetrag_cent)}</td>
          <td>${formatEuro(c.mwst_betrag_cent)}</td>
          <td class="text-accent">${formatEuro(c.bruttobetrag_cent)}</td>
          <td>${c.leistungsbeschreibung || '–'}</td>
          <td>${statusBadge(c.status || 'pending')}</td>
        </tr>
      `).join('');
    } catch (err) {
      document.getElementById('credits-body').innerHTML =
        `<tr><td colspan="8" class="text-error" style="padding:16px">Fehler: ${err.message}</td></tr>`;
      document.getElementById('kpi-credits').textContent = '–';
    }
  }

  function exportCSV() {
    if (financeData.length === 0) { alert('Keine Daten zum Exportieren.'); return; }

    const headers = ['Datum', 'Kunde', 'Trainer', 'Einnahme brutto (EUR)', 'Einnahme netto (EUR)', 'Trainer Kosten (EUR)', 'Erlöse (EUR)', 'Status'];
    const rows = financeData.map(b => [
      b.scheduled_date || '',
      b.customer_name || '',
      b.trainer_name || '',
      (effBrutto(b) / 100).toFixed(2).replace('.', ','),
      (effNetto(b)  / 100).toFixed(2).replace('.', ','),
      (effKosten(b) / 100).toFixed(2).replace('.', ','),
      (effErloese(b)/ 100).toFixed(2).replace('.', ','),
      b.status || '',
    ]);

    let csv = '\uFEFF'; // BOM for Excel
    csv += headers.join(';') + '\n';
    rows.forEach(r => { csv += r.map(v => `"${v}"`).join(';') + '\n'; });

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `projektfit-finanzen-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function paymentLabel(b) {
    const ps = (b.payment_status || '').toLowerCase();
    const st = (b.status || '').toLowerCase();
    if (ps === 'paid'    || b.paid === true || st === 'completed') return '\u2705 Bezahlt';
    if (ps === 'refunded')                                         return '\u21a9\ufe0f Erstattet';
    if (ps === 'failed')                                           return '\u274c Fehlgeschlagen';
    if (ps === 'pending' || st === 'confirmed' || st === 'pending') return '\u23f3 Ausstehend';
    return '\u2013 Keine';
  }

  function openFinanceDetail(id) {
    const b = financeData.find(x => x.id === id);
    if (!b) return;
    const brutto  = effBrutto(b);
    const netto   = effNetto(b);
    const kosten  = effKosten(b);
    const erloese = effErloese(b);
    document.getElementById('finance-modal-body').innerHTML = `
      <div class="two-col">
        <div class="form-group">
          <label>Trainer</label>
          <input class="form-control" value="${b.trainer_name || '–'}" disabled>
        </div>
        <div class="form-group">
          <label>Kunde</label>
          <input class="form-control" value="${b.customer_name || b.customer_id || '–'}" disabled>
        </div>
      </div>
      <div class="two-col">
        <div class="form-group">
          <label>Datum</label>
          <input class="form-control" value="${formatDate(b.scheduled_date)}" disabled>
        </div>
        <div class="form-group">
          <label>Uhrzeit</label>
          <input class="form-control" value="${b.scheduled_time ? b.scheduled_time.slice(0,5) : '–'}" disabled>
        </div>
      </div>
      <div class="two-col">
        <div class="form-group">
          <label>Stadt</label>
          <input class="form-control" value="${b.trainer_city || b.city || '–'}" disabled>
        </div>
        <div class="form-group">
          <label>Art</label>
          <input class="form-control" value="${b.booking_type === 'group' ? 'Gruppentraining' : 'Personal Training'}" disabled>
        </div>
      </div>
      <div class="form-group">
        <label>Treffpunkt-Adresse</label>
        <input class="form-control" value="${b.location_name || b.location_address || b.location || '–'}" disabled>
      </div>
      <div class="two-col">
        <div class="form-group">
          <label>Status</label>
          <input class="form-control" value="${b.status || '–'}" disabled>
        </div>
        <div class="form-group">
          <label>Zahlung</label>
          <input class="form-control" value="${paymentLabel(b)}" disabled>
        </div>
      </div>
      <div class="two-col">
        <div class="form-group">
          <label>Einnahme brutto</label>
          <input class="form-control" value="${formatEuro(brutto)}" disabled>
        </div>
        <div class="form-group">
          <label>Einnahme netto (−19% MwSt)</label>
          <input class="form-control" value="${formatEuro(netto)}" disabled>
        </div>
      </div>
      <div class="two-col">
        <div class="form-group">
          <label>Trainer Kosten</label>
          <input class="form-control" value="${formatEuro(kosten)}" disabled>
        </div>
        <div class="form-group">
          <label>Erlöse</label>
          <input class="form-control text-success" value="${formatEuro(erloese)}" disabled>
        </div>
      </div>
      <p class="text-muted mt-1" style="font-size:12px">Erstellt: ${formatDateTime(b.created_at)} &middot; ID: ${b.id}</p>
    `;
    document.getElementById('finance-detail-modal').classList.add('open');
  }

  function closeFinanceModal() {
    document.getElementById('finance-detail-modal').classList.remove('open');
  }

  document.getElementById('finance-detail-modal').addEventListener('click', e => {
    if (e.target === document.getElementById('finance-detail-modal')) closeFinanceModal();
  });
</script>

</body>
</html>
