<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buchungen – Projekt Fit Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="../shared/tabler-custom.css">
  <link rel="stylesheet" href="../shared/table-utils.css">
  <style>
    /* Zeilen-Klick-Cursor fuer Buchungs-Tabelle */
    #bookings-table tbody tr { cursor: pointer; }
  </style>
</head>
<body class="page">
<script src="../shared/theme.js"></script>

<div id="sidebar"></div>

<div class="page-wrapper">
  <div class="page-header d-print-none" id="header"></div>
  <div class="page-body">
    <div class="container-fluid">

      <div id="alert-box" class="alert"></div>

      <div class="card">
        <div class="table-responsive">
          <table class="table table-vcenter card-table table-hover" id="bookings-table">
            <thead>
              <tr id="bookings-tfoot" style="display:none;border-bottom:1px solid rgba(255,255,255,0.1);font-size:12px;color:var(--tblr-secondary-color)">
                <td colspan="7" style="padding:6px 12px;text-align:right;font-style:italic" id="bookings-sum-label"></td>
                <td style="padding:6px 12px" class="text-accent" id="bookings-price-sum"></td>
                <td style="padding:6px 12px" class="text-warning" id="bookings-discount-sum"></td>
                <td style="padding:6px 12px" class="text-secondary"  id="bookings-cost-sum"></td>
                <td colspan="2"></td>
              </tr>
              <tr>
                <th>Datum</th>
                <th>Ort</th>
                <th>Uhrzeit</th>
                <th>Art</th>
                <th>Trainer</th>
                <th>Kunde</th>
                <th>Status</th>
                <th>Einnahmen</th>
                <th>Rabatt</th>
                <th>Kosten</th>
                <th>Zahlung</th>
                <th>Aktionen</th>
              </tr>
            </thead>
            <tbody id="bookings-body">
              <tr><td colspan="12" class="loading-overlay"><div class="spinner-border spinner-border-sm"></div> Buchungen werden geladen...</td></tr>
            </tbody>
          </table>
        </div>
        <!-- Pagination Footer -->
        <div class="card-footer d-flex align-items-center" id="bookings-pagination" style="display:none!important">
          <p class="m-0 text-secondary" id="pagination-info"></p>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Booking Detail Modal -->
<div class="modal modal-blur fade pf-modal-lg" id="detail-modal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Buchungs-Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <!-- Tabs -->
        <ul class="nav nav-tabs mb-3" role="tablist">
          <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#tab-details">Details</a></li>
          <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-history">Verlauf</a></li>
          <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-invoice">Beleg</a></li>
        </ul>
        <div class="tab-content">
          <div class="tab-pane active show" id="tab-details">
            <div id="modal-body"></div>
          </div>
          <div class="tab-pane" id="tab-history">
            <div id="modal-history"></div>
          </div>
          <div class="tab-pane" id="tab-invoice">
            <div id="modal-invoice" class="text-center text-secondary p-4">Noch kein Beleg vorhanden</div>
          </div>
        </div>
      </div>
      <div class="modal-footer pf-modal-footer">
        <button class="pf-btn pf-btn-danger pf-btn-lg" id="modal-storno-btn" style="display:none" onclick="modalStornoBooking()">Stornieren</button>
        <div style="flex:1"></div>
        <button class="pf-btn pf-btn-neutral" data-bs-dismiss="modal">Schliessen</button>
        <button class="pf-btn pf-btn-primary" id="modal-save-btn" onclick="saveBookingStatus()"><i class="ti ti-device-floppy"></i> Speichern</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/js/tabler.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/design-tokens.js"></script>
<script src="../shared/constants.js"></script>
<script src="../shared/table-utils.js"></script>
<script src="../shared/layout.js"></script>
<script src="../shared/toast.js"></script>
<script src="auth-guard.js"></script>
<script src="../shared/form-dirty.js"></script>
<script src="assets/js/storno-dialog.js"></script>
<script>
  let allBookings = [];
  let editingBookingId = null;
  let tableFilter;

  (async () => {
    const user = await checkAdminAuth();
    if (!user) return;

    document.getElementById('sidebar').innerHTML = renderAdminSidebar('bookings');
    document.getElementById('header').innerHTML = renderAdminHeader('Buchungen', user.email);
    initRealtimeToasts(getSupabase(), 'admin');

    // Reihenfolge wichtig: erst Filter+Sort-Mechanik aufsetzen, DANN Daten laden.
    // Sonst wird beim ersten renderBookings() der tableFilter.apply() uebersprungen
    // und die Filter-Selects bleiben mit nur 'Alle' befuellt (Init-Reihenfolge-Bug,
    // gemeldet 11.05.2026).
    tableFilter = initSortableTable('bookings-table', [
      { key: 'scheduled_date', type: 'date',   getValue: b => b.scheduled_date || '' },
      { key: 'trainer_city',   type: 'select', getValue: b => b.trainer_city || b.city || '\u2013' },
      { key: 'scheduled_time', type: 'select', getValue: b => b.scheduled_time ? b.scheduled_time.slice(0, 5) : '\u2013' },
      { key: 'booking_type',   type: 'select', getValue: b => b.booking_type === 'group' ? 'Gruppentraining' : 'Personal Training' },
      { key: 'trainer_name',   type: 'text',   getValue: b => b.trainer_name || '' },
      { key: 'customer_name',  type: 'text',   getValue: b => b.customer_name || b.customer_id || '' },
      { key: 'status',         type: 'select', getValue: b => b.status || '\u2013' },
      { key: 'einnahmen',      type: 'number', getValue: b => effectivePrice(b) / 100 },
      null,   // Rabatt-Spalte: kein Filter (positions-basierte Zuordnung zu <th>!)
      { key: 'cost',           type: 'number', getValue: b => effectiveCost(b) / 100 },
      { key: 'payment_status', type: 'select', getValue: b => getPaymentLabel(b) },
      null,   // Aktionen-Spalte: kein Filter
    ], {
      // 'Gefilterte löschen'-Knopf entfernt (User-Wunsch 11.05.): war ein Doppel
      // zum Mülleimer pro Zeile und verführerisch gefährlich (Massenlöschung mit
      // einem Klick). Pro-Zeile-Mülleimer bleibt für gezieltes Aufräumen.
      extraButtons: [
        { label: 'CSV Export', icon: 'ti-download', className: 'pf-btn pf-btn-neutral', onClick: 'exportCSV()' },
      ],
      countLabel: 'Buchungen',
      onRowClick: function(rowData) { openDetail(rowData.id); },
    });
    tableFilter.onFilterChange(() => renderBookings());

    await loadBookings();
  })();

  async function loadBookings() {
    try {
      const res = await adminApi('/api/admin?action=data&type=all_bookings');
      allBookings = (res.data || []).slice().sort((a, b) => {
        // alt → neu (aufsteigend nach Datum + Uhrzeit)
        const da = `${a.scheduled_date || ''}T${a.scheduled_time || '00:00'}`;
        const db = `${b.scheduled_date || ''}T${b.scheduled_time || '00:00'}`;
        return da.localeCompare(db);
      });
      renderBookings();
      updateErsatzBadge();
    } catch (err) {
      document.getElementById('bookings-body').innerHTML =
        `<tr><td colspan="12" class="text-error" style="padding:20px">Fehler: ${err.message}</td></tr>`;
    }
  }

  // Ersatztrainer Vorgang 6: Menue-Zaehler (Sidebar „Buchungen" + Header-Glocke)
  // aus den frisch geladenen Buchungen setzen — nutzt die zentrale Funktion in
  // layout.js (setzt Sidebar-Badge + Glocke einheitlich).
  function updateErsatzBadge() {
    const n = allBookings.filter(b => b.flag_ersatz_trainer_gesucht === true).length;
    if (window.pfSetBookingsBadge) window.pfSetBookingsBadge(n);
  }

  function getBookingType(b) {
    if (b.booking_type === 'group') return 'Gruppentraining';
    return 'Personal Training';
  }

  function bookingActions(b) {
    const s = (b.status || '').toUpperCase();
    const id = b.id;
    // View-Button entfernt — Zeilen-Klick oeffnet Details
    const editBtn = `<button class="pf-btn pf-btn-edit" title="Bearbeiten" onclick="event.stopPropagation();openDetail('${id}')"><i class="ti ti-edit"></i> Bearbeiten</button>`;
    const confirmBtn = `<button class="pf-btn pf-btn-primary" title="Bestätigen" onclick="event.stopPropagation();quickStatusChange('${id}',BOOKING_STATUS.CONFIRMED)"><i class="ti ti-check"></i> Bestätigen</button>`;
    const completeBtn = `<button class="pf-btn pf-btn-primary" title="Abschließen" onclick="event.stopPropagation();quickStatusChange('${id}',BOOKING_STATUS.COMPLETED)"><i class="ti ti-circle-check"></i> Abschließen</button>`;
    const deleteBtn = `<button class="pf-btn pf-btn-danger" title="Löschen" onclick="event.stopPropagation();deleteBooking('${id}')"><i class="ti ti-trash"></i> Löschen</button>`;

    // Storno-Button: oeffnet den Storno-Dialog (Stornobeleg + Rueckzahlung + Sorry-Code via
    // cancel-or-refund Edge Function). Frueher gab es zusaetzlich einen 'X'-Schnell-Storno der
    // den Status direkt auf CANCELLED gesetzt hat — der hat den Workflow umgangen und ist
    // entfernt (Bug B-2026-04-25-02). Storno-Button ist der EINZIGE Weg, eine Buchung zu stornieren.
    const custName = (b.customer_name || '').replace(/'/g,"\\'");
    const gross = b.final_price_cents || b.price_cents || 0;
    const excluded = ['FULLY_CANCELLED','CANCELLED','EXPIRED','REJECTED','REFUNDED'];
    const stornoBtn = (!b.storno_invoice_id && !excluded.includes(s))
      ? `<button class="pf-btn pf-btn-danger" title="Stornieren (mit Stornobeleg + Rueckzahlung)" onclick="event.stopPropagation();stornoBooking('${id}','${custName}',${gross})"><i class="ti ti-x"></i> Stornieren</button>`
      : '';

    // Abgeschlossene/unveränderliche Zustände → Bearbeiten + Storno + Löschen
    if (['COMPLETED', 'CANCELLED', 'REFUNDED', 'DISPUTED', 'ESCALATED'].includes(s)) {
      return `<div class="d-flex gap-1">${editBtn} ${stornoBtn} ${deleteBtn}</div>`;
    }
    // EXPIRED → Bearbeiten + Löschen
    if (s === BOOKING_STATUS.EXPIRED.toUpperCase()) {
      return `<div class="d-flex gap-1">${editBtn} ${deleteBtn}</div>`;
    }
    // In Bearbeitung → Stornieren + Löschen
    if (['CHECKED_IN', 'IN_PROGRESS'].includes(s)) {
      return `<div class="d-flex gap-1">${stornoBtn} ${deleteBtn}</div>`;
    }
    // PENDING → Bestätigen + Stornieren + Löschen
    if (s === BOOKING_STATUS.PENDING.toUpperCase()) {
      return `<div class="d-flex gap-1">${confirmBtn} ${stornoBtn} ${deleteBtn}</div>`;
    }
    // CONFIRMED → Abschließen + Stornieren + Löschen
    if (s === BOOKING_STATUS.CONFIRMED.toUpperCase()) {
      return `<div class="d-flex gap-1">${completeBtn} ${stornoBtn} ${deleteBtn}</div>`;
    }
    // Fallback
    return `<div class="d-flex gap-1">${editBtn} ${stornoBtn} ${deleteBtn}</div>`;
  }

  function stornoBooking(bookingId, customerName, grossCents) {
    // GT-Einträge kommen als "gp_<uuid>" — für Edge Function group_participant_id statt booking_id
    if (typeof bookingId === 'string' && bookingId.startsWith('gp_')) {
      const participantId = bookingId.slice(3);
      openStornoDialog({
        kind: 'group_participant',
        id: participantId,
        title: `GT-Teilnahme: ${customerName || 'Kunde'}`,
        grossCents: Number(grossCents),
        onSuccess: () => loadBookings(),
      });
    } else {
      openStornoDialog({
        kind: 'booking',
        id: bookingId,
        title: `PT-Buchung mit ${customerName || 'Kunde'}`,
        grossCents: Number(grossCents),
        onSuccess: () => loadBookings(),
      });
    }
    return false;
  }

  // Modal-Footer-Storno: ruft stornoBooking() fuer die aktuell geoeffnete Buchung auf
  function modalStornoBooking() {
    if (!editingBookingId) return;
    const b = allBookings.find(x => x.id === editingBookingId);
    if (!b) return;
    const custName = (b.customer_name || '').replace(/'/g,"\\'");
    const gross = b.final_price_cents || b.price_cents || 0;
    stornoBooking(b.id, custName, gross);
  }

  // Nutzt CANCELLED_STATUSES aus shared/constants.js (lowercase)
  // effectivePrice/effectiveCost vergleichen mit .toUpperCase(), daher uppercase-Kopie
  const CANCELLED_STATUSES_UC = CANCELLED_STATUSES.map(s => s.toUpperCase());

  function effectivePrice(b) {
    const st = (b.status || '').toUpperCase();
    if (CANCELLED_STATUSES_UC.includes(st)) return 0;
    return b.price_cents || b.final_price_cents || 0;
  }

  function effectiveCost(b) {
    const st = (b.status || '').toUpperCase();
    if (CANCELLED_STATUSES_UC.includes(st)) return 0;
    if (st === 'EXPIRED') return 0; // Trainer bekommt nichts bis Klärung
    // B-2026-05-14-50 Folge: korrekte DB-Spalte ist `trainer_payout_cents`.
    // Aber: Admin-API `enrichBookings` synthetisiert `payout_cents` fuer
    // GT-Teilnahmen (siehe api/admin/index.js Z. 1433). Daher Kompat-Chain:
    // 1) trainer_payout_cents (echte DB-Spalte fuer PT)
    // 2) payout_cents (API-Synthese fuer GT)
    // 3) trainer_rate_cents (Trainer-Profil-Default als Notfall)
    return b.trainer_payout_cents ?? b.payout_cents ?? b.trainer_rate_cents ?? 0;
  }

  function renderBookings() {
    let filtered = tableFilter ? tableFilter.apply(allBookings) : allBookings;
    // Dringende Faelle (laufende Ersatztrainer-Suche) visuell nach oben ziehen —
    // sonst gehen sie unter den 20 Datensaetzen unter (User-Befund 31.05.).
    // Stabile Sortierung: nur Ersatz-Faelle hoch, sonst Reihenfolge unveraendert.
    filtered = filtered.slice().sort((a, b) =>
      (b.flag_ersatz_trainer_gesucht === true ? 1 : 0) - (a.flag_ersatz_trainer_gesucht === true ? 1 : 0));

    const tbody = document.getElementById('bookings-body');
    const tfoot  = document.getElementById('bookings-tfoot');

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="12" class="text-center text-muted" style="padding:24px">Keine Buchungen gefunden</td></tr>';
      tfoot.style.display = 'none';
      return;
    }

    tbody.innerHTML = filtered.map((b, idx) => {
      const price = effectivePrice(b);
      const cost  = effectiveCost(b);
      return `
        <tr class="${isOverdue(b) ? 'row-overdue' : ''}" data-row-index="${idx}">
          <td>${formatDate(b.scheduled_date)}</td>
          <td>${b.trainer_city || b.city || '–'}</td>
          <td>${b.scheduled_time ? b.scheduled_time.slice(0,5) : '–'}</td>
          <td><span class="badge ${b.booking_type === 'group' ? 'badge-paused' : 'badge-pending'}">${getBookingType(b)}</span></td>
          <td>${b.trainer_name || '–'}</td>
          <td>${b.customer_name || b.customer_id || '–'}</td>
          <td>${statusBadge(b.status)}${b.flag_ersatz_trainer_gesucht === true ? ` <span class="badge bg-orange" title="Ersatztrainer wird gesucht" style="margin-left:4px">🔄 Ersatz gesucht</span>` : ''}${isOverdue(b) ? `<span class="badge badge-overdue">${overdueDays(b)}d</span>` : ''}</td>
          <td class="td-amount text-accent">${price > 0 ? formatEuro(price) : '–'}</td>
          <td class="td-amount text-warning">${b.discount_code ? `<span title="${b.discount_code}">-${formatEuro(b.discount_amount_cents || 0)}</span>` : '–'}</td>
          <td class="td-amount text-muted">${cost > 0 ? formatEuro(cost) : '–'}</td>
          <td>${paymentBadge(b)}</td>
          <td>${bookingActions(b)}</td>
        </tr>`;
    }).join('');

    // Summen (nur gefilterte Zeilen)
    const totalPrice = filtered.reduce((s, b) => s + effectivePrice(b), 0);
    const totalCost  = filtered.reduce((s, b) => s + effectiveCost(b), 0);
    tfoot.style.display = '';
    document.getElementById('bookings-sum-label').textContent =
      `${filtered.length} von ${allBookings.length} Buchungen`;
    const totalDiscount = filtered.reduce((s, b) => s + (b.discount_amount_cents || 0), 0);
    document.getElementById('bookings-price-sum').textContent = formatEuro(totalPrice);
    document.getElementById('bookings-discount-sum').textContent = totalDiscount > 0 ? `-${formatEuro(totalDiscount)}` : '–';
    document.getElementById('bookings-cost-sum').textContent  = formatEuro(totalCost);
  }

  // Wenn die Buchung selbst storniert/abgelaufen/abgelehnt ist, kann die Zahlung nicht mehr
  // \u201Eausstehen" \u2014 sie ist entweder erstattet, gar nicht erst erfolgt, oder (selten) noch beim
  // Trainer/Pulsly haengen. Diese Liste deckt sowohl Alt-Kanon als auch neuen 7-Wert-Kanon ab.
  const PAYMENT_LABEL_STORNO_STATUSES = [
    'CANCELLED', 'CANCELLED_BY_TRAINER', 'FULLY_CANCELLED',
    'EXPIRED', 'REJECTED', 'DISPUTED', 'REFUNDED', 'STORNIERT', 'STRITTIG',
  ];

  function getPaymentLabel(b) {
    const ps = (b.payment_status || '').toLowerCase();
    const st = (b.status || '').toUpperCase();
    // Bei stornierter Buchung: nicht \u201EAusstehend" zeigen \u2014 die Zahlung kann nicht mehr ausstehen.
    if (PAYMENT_LABEL_STORNO_STATUSES.includes(st)) {
      if (ps === 'refunded')   return STATUS_LABELS[BOOKING_STATUS.REFUNDED];
      if (b.paid === true)     return 'Bezahlt (nicht erstattet)';
      return 'Keine';
    }
    // Teilspec 2 Task 30: \u201EKarte abgelehnt\u201C als eigener Filter-Wert, damit
    // der Admin im bestehenden Select-Filter \u201EZahlung\u201C direkt darauf filtern
    // kann (Task-30-Step-2 Variante via Quick-Filter-Chip statt extraButtons-
    // Toggle \u2014 Begruendung im Commit-Body).
    if (b.flag_zahlung_offen === true)                                return 'Karte abgelehnt';
    if (ps === 'paid'     || b.paid === true || st === BOOKING_STATUS.COMPLETED.toUpperCase()) return STATUS_LABELS[BOOKING_STATUS.PAID];
    if (ps === 'refunded')                                           return STATUS_LABELS[BOOKING_STATUS.REFUNDED];
    if (ps === 'failed')                                             return 'Fehlgeschlagen';
    if (b.stripe_setup_intent_id && !b.stripe_payment_intent_id)     return 'Karte hinterlegt';
    if (ps === BOOKING_STATUS.PENDING || st === BOOKING_STATUS.CONFIRMED.toUpperCase() || st === BOOKING_STATUS.PENDING.toUpperCase()) return 'Ausstehend';
    return 'Keine';
  }

  function paymentBadge(b) {
    const ps = (b.payment_status || '').toLowerCase();
    const st = (b.status || '').toUpperCase();
    // Bei stornierter Buchung: nicht den orangen \u201EAusstehend"-Hinweis zeigen.
    if (PAYMENT_LABEL_STORNO_STATUSES.includes(st)) {
      if (ps === 'refunded')
        return '<span style="color:#E07A3A;white-space:nowrap">\u21A9\uFE0F Erstattet</span>';
      if (b.paid === true)
        return '<span style="color:#E07A3A;white-space:nowrap">\u26A0\uFE0F Bezahlt (nicht erstattet)</span>';
      return '<span style="color:#55556A;white-space:nowrap">\u2013 Keine</span>';
    }
    // Teilspec 2 Task 30: \u201EKarte abgelehnt\u201C hat Vorrang vor allen anderen Anzeigen
    // \u2014 wenn flag_zahlung_offen gesetzt ist, will der Admin das SOFORT sehen.
    // Hinweis: enrichBookings mappt mapStatusForFrontend; bei flag_zahlung_offen=true
    // wird status zu 'payment_open' \u2014 wir lesen aber direkt das Flag, weil GT-Teilnahmen
    // \u00FCber fetchGroupParticipantsAsBookings das Flag nicht durchreichen und der
    // Frontend-Code-Fluss konsistenter ist, wenn das Flag der prim\u00E4re Indikator bleibt.
    if (b.flag_zahlung_offen === true)
      return '<span style="color:#E74C3C;white-space:nowrap" title="Karte abgelehnt \u2014 Zahlung offen">\u274C Karte abgelehnt</span>';
    if (ps === 'paid'     || b.paid === true || st === BOOKING_STATUS.COMPLETED.toUpperCase())
      return '<span style="color:#27AE60;white-space:nowrap">\u2705 Bezahlt</span>';
    if (ps === 'refunded')
      return '<span style="color:#E07A3A;white-space:nowrap">\u21A9\uFE0F Erstattet</span>';
    if (ps === 'failed')
      return '<span style="color:#E74C3C;white-space:nowrap">\u274C Fehlgeschlagen</span>';
    // Karte hinterlegt (SetupIntent existiert, noch kein PaymentIntent) \u2014 typisch
    // f\u00FCr Buchungen vor dem \u201Eautomatischen Einzug 24h vorher\u201C-Cron.
    if (b.stripe_setup_intent_id && !b.stripe_payment_intent_id)
      return '<span style="color:#7E879F;white-space:nowrap" title="SetupIntent erstellt, noch nicht belastet">\uD83D\uDCB3 Karte hinterlegt</span>';
    if (ps === BOOKING_STATUS.PENDING || st === BOOKING_STATUS.CONFIRMED.toUpperCase() || st === BOOKING_STATUS.PENDING.toUpperCase())
      return '<span style="color:#F39C12;white-space:nowrap">\u23F3 Ausstehend</span>';
    return '<span style="color:#55556A;white-space:nowrap">\u2013 Keine</span>';
  }

  async function quickStatusChange(bookingId, status) {
    // Sicherheits-Sperre (Bug B-2026-04-25-02): Storno-Werte muessen IMMER ueber stornoBooking()
    // laufen — sonst wird der cancel-or-refund-Workflow (Stornobeleg, Rueckerstattung, SORRY-Code,
    // payment_events, booking_audit) umgangen. Quick-Status ist nur fuer CONFIRMED/COMPLETED erlaubt.
    const stornoStatuses = ['CANCELLED', 'CANCELLED_BY_TRAINER', 'FULLY_CANCELLED', 'REJECTED', 'REFUNDED', 'EXPIRED', 'DISPUTED'];
    if (stornoStatuses.includes(String(status).toUpperCase())) {
      showAlert('alert-box', 'Storno bitte ueber den Storno-Button (rotes X) — der oeffnet den Dialog fuer Stornobeleg + Rueckzahlung.', 'error');
      return;
    }
    try {

  async function loadLocationProposals(bookingId) {
    const el = document.getElementById('location-proposals-section');
    if (!el) return;
    try {
      const res = await adminApi(`/api/admin?action=data&type=booking_locations&bookingId=${bookingId}`);
      const proposals = res.data || [];
      if (proposals.length === 0) return;

      const rows = proposals.map(loc => {
        const isSelected = loc.is_selected || loc.selected;
        const isAdmin = loc.source === 'admin' || loc.location_id;
        const typeLabel = isAdmin ? 'Admin-Ort' : 'Benutzerdefiniert';
        const typeBadgeClass = isAdmin ? 'badge-confirmed' : 'badge-pending';
        const selectedMark = isSelected
          ? '<span style="color:#27AE60;font-weight:700;margin-left:6px">&#10003; Gewählt</span>'
          : '';
        const address = [loc.address, loc.city].filter(Boolean).join(', ') || '–';
        return `
          <div style="display:grid;grid-template-columns:1fr auto;align-items:start;gap:8px;padding:10px 12px;border-radius:8px;background:${isSelected ? 'rgba(64,145,108,0.08)' : 'rgba(255,255,255,0.03)'};border:1px solid ${isSelected ? 'rgba(64,145,108,0.3)' : 'rgba(255,255,255,0.07)'};margin-bottom:8px">
            <div>
              <div style="font-weight:600;color:${isSelected ? '#40916C' : 'var(--text-primary)'};margin-bottom:2px">${loc.name || loc.location_name || '–'}${selectedMark}</div>
              <div style="font-size:12px;color:var(--text-secondary)">${address}</div>
            </div>
            <span class="badge ${typeBadgeClass}" style="font-size:11px;white-space:nowrap">${typeLabel}</span>
          </div>`;
      }).join('');

      el.innerHTML = `
        <div style="margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.06)">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:10px">
            Standort-Vorschlaege (${proposals.length})
          </div>
          ${rows}
        </div>`;
    } catch {
      // Fehler still ignorieren – Proposals sind optional
    }
  }

  async function saveBookingStatus() {
    if (!editingBookingId) return;
    const btn = document.getElementById('modal-save-btn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner-border spinner-border-sm"></div>';

    const payload = { bookingId: editingBookingId };

    // Status
    payload.status = document.getElementById('edit-booking-status').value;

    // Termin
    const dateVal = document.getElementById('edit-booking-date').value;
    if (dateVal) payload.scheduled_date = dateVal;
    const timeVal = document.getElementById('edit-booking-time').value;
    if (timeVal) payload.scheduled_time = timeVal;

    // Preise (EUR → Cent)
    const priceVal = document.getElementById('edit-booking-price').value;
    if (priceVal !== '') payload.price_cents = Math.round(parseFloat(priceVal) * 100);
    const finalVal = document.getElementById('edit-booking-final-price').value;
    if (finalVal !== '') payload.final_price_cents = Math.round(parseFloat(finalVal) * 100);
    const payoutVal = document.getElementById('edit-booking-payout').value;
    if (payoutVal !== '') payload.trainer_payout_cents = Math.round(parseFloat(payoutVal) * 100);

    // Admin-Notiz
    const note = document.getElementById('edit-booking-admin-note').value.trim();
    if (note) payload.admin_note = note;

    try {
      await adminApi('/api/admin?action=bookings', {
        method: 'PUT',
        body: JSON.stringify(payload),
      });
      if (window._bookingDirty) window._bookingDirty.reset();
      closeModal();
      showAlert('alert-box', 'Buchung aktualisiert!', 'success');
      await loadBookings();
    } catch (err) {
      showAlert('alert-box', 'Fehler: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Speichern';
    }
  }

  async function deleteBooking(id) {
    if (!confirm('Buchung wirklich endgültig löschen?')) return;
    try {
      await adminApi('/api/admin?action=bookings', {
        method: 'DELETE',
        body: JSON.stringify({ bookingIds: [id] }),
      });
      showAlert('alert-box', 'Buchung gelöscht.', 'success');
      await loadBookings();
    } catch (err) {
      // Server liefert bei vorhersehbaren Konflikten (z.B. Tagebuch, Rechnung) bereits
      // einen vollstaendigen deutschen Erklaer-Text — dann nicht zusaetzlich
      // 'Loeschen fehlgeschlagen:' davor setzen, das wirkt sonst doppelt.
      const msg = (err && err.message) || 'Unbekannter Fehler';
      const isFriendlyText = /\b(stornier|tagebuch|stornobeleg|finanzamt|rechnung)\b/i.test(msg);
      alert(isFriendlyText ? msg : ('Löschen fehlgeschlagen: ' + msg));
    }
  }

  async function deleteAllFiltered() {
    const filtered = tableFilter ? tableFilter.apply(allBookings) : allBookings;
    if (filtered.length === 0) return;
    if (!confirm(`${filtered.length} gefilterte Buchung(en) endgültig löschen? Diese Aktion kann nicht rückgängig gemacht werden!`)) return;
    try {
      const ids = filtered.map(b => b.id);
      await adminApi('/api/admin?action=bookings', {
        method: 'DELETE',
        body: JSON.stringify({ bookingIds: ids }),
      });
      showAlert('alert-box', `${ids.length} Buchung(en) gelöscht.`, 'success');
      await loadBookings();
    } catch (err) {
      const msg = (err && err.message) || 'Unbekannter Fehler';
      const isFriendlyText = /\b(stornier|tagebuch|stornobeleg|finanzamt|rechnung)\b/i.test(msg);
      alert(isFriendlyText ? msg : ('Löschen fehlgeschlagen: ' + msg));
    }
  }

  function exportCSV() {
    if (allBookings.length === 0) return;
    const filtered = tableFilter ? tableFilter.apply(allBookings) : allBookings;
    const headers = ['Datum','Ort','Uhrzeit','Art','Trainer','Kunde','Status','Einnahmen','Rabatt','Rabattcode','Kosten','Zahlung'];
    const rows = filtered.map(b => [
      b.scheduled_date || '',
      b.trainer_city || b.city || '',
      b.scheduled_time ? b.scheduled_time.slice(0,5) : '',
      getBookingType(b),
      b.trainer_name || '',
      b.customer_name || b.customer_id || '',
      b.status || '',
      (effectivePrice(b) / 100).toFixed(2),
      ((b.discount_amount_cents || 0) / 100).toFixed(2),
      b.discount_code || '',
      (effectiveCost(b) / 100).toFixed(2),
      getPaymentLabel(b),
    ]);
    const csv = [headers, ...rows].map(r => r.map(c => '"' + String(c).replace(/"/g,'""') + '"').join(';')).join('\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'buchungen_export_' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
  }

  }

  // Status-Code zu Klartext-Label (greift auf shared/constants.js STATUS_LABELS zu)
  function auditStatusLabel(code) {
    if (!code) return '';
    if (typeof STATUS_LABELS !== 'undefined' && STATUS_LABELS[code]) return STATUS_LABELS[code];
    return code;
  }

  // Details-JSON in Klartext-Saetze umformen, je nach Aktion
  function formatAuditDetails(kind, action, details) {
    if (!details || typeof details !== 'object') return '';
    const d = details;
    const parts = [];
    const eur = c => (c == null ? null : formatEuro(c));

    if (kind === 'booking') {
      if (action === 'migrated_to_new_status_kanon') {
        if (d.new_status) parts.push('Neuer Status: <strong>' + auditEscape(auditStatusLabel(d.new_status)) + '</strong>');
        if (d.old_status) parts.push('vorher: ' + auditEscape(auditStatusLabel(d.old_status)));
        // Migrations-Phase nicht mehr anzeigen — interne Info, hilft dem Admin nicht
      } else if (action === 'created') {
        if (d.art === 'pt_einzel') parts.push('Personal Training');
        else if (d.art === 'gt_teilnahme') parts.push('Gruppentraining');
        if (d.scheduled_date) parts.push('Termin: ' + auditEscape(d.scheduled_date) + (d.scheduled_time ? ' ' + auditEscape(d.scheduled_time) : ''));
        if (d.price_cents != null) parts.push('Preis: ' + auditEscape(eur(d.price_cents)));
        if (d.discount_code) parts.push('Rabatt-Code: ' + auditEscape(d.discount_code));
      } else if (action === 'cancelled') {
        if (d.storno_wer) parts.push('Veranlasst durch: ' + auditEscape(AUDIT_ACTORS[d.storno_wer] || d.storno_wer));
        if (d.storno_grund) parts.push('Grund: ' + auditEscape(d.storno_grund));
        if (d.refund_cents != null) parts.push('Rueckerstattung: ' + auditEscape(eur(d.refund_cents)));
      } else if (action === 'escalated') {
        if (d.reason || d.grund) parts.push('Grund: ' + auditEscape(d.reason || d.grund));
      } else if (action === 'rescheduled') {
        if (d.old_date) parts.push('alt: ' + auditEscape(d.old_date) + (d.old_time ? ' ' + auditEscape(d.old_time) : ''));
        if (d.new_date) parts.push('neu: ' + auditEscape(d.new_date) + (d.new_time ? ' ' + auditEscape(d.new_time) : ''));
      } else if (action === 'location_changed') {
        if (d.old_location) parts.push('alt: ' + auditEscape(d.old_location));
        if (d.new_location) parts.push('neu: ' + auditEscape(d.new_location));
      } else if (action === 'storno_invoice_created') {
        const ref = d.invoice_number || d.storno_ref || d.invoice_id;
        if (ref) parts.push('Stornobeleg: <strong>' + auditEscape(ref) + '</strong>');
        if (d.refund_cents != null) parts.push('Betrag: ' + auditEscape(eur(d.refund_cents)));
      } else if (action === 'sorry_code_issued' || action === 'sorry_code_released') {
        if (d.code) parts.push('Code: <strong>' + auditEscape(d.code) + '</strong>');
        if (d.discount_percent != null) parts.push(auditEscape(d.discount_percent) + ' % Rabatt');
      } else if (action === 'replacement_trainer_assigned') {
        if (d.new_trainer_id) parts.push('Neuer Trainer: ' + auditEscape(String(d.new_trainer_id).slice(0, 8)) + '…');
        if (d.old_trainer_id) parts.push('(vorher: ' + auditEscape(String(d.old_trainer_id).slice(0, 8)) + '…)');
      } else if (action === 'check_in' || action === 'check_out') {
        if (d.at) parts.push('Zeitpunkt: ' + auditEscape(formatDateTime(d.at)));
      }
    } else if (kind === 'payment') {
      if (d.reason) parts.push('Grund: ' + auditEscape(d.reason));
      if (d.failure_message) parts.push('Fehler: ' + auditEscape(d.failure_message));
      if (d.refund_id) parts.push('Refund-ID: <code style="font-size:11px">' + auditEscape(d.refund_id) + '</code>');
      if (d.payment_intent_id) parts.push('PaymentIntent: <code style="font-size:11px">' + auditEscape(d.payment_intent_id) + '</code>');
      if (d.transfer_id) parts.push('Transfer: <code style="font-size:11px">' + auditEscape(d.transfer_id) + '</code>');
    } else if (kind === 'invoice') {
      if (d.invoice_number) parts.push('Rechnungs-Nr: <strong>' + auditEscape(d.invoice_number) + '</strong>');
      if (d.total_cents != null) parts.push('Summe: ' + auditEscape(eur(d.total_cents)));
      if (d.recipient_email) parts.push('an: ' + auditEscape(d.recipient_email));
      if (d.field) parts.push('Geaendertes Feld: ' + auditEscape(d.field));
      if (d.blocked_reason) parts.push('Block-Grund: ' + auditEscape(d.blocked_reason));
    } else if (kind === 'cash') {
      // cash_payment_audit-Detail-Felder (Spalten + details-jsonb)
      if (d.pulsly_anteil_cents != null) parts.push('Pulsly-Anteil: ' + auditEscape(eur(d.pulsly_anteil_cents)));
      if (d.trainer_anteil_cents != null) parts.push('Trainer-Anteil: ' + auditEscape(eur(d.trainer_anteil_cents)));
      if (d.admin_override === true) parts.push('Admin-Override');
      if (d.note) parts.push('Notiz: ' + auditEscape(d.note));
      if (d.reason) parts.push('Grund: ' + auditEscape(d.reason));
    }

    return parts.join(' · ');
  }

  function renderAuditEntry(e) {
    let map = null, kindLabel = '';
    if (e.kind === 'booking') { map = AUDIT_BOOKING_ACTIONS; kindLabel = 'Buchung'; }
    if (e.kind === 'payment') { map = AUDIT_PAYMENT_ACTIONS; kindLabel = 'Zahlung'; }
    if (e.kind === 'invoice') { map = AUDIT_INVOICE_ACTIONS; kindLabel = 'Rechnung'; }
    if (e.kind === 'cash')    { map = AUDIT_CASH_ACTIONS;    kindLabel = 'Bar-Zahlung'; }
    const meta = (map && map[e.action]) || { icon: '•', label: e.action || '(unbekannte Aktion)' };
    const actor = AUDIT_ACTORS[e.actor_type] || (e.actor_type || 'unbekannt');

    let context = '';
    if (e.kind === 'payment') {
      if (e.amount_cents != null) context += ' · ' + auditEscape(formatEuro(e.amount_cents));
      if (e.stripe_object_id) context += ' · <code style="font-size:11px">' + auditEscape(e.stripe_object_id) + '</code>';
    } else if (e.kind === 'invoice' && e.invoice_label) {
      context += ' · <strong>' + auditEscape(e.invoice_label) + '</strong>';
    } else if (e.kind === 'cash') {
      if (e.amount_cents != null) context += ' · ' + auditEscape(formatEuro(e.amount_cents));
    }

    // Klartext-Zusammenfassung der Details (immer sichtbar)
    const klartext = formatAuditDetails(e.kind, e.action, e.details);
    const klartextHtml = klartext
      ? '<div class="text-secondary mt-1" style="font-size:12px">' + klartext + '</div>'
      : '';

    // Roh-JSON nur fuer Tech-Pruefung, eingeklappt + kleiner Schriftgrad.
    // Bei synthetischen Eintraegen (rekonstruiert aus Buchungs-Spalten) entfaellt der Toggle,
    // weil die Roh-Felder identisch sind zur Klartext-Zusammenfassung.
    let rohHtml = '';
    if (!e.synthetic && e.details && typeof e.details === 'object' && Object.keys(e.details).length > 0) {
      const detailJson = JSON.stringify(e.details, null, 2);
      rohHtml = '<details class="mt-1"><summary class="text-secondary" style="cursor:pointer;font-size:10px;opacity:0.7">Roh-Daten anzeigen</summary>'
        + '<pre style="font-size:10px;margin:4px 0 0 0;white-space:pre-wrap;word-break:break-word;opacity:0.7">' + auditEscape(detailJson) + '</pre>'
        + '</details>';
    }

    // Bei Buchungs-Eintraegen ist der kindLabel ("Buchung") redundant — der Kontext ist klar.
    // Bei Zahlung/Rechnung zeigt der kindLabel, woher der Eintrag stammt, das hilft.
    const actorSuffix = (e.kind === 'booking')
      ? ' <span class="text-secondary" style="font-size:12px">durch ' + auditEscape(actor) + '</span>'
      : ' <span class="text-secondary" style="font-size:12px">(' + auditEscape(kindLabel) + ' · ' + auditEscape(actor) + ')</span>';

    return '<div class="d-flex gap-3 mb-3">'
      + '<div class="text-secondary" style="font-size:12px;min-width:130px">' + auditEscape(formatDateTime(e.at)) + '</div>'
      + '<div style="flex:1">'
      +   '<span style="margin-right:6px">' + meta.icon + '</span>'
      +   '<strong>' + auditEscape(meta.label) + '</strong>'
      +   actorSuffix
      +   context
      +   klartextHtml
      +   rohHtml
      + '</div>'
      + '</div>';
  }

  // Aktionen die NICHT ins Logbuch fuer den Admin gehoeren (reine Daten-Pflege)
  const AUDIT_HIDDEN_BOOKING_ACTIONS = new Set([
    'migrated_to_new_status_kanon',
  ]);
  const AUDIT_HIDDEN_INVOICE_ACTIONS = new Set([
    'pdf_regenerated',
    'admin_viewed',
    'export_included',
    'anonymized',
    'admin_override_update',
  ]);

  // Legacy-Status-Werte die als 'Storniert' interpretiert werden — fuer alte Buchungen
  // ohne booking_audit-Eintrag rekonstruieren wir den Stornierungs-Eintrag aus den
  // Buchungs-Spalten.
  const AUDIT_STORNO_LEGACY_STATUSES = new Set([
    'cancelled', 'cancelled_by_trainer', 'fully_cancelled',
    'rejected', 'refunded', 'storniert',
  ]);

  // Synthetische Eintraege aus der Buchung selbst — fuer alte Buchungen wo keine
  // booking_audit-Eintraege existieren (Tabelle wurde erst am 25.04.2026 eingerichtet).
  // Werden mit `synthetic: true` markiert, damit der Roh-JSON-Toggle entfaellt.
  function buildSyntheticEntries(b) {
    const items = [];

    // Eintrag 1: Buchung erstellt (immer, weil b.created_at existiert)
    if (b.created_at) {
      items.push({
        kind: 'booking',
        synthetic: true,
        at: b.created_at,
        actor_type: 'customer',
        action: 'created',
        details: {
          art: b.booking_type === 'group' ? 'gt_teilnahme' : 'pt_einzel',
          scheduled_date: b.scheduled_date || null,
          scheduled_time: b.scheduled_time || null,
          price_cents: (b.final_price_cents != null ? b.final_price_cents : b.price_cents) || null,
        },
      });
    }

    // Eintrag 2 (nur wenn die Buchung storniert ist): Storniert
    if (AUDIT_STORNO_LEGACY_STATUSES.has(b.status)) {
      items.push({
        kind: 'booking',
        synthetic: true,
        at: b.updated_at || b.created_at,
        actor_type: b.storno_wer || 'system',
        action: 'cancelled',
        details: {
          storno_wer: b.storno_wer || null,
          storno_grund: b.storno_grund || null,
        },
      });
    }

    return items;
  }

  async function renderHistory(b) {
    const el = document.getElementById('modal-history');
    if (!el) return;
    el.innerHTML = '<div class="text-muted p-3">Logbuch wird geladen ...</div>';

    let auditEvents = [];
    let loadError = null;
    try {
      const resp = await adminApi('/api/admin?action=data&type=booking_audit_log&booking_id=' + encodeURIComponent(b.id));
      auditEvents = (resp && resp.data) || [];
    } catch (e) {
      loadError = (e && e.message) || String(e || 'unbekannter Fehler');
    }

    // Interne Daten-Pflege-Eintraege rausfiltern
    auditEvents = auditEvents.filter(e => {
      if (e.kind === 'booking' && AUDIT_HIDDEN_BOOKING_ACTIONS.has(e.action)) return false;
      if (e.kind === 'invoice' && AUDIT_HIDDEN_INVOICE_ACTIONS.has(e.action)) return false;
      return true;
    });

    // Synthetische Eintraege aus der Buchung selbst — nur wo noch kein echter
    // booking_audit-Eintrag mit gleicher action existiert (Dedup)
    const realBookingActions = new Set(auditEvents.filter(e => e.kind === 'booking').map(e => e.action));
    const synthEntries = buildSyntheticEntries(b).filter(s => !realBookingActions.has(s.action));

    const events = [...auditEvents, ...synthEntries].sort((a, b) => (b.at || '').localeCompare(a.at || ''));

    if (loadError) {
      el.innerHTML = '<div class="text-warning p-3">Logbuch konnte nicht geladen werden: '
        + auditEscape(loadError) + '</div>';
      return;
    }

    if (!events.length) {
      el.innerHTML = '<div class="text-muted p-3">Keine Logbuch-Eintraege fuer diese Buchung.</div>';
      return;
    }

    el.innerHTML = '<div class="timeline">' + events.map(renderAuditEntry).join('') + '</div>';
  }

  function closeModal() {
    if (window._bookingDirty && window._bookingDirty.isDirty()) {
      window._bookingDirty.confirmDiscard(function () {
        window._bookingDirty = null;
        editingBookingId = null;
        bootstrap.Modal.getInstance(document.getElementById('detail-modal')).hide();
      });
      return;
    }
    if (window._bookingDirty) { window._bookingDirty.destroy(); window._bookingDirty = null; }
    const modal = bootstrap.Modal.getInstance(document.getElementById('detail-modal'));
    if (modal) modal.hide();
    editingBookingId = null;
  }

  // ─── Ersatztrainer zuweisen ──────────────────────────────────────────────
  async function loadReplacementTrainers(booking) {
    const sel = document.getElementById('edit-booking-trainer');
    if (!sel) return;
    try {
      const resp = await adminApi('/api/admin?action=data&type=calendar_trainers');
      var trainers = (resp.data || []).filter(function(t) {
        return t.id !== booking.trainer_id;
      });
      trainers.forEach(function(t) {
        var opt = document.createElement('option');
        opt.value = t.id;
        opt.textContent = t.full_name + (t.city ? ' (' + t.city + ')' : '');
        sel.appendChild(opt);
      });
    } catch(e) { console.error('Trainer laden:', e); }
  }

  async function assignReplacementTrainer() {
    var sel = document.getElementById('edit-booking-trainer');
    var newTrainerId = sel ? sel.value : null;
    if (!newTrainerId || !editingBookingId) return;

    var b = allBookings.find(function(x) { return x.id === editingBookingId; });
    if (!b) return;

    // Absage: Kein Trainer verfuegbar
    if (newTrainerId === '__cancel__') {
      if (!confirm('Buchung endgueltig absagen? Der Kunde wird informiert.')) return;
      try {
        await adminApi('/api/admin?action=bookings', {
          method: 'PUT',
          body: JSON.stringify({
            bookingId: editingBookingId,
            status: 'fully_cancelled',
            admin_note: 'Kein Ersatztrainer verfuegbar – Buchung abgesagt'
          }),
        });
        showAlert('alert-box', 'Buchung abgesagt. Kunde wird informiert.', 'success');
        bootstrap.Modal.getInstance(document.getElementById('detail-modal')).hide();
        await loadBookings();
      } catch(e) {
        alert('Fehler: ' + e.message);
      }
      return;
    }

    if (newTrainerId === b.trainer_id) {
      alert('Bitte einen anderen Trainer auswaehlen.');
      return;
    }

    try {
      await adminApi('/api/admin?action=bookings', {
        method: 'PUT',
        body: JSON.stringify({
          bookingId: editingBookingId,
          status: 'replacement_pending',
          trainer_id: newTrainerId,
          admin_note: 'Ersatztrainer zugewiesen'
        }),
      });
      showAlert('alert-box', 'Ersatztrainer zugewiesen! Status: Warte auf Bestaetigung.', 'success');
      bootstrap.Modal.getInstance(document.getElementById('detail-modal')).hide();
      await loadBookings();
    } catch(e) {
      alert('Fehler: ' + e.message);
    }
  }
</script>
