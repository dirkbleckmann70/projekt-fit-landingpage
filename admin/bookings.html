<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buchungen – Projekt Fit Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="../shared/tabler-custom.css">
  <link rel="stylesheet" href="../shared/table-utils.css">
</head>
<body class="page">
<script src="../shared/theme.js"></script>

<div id="sidebar"></div>

<div class="page-wrapper">
  <div class="page-header d-print-none" id="header"></div>
  <div class="page-body">
    <div class="container-xl">

      <div id="alert-box" class="alert"></div>

      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h3 class="card-title">Alle Buchungen</h3>
          <div class="table-actions"></div>
        </div>
        <div class="table-responsive">
          <table class="table table-vcenter card-table" id="bookings-table">
            <thead>
              <tr id="bookings-tfoot" style="display:none;border-bottom:1px solid rgba(255,255,255,0.1);font-size:12px;color:var(--text-secondary)">
                <td colspan="7" style="padding:6px 12px;text-align:right;font-style:italic" id="bookings-count-cell"></td>
                <td style="padding:6px 12px" class="text-accent" id="bookings-price-sum"></td>
                <td style="padding:6px 12px" class="text-muted"  id="bookings-cost-sum"></td>
                <td colspan="2"></td>
              </tr>
              <tr>
                <th>Datum</th>
                <th>Ort</th>
                <th>Uhrzeit</th>
                <th>Art</th>
                <th>Trainer</th>
                <th>Kunde</th>
                <th>Status</th>
                <th>Einnahmen</th>
                <th>Kosten</th>
                <th>Zahlung</th>
                <th>Aktionen</th>
              </tr>
            </thead>
            <tbody id="bookings-body">
              <tr><td colspan="11" class="loading-overlay"><div class="spinner-border spinner-border-sm"></div> Buchungen werden geladen...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Booking Detail Modal -->
<div class="modal modal-blur fade" id="detail-modal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Buchungs-Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button class="btn btn-ghost-secondary" data-bs-dismiss="modal">Schließen</button>
        <button class="btn btn-primary" id="modal-save-btn" onclick="saveBookingStatus()">Speichern</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/js/tabler.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/constants.js"></script>
<script src="../shared/table-utils.js"></script>
<script src="../shared/layout.js"></script>
<script src="../shared/toast.js"></script>
<script src="auth-guard.js"></script>
<script src="../shared/form-dirty.js"></script>
<script>
  let allBookings = [];
  let editingBookingId = null;
  let tableFilter;

  (async () => {
    const user = await checkAdminAuth();
    if (!user) return;

    document.getElementById('sidebar').innerHTML = renderAdminSidebar('bookings');
    document.getElementById('header').innerHTML = renderAdminHeader('Buchungen', user.email);
    initRealtimeToasts(getSupabase(), 'admin');

    await loadBookings();

    tableFilter = initSortableTable('bookings-table', [
      { key: 'scheduled_date', type: 'date',   getValue: b => b.scheduled_date || '' },
      { key: 'trainer_city',   type: 'select', getValue: b => b.trainer_city || b.city || '\u2013' },
      { key: 'scheduled_time', type: 'select', getValue: b => b.scheduled_time ? b.scheduled_time.slice(0, 5) : '\u2013' },
      { key: 'booking_type',   type: 'select', getValue: b => b.booking_type === 'group' ? 'Gruppentraining' : 'Personal Training' },
      { key: 'trainer_name',   type: 'text',   getValue: b => b.trainer_name || '' },
      { key: 'customer_name',  type: 'text',   getValue: b => b.customer_name || b.customer_id || '' },
      { key: 'status',         type: 'select', getValue: b => b.status || '\u2013' },
      { key: 'einnahmen',      type: 'number', getValue: b => effectivePrice(b) / 100 },
      { key: 'cost',           type: 'number', getValue: b => effectiveCost(b) / 100 },
      { key: 'payment_status', type: 'select', getValue: b => getPaymentLabel(b) },
      null,
    ]);
    tableFilter.onFilterChange(() => renderBookings());
  })();

  async function loadBookings() {
    try {
      const res = await adminApi('/api/admin?action=data&type=all_bookings');
      allBookings = res.data || [];
      renderBookings();
    } catch (err) {
      document.getElementById('bookings-body').innerHTML =
        `<tr><td colspan="11" class="text-error" style="padding:20px">Fehler: ${err.message}</td></tr>`;
    }
  }

  function getBookingType(b) {
    if (b.booking_type === 'group') return 'Gruppentraining';
    return 'Personal Training';
  }

  function bookingActions(b) {
    const s = (b.status || '').toUpperCase();
    const id = b.id;
    const detailBtn = `<button class="btn btn-secondary btn-sm" onclick="openDetail('${id}')">Details</button>`;

    // Abgeschlossene/unveränderliche Zustände → nur Details
    if (['COMPLETED', 'CANCELLED', 'REFUNDED', 'DISPUTED', 'ESCALATED'].includes(s)) {
      return detailBtn;
    }
    // EXPIRED → Details + Klären
    if (s === BOOKING_STATUS.EXPIRED.toUpperCase()) {
      return `${detailBtn} <button class="btn btn-ghost-secondary btn-sm" style="color:#f39c12;border-color:rgba(243,156,18,0.4)" onclick="openDetail('${id}')">Klären</button>`;
    }
    // In Bearbeitung → nur Details
    if (['CHECKED_IN', 'IN_PROGRESS'].includes(s)) {
      return detailBtn;
    }
    // PENDING → Details + Bestätigen + Stornieren
    if (s === BOOKING_STATUS.PENDING.toUpperCase()) {
      return `
        ${detailBtn}
        <button class="btn btn-success btn-sm" onclick="quickStatusChange('${id}',BOOKING_STATUS.CONFIRMED)">Bestätigen</button>
        <button class="btn btn-danger btn-sm"  onclick="quickStatusChange('${id}',BOOKING_STATUS.CANCELLED)">Stornieren</button>`;
    }
    // CONFIRMED → Details + Abschließen + Stornieren
    if (s === BOOKING_STATUS.CONFIRMED.toUpperCase()) {
      return `
        ${detailBtn}
        <button class="btn btn-success btn-sm" onclick="quickStatusChange('${id}',BOOKING_STATUS.COMPLETED)">Abschließen</button>
        <button class="btn btn-danger btn-sm"  onclick="quickStatusChange('${id}',BOOKING_STATUS.CANCELLED)">Stornieren</button>`;
    }
    // Fallback
    return detailBtn;
  }

  // Nutzt CANCELLED_STATUSES aus shared/constants.js (lowercase)
  // effectivePrice/effectiveCost vergleichen mit .toUpperCase(), daher uppercase-Kopie
  const CANCELLED_STATUSES_UC = CANCELLED_STATUSES.map(s => s.toUpperCase());

  function effectivePrice(b) {
    const st = (b.status || '').toUpperCase();
    if (CANCELLED_STATUSES_UC.includes(st)) return 0;
    return b.price_cents || b.final_price_cents || 0;
  }

  function effectiveCost(b) {
    const st = (b.status || '').toUpperCase();
    if (CANCELLED_STATUSES_UC.includes(st)) return 0;
    if (st === 'EXPIRED') return 0; // Trainer bekommt nichts bis Klärung
    // Buchungseigenes Feld bevorzugen, sonst Trainer-Rate aus trainer_profiles
    return b.payout_cents || b.trainer_cost_cents || b.cost_cents || b.trainer_rate_cents || 0;
  }

  function renderBookings() {
    let filtered = tableFilter ? tableFilter.apply(allBookings) : allBookings;

    const tbody = document.getElementById('bookings-body');
    const tfoot  = document.getElementById('bookings-tfoot');

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="11" class="text-center text-muted" style="padding:24px">Keine Buchungen gefunden</td></tr>';
      tfoot.style.display = 'none';
      return;
    }

    tbody.innerHTML = filtered.map(b => {
      const price = effectivePrice(b);
      const cost  = effectiveCost(b);
      return `
        <tr class="${isOverdue(b) ? 'row-overdue' : ''}">
          <td>${formatDate(b.scheduled_date)}</td>
          <td>${b.trainer_city || b.city || '–'}</td>
          <td>${b.scheduled_time ? b.scheduled_time.slice(0,5) : '–'}</td>
          <td><span class="badge ${b.booking_type === 'group' ? 'badge-paused' : 'badge-pending'}">${getBookingType(b)}</span></td>
          <td>${b.trainer_name || '–'}</td>
          <td>${b.customer_name || b.customer_id || '–'}</td>
          <td>${statusBadge(b.status)}${isOverdue(b) ? `<span class="badge badge-overdue">${overdueDays(b)}d überfällig</span>` : ''}</td>
          <td class="text-accent">${price > 0 ? formatEuro(price) : '–'}</td>
          <td class="text-muted">${cost > 0 ? formatEuro(cost) : '–'}</td>
          <td>${paymentBadge(b)}</td>
          <td>
            <div class="action-cell">
              ${bookingActions(b)}
            </div>
          </td>
        </tr>`;
    }).join('');

    // Summen (nur gefilterte Zeilen)
    const totalPrice = filtered.reduce((s, b) => s + effectivePrice(b), 0);
    const totalCost  = filtered.reduce((s, b) => s + effectiveCost(b), 0);
    tfoot.style.display = '';
    document.getElementById('bookings-count-cell').textContent =
      `${filtered.length} von ${allBookings.length} Buchungen`;
    document.getElementById('bookings-price-sum').textContent = formatEuro(totalPrice);
    document.getElementById('bookings-cost-sum').textContent  = formatEuro(totalCost);
  }

  function getPaymentLabel(b) {
    const ps = (b.payment_status || '').toLowerCase();
    const st = (b.status || '').toUpperCase();
    if (ps === 'paid'     || b.paid === true || st === BOOKING_STATUS.COMPLETED.toUpperCase()) return STATUS_LABELS[BOOKING_STATUS.PAID];
    if (ps === BOOKING_STATUS.REFUNDED)                              return STATUS_LABELS[BOOKING_STATUS.REFUNDED];
    if (ps === 'failed')                                             return 'Fehlgeschlagen';
    if (ps === BOOKING_STATUS.PENDING || st === BOOKING_STATUS.CONFIRMED.toUpperCase() || st === BOOKING_STATUS.PENDING.toUpperCase()) return 'Ausstehend';
    return 'Keine';
  }

  function paymentBadge(b) {
    const ps = (b.payment_status || '').toLowerCase();
    const st = (b.status || '').toUpperCase();
    if (ps === 'paid'     || b.paid === true || st === BOOKING_STATUS.COMPLETED.toUpperCase())
      return '<span style="color:#27AE60;white-space:nowrap">\u2705 Bezahlt</span>';
    if (ps === BOOKING_STATUS.REFUNDED)
      return '<span style="color:#E07A3A;white-space:nowrap">\u21A9\uFE0F Erstattet</span>';
    if (ps === 'failed')
      return '<span style="color:#E74C3C;white-space:nowrap">\u274C Fehlgeschlagen</span>';
    if (ps === BOOKING_STATUS.PENDING || st === BOOKING_STATUS.CONFIRMED.toUpperCase() || st === BOOKING_STATUS.PENDING.toUpperCase())
      return '<span style="color:#F39C12;white-space:nowrap">\u23F3 Ausstehend</span>';
    return '<span style="color:#55556A;white-space:nowrap">\u2013 Keine</span>';
  }

  async function quickStatusChange(bookingId, status) {
    try {
      await adminApi('/api/admin?action=bookings', {
        method: 'PUT',
        body: JSON.stringify({ bookingId, status }),
      });
      // Update local data
      const b = allBookings.find(x => x.id === bookingId);
      if (b) b.status = status;
    } catch (err) {
      showAlert('alert-box', 'Fehler: ' + err.message, 'error');
      await loadBookings();
    }
  }

  function openDetail(id) {
    const b = allBookings.find(x => x.id === id);
    if (!b) return;
    editingBookingId = id;

    document.getElementById('modal-body').innerHTML = `
      <form id="booking-detail-form">
      <div class="two-col">
        <div class="form-group">
          <label>Kunde</label>
          <input class="form-control" value="${b.customer_name || b.customer_id || '–'}" disabled>
        </div>
        <div class="form-group">
          <label>Trainer</label>
          <input class="form-control" value="${b.trainer_name || '–'}" disabled>
        </div>
      </div>
      <div class="two-col">
        <div class="form-group">
          <label>Datum</label>
          <input class="form-control" type="date" id="edit-booking-date" value="${b.scheduled_date || ''}">
        </div>
        <div class="form-group">
          <label>Uhrzeit</label>
          <input class="form-control" type="time" id="edit-booking-time" value="${b.scheduled_time ? b.scheduled_time.slice(0,5) : ''}">
        </div>
      </div>
      ${b.proposed_date ? `<div class="two-col" style="background:rgba(244,169,64,0.08);border:1px solid rgba(244,169,64,0.25);border-radius:10px;padding:12px;margin-bottom:12px">
        <div class="form-group" style="margin:0">
          <label style="color:#F4A940">Vorgeschlagenes Datum</label>
          <input class="form-control" value="${formatDate(b.proposed_date)}" disabled style="color:#F4A940;font-weight:700">
        </div>
        <div class="form-group" style="margin:0">
          <label style="color:#F4A940">Vorgeschlagene Uhrzeit</label>
          <input class="form-control" value="${b.proposed_time ? b.proposed_time.slice(0,5) + ' Uhr' : '–'}" disabled style="color:#F4A940;font-weight:700">
        </div>
      </div>` : ''}
      <div class="two-col">
        <div class="form-group">
          <label>Ort</label>
          <input class="form-control" value="${b.location_name || b.location || '–'}" disabled>
        </div>
        <div class="form-group">
          <label>Art</label>
          <input class="form-control" value="${getBookingType(b)}" disabled>
        </div>
      </div>
      <div class="two-col">
        <div class="form-group">
          <label>Kundenpreis (EUR)</label>
          <input class="form-control" type="number" step="0.01" min="0" id="edit-booking-price" value="${b.price_cents ? (b.price_cents / 100).toFixed(2) : '0.00'}">
        </div>
        <div class="form-group">
          <label>Endpreis (EUR)</label>
          <input class="form-control" type="number" step="0.01" min="0" id="edit-booking-final-price" value="${(b.final_price_cents || b.price_cents) ? ((b.final_price_cents || b.price_cents) / 100).toFixed(2) : '0.00'}">
        </div>
      </div>
      <div class="two-col">
        <div class="form-group">
          <label>Trainer-Verguetung (EUR)</label>
          <input class="form-control" type="number" step="0.01" min="0" id="edit-booking-payout" value="${b.trainer_payout_cents ? (b.trainer_payout_cents / 100).toFixed(2) : '0.00'}">
        </div>
        <div class="form-group">
          <label>Zahlung</label>
          <input class="form-control" value="${getPaymentLabel(b)}" disabled>
        </div>
      </div>
      <div class="two-col">
        <div class="form-group">
          <label>Rabattcode</label>
          <input class="form-control" value="${b.discount_code || '–'}" disabled>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select class="form-control" id="edit-booking-status">
            ${ADMIN_EDITABLE_STATUSES.map(s =>
              `<option value="${s}" ${b.status === s ? 'selected' : ''}>${STATUS_LABELS[s] || s}</option>`
            ).join('')}
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Admin-Notiz (optional, wird als Audit-Log gespeichert)</label>
        <input class="form-control" id="edit-booking-admin-note" placeholder="Grund fuer Aenderung...">
      </div>
      ${b.notes ? `<div class="form-group"><label>Bisherige Notizen</label><textarea class="form-control" disabled style="min-height:60px">${b.notes}</textarea></div>` : ''}
      <div id="admin-contact-section"></div>
      <div id="location-proposals-section"></div>
      <p class="text-muted mt-1" style="font-size:12px">Erstellt: ${formatDateTime(b.created_at)} · ID: ${b.id}</p>
      </form>
    `;

    new bootstrap.Modal(document.getElementById('detail-modal')).show();

    // Kontaktdaten asynchron nachladen (Admin sieht immer beide)
    loadAdminContacts(b);

    // Standort-Vorschlaege asynchron nachladen
    loadLocationProposals(b.id);

    if (window._bookingDirty) window._bookingDirty.destroy();
    window._bookingDirty = initFormDirty({
      form: document.getElementById('booking-detail-form'),
      saveBtnId: 'modal-save-btn',
      onSave: saveBookingStatus,
    });
  }

  async function loadAdminContacts(b) {
    const el = document.getElementById('admin-contact-section');
    if (!el) return;
    try {
      const sb = getSupabase();
      let html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.06)">';

      // Kunden-Telefon
      if (b.customer_id) {
        const { data: cust } = await sb.from('customers').select('phone').eq('id', b.customer_id).single();
        html += `<div class="form-group"><label>Kunde Tel.</label><input class="form-control" value="${cust?.phone || '–'}" disabled style="${cust?.phone ? 'color:#40916C;font-weight:600' : ''}"></div>`;
      } else {
        html += '<div class="form-group"><label>Kunde Tel.</label><input class="form-control" value="–" disabled></div>';
      }

      // Trainer-Telefon
      if (b.trainer_id) {
        const { data: trainer } = await sb.from('trainer_profiles').select('phone').eq('id', b.trainer_id).single();
        html += `<div class="form-group"><label>Trainer Tel.</label><input class="form-control" value="${trainer?.phone || '–'}" disabled style="${trainer?.phone ? 'color:#40916C;font-weight:600' : ''}"></div>`;
      } else {
        html += '<div class="form-group"><label>Trainer Tel.</label><input class="form-control" value="–" disabled></div>';
      }

      html += '</div>';
      el.innerHTML = html;
    } catch {
      el.innerHTML = '';
    }
  }

  async function loadLocationProposals(bookingId) {
    const el = document.getElementById('location-proposals-section');
    if (!el) return;
    try {
      const res = await adminApi(`/api/admin?action=data&type=booking_locations&bookingId=${bookingId}`);
      const proposals = res.data || [];
      if (proposals.length === 0) return;

      const rows = proposals.map(loc => {
        const isSelected = loc.is_selected || loc.selected;
        const isAdmin = loc.source === 'admin' || loc.location_id;
        const typeLabel = isAdmin ? 'Admin-Ort' : 'Benutzerdefiniert';
        const typeBadgeClass = isAdmin ? 'badge-confirmed' : 'badge-pending';
        const selectedMark = isSelected
          ? '<span style="color:#27AE60;font-weight:700;margin-left:6px">&#10003; Gewählt</span>'
          : '';
        const address = [loc.address, loc.city].filter(Boolean).join(', ') || '–';
        return `
          <div style="display:grid;grid-template-columns:1fr auto;align-items:start;gap:8px;padding:10px 12px;border-radius:8px;background:${isSelected ? 'rgba(64,145,108,0.08)' : 'rgba(255,255,255,0.03)'};border:1px solid ${isSelected ? 'rgba(64,145,108,0.3)' : 'rgba(255,255,255,0.07)'};margin-bottom:8px">
            <div>
              <div style="font-weight:600;color:${isSelected ? '#40916C' : 'var(--text-primary)'};margin-bottom:2px">${loc.name || loc.location_name || '–'}${selectedMark}</div>
              <div style="font-size:12px;color:var(--text-secondary)">${address}</div>
            </div>
            <span class="badge ${typeBadgeClass}" style="font-size:11px;white-space:nowrap">${typeLabel}</span>
          </div>`;
      }).join('');

      el.innerHTML = `
        <div style="margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.06)">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:10px">
            Standort-Vorschlaege (${proposals.length})
          </div>
          ${rows}
        </div>`;
    } catch {
      // Fehler still ignorieren – Proposals sind optional
    }
  }

  async function saveBookingStatus() {
    if (!editingBookingId) return;
    const btn = document.getElementById('modal-save-btn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner-border spinner-border-sm"></div>';

    const payload = { bookingId: editingBookingId };

    // Status
    payload.status = document.getElementById('edit-booking-status').value;

    // Termin
    const dateVal = document.getElementById('edit-booking-date').value;
    if (dateVal) payload.scheduled_date = dateVal;
    const timeVal = document.getElementById('edit-booking-time').value;
    if (timeVal) payload.scheduled_time = timeVal;

    // Preise (EUR → Cent)
    const priceVal = document.getElementById('edit-booking-price').value;
    if (priceVal !== '') payload.price_cents = Math.round(parseFloat(priceVal) * 100);
    const finalVal = document.getElementById('edit-booking-final-price').value;
    if (finalVal !== '') payload.final_price_cents = Math.round(parseFloat(finalVal) * 100);
    const payoutVal = document.getElementById('edit-booking-payout').value;
    if (payoutVal !== '') payload.trainer_payout_cents = Math.round(parseFloat(payoutVal) * 100);

    // Admin-Notiz
    const note = document.getElementById('edit-booking-admin-note').value.trim();
    if (note) payload.admin_note = note;

    try {
      await adminApi('/api/admin?action=bookings', {
        method: 'PUT',
        body: JSON.stringify(payload),
      });
      if (window._bookingDirty) window._bookingDirty.reset();
      closeModal();
      showAlert('alert-box', 'Buchung aktualisiert!', 'success');
      await loadBookings();
    } catch (err) {
      showAlert('alert-box', 'Fehler: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Speichern';
    }
  }

  function closeModal() {
    if (window._bookingDirty && window._bookingDirty.isDirty()) {
      window._bookingDirty.confirmDiscard(function () {
        window._bookingDirty = null;
        editingBookingId = null;
        bootstrap.Modal.getInstance(document.getElementById('detail-modal')).hide();
      });
      return;
    }
    if (window._bookingDirty) { window._bookingDirty.destroy(); window._bookingDirty = null; }
    const modal = bootstrap.Modal.getInstance(document.getElementById('detail-modal'));
    if (modal) modal.hide();
    editingBookingId = null;
  }
</script>

</body>
</html>
