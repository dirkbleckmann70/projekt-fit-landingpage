<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belege – Projekt Fit Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="../shared/tabler-custom.css">
  <link rel="stylesheet" href="../shared/table-utils.css">
</head>
<body class="page">
<script src="../shared/theme.js"></script>

<div id="sidebar"></div>

<div class="page-wrapper">
  <div class="page-header d-print-none" id="header"></div>
  <div class="page-body">
    <div class="container-fluid">

      <div id="alert-box" class="alert"></div>

      <div class="card mb-3">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h3 class="card-title">Belege</h3>
          <div class="d-flex gap-2">
            <button class="pf-btn pf-btn-neutral" onclick="exportCSV()"><i class="ti ti-download"></i> CSV-Export</button>
            <button class="pf-btn pf-btn-primary" onclick="exportZip()"><i class="ti ti-file-zip"></i> Export für Steuerberater (ZIP)</button>
          </div>
        </div>
        <div class="card-body">

          <!-- Filter-Leiste -->
          <div class="pf-table-toolbar" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px">
            <select class="pf-field" style="width:auto;padding:6px 12px;font-size:13px" id="filter-year" onchange="applyFilters()">
              <option value="2026">2026</option>
              <option value="2025">2025</option>
              <option value="2024">2024</option>
            </select>
            <select class="pf-field" style="width:auto;padding:6px 12px;font-size:13px" id="filter-month" onchange="applyFilters()">
              <option value="">Alle Monate</option>
              <option value="01">Januar</option>
              <option value="02">Februar</option>
              <option value="03">März</option>
              <option value="04">April</option>
              <option value="05">Mai</option>
              <option value="06">Juni</option>
              <option value="07">Juli</option>
              <option value="08">August</option>
              <option value="09">September</option>
              <option value="10">Oktober</option>
              <option value="11">November</option>
              <option value="12">Dezember</option>
            </select>
            <select class="pf-field" style="width:auto;padding:6px 12px;font-size:13px" id="filter-type" onchange="applyFilters()">
              <option value="">Alle Typen</option>
              <option value="invoice">Rechnungen</option>
              <option value="credit_note">Gutschriften</option>
              <option value="cancellation">Stornos</option>
              <option value="rechnung_gt_card">GT-Karte</option>
            </select>
            <input type="text" class="pf-field" style="width:auto;min-width:200px;padding:6px 12px;font-size:13px" id="filter-search" placeholder="Suche (Nr., Empfänger...)" oninput="applyFilters()">
          </div>

        </div>
        <div class="table-responsive">
          <table class="table table-vcenter card-table" id="invoices-table">
            <thead>
              <tr>
                <th>Nr.</th>
                <th>Typ</th>
                <th>Training</th>
                <th>Datum</th>
                <th>Empfänger</th>
                <th>Netto</th>
                <th>MwSt</th>
                <th>Brutto</th>
                <th>E-Mail</th>
                <th>PDF</th>
              </tr>
            </thead>
            <tbody id="invoices-body">
              <tr><td colspan="10" class="loading-overlay"><div class="spinner-border spinner-border-sm"></div> Belege werden geladen...</td></tr>
            </tbody>
            <tfoot id="invoices-tfoot" style="display:none">
              <tr style="font-weight:700;border-top:2px solid rgba(74,222,128,0.3)">
                <td colspan="5" style="text-align:right;color:#888;font-size:12px;background:rgba(74,222,128,0.07)" id="sum-label">Gesamt</td>
                <td style="background:rgba(74,222,128,0.07)" id="sum-netto"></td>
                <td style="background:rgba(74,222,128,0.07)" id="sum-mwst"></td>
                <td style="background:rgba(74,222,128,0.07)" id="sum-brutto"></td>
                <td colspan="2" style="background:rgba(74,222,128,0.07)"></td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal modal-blur fade pf-modal-lg" id="detail-modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-title">Beleg-Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button class="pf-btn pf-btn-neutral" data-bs-dismiss="modal">Schließen</button>
        <button class="pf-btn pf-btn-primary" id="modal-pdf-btn" onclick="openPdf(currentInvoiceId)">PDF öffnen</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/js/tabler.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/design-tokens.js"></script>
<script src="../shared/constants.js"></script>
<script src="../shared/table-utils.js"></script>
<script src="../shared/layout.js"></script>
<script src="../shared/toast.js"></script>
<script src="auth-guard.js"></script>
<script>
  let allInvoices = [];
  let filteredInvoices = [];
  let currentInvoiceId = null;

  (async () => {
    const user = await checkAdminAuth();
    if (!user) return;

    document.getElementById('sidebar').innerHTML = renderAdminSidebar('invoices');
    document.getElementById('header').innerHTML = renderAdminHeader('Belege', user.email);
    initRealtimeToasts(getSupabase(), 'admin');

    // Jahr aus URL oder aktuelles Jahr
    const urlYear = new URLSearchParams(window.location.search).get('year');
    const currentYear = new Date().getFullYear();
    const year = urlYear || String(currentYear);
    document.getElementById('filter-year').value = year;

    await loadInvoices(year);
  })();

  async function loadInvoices(year) {
    try {
      const res = await adminApi(`/api/admin?action=invoices&year=${year}`);
      allInvoices = res.data || [];
      applyFilters();
    } catch (err) {
      document.getElementById('invoices-body').innerHTML =
        `<tr><td colspan="10" class="text-danger" style="padding:20px">Fehler: ${err.message}</td></tr>`;
    }
  }

  function applyFilters() {
    const year   = document.getElementById('filter-year').value;
    const month  = document.getElementById('filter-month').value;
    const type   = document.getElementById('filter-type').value;
    const search = document.getElementById('filter-search').value.toLowerCase().trim();

    // Neues Jahr laden wenn sich Jahr ändert (nicht wenn nur leer — das waere Endlosschleife)
    const loaded = allInvoices[0]?.issued_at?.slice(0, 4);
    if (loaded && loaded !== year) {
      loadInvoices(year);
      return;
    }

    filteredInvoices = allInvoices.filter(inv => {
      if (month && inv.issued_at?.slice(5, 7) !== month) return false;
      if (type) {
        const typeMap = { invoice: 'invoice', credit_note: 'credit_note', cancellation: 'cancellation', rechnung_gt_card: 'rechnung_gt_card' };
        if (inv.invoice_type !== typeMap[type]) return false;
      }
      if (search) {
        const haystack = [
          inv.invoice_number, inv.recipient_name, inv.recipient_email,
          inv.notes
        ].join(' ').toLowerCase();
        if (!haystack.includes(search)) return false;
      }
      return true;
    });

    renderInvoices();
  }

  // ─── Helpers ──────────────────────────────────────────────────────────────

  function typeBadge(inv) {
    const t = inv.invoice_type || 'invoice';
    if (t === 'credit_note')      return '<span class="pf-badge" style="background:#eff6ff;color:#0369a1">GS</span>';
    if (t === 'cancellation')     return '<span class="pf-badge" style="background:#fef2f2;color:#dc2626">SB</span>';
    if (t === 'rechnung_gt_card') return '<span class="pf-badge" style="background:#faf5ff;color:#7c3aed">GT-Karte</span>';
    return '<span class="pf-badge" style="background:#f0fdf4;color:#16a34a">RG</span>';
  }

  function typeLabel(inv) {
    const t = inv.invoice_type || 'invoice';
    if (t === 'credit_note')      return 'Gutschrift';
    if (t === 'cancellation')     return 'Storno';
    if (t === 'rechnung_gt_card') return 'GT-Karte';
    return 'Rechnung';
  }

  function trainingBadge(inv) {
    const t = (inv.training_type || '').toLowerCase();
    if (t === 'group' || t === 'gruppentraining') return '<span class="pf-badge" style="background:#faf5ff;color:#7c3aed">GT</span>';
    if (t === 'personal' || t === 'pt')           return '<span class="pf-badge" style="background:#fff7ed;color:#ea580c">PT</span>';
    return '<span class="text-muted">–</span>';
  }

  function emailBadge(inv) {
    if (inv.email_sent_at) return `<span class="pf-badge" style="background:#f0fdf4;color:#16a34a" title="Gesendet: ${formatDate(inv.email_sent_at)}">&#10003;</span>`;
    return '<span class="pf-badge" style="background:#fff7ed;color:#ea580c">ausstehend</span>';
  }

  // Deutsches Klartext-Label fuer den Zahlungs-Status einer Rechnung.
  // Werte stammen aus payment_status der Rechnungs-Zeile (Stripe-Sprache).
  const INV_PAY_LABELS = {
    succeeded:        '✅ Bezahlt',
    paid:             '✅ Bezahlt',
    pending:          '⏳ Ausstehend',
    requires_capture: '⏳ Wartet auf Einzug',
    requires_action:  '📲 Karten-Bestaetigung erforderlich',
    refunded:         '↩️ Erstattet',
    failed:           '❌ Fehlgeschlagen',
    canceled:         '❌ Abgebrochen',
  };
  function paymentStatusLabel(status) {
    if (!status) return '–';
    return INV_PAY_LABELS[status.toLowerCase()] || status;
  }

  function isStorno(inv) {
    return inv.invoice_type === 'cancellation';
  }

  function fmtCents(cents) {
    if (cents == null) return '–';
    return (cents / 100).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
  }

  // ─── Render ───────────────────────────────────────────────────────────────

  function renderInvoices() {
    const tbody = document.getElementById('invoices-body');
    const tfoot = document.getElementById('invoices-tfoot');

    if (filteredInvoices.length === 0) {
      tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted" style="padding:24px">Keine Belege gefunden</td></tr>';
      tfoot.style.display = 'none';
      return;
    }

    tbody.innerHTML = filteredInvoices.map(inv => {
      const rowStyle = isStorno(inv) ? 'color:#dc2626;opacity:0.85;' : '';
      const numberCell = inv.storno_ref
        ? `${inv.invoice_number || '–'} <span class="text-muted small">(storniert via SB ${inv.storno_ref})</span>`
        : (inv.status === 'cancelled'
           ? `<s>${inv.invoice_number || '–'}</s> <span class="text-danger small">storniert</span>`
           : (inv.invoice_number || '–'));
      return `
        <tr style="cursor:pointer;${rowStyle}" onclick="openDetail('${inv.id}')">
          <td><strong>${numberCell}</strong></td>
          <td>${typeBadge(inv)}</td>
          <td>${trainingBadge(inv)}</td>
          <td>${formatDate(inv.issued_at)}</td>
          <td>${inv.recipient_name || inv.recipient_email || '–'}</td>
          <td>${fmtCents(inv.net_amount_cents)}</td>
          <td>${fmtCents(inv.vat_amount_cents)}</td>
          <td><strong>${fmtCents(inv.gross_amount_cents)}</strong></td>
          <td>${emailBadge(inv)}</td>
          <td onclick="event.stopPropagation()">
            <button class="pf-btn pf-btn-neutral" title="PDF herunterladen" onclick="openPdf('${inv.id}')"><i class="ti ti-download"></i> PDF</button>
            <button class="pf-btn pf-btn-neutral" title="Drucken" onclick="printPdf('${inv.id}')"><i class="ti ti-printer"></i> Drucken</button>
          </td>
        </tr>`;
    }).join('');

    // Summen
    let sumNetto  = 0, sumMwst = 0, sumBrutto = 0;
    filteredInvoices.forEach(inv => {
      // Stornos subtrahieren
      const sign = isStorno(inv) ? -1 : 1;
      sumNetto  += sign * (inv.net_amount_cents   || 0);
      sumMwst   += sign * (inv.vat_amount_cents   || 0);
      sumBrutto += sign * (inv.gross_amount_cents || 0);
    });

    document.getElementById('sum-label').textContent   = `Gesamt (${filteredInvoices.length} Belege)`;
    document.getElementById('sum-netto').textContent   = fmtCents(sumNetto);
    document.getElementById('sum-mwst').textContent    = fmtCents(sumMwst);
    document.getElementById('sum-brutto').textContent  = fmtCents(sumBrutto);
    tfoot.style.display = '';
  }

  // ─── Detail Modal ──────────────────────────────────────────────────────────

  function openDetail(id) {
    const inv = allInvoices.find(x => x.id === id);
    if (!inv) return;
    currentInvoiceId = id;

    document.getElementById('modal-title').textContent = `Beleg ${inv.invoice_number || id} – ${typeLabel(inv)}`;

    const sectionTitle = 'font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#4ADE80;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid rgba(74,222,128,0.2)';
    const gridStyle = 'display:grid;grid-template-columns:1fr 1fr;gap:12px 20px';
    const lblStyle = 'display:block;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px';

    document.getElementById('modal-body').innerHTML = `
      <div style="${sectionTitle}">Beleg-Informationen</div>
      <div style="${gridStyle}">
        <div><label style="${lblStyle}">Belegnummer</label><div>${inv.invoice_number || '–'}</div></div>
        <div><label style="${lblStyle}">Typ</label><div>${typeBadge(inv)} ${typeLabel(inv)}</div></div>
        <div><label style="${lblStyle}">Ausstellungsdatum</label><div>${formatDate(inv.issued_at)}</div></div>
        <div><label style="${lblStyle}">Leistungsdatum</label><div>${formatDate(inv.service_date)}</div></div>
        <div><label style="${lblStyle}">Fälligkeitsdatum</label><div>${formatDate(inv.due_date)}</div></div>
        <div><label style="${lblStyle}">Trainingstyp</label><div>${trainingBadge(inv)}</div></div>
      </div>

      <div style="${sectionTitle}">Empfänger</div>
      <div style="${gridStyle}">
        <div><label style="${lblStyle}">Name</label><div>${inv.recipient_name || '–'}</div></div>
        <div><label style="${lblStyle}">E-Mail</label><div>${inv.recipient_email || '–'}</div></div>
        <div><label style="${lblStyle}">Adresse</label><div>${inv.recipient_address || '–'}</div></div>
        <div><label style="${lblStyle}">USt-IdNr.</label><div>${inv.recipient_vat_id || '–'}</div></div>
      </div>

      <div style="${sectionTitle}">Beträge</div>
      <div style="${gridStyle}">
        <div><label style="${lblStyle}">Nettobetrag</label><div>${fmtCents(inv.net_amount_cents)}</div></div>
        <div><label style="${lblStyle}">MwSt-Satz</label><div>${inv.vat_rate != null ? inv.vat_rate + ' %' : '–'}</div></div>
        <div><label style="${lblStyle}">MwSt-Betrag</label><div>${fmtCents(inv.vat_amount_cents)}</div></div>
        <div><label style="${lblStyle}">Bruttobetrag</label><div style="color:#4ADE80;font-weight:700">${fmtCents(inv.gross_amount_cents)}</div></div>
      </div>

      <div style="${sectionTitle}">Status & Versand</div>
      <div style="${gridStyle}">
        <div><label style="${lblStyle}">Zahlungsstatus</label><div>${paymentStatusLabel(inv.payment_status)}</div></div>
        <div><label style="${lblStyle}">E-Mail gesendet</label><div>${inv.email_sent_at ? formatDateTime(inv.email_sent_at) : '<span class="pf-badge" style="background:#fff7ed;color:#ea580c">Nein</span>'}</div></div>
        <div><label style="${lblStyle}">PDF vorhanden</label><div>${inv.pdf_path ? '<span class="pf-badge" style="background:#f0fdf4;color:#16a34a">Ja</span>' : '<span class="text-muted">Nein</span>'}</div></div>
        <div><label style="${lblStyle}">Erstellt am</label><div>${formatDateTime(inv.created_at)}</div></div>
      </div>

      ${inv.notes ? `
      <div style="${sectionTitle}">Notizen</div>
      <div style="background:#f8fafc;border-radius:8px;padding:12px;font-size:13px">${inv.notes}</div>
      ` : ''}

      <p class="text-muted mt-3" style="font-size:11px">ID: ${inv.id}</p>
    `;

    document.getElementById('modal-pdf-btn').style.display = inv.pdf_path ? '' : 'none';
    new bootstrap.Modal(document.getElementById('detail-modal')).show();
  }

  // ─── PDF ──────────────────────────────────────────────────────────────────

  async function openPdf(id) {
    if (!id) return;
    try {
      const res = await adminApi(`/api/admin?action=invoice-pdf&id=${id}`);
      window.open(res.url, '_blank');
    } catch (err) {
      showAlert('alert-box', 'PDF-Fehler: ' + err.message, 'error');
    }
  }

  async function printPdf(id) {
    if (!id) return;
    try {
      const res = await adminApi(`/api/admin?action=invoice-pdf&id=${id}`);
      const win = window.open(res.url, '_blank');
      if (win) win.addEventListener('load', () => win.print(), { once: true });
    } catch (err) {
      showAlert('alert-box', 'PDF-Fehler: ' + err.message, 'error');
    }
  }

  // ─── ZIP-Export (für Steuerberater) ───────────────────────────────────────

  async function exportZip() {
    const year  = document.getElementById('filter-year').value || String(new Date().getFullYear());
    const month = document.getElementById('filter-month').value; // '' oder '01'..'12'
    const typeSelect = document.getElementById('filter-type').value || '';

    // Datumsfenster aus year+month bilden
    let from, to;
    if (month) {
      from = `${year}-${month}-01`;
      const lastDay = new Date(Number(year), Number(month), 0).getDate();
      to = `${year}-${month}-${String(lastDay).padStart(2, '0')}`;
    } else {
      from = `${year}-01-01`;
      to   = `${year}-12-31`;
    }

    // Typ auf export-invoices-Schema mappen (Edge Function erwartet 'all' | 'rechnung' | 'gutschrift' | 'stornobeleg')
    const typeMap = {
      '': 'all',
      'invoice': 'rechnung',
      'credit_note': 'gutschrift',
      'cancellation': 'stornobeleg',
      'rechnung_gt_card': 'rechnung',
    };
    const type = typeMap[typeSelect] || 'all';

    try {
      const supabase = getSupabase();
      const { data: s } = await supabase.auth.getSession();
      const token = s?.session?.access_token;
      if (!token) {
        showPfToast('Export', 'Nicht angemeldet', 'danger');
        return;
      }
      showPfToast('Export', 'ZIP wird erstellt...', 'info');
      const resp = await fetch(`${SUPABASE_URL}/functions/v1/export-invoices`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'apikey': SUPABASE_ANON_KEY,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ from, to, type }),
      });
      if (!resp.ok) {
        let msg = `HTTP ${resp.status}`;
        try { const errJson = await resp.json(); if (errJson && errJson.error) msg = errJson.error; } catch {}
        showPfToast('ZIP-Export fehlgeschlagen', msg, 'danger');
        return;
      }
      const blob = await resp.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `belege_${from}_${to}.zip`;
      a.click();
      URL.revokeObjectURL(url);
      showPfToast('Export', 'ZIP bereit', 'success');
    } catch (err) {
      showPfToast('ZIP-Export fehlgeschlagen', err.message || String(err), 'danger');
    }
  }

  // ─── CSV-Export ───────────────────────────────────────────────────────────

  function exportCSV() {
    if (filteredInvoices.length === 0) {
      showAlert('alert-box', 'Keine Daten zum Exportieren.', 'error');
      return;
    }

    const header = ['Nr.','Typ','Trainingstyp','Datum','Empfänger','E-Mail','Netto','MwSt','Brutto','E-Mail gesendet','Zahlungsstatus'];
    const rows = filteredInvoices.map(inv => [
      inv.invoice_number || '',
      typeLabel(inv),
      inv.training_type || '',
      inv.issued_at ? inv.issued_at.slice(0, 10) : '',
      inv.recipient_name || '',
      inv.recipient_email || '',
      inv.net_amount_cents != null   ? (inv.net_amount_cents   / 100).toFixed(2) : '',
      inv.vat_amount_cents != null   ? (inv.vat_amount_cents   / 100).toFixed(2) : '',
      inv.gross_amount_cents != null ? (inv.gross_amount_cents / 100).toFixed(2) : '',
      inv.email_sent_at ? inv.email_sent_at.slice(0, 10) : 'Nein',
      inv.payment_status || '',
    ]);

    const csv = [header, ...rows]
      .map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
      .join('\n');

    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `belege_${document.getElementById('filter-year').value}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }
</script>

</body>
</html>
