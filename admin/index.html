<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – Projekt Fit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="../shared/tabler-custom.css">
</head>
<body class="page page-center">
<script src="../shared/theme.js"></script>

<div class="container container-tight py-4">
  <div class="text-center mb-4">
    <h1 style="font-weight:800;font-size:1.75rem">Projekt <span style="color:var(--tblr-primary)">Fit</span> Admin</h1>
    <p class="text-secondary">Admin-Bereich</p>
  </div>
  <div class="card card-md">
    <div class="card-body">
      <h2 class="h2 text-center mb-4">Anmelden</h2>

      <div class="alert alert-danger d-none" id="error-msg"></div>

      <form id="login-form" novalidate>
        <div class="mb-3">
          <label class="form-label" for="email">E-Mail</label>
          <input type="email" class="form-control" id="email" placeholder="admin@projektfit.net" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Passwort</label>
          <input type="password" class="form-control" id="password" placeholder="Passwort" autocomplete="current-password" required>
        </div>
        <div class="form-footer">
          <button type="submit" class="btn btn-primary w-100" id="submit-btn">Einloggen</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/js/tabler.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-guard.js"></script>
<script>
  const SUPABASE_URL = 'https://ahsjydgknmysircubjsk.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_8tZaFMrIrzJXjDbYAF2huw_ygDY9K2Q';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const errorMsg = document.getElementById('error-msg');
  const submitBtn = document.getElementById('submit-btn');

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.remove('d-none');
  }
  function hideError() {
    errorMsg.classList.add('d-none');
  }

  // Check if already logged in as admin
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session && session.user.user_metadata?.role?.includes('admin')) {
      window.location.href = '/admin/dashboard.html';
    }
  })();

  // Show error from URL params (e.g. ?error=no_admin)
  const urlError = new URLSearchParams(window.location.search).get('error');
  if (urlError === 'no_admin') {
    showError('Kein Admin-Zugang. Nur Administratoren dürfen sich hier einloggen.');
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      showError('Bitte E-Mail und Passwort eingeben.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Wird geprüft...';

    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        showError('Login fehlgeschlagen: ' + error.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Einloggen';
        return;
      }

      // Check admin role
      const role = data.user?.user_metadata?.role;
      if (!role || !role.includes('admin')) {
        await sb.auth.signOut();
        showError('Kein Admin-Zugang. Nur Administratoren dürfen sich hier einloggen.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Einloggen';
        return;
      }

      // Redirect to dashboard
      window.location.href = '/admin/dashboard.html';
    } catch (err) {
      showError('Verbindungsfehler: ' + err.message);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Einloggen';
    }
  });
</script>

</body>
</html>
