<!DOCTYPE html>
<html lang="de" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – Projekt Fit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="../shared/tabler-custom.css">
</head>
<body class="page page-center">
<script src="../shared/theme.js"></script>

<div class="container container-tight py-4">
  <div class="text-center mb-4">
    <h1 style="font-weight:800;font-size:1.75rem">Projekt <span class="text-primary">Fit</span> Admin</h1>
    <p class="text-secondary mt-2">Verwaltungsportal</p>
  </div>
  <div class="card card-md">
    <div class="card-body">
      <h2 class="h2 text-center mb-4">Anmelden</h2>

      <div class="alert alert-danger d-none" id="error-msg"></div>
      <div class="alert alert-success d-none" id="success-msg"></div>

      <!-- Login Form -->
      <div id="login-view">
        <form id="login-form" novalidate>
          <div class="mb-3">
            <label class="form-label" for="email">E-Mail-Adresse</label>
            <div class="input-group">
              <span class="input-group-text"><i class="ti ti-mail"></i></span>
              <input type="email" class="form-control" id="email" placeholder="admin@projektfit.net" autocomplete="email" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label d-flex justify-content-between" for="password">
              Passwort
              <a href="#" id="forgot-link" class="text-secondary" style="font-size:12px">Vergessen?</a>
            </label>
            <div class="input-group">
              <span class="input-group-text"><i class="ti ti-lock"></i></span>
              <input type="password" class="form-control" id="password" placeholder="Passwort eingeben" autocomplete="current-password" required>
              <button class="input-group-text" type="button" onclick="togglePw(this)" title="Anzeigen">
                <i class="ti ti-eye"></i>
              </button>
            </div>
          </div>
          <div class="form-footer">
            <button type="submit" class="btn btn-primary w-100" id="submit-btn">
              <i class="ti ti-login"></i> Anmelden
            </button>
          </div>
        </form>
      </div>

      <!-- Password Reset Form -->
      <div id="reset-view" style="display:none">
        <h3 class="h3 text-center mb-3">Passwort zuruecksetzen</h3>
        <form id="reset-form" novalidate>
          <div class="mb-3">
            <label class="form-label" for="reset-email">E-Mail</label>
            <input type="email" class="form-control" id="reset-email" placeholder="deine@email.de" autocomplete="email" required>
          </div>
          <div class="form-footer">
            <button type="submit" class="btn btn-primary w-100" id="reset-btn">Link senden</button>
          </div>
        </form>
        <div class="text-center mt-3">
          <a href="#" id="back-link" class="text-secondary">Zurueck zum Login</a>
        </div>
      </div>
    </div>
  </div>

  <div class="text-center text-secondary mt-3" style="font-size:12px">
    &copy; 2026 ProjektFit &middot; <a href="/datenschutz.html" class="text-secondary">Datenschutz</a> &middot; <a href="/impressum.html" class="text-secondary">Impressum</a>
  </div>

  <!-- Theme Toggle unten rechts -->
  <div style="position:fixed;bottom:1rem;right:1rem">
    <button class="btn btn-icon btn-ghost-secondary" onclick="toggleThemeManual()" title="Theme wechseln">
      <i class="ti ti-moon" id="theme-icon"></i>
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/js/tabler.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-guard.js"></script>
<script>
  function togglePw(btn) {
    const input = btn.parentElement.querySelector('input');
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.className = 'ti ti-eye-off';
    } else {
      input.type = 'password';
      icon.className = 'ti ti-eye';
    }
  }
  function toggleThemeManual() {
    const html = document.documentElement;
    const next = html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-bs-theme', next);
    localStorage.setItem('theme', next);
    const icon = document.getElementById('theme-icon');
    if (icon) icon.className = next === 'dark' ? 'ti ti-moon' : 'ti ti-sun';
  }

  const sb = getSupabase();

  const errorMsg = document.getElementById('error-msg');
  const submitBtn = document.getElementById('submit-btn');

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.remove('d-none');
  }
  function hideError() {
    errorMsg.classList.add('d-none');
  }
  function resetBtn() {
    submitBtn.disabled = false;
    submitBtn.innerHTML = '<i class="ti ti-login"></i> Anmelden';
  }

  // Check if already logged in as admin
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session && session.user.user_metadata?.role?.includes('admin')) {
      window.location.href = '/admin/dashboard.html';
    }
  })();

  // Show error from URL params (e.g. ?error=no_admin)
  const urlError = new URLSearchParams(window.location.search).get('error');
  if (urlError === 'no_admin') {
    showError('Kein Admin-Zugang. Nur Administratoren dürfen sich hier einloggen.');
  }

  const successMsg = document.getElementById('success-msg');

  // ─── Forgot / Reset Toggle ─────────────────────────────────
  document.getElementById('forgot-link').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('reset-view').style.display = 'block';
    errorMsg.classList.add('d-none');
    successMsg.classList.add('d-none');
  });
  document.getElementById('back-link').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('reset-view').style.display = 'none';
    document.getElementById('login-view').style.display = 'block';
    errorMsg.classList.add('d-none');
    successMsg.classList.add('d-none');
  });

  // ─── Password Reset ───────────────────────────────────────
  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.classList.add('d-none');
    successMsg.classList.add('d-none');
    const email = document.getElementById('reset-email').value.trim();
    if (!email) { showError('Bitte E-Mail eingeben.'); return; }
    const btn = document.getElementById('reset-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Wird gesendet...';
    try {
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: 'https://projektfit.net/admin/',
      });
      if (error) { showError('Fehler: ' + error.message); }
      else {
        successMsg.textContent = 'Reset-Link wurde an ' + email + ' gesendet. Pruefe dein Postfach.';
        successMsg.classList.remove('d-none');
      }
    } catch (err) { showError('Verbindungsfehler: ' + err.message); }
    finally { btn.disabled = false; btn.textContent = 'Link senden'; }
  });

  // ─── Login ─────────────────────────────────────────────────
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      showError('Bitte E-Mail und Passwort eingeben.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Wird geprüft...';

    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        console.error('[Admin Login] signIn error:', error);
        showError('Login fehlgeschlagen: ' + error.message);
        resetBtn();
        return;
      }

      // Check admin role
      const role = data.user?.user_metadata?.role;
      console.log('[Admin Login] role:', role);
      if (!role || !role.includes('admin')) {
        await sb.auth.signOut();
        showError('Kein Admin-Zugang. Nur Administratoren dürfen sich hier einloggen.');
        resetBtn();
        return;
      }

      // Redirect to dashboard
      window.location.href = '/admin/dashboard.html';
    } catch (err) {
      console.error('[Admin Login] catch:', err);
      showError('Verbindungsfehler: ' + err.message);
      resetBtn();
    }
  });
</script>

</body>
</html>
