<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tester & Admins – Projekt Fit Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="../shared/tabler-custom.css">
</head>
<body class="page">
<script src="../shared/theme.js"></script>

<div id="sidebar"></div>

<div class="page-wrapper">
  <div class="page-header d-print-none" id="header"></div>
  <div class="page-body">
    <div class="container-fluid">

      <p class="text-secondary" style="margin-bottom:24px">
        Verwalte Testnutzer und deren Berechtigungen. Änderungen werden sofort wirksam.
      </p>

      <!-- Alert -->
      <div class="alert" id="alert"></div>

      <!-- KPI Cards -->
      <div class="row row-deck row-cards mb-3" id="kpi-grid">
        <div class="col-sm-6 col-lg-4">
          <div class="pf-stat-card">
            <div class="pf-stat-num" id="kpi-active"><div class="spinner-border spinner-border-sm"></div></div>
            <div class="pf-stat-label">Aktive Tester</div>
          </div>
        </div>
        <div class="col-sm-6 col-lg-4">
          <div class="pf-stat-card">
            <div class="pf-stat-num" id="kpi-inactive"><div class="spinner-border spinner-border-sm"></div></div>
            <div class="pf-stat-label">Inaktive</div>
          </div>
        </div>
        <div class="col-sm-6 col-lg-4">
          <div class="pf-stat-card">
            <div class="pf-stat-num" id="kpi-total"><div class="spinner-border spinner-border-sm"></div></div>
            <div class="pf-stat-label">Gesamt</div>
          </div>
        </div>
      </div>

      <!-- Formular -->
      <div class="card mb-3" id="tester-form-card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h3 class="card-title" id="form-title">Neuen Tester hinzufügen</h3>
          <button class="pf-btn pf-btn-neutral" id="form-cancel-btn" style="display:none" onclick="resetForm()">Abbrechen</button>
        </div>
        <div class="card-body">
          <form id="tester-form" style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end">
            <input type="hidden" id="edit-id" value="">
            <div style="flex:1;min-width:220px">
              <label class="form-label">E-Mail *</label>
              <input type="email" id="input-email" class="form-control" placeholder="name@beispiel.de" required>
            </div>
            <div style="min-width:140px">
              <label class="form-label">Rolle</label>
              <select id="input-role" class="form-select">
                <option value="tester">Tester</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <div style="min-width:120px">
              <label class="form-label" style="display:block">&nbsp;</label>
              <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px">
                <input type="checkbox" id="input-premium" checked> Premium
              </label>
            </div>
            <div style="min-width:120px">
              <label class="form-label" style="display:block">&nbsp;</label>
              <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px">
                <input type="checkbox" id="input-devtools" checked> Dev-Tools
              </label>
            </div>
            <div style="flex:1;min-width:180px">
              <label class="form-label">Notiz</label>
              <input type="text" id="input-notes" class="form-control" placeholder="z.B. Beta-Tester, QA">
            </div>
            <button type="submit" class="pf-btn pf-btn-primary" id="submit-btn">Hinzufügen</button>
          </form>
        </div>
      </div>

      <!-- Tabelle -->
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Alle Tester & Admins</h3>
        </div>
        <div class="table-responsive">
          <table class="table table-vcenter card-table">
            <thead>
              <tr>
                <th>E-Mail</th>
                <th>Rolle</th>
                <th>Premium</th>
                <th>Dev-Tools</th>
                <th>Notiz</th>
                <th>Status</th>
                <th>Erstellt</th>
                <th>Aktionen</th>
              </tr>
            </thead>
            <tbody id="testers-body">
              <tr><td colspan="8" class="loading-overlay"><div class="spinner-border spinner-border-sm"></div> Laden...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/js/tabler.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/design-tokens.js"></script>
<script src="../shared/constants.js"></script>
<script src="../shared/layout.js"></script>
<script src="../shared/toast.js"></script>
<script src="auth-guard.js"></script>
<script>
(async () => {
  const user = await checkAdminAuth();
  if (!user) return;

  document.getElementById('sidebar').innerHTML = renderAdminSidebar('testers');
  document.getElementById('header').innerHTML = renderAdminHeader('Tester & Admins', user.email);
  initRealtimeToasts(getSupabase(), 'admin');

  let allTesters = [];

  // ─── Daten laden (über Admin-API) ─────────────────────────────
  async function loadTesters() {
    try {
      const { data } = await adminApi('/api/admin?action=testers');
      allTesters = data || [];
      renderTable();
      renderKpis();
    } catch (err) {
      console.error('Tester laden fehlgeschlagen:', err.message);
      showAlert('alert', 'Fehler beim Laden: ' + err.message, 'error');
    }
  }

  // ─── KPIs ───────────────────────────────────────────────────────
  function renderKpis() {
    const active = allTesters.filter(t => t.is_active).length;
    const inactive = allTesters.filter(t => !t.is_active).length;
    document.getElementById('kpi-active').textContent = active;
    document.getElementById('kpi-inactive').textContent = inactive;
    document.getElementById('kpi-total').textContent = allTesters.length;
  }

  // ─── Tabelle rendern ────────────────────────────────────────────
  function renderTable() {
    const tbody = document.getElementById('testers-body');
    if (allTesters.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted" style="padding:24px">Keine Tester vorhanden</td></tr>';
      return;
    }

    tbody.innerHTML = allTesters.map(t => {
      const role = (t.notes || '').toLowerCase().includes('admin') ? 'Admin' : 'Tester';
      return `
        <tr data-id="${t.id}">
          <td><strong>${t.email}</strong></td>
          <td><span class="badge ${role === 'Admin' ? 'badge-confirmed' : 'badge-active'}">${role}</span></td>
          <td>
            <input type="checkbox" ${t.premium_override ? 'checked' : ''}
              onchange="toggleField('${t.id}', 'premium_override', this.checked)">
          </td>
          <td>
            <input type="checkbox" ${t.dev_tools ? 'checked' : ''}
              onchange="toggleField('${t.id}', 'dev_tools', this.checked)">
          </td>
          <td class="text-muted">${t.notes || '–'}</td>
          <td>
            <button class="${t.is_active ? 'pf-btn pf-btn-primary' : 'pf-btn pf-btn-neutral'}"
              onclick="toggleField('${t.id}', 'is_active', ${!t.is_active})">
              ${t.is_active ? 'Aktiv' : 'Inaktiv'}
            </button>
          </td>
          <td class="text-muted">${formatDate(t.created_at)}</td>
          <td>
            <div style="display:flex;gap:6px">
              <button class="pf-btn pf-btn-edit" onclick="editTester('${t.id}')"><i class="ti ti-edit"></i></button>
              <button class="pf-btn pf-btn-danger" onclick="deleteTester('${t.id}', '${t.email}')"><i class="ti ti-trash"></i></button>
            </div>
          </td>
        </tr>
      `;
    }).join('');
  }

  // ─── Toggle Feld (Checkbox/Status) über Admin-API ───────────────
  window.toggleField = async function(id, field, value) {
    try {
      await adminApi('/api/admin?action=testers', {
        method: 'PUT',
        body: JSON.stringify({ id, [field]: value }),
      });
      await loadTesters();
    } catch (err) {
      showAlert('alert', 'Fehler: ' + err.message, 'error');
    }
  };

  // ─── Bearbeiten ─────────────────────────────────────────────────
  window.editTester = function(id) {
    const t = allTesters.find(x => x.id === id);
    if (!t) return;

    document.getElementById('edit-id').value = t.id;
    document.getElementById('input-email').value = t.email;
    document.getElementById('input-role').value = (t.notes || '').toLowerCase().includes('admin') ? 'admin' : 'tester';
    document.getElementById('input-premium').checked = t.premium_override;
    document.getElementById('input-devtools').checked = t.dev_tools;
    document.getElementById('input-notes').value = t.notes || '';
    document.getElementById('form-title').textContent = 'Tester bearbeiten';
    document.getElementById('submit-btn').textContent = 'Speichern';
    document.getElementById('form-cancel-btn').style.display = '';

    // Sichtbar machen, dass jetzt im oberen Formular bearbeitet wird:
    // zum Formular springen + kurz grün aufblinken (sonst leicht zu übersehen,
    // weil die Bearbeitung oben statt in der Zeile passiert).
    const card = document.getElementById('tester-form-card');
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.style.transition = 'none';
      card.style.boxShadow = '0 0 0 3px #4ADE80';
      card.style.backgroundColor = 'rgba(74,222,128,0.10)';
      setTimeout(() => {
        card.style.transition = 'box-shadow 0.6s ease, background-color 0.6s ease';
        card.style.boxShadow = '';
        card.style.backgroundColor = '';
      }, 400);
    }
  };

  // ─── Formular zurücksetzen ──────────────────────────────────────
  window.resetForm = function() {
    document.getElementById('edit-id').value = '';
    document.getElementById('input-email').value = '';
    document.getElementById('input-role').value = 'tester';
    document.getElementById('input-premium').checked = true;
    document.getElementById('input-devtools').checked = true;
    document.getElementById('input-notes').value = '';
    document.getElementById('form-title').textContent = 'Neuen Tester hinzufügen';
    document.getElementById('submit-btn').textContent = 'Hinzufügen';
    document.getElementById('form-cancel-btn').style.display = 'none';
  };

  // ─── Löschen über Admin-API ─────────────────────────────────────
  window.deleteTester = async function(id, email) {
    if (!confirm(`Tester "${email}" wirklich löschen?\n\nDiese Aktion kann nicht rückgängig gemacht werden.`)) return;

    try {
      await adminApi(`/api/admin?action=testers&id=${id}`, { method: 'DELETE' });
      showAlert('alert', `${email} wurde gelöscht.`, 'success');
      await loadTesters();
    } catch (err) {
      showAlert('alert', 'Löschen fehlgeschlagen: ' + err.message, 'error');
    }
  };

  // ─── Formular Submit über Admin-API ─────────────────────────────
  document.getElementById('tester-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const editId = document.getElementById('edit-id').value;
    const email = document.getElementById('input-email').value.trim().toLowerCase();
    const role = document.getElementById('input-role').value;
    const premium = document.getElementById('input-premium').checked;
    const devtools = document.getElementById('input-devtools').checked;
    const notes = document.getElementById('input-notes').value.trim() || (role === 'admin' ? 'Admin' : null);

    if (!email) {
      showAlert('alert', 'E-Mail ist ein Pflichtfeld.', 'error');
      return;
    }

    try {
      if (editId) {
        // UPDATE
        await adminApi('/api/admin?action=testers', {
          method: 'PUT',
          body: JSON.stringify({
            id: editId,
            email,
            premium_override: premium,
            dev_tools: devtools,
            notes: notes,
          }),
        });
        showAlert('alert', `${email} wurde aktualisiert.`, 'success');
      } else {
        // INSERT — Duplikat prüfen (client-seitig)
        const exists = allTesters.some(t => t.email.toLowerCase() === email);
        if (exists) {
          showAlert('alert', `${email} ist bereits als Tester eingetragen.`, 'error');
          return;
        }

        await adminApi('/api/admin?action=testers', {
          method: 'POST',
          body: JSON.stringify({
            email,
            is_active: true,
            premium_override: premium,
            dev_tools: devtools,
            notes: notes,
          }),
        });
        showAlert('alert', `${email} wurde als Tester hinzugefügt.`, 'success');
      }
    } catch (err) {
      showAlert('alert', (editId ? 'Speichern' : 'Hinzufügen') + ' fehlgeschlagen: ' + err.message, 'error');
      return;
    }

    resetForm();
    await loadTesters();
  });

  // ─── Initial laden ──────────────────────────────────────────────
  await loadTesters();
})();
</script>

</body>
</html>
