<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tester & Admins – Projekt Fit Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="header" id="header"></header>
    <div class="content">

      <p class="text-muted" style="margin-bottom:24px">
        Verwalte Testnutzer und deren Berechtigungen. Änderungen werden sofort wirksam.
      </p>

      <!-- Alert -->
      <div class="alert" id="alert"></div>

      <!-- KPI Cards -->
      <div class="kpi-grid" style="margin-bottom:24px" id="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-label">Aktive Tester</div>
          <div class="kpi-value" id="kpi-active"><span class="spinner"></span></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Inaktive</div>
          <div class="kpi-value" id="kpi-inactive"><span class="spinner"></span></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Gesamt</div>
          <div class="kpi-value" id="kpi-total"><span class="spinner"></span></div>
        </div>
      </div>

      <!-- Formular -->
      <div class="table-wrap mb-2">
        <div class="table-header">
          <div class="table-title" id="form-title">Neuen Tester hinzufügen</div>
          <button class="btn btn-ghost btn-sm" id="form-cancel-btn" style="display:none" onclick="resetForm()">Abbrechen</button>
        </div>
        <form id="tester-form" style="padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end">
          <input type="hidden" id="edit-id" value="">
          <div style="flex:1;min-width:220px">
            <label class="form-label">E-Mail *</label>
            <input type="email" id="input-email" class="form-input" placeholder="name@beispiel.de" required>
          </div>
          <div style="min-width:140px">
            <label class="form-label">Rolle</label>
            <select id="input-role" class="form-input">
              <option value="tester">Tester</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div style="min-width:120px">
            <label class="form-label" style="display:block">&nbsp;</label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:var(--text)">
              <input type="checkbox" id="input-premium" checked> Premium
            </label>
          </div>
          <div style="min-width:120px">
            <label class="form-label" style="display:block">&nbsp;</label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:var(--text)">
              <input type="checkbox" id="input-devtools" checked> Dev-Tools
            </label>
          </div>
          <div style="flex:1;min-width:180px">
            <label class="form-label">Notiz</label>
            <input type="text" id="input-notes" class="form-input" placeholder="z.B. Beta-Tester, QA">
          </div>
          <button type="submit" class="btn btn-primary" id="submit-btn">Hinzufügen</button>
        </form>
      </div>

      <!-- Tabelle -->
      <div class="table-wrap">
        <div class="table-header">
          <div class="table-title">Alle Tester & Admins</div>
        </div>
        <table>
          <thead>
            <tr>
              <th>E-Mail</th>
              <th>Rolle</th>
              <th>Premium</th>
              <th>Dev-Tools</th>
              <th>Notiz</th>
              <th>Status</th>
              <th>Erstellt</th>
              <th>Aktionen</th>
            </tr>
          </thead>
          <tbody id="testers-body">
            <tr><td colspan="8" class="loading-overlay"><span class="spinner"></span> Laden...</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-guard.js"></script>
<script>
(async () => {
  const user = await checkAdminAuth();
  if (!user) return;

  document.getElementById('sidebar').innerHTML = renderSidebar('testers');
  document.getElementById('header').innerHTML = renderHeader('Tester & Admins');

  const sb = getSupabase();
  let allTesters = [];

  // ─── Daten laden ────────────────────────────────────────────────
  async function loadTesters() {
    const { data, error } = await sb
      .from('test_users')
      .select('*')
      .order('is_active', { ascending: false })
      .order('created_at', { ascending: false });

    if (error) {
      console.error('Tester laden fehlgeschlagen:', error.message);
      showAlert('alert', 'Fehler beim Laden: ' + error.message, 'error');
      return;
    }

    allTesters = data || [];
    renderTable();
    renderKpis();
  }

  // ─── KPIs ───────────────────────────────────────────────────────
  function renderKpis() {
    const active = allTesters.filter(t => t.is_active).length;
    const inactive = allTesters.filter(t => !t.is_active).length;
    document.getElementById('kpi-active').textContent = active;
    document.getElementById('kpi-inactive').textContent = inactive;
    document.getElementById('kpi-total').textContent = allTesters.length;
  }

  // ─── Tabelle rendern ────────────────────────────────────────────
  function renderTable() {
    const tbody = document.getElementById('testers-body');
    if (allTesters.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted" style="padding:24px">Keine Tester vorhanden</td></tr>';
      return;
    }

    tbody.innerHTML = allTesters.map(t => {
      const role = (t.notes || '').toLowerCase().includes('admin') ? 'Admin' : 'Tester';
      return `
        <tr data-id="${t.id}">
          <td><strong>${t.email}</strong></td>
          <td><span class="badge ${role === 'Admin' ? 'badge-confirmed' : 'badge-active'}">${role}</span></td>
          <td>
            <input type="checkbox" ${t.premium_override ? 'checked' : ''}
              onchange="toggleField('${t.id}', 'premium_override', this.checked)">
          </td>
          <td>
            <input type="checkbox" ${t.dev_tools ? 'checked' : ''}
              onchange="toggleField('${t.id}', 'dev_tools', this.checked)">
          </td>
          <td class="text-muted">${t.notes || '–'}</td>
          <td>
            <button class="btn btn-sm ${t.is_active ? 'btn-primary' : 'btn-ghost'}"
              onclick="toggleField('${t.id}', 'is_active', ${!t.is_active})"
              style="min-width:70px">
              ${t.is_active ? 'Aktiv' : 'Inaktiv'}
            </button>
          </td>
          <td class="text-muted">${formatDate(t.created_at)}</td>
          <td>
            <div style="display:flex;gap:6px">
              <button class="btn btn-ghost btn-sm" onclick="editTester('${t.id}')">✏️</button>
              <button class="btn btn-ghost btn-sm" onclick="deleteTester('${t.id}', '${t.email}')" style="color:var(--danger)">🗑️</button>
            </div>
          </td>
        </tr>
      `;
    }).join('');
  }

  // ─── Toggle Feld (Checkbox/Status) ──────────────────────────────
  window.toggleField = async function(id, field, value) {
    const { error } = await sb
      .from('test_users')
      .update({ [field]: value })
      .eq('id', id);

    if (error) {
      showAlert('alert', 'Fehler: ' + error.message, 'error');
      return;
    }
    await loadTesters();
  };

  // ─── Bearbeiten ─────────────────────────────────────────────────
  window.editTester = function(id) {
    const t = allTesters.find(x => x.id === id);
    if (!t) return;

    document.getElementById('edit-id').value = t.id;
    document.getElementById('input-email').value = t.email;
    document.getElementById('input-role').value = (t.notes || '').toLowerCase().includes('admin') ? 'admin' : 'tester';
    document.getElementById('input-premium').checked = t.premium_override;
    document.getElementById('input-devtools').checked = t.dev_tools;
    document.getElementById('input-notes').value = t.notes || '';
    document.getElementById('form-title').textContent = 'Tester bearbeiten';
    document.getElementById('submit-btn').textContent = 'Speichern';
    document.getElementById('form-cancel-btn').style.display = '';

    document.getElementById('tester-form').scrollIntoView({ behavior: 'smooth' });
  };

  // ─── Formular zurücksetzen ──────────────────────────────────────
  window.resetForm = function() {
    document.getElementById('edit-id').value = '';
    document.getElementById('input-email').value = '';
    document.getElementById('input-role').value = 'tester';
    document.getElementById('input-premium').checked = true;
    document.getElementById('input-devtools').checked = true;
    document.getElementById('input-notes').value = '';
    document.getElementById('form-title').textContent = 'Neuen Tester hinzufügen';
    document.getElementById('submit-btn').textContent = 'Hinzufügen';
    document.getElementById('form-cancel-btn').style.display = 'none';
  };

  // ─── Löschen ────────────────────────────────────────────────────
  window.deleteTester = async function(id, email) {
    if (!confirm(`Tester "${email}" wirklich löschen?\n\nDiese Aktion kann nicht rückgängig gemacht werden.`)) return;

    const { error } = await sb
      .from('test_users')
      .delete()
      .eq('id', id);

    if (error) {
      showAlert('alert', 'Löschen fehlgeschlagen: ' + error.message, 'error');
      return;
    }

    showAlert('alert', `${email} wurde gelöscht.`, 'success');
    await loadTesters();
  };

  // ─── Formular Submit ────────────────────────────────────────────
  document.getElementById('tester-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const editId = document.getElementById('edit-id').value;
    const email = document.getElementById('input-email').value.trim().toLowerCase();
    const role = document.getElementById('input-role').value;
    const premium = document.getElementById('input-premium').checked;
    const devtools = document.getElementById('input-devtools').checked;
    const notes = document.getElementById('input-notes').value.trim() || (role === 'admin' ? 'Admin' : null);

    if (!email) {
      showAlert('alert', 'E-Mail ist ein Pflichtfeld.', 'error');
      return;
    }

    if (editId) {
      // UPDATE
      const { error } = await sb
        .from('test_users')
        .update({
          email,
          premium_override: premium,
          dev_tools: devtools,
          notes: notes,
        })
        .eq('id', editId);

      if (error) {
        showAlert('alert', 'Speichern fehlgeschlagen: ' + error.message, 'error');
        return;
      }

      showAlert('alert', `${email} wurde aktualisiert.`, 'success');
    } else {
      // INSERT — Duplikat prüfen
      const exists = allTesters.some(t => t.email.toLowerCase() === email);
      if (exists) {
        showAlert('alert', `${email} ist bereits als Tester eingetragen.`, 'error');
        return;
      }

      const { error } = await sb
        .from('test_users')
        .insert({
          email,
          is_active: true,
          premium_override: premium,
          dev_tools: devtools,
          notes: notes,
        });

      if (error) {
        showAlert('alert', 'Hinzufügen fehlgeschlagen: ' + error.message, 'error');
        return;
      }

      showAlert('alert', `${email} wurde als Tester hinzugefügt.`, 'success');
    }

    resetForm();
    await loadTesters();
  });

  // ─── Initial laden ──────────────────────────────────────────────
  await loadTesters();
})();
</script>

</body>
</html>
