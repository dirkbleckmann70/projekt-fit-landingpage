<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Einsatzorte – Projekt Fit Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../shared/table-utils.css">
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="header" id="header"></header>
    <div class="content">

      <div id="alert-box" class="alert"></div>

      <div class="table-wrap">
        <div class="table-header">
          <div class="table-title">Einsatzorte</div>
          <div class="table-actions">
            <button class="btn btn-primary" onclick="openNewModal()">+ Neuer Einsatzort</button>
          </div>
        </div>
        <table id="locations-table">
          <thead>
            <tr>
              <th>Stadt</th>
              <th>Status</th>
              <th>Erstellt am</th>
              <th>Aktionen</th>
            </tr>
          </thead>
          <tbody id="locations-body">
            <tr><td colspan="4" class="loading-overlay"><span class="spinner"></span> Laden...</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<!-- ─── New / Edit Location Modal ──────────────────────────────── -->
<div class="modal-overlay" id="location-modal">
  <div class="modal" style="max-width:500px">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Neuer Einsatzort</div>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <form id="location-form">
        <div class="form-group">
          <label>Stadt *</label>
          <input class="form-control" id="f-city" required placeholder="z.B. Köln">
        </div>
        <div class="form-group" style="display:flex;align-items:center;gap:8px;padding-top:8px">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <input type="checkbox" id="f-active" checked> Aktiv
          </label>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-primary" id="modal-save-btn" onclick="saveLocation()">Speichern</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-guard.js"></script>
<script src="../shared/table-utils.js"></script>
<script>
  let allLocations = [];
  let editingLocationId = null;
  let tableFilter;

  (async () => {
    const user = await checkAdminAuth();
    if (!user) return;

    document.getElementById('sidebar').innerHTML = renderSidebar('locations');
    document.getElementById('header').innerHTML = renderHeader('Einsatzorte');

    await loadLocations();

    tableFilter = initSortableTable('locations-table', [
      { key: 'city',       type: 'text',   getValue: l => l.city || '' },
      { key: 'status',     type: 'select', getValue: l => l.is_active !== false ? 'Aktiv' : 'Inaktiv' },
      { key: 'created_at', type: 'date',   getValue: l => l.created_at ? l.created_at.slice(0, 10) : '' },
      null,
    ]);
    tableFilter.onFilterChange(() => renderLocations());
  })();

  async function loadLocations() {
    try {
      const res = await adminApi('/api/admin?action=data&type=service_locations');
      allLocations = res.data || [];
      renderLocations();
    } catch (err) {
      document.getElementById('locations-body').innerHTML =
        `<tr><td colspan="4" class="text-error" style="padding:20px">Fehler: ${err.message}</td></tr>`;
    }
  }

  function renderLocations() {
    const filtered = tableFilter ? tableFilter.apply(allLocations) : allLocations;
    const tbody = document.getElementById('locations-body');
    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted" style="padding:24px">Keine Einsatzorte gefunden</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map(l => `
      <tr>
        <td><strong>${l.city}</strong></td>
        <td>${l.is_active !== false ? '<span class="badge badge-active">Aktiv</span>' : '<span class="badge badge-paused">Inaktiv</span>'}</td>
        <td class="text-muted">${formatDate(l.created_at)}</td>
        <td>
          <div class="action-cell">
            <button class="btn btn-secondary btn-sm" onclick="editLocation('${l.id}')">Bearbeiten</button>
            <button class="btn btn-sm ${l.is_active !== false ? 'btn-danger' : 'btn-success'}"
              onclick="toggleActive('${l.id}', ${l.is_active === false})">
              ${l.is_active !== false ? 'Deaktivieren' : 'Aktivieren'}
            </button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  function openNewModal() {
    editingLocationId = null;
    document.getElementById('modal-title').textContent = 'Neuer Einsatzort';
    document.getElementById('location-form').reset();
    document.getElementById('f-active').checked = true;
    document.getElementById('location-modal').classList.add('open');
  }

  function editLocation(id) {
    const l = allLocations.find(x => x.id === id);
    if (!l) return;
    editingLocationId = id;
    document.getElementById('modal-title').textContent = 'Einsatzort bearbeiten';
    document.getElementById('f-city').value = l.city || '';
    document.getElementById('f-active').checked = l.is_active !== false;
    document.getElementById('location-modal').classList.add('open');
  }

  async function saveLocation() {
    const city = document.getElementById('f-city').value.trim();
    if (!city) { alert('Stadt ist ein Pflichtfeld.'); return; }

    const payload = {
      city,
      is_active: document.getElementById('f-active').checked,
    };

    const btn = document.getElementById('modal-save-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';

    try {
      if (editingLocationId) {
        payload.id = editingLocationId;
        await adminApi('/api/admin?action=locations', { method: 'PUT', body: JSON.stringify(payload) });
      } else {
        await adminApi('/api/admin?action=locations', { method: 'POST', body: JSON.stringify(payload) });
      }
      closeModal();
      showAlert('alert-box', editingLocationId ? 'Einsatzort aktualisiert!' : 'Einsatzort erstellt!', 'success');
      await loadLocations();
    } catch (err) {
      showAlert('alert-box', 'Fehler: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Speichern';
    }
  }

  async function toggleActive(id, newState) {
    try {
      await adminApi('/api/admin?action=locations', {
        method: 'PUT',
        body: JSON.stringify({ id, is_active: newState }),
      });
      await loadLocations();
    } catch (err) {
      showAlert('alert-box', 'Fehler: ' + err.message, 'error');
    }
  }

  function closeModal() {
    document.getElementById('location-modal').classList.remove('open');
    editingLocationId = null;
  }

  document.querySelectorAll('.modal-overlay').forEach(o => {
    o.addEventListener('click', e => {
      if (e.target === o) { o.classList.remove('open'); editingLocationId = null; }
    });
  });
</script>

</body>
</html>
