<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kunden – Projekt Fit Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../shared/table-utils.css">
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="header" id="header"></header>
    <div class="content">

      <div id="alert-box" class="alert"></div>

      <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px 16px">
        Kundendaten werden über die App erfasst. Hier kannst du Kunden einsehen und verwalten.
      </p>

      <div class="table-wrap">
        <div class="table-header">
          <div class="table-title">Kunden-Verwaltung</div>
          <div class="table-actions">
            <button class="btn btn-primary" onclick="openNewModal()">+ Kunde anlegen</button>
          </div>
        </div>
        <div style="overflow-x:auto">
          <table id="customers-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>E-Mail</th>
                <th>Telefon</th>
                <th>Stadt</th>
                <th>Geb.datum</th>
                <th>AGB</th>
                <th>Vertrag</th>
                <th>Gesundheit</th>
                <th>Registriert am</th>
                <th>Aktionen</th>
              </tr>
            </thead>
            <tbody id="customers-body">
              <tr><td colspan="10" class="loading-overlay"><span class="spinner"></span> Kunden werden geladen...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- New Customer Modal -->
<div class="modal-overlay" id="new-modal">
  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <div class="modal-title">Neuen Kunden anlegen</div>
      <button class="modal-close" onclick="closeNewModal()">&times;</button>
    </div>
    <div class="modal-body">
      <form id="new-customer-form">
        <div class="two-col">
          <div class="form-group">
            <label>Vorname *</label>
            <input class="form-control" id="new-firstname" required>
          </div>
          <div class="form-group">
            <label>Nachname *</label>
            <input class="form-control" id="new-lastname" required>
          </div>
        </div>
        <div class="two-col">
          <div class="form-group">
            <label>E-Mail *</label>
            <input class="form-control" type="email" id="new-email" required>
          </div>
          <div class="form-group">
            <label>Telefon</label>
            <input class="form-control" id="new-phone">
          </div>
        </div>
        <div class="form-group">
          <label>Straße und Hausnummer</label>
          <input class="form-control" id="new-street">
        </div>
        <div class="two-col">
          <div class="form-group">
            <label>PLZ</label>
            <input class="form-control" id="new-postal">
          </div>
          <div class="form-group">
            <label>Ort</label>
            <input class="form-control" id="new-city">
          </div>
        </div>
        <div class="form-group">
          <label>Geburtsdatum</label>
          <input class="form-control" type="date" id="new-dob">
        </div>
        <div class="form-group">
          <label>Notizen</label>
          <textarea class="form-control" id="new-notes" rows="3"></textarea>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeNewModal()">Abbrechen</button>
      <button class="btn btn-primary" id="new-save-btn" onclick="createCustomer()">Anlegen</button>
    </div>
  </div>
</div>

<!-- Customer Detail Modal -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal" style="max-width:700px">
    <div class="modal-header">
      <div class="modal-title" id="detail-title">Kunden-Details</div>
      <button class="modal-close" onclick="closeDetailModal()">&times;</button>
    </div>
    <div class="modal-body" id="detail-body"></div>
    <div class="modal-footer" id="detail-footer">
      <button class="btn btn-danger" id="detail-delete-btn" onclick="deleteCustomer()">Löschen</button>
      <div style="flex:1"></div>
      <button class="btn btn-ghost" onclick="closeDetailModal()">Schließen</button>
      <button class="btn btn-primary" id="detail-save-btn" onclick="saveCustomer()">Speichern</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-guard.js"></script>
<script src="../shared/table-utils.js"></script>
<script src="../shared/form-dirty.js"></script>
<script>
  let allCustomers = [];
  let tableFilter;

  function formatDateDE(dateStr) {
    if (!dateStr) return '–';
    const parts = dateStr.split('-');
    if (parts.length === 3) return parts[2] + '.' + parts[1] + '.' + parts[0];
    return dateStr;
  }

  (async () => {
    const user = await checkAdminAuth();
    if (!user) return;

    document.getElementById('sidebar').innerHTML = renderSidebar('customers');
    document.getElementById('header').innerHTML = renderHeader('Kunden');

    await loadCustomers();

    tableFilter = initSortableTable('customers-table', [
      { key: 'full_name',  type: 'text',   getValue: c => c.full_name || (c.first_name + ' ' + c.last_name) || '' },
      { key: 'email',      type: 'text',   getValue: c => c.email || '' },
      { key: 'phone',      type: 'text',   getValue: c => c.phone || '' },
      { key: 'city',       type: 'select', getValue: c => c.city || '\u2013' },
      null,
      { key: 'terms',      type: 'select', getValue: c => c.terms_accepted ? 'Akzeptiert' : 'Offen' },
      { key: 'contract',   type: 'select', getValue: c => c.service_contract_accepted ? 'Akzeptiert' : 'Offen' },
      { key: 'health',     type: 'select', getValue: c => c.health_declaration_accepted ? 'Akzeptiert' : 'Offen' },
      { key: 'created_at', type: 'date',   getValue: c => c.created_at ? c.created_at.slice(0, 10) : '' },
      null,
    ]);
    tableFilter.onFilterChange(() => renderCustomers());
  })();

  async function loadCustomers() {
    try {
      const res = await adminApi('/api/admin?action=data&type=all_customers');
      allCustomers = res.data || [];
      renderCustomers();
    } catch (err) {
      document.getElementById('customers-body').innerHTML =
        `<tr><td colspan="7" class="text-error" style="padding:20px">Fehler: ${err.message}</td></tr>`;
    }
  }

  function renderCustomers() {
    let filtered = tableFilter ? tableFilter.apply(allCustomers) : allCustomers;

    const tbody = document.getElementById('customers-body');

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted" style="padding:24px">Keine Kunden gefunden</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map(c => {
      const dobFormatted = c.date_of_birth ? formatDateDE(c.date_of_birth) : '–';
      const termsBadge = c.terms_accepted
        ? '<span class="badge badge-active">Ja</span>'
        : '<span class="badge badge-red">Nein</span>';
      const contractBadge = c.service_contract_accepted
        ? '<span class="badge badge-active">Ja</span>'
        : '<span class="badge badge-red">Nein</span>';
      const healthBadge = c.health_declaration_accepted
        ? '<span class="badge badge-active">Ja</span>'
        : '<span class="badge badge-red">Nein</span>';
      return `
        <tr>
          <td><strong>${c.full_name || (c.first_name + ' ' + c.last_name) || '–'}</strong></td>
          <td class="text-secondary">${c.email || '–'}</td>
          <td>${c.phone || '–'}</td>
          <td>${c.city || '–'}</td>
          <td class="text-muted">${dobFormatted}</td>
          <td>${termsBadge}</td>
          <td>${contractBadge}</td>
          <td>${healthBadge}</td>
          <td class="text-muted">${formatDate(c.created_at)}</td>
          <td>
            <button class="btn btn-secondary btn-sm" onclick="showDetail('${c.id}')">Details</button>
          </td>
        </tr>
      `;
    }).join('');
  }

  // New Customer
  function openNewModal() {
    document.getElementById('new-customer-form').reset();
    document.getElementById('new-modal').classList.add('open');
  }
  function closeNewModal() {
    document.getElementById('new-modal').classList.remove('open');
  }

  async function createCustomer() {
    const firstname = document.getElementById('new-firstname').value.trim();
    const lastname = document.getElementById('new-lastname').value.trim();
    const email = document.getElementById('new-email').value.trim();

    if (!firstname || !lastname || !email) {
      alert('Vorname, Nachname und E-Mail sind Pflichtfelder.');
      return;
    }

    const btn = document.getElementById('new-save-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';

    try {
      await adminApi('/api/admin?action=customers', {
        method: 'POST',
        body: JSON.stringify({
          first_name: firstname,
          last_name: lastname,
          email,
          phone: document.getElementById('new-phone').value.trim() || null,
          street_address: document.getElementById('new-street').value.trim() || null,
          postal_code: document.getElementById('new-postal').value.trim() || null,
          city: document.getElementById('new-city').value.trim() || null,
          date_of_birth: document.getElementById('new-dob').value || null,
          notes: document.getElementById('new-notes').value.trim() || null,
        }),
      });
      closeNewModal();
      showAlert('alert-box', 'Kunde angelegt!', 'success');
      await loadCustomers();
    } catch (err) {
      showAlert('alert-box', 'Fehler: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Anlegen';
    }
  }

  // Customer Detail
  async function showDetail(id) {
    const c = allCustomers.find(x => x.id === id);
    if (!c) return;

    currentDetailId = id;
    editMode = false;

    document.getElementById('detail-title').textContent = c.full_name || 'Kunden-Details';

    const dobFormatted = c.date_of_birth ? formatDateDE(c.date_of_birth) : '–';

    // Vertragsstatus Badges
    const termsBadge = c.terms_accepted
      ? '<span class="badge badge-active">Akzeptiert</span>'
      : '<span class="badge badge-red">Nicht akzeptiert</span>';
    const termsDate = c.terms_accepted_at ? formatDateTime(c.terms_accepted_at) : '–';

    const serviceContractBadge = c.service_contract_accepted
      ? '<span class="badge badge-active">Akzeptiert</span>'
      : '<span class="badge badge-red">Nicht akzeptiert</span>';
    const serviceContractDate = c.service_contract_accepted_at ? formatDateTime(c.service_contract_accepted_at) : '–';

    const healthBadge = c.health_declaration_accepted
      ? '<span class="badge badge-active">Akzeptiert</span>'
      : '<span class="badge badge-red">Nicht ausgefüllt</span>';
    const healthDate = c.health_declaration_accepted_at ? formatDateTime(c.health_declaration_accepted_at) : '–';

    // Gesundheitserklärung Details
    const healthLabels = {
      heart_disease: 'Herz-Kreislauf-Erkrankungen',
      joint_problems: 'Gelenkprobleme',
      respiratory: 'Atemwegserkrankungen',
      medical_treatment: 'Aktuell in ärztl. Behandlung',
      medication: 'Medikamenteneinnahme',
      recent_surgery: 'Kürzliche Operation',
      pregnant: 'Schwangerschaft',
      other_conditions: 'Sonstige Erkrankungen',
    };
    let healthHtml = '';
    const hd = c.health_declaration;
    if (hd && typeof hd === 'object') {
      healthHtml = Object.entries(healthLabels).map(([key, label]) => {
        const val = hd[key];
        const badge = val ? '<span style="color:#E74C3C;font-weight:700">Ja</span>' : '<span style="color:#27AE60;font-weight:700">Nein</span>';
        return `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04)"><span style="font-size:13px;color:var(--text-secondary)">${label}</span>${badge}</div>`;
      }).join('');
      if (hd.additional_notes) {
        healthHtml += `<div style="margin-top:8px"><span style="font-size:12px;color:var(--text-muted)">Anmerkungen:</span><p style="font-size:13px;margin-top:4px">${hd.additional_notes}</p></div>`;
      }
    }

    let html = `
      <form id="customer-detail-form">
      <div class="two-col">
        <div class="form-group">
          <label>Vorname</label>
          <input class="form-control edit-field" id="edit-firstname" value="${c.first_name || ''}">
        </div>
        <div class="form-group">
          <label>Nachname</label>
          <input class="form-control edit-field" id="edit-lastname" value="${c.last_name || ''}">
        </div>
      </div>
      <div class="two-col">
        <div class="form-group">
          <label>E-Mail</label>
          <input class="form-control edit-field" type="email" id="edit-email" value="${c.email || ''}">
        </div>
        <div class="form-group">
          <label>Telefon</label>
          <input class="form-control edit-field" id="edit-phone" value="${c.phone || ''}">
        </div>
      </div>
      <div class="form-group">
        <label>Straße und Hausnummer</label>
        <input class="form-control edit-field" id="edit-street" value="${c.street_address || ''}">
      </div>
      <div class="two-col">
        <div class="form-group">
          <label>PLZ</label>
          <input class="form-control edit-field" id="edit-postal" value="${c.postal_code || ''}">
        </div>
        <div class="form-group">
          <label>Ort</label>
          <input class="form-control edit-field" id="edit-city" value="${c.city || ''}">
        </div>
      </div>
      <div class="form-group">
        <label>Geburtsdatum</label>
        <input class="form-control edit-field" type="date" id="edit-dob" value="${c.date_of_birth || ''}">
      </div>
      <div class="form-group">
        <label>Notizen</label>
        <textarea class="form-control edit-field" id="edit-notes" rows="3">${c.notes || ''}</textarea>
      </div>
      <p class="text-muted" style="font-size:12px">Registriert: ${formatDateTime(c.created_at)} · ID: ${c.id}</p>
      </form>

      <hr style="border-color:#2a2a2a;margin:20px 0">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Vertragsstatus</h3>
      <div class="two-col">
        <div class="form-group">
          <label>AGB</label>
          <div style="padding:4px 0">${termsBadge}</div>
          <span class="text-muted" style="font-size:11px">${termsDate}</span>
        </div>
        <div class="form-group">
          <label>Dienstleistungsvertrag</label>
          <div style="padding:4px 0">${serviceContractBadge}</div>
          <span class="text-muted" style="font-size:11px">${serviceContractDate}</span>
        </div>
      </div>

      <hr style="border-color:#2a2a2a;margin:20px 0">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Gesundheitserklärung ${healthBadge}</h3>
      ${healthHtml
        ? `<div style="background:#161625;border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:12px 16px">${healthHtml}</div>
           <span class="text-muted" style="font-size:11px;display:block;margin-top:6px">Akzeptiert am: ${healthDate}</span>`
        : '<p class="text-muted" style="font-size:13px">Noch nicht ausgefüllt.</p>'
      }

      <hr style="border-color:#2a2a2a;margin:20px 0">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Dokumente & Verträge</h3>
      <div id="customer-docs">
        ${renderDocList(c.document_files || [], c.id)}
      </div>
      <div style="margin-top:12px">
        <label class="btn btn-secondary btn-sm" style="cursor:pointer;display:inline-flex;align-items:center;gap:6px">
          <input type="file" id="customer-doc-upload" multiple accept=".pdf,.jpg,.jpeg,.png" style="display:none"
            onchange="uploadCustomerDoc('${c.id}')">
          + Dokument hochladen
        </label>
        <span id="customer-doc-status" style="font-size:12px;color:var(--text-muted);margin-left:8px">PDF, JPG, PNG – max 10 MB</span>
      </div>

      <hr style="border-color:#2a2a2a;margin:20px 0">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Buchungshistorie</h3>
      <div id="customer-bookings"><div class="loading-overlay"><span class="spinner"></span> Laden...</div></div>
    `;

    document.getElementById('detail-body').innerHTML = html;
    document.getElementById('detail-modal').classList.add('open');

    if (window._customerDirty) window._customerDirty.destroy();
    window._customerDirty = initFormDirty({
      form: document.getElementById('customer-detail-form'),
      saveBtnId: 'detail-save-btn',
      onSave: saveCustomer,
    });

    // Load customer bookings
    try {
      const res = await adminApi(`/api/admin?action=data&type=customer_bookings&customer_id=${encodeURIComponent(c.id)}`);
      const bookings = res.data || [];
      const bookingsEl = document.getElementById('customer-bookings');

      if (bookings.length === 0) {
        bookingsEl.innerHTML = '<p class="text-muted text-center" style="padding:12px">Keine Buchungen vorhanden.</p>';
      } else {
        bookingsEl.innerHTML = `
          <table>
            <thead><tr>
              <th>Datum</th>
              <th>Trainer</th>
              <th>Status</th>
              <th>Preis</th>
            </tr></thead>
            <tbody>
              ${bookings.map(b => `
                <tr>
                  <td>${formatDate(b.scheduled_date)}</td>
                  <td>${b.trainer_name || '–'}</td>
                  <td>${statusBadge(b.status)}</td>
                  <td class="text-accent">${['cancelled','refunded','cancelled_by_trainer'].includes((b.status||'').toLowerCase()) ? '0,00\u00a0€' : formatEuro(b.price_cents || b.final_price_cents)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }
    } catch (err) {
      document.getElementById('customer-bookings').innerHTML =
        `<p class="text-error" style="font-size:13px">Buchungen konnten nicht geladen werden: ${err.message}</p>`;
    }
  }

  function closeDetailModal() {
    if (window._customerDirty && window._customerDirty.isDirty()) {
      window._customerDirty.confirmDiscard(function () {
        window._customerDirty = null;
        document.getElementById('detail-modal').classList.remove('open');
      });
      return;
    }
    if (window._customerDirty) { window._customerDirty.destroy(); window._customerDirty = null; }
    document.getElementById('detail-modal').classList.remove('open');
  }

  // Document helpers
  function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function renderDocList(files, customerId) {
    if (!files || files.length === 0) {
      return '<p style="color:var(--text-muted);font-size:13px">Keine Dokumente hochgeladen.</p>';
    }
    return files.map(f => {
      const date = f.uploaded_at ? new Date(f.uploaded_at).toLocaleDateString('de-DE') : '–';
      const size = f.size_bytes ? formatFileSize(f.size_bytes) : '–';
      const icon = (f.content_type === 'application/pdf' || (f.filename && f.filename.endsWith('.pdf'))) ? 'PDF' : 'IMG';
      return `
        <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#161625;border:1px solid rgba(255,255,255,0.06);border-radius:10px;margin-bottom:8px">
          <div style="width:36px;height:36px;border-radius:8px;background:rgba(46,117,182,0.12);color:#2E75B6;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0">${icon}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.filename}</div>
            <div style="font-size:11px;color:var(--text-muted)">${date} &middot; ${size}</div>
          </div>
          <button class="btn btn-secondary btn-sm" style="font-size:11px;padding:4px 10px" onclick="viewCustomerDoc('${f.path}')">Anzeigen</button>
          <button class="btn btn-danger btn-sm" style="font-size:11px;padding:4px 10px" onclick="deleteCustomerDoc('${customerId}','${f.path}')">L&ouml;schen</button>
        </div>
      `;
    }).join('');
  }

  async function viewCustomerDoc(path) {
    try {
      const res = await adminApi('/api/admin?action=get-file-url', {
        method: 'POST',
        body: JSON.stringify({ path, bucket: 'trainer-documents' }),
      });
      if (res.url) window.open(res.url, '_blank');
    } catch (err) {
      showAlert('alert-box', 'Fehler: ' + err.message, 'error');
    }
  }

  async function uploadCustomerDoc(customerId) {
    const input = document.getElementById('customer-doc-upload');
    const status = document.getElementById('customer-doc-status');
    const filesList = input.files;
    if (!filesList || filesList.length === 0) return;

    status.textContent = 'Hochladen...';

    try {
      const formData = new FormData();
      formData.append('customerId', customerId);
      for (let i = 0; i < filesList.length; i++) {
        formData.append('files', filesList[i]);
      }

      const resp = await fetch('/api/upload-license', {
        method: 'POST',
        body: formData,
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Upload fehlgeschlagen');

      showAlert('alert-box', `${result.files.length} Dokument(e) hochgeladen!`, 'success');
      await loadCustomers();
      const updated = allCustomers.find(x => x.id === customerId);
      if (updated) {
        document.getElementById('customer-docs').innerHTML = renderDocList(updated.document_files || [], customerId);
      }
    } catch (err) {
      showAlert('alert-box', 'Upload-Fehler: ' + err.message, 'error');
    }

    status.textContent = 'PDF, JPG, PNG – max 10 MB';
    input.value = '';
  }

  async function deleteCustomerDoc(customerId, path) {
    if (!confirm('Dokument wirklich löschen?')) return;
    try {
      await adminApi('/api/admin?action=delete-storage-file', {
        method: 'POST',
        body: JSON.stringify({ path, bucket: 'trainer-documents' }),
      });

      const c = allCustomers.find(x => x.id === customerId);
      const updatedDocs = (c?.document_files || []).filter(f => f.path !== path);
      await adminApi('/api/admin?action=customers', {
        method: 'PUT',
        body: JSON.stringify({ id: customerId, document_files: updatedDocs }),
      });

      showAlert('alert-box', 'Dokument gelöscht!', 'success');
      await loadCustomers();
      const updated = allCustomers.find(x => x.id === customerId);
      if (updated) {
        document.getElementById('customer-docs').innerHTML = renderDocList(updated.document_files || [], customerId);
      }
    } catch (err) {
      showAlert('alert-box', 'Fehler: ' + err.message, 'error');
    }
  }

  // ─── Edit Mode ──────────────────────────────────────────────
  let currentDetailId = null;

  async function saveCustomer() {
    if (!currentDetailId) return;
    const btn = document.getElementById('detail-save-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';

    try {
      await adminApi('/api/admin?action=customers', {
        method: 'PUT',
        body: JSON.stringify({
          id: currentDetailId,
          first_name: document.getElementById('edit-firstname').value.trim() || null,
          last_name: document.getElementById('edit-lastname').value.trim() || null,
          email: document.getElementById('edit-email').value.trim() || null,
          phone: document.getElementById('edit-phone').value.trim() || null,
          street_address: document.getElementById('edit-street').value.trim() || null,
          postal_code: document.getElementById('edit-postal').value.trim() || null,
          city: document.getElementById('edit-city').value.trim() || null,
          date_of_birth: document.getElementById('edit-dob').value || null,
          notes: document.getElementById('edit-notes').value.trim() || null,
        }),
      });
      if (window._customerDirty) window._customerDirty.reset();
      closeDetailModal();
      showAlert('alert-box', 'Kunde gespeichert!', 'success');
      await loadCustomers();
    } catch (err) {
      showAlert('alert-box', 'Fehler: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Speichern';
    }
  }

  async function deleteCustomer() {
    if (!currentDetailId) return;
    if (!confirm('Diesen Kunden wirklich löschen? Diese Aktion kann nicht rückgängig gemacht werden.')) return;

    const btn = document.getElementById('detail-delete-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';

    try {
      await adminApi('/api/admin?action=customers', {
        method: 'DELETE',
        body: JSON.stringify({ id: currentDetailId }),
      });
      closeDetailModal();
      showAlert('alert-box', 'Kunde gelöscht!', 'success');
      await loadCustomers();
    } catch (err) {
      showAlert('alert-box', err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Löschen';
    }
  }

  // Modal overlay clicks
  document.querySelectorAll('.modal-overlay').forEach(o => {
    o.addEventListener('click', e => {
      if (e.target === o) {
        if (o.id === 'detail-modal') {
          closeDetailModal();
        } else {
          o.classList.remove('open');
        }
      }
    });
  });
</script>

</body>
</html>
