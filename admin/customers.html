<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kunden – Projekt Fit Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="header" id="header"></header>
    <div class="content">

      <div id="alert-box" class="alert"></div>

      <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px 16px">
        Kundendaten werden über die App erfasst. Hier kannst du Kunden einsehen und verwalten.
      </p>

      <div class="table-wrap">
        <div class="table-header">
          <div class="table-title">Kunden-Verwaltung</div>
          <div class="table-actions">
            <input type="text" class="search-input" id="search" placeholder="Name oder E-Mail suchen...">
            <div class="filter-tabs" id="filter-tabs">
              <button class="filter-tab active" data-filter="all">Alle</button>
              <button class="filter-tab" data-filter="contract">Mit Vertrag</button>
              <button class="filter-tab" data-filter="no-contract">Ohne Vertrag</button>
            </div>
            <button class="btn btn-primary" onclick="openNewModal()">+ Kunde anlegen</button>
          </div>
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>E-Mail</th>
                <th>Telefon</th>
                <th>Stadt</th>
                <th>Vertrag</th>
                <th>Registriert am</th>
                <th>Aktionen</th>
              </tr>
            </thead>
            <tbody id="customers-body">
              <tr><td colspan="7" class="loading-overlay"><span class="spinner"></span> Kunden werden geladen...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- New Customer Modal -->
<div class="modal-overlay" id="new-modal">
  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <div class="modal-title">Neuen Kunden anlegen</div>
      <button class="modal-close" onclick="closeNewModal()">&times;</button>
    </div>
    <div class="modal-body">
      <form id="new-customer-form">
        <div class="two-col">
          <div class="form-group">
            <label>Vorname *</label>
            <input class="form-control" id="new-firstname" required>
          </div>
          <div class="form-group">
            <label>Nachname *</label>
            <input class="form-control" id="new-lastname" required>
          </div>
        </div>
        <div class="two-col">
          <div class="form-group">
            <label>E-Mail *</label>
            <input class="form-control" type="email" id="new-email" required>
          </div>
          <div class="form-group">
            <label>Telefon</label>
            <input class="form-control" id="new-phone">
          </div>
        </div>
        <div class="form-group">
          <label>Straße und Hausnummer</label>
          <input class="form-control" id="new-street">
        </div>
        <div class="two-col">
          <div class="form-group">
            <label>PLZ</label>
            <input class="form-control" id="new-postal">
          </div>
          <div class="form-group">
            <label>Ort</label>
            <input class="form-control" id="new-city">
          </div>
        </div>
        <div class="form-group">
          <label>Notizen</label>
          <textarea class="form-control" id="new-notes" rows="3"></textarea>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeNewModal()">Abbrechen</button>
      <button class="btn btn-primary" id="new-save-btn" onclick="createCustomer()">Anlegen</button>
    </div>
  </div>
</div>

<!-- Customer Detail Modal -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal" style="max-width:700px">
    <div class="modal-header">
      <div class="modal-title" id="detail-title">Kunden-Details</div>
      <button class="modal-close" onclick="closeDetailModal()">&times;</button>
    </div>
    <div class="modal-body" id="detail-body"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeDetailModal()">Schließen</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-guard.js"></script>
<script>
  let allCustomers = [];
  let currentFilter = 'all';
  let currentSearch = '';

  (async () => {
    const user = await checkAdminAuth();
    if (!user) return;

    document.getElementById('sidebar').innerHTML = renderSidebar('customers');
    document.getElementById('header').innerHTML = renderHeader('Kunden');

    await loadCustomers();

    document.querySelectorAll('#filter-tabs .filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('#filter-tabs .filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.filter;
        renderCustomers();
      });
    });

    document.getElementById('search').addEventListener('input', (e) => {
      currentSearch = e.target.value.toLowerCase();
      renderCustomers();
    });
  })();

  async function loadCustomers() {
    try {
      const res = await adminApi('/api/admin?action=data&type=all_customers');
      allCustomers = res.data || [];
      renderCustomers();
    } catch (err) {
      document.getElementById('customers-body').innerHTML =
        `<tr><td colspan="7" class="text-error" style="padding:20px">Fehler: ${err.message}</td></tr>`;
    }
  }

  function renderCustomers() {
    let filtered = allCustomers;

    if (currentFilter === 'contract') {
      filtered = filtered.filter(c => c.contract_accepted);
    } else if (currentFilter === 'no-contract') {
      filtered = filtered.filter(c => !c.contract_accepted);
    }

    if (currentSearch) {
      filtered = filtered.filter(c =>
        (c.full_name || '').toLowerCase().includes(currentSearch) ||
        (c.first_name || '').toLowerCase().includes(currentSearch) ||
        (c.last_name || '').toLowerCase().includes(currentSearch) ||
        (c.email || '').toLowerCase().includes(currentSearch)
      );
    }

    const tbody = document.getElementById('customers-body');

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted" style="padding:24px">Keine Kunden gefunden</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map(c => {
      const contractBadge = c.contract_accepted
        ? '<span class="badge badge-active">Vertrag akzeptiert</span>'
        : '<span class="badge badge-red">Kein Vertrag</span>';
      return `
        <tr>
          <td><strong>${c.full_name || (c.first_name + ' ' + c.last_name) || '–'}</strong></td>
          <td class="text-secondary">${c.email || '–'}</td>
          <td>${c.phone || '–'}</td>
          <td>${c.city || '–'}</td>
          <td>${contractBadge}</td>
          <td class="text-muted">${formatDate(c.created_at)}</td>
          <td>
            <button class="btn btn-secondary btn-sm" onclick="showDetail('${c.id}')">Details</button>
          </td>
        </tr>
      `;
    }).join('');
  }

  // New Customer
  function openNewModal() {
    document.getElementById('new-customer-form').reset();
    document.getElementById('new-modal').classList.add('open');
  }
  function closeNewModal() {
    document.getElementById('new-modal').classList.remove('open');
  }

  async function createCustomer() {
    const firstname = document.getElementById('new-firstname').value.trim();
    const lastname = document.getElementById('new-lastname').value.trim();
    const email = document.getElementById('new-email').value.trim();

    if (!firstname || !lastname || !email) {
      alert('Vorname, Nachname und E-Mail sind Pflichtfelder.');
      return;
    }

    const btn = document.getElementById('new-save-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';

    try {
      await adminApi('/api/admin?action=customers', {
        method: 'POST',
        body: JSON.stringify({
          first_name: firstname,
          last_name: lastname,
          email,
          phone: document.getElementById('new-phone').value.trim() || null,
          street_address: document.getElementById('new-street').value.trim() || null,
          postal_code: document.getElementById('new-postal').value.trim() || null,
          city: document.getElementById('new-city').value.trim() || null,
          notes: document.getElementById('new-notes').value.trim() || null,
        }),
      });
      closeNewModal();
      showAlert('alert-box', 'Kunde angelegt!', 'success');
      await loadCustomers();
    } catch (err) {
      showAlert('alert-box', 'Fehler: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Anlegen';
    }
  }

  // Customer Detail
  async function showDetail(id) {
    const c = allCustomers.find(x => x.id === id);
    if (!c) return;

    document.getElementById('detail-title').textContent = c.full_name || 'Kunden-Details';

    const contractBadge = c.contract_accepted
      ? '<span class="badge badge-active">Vertrag akzeptiert</span>'
      : '<span class="badge badge-red">Kein Vertrag</span>';
    const contractDate = c.contract_accepted_at ? formatDateTime(c.contract_accepted_at) : '–';

    let html = `
      <div class="two-col">
        <div class="form-group">
          <label>Vorname</label>
          <input class="form-control" value="${c.first_name || '–'}" disabled>
        </div>
        <div class="form-group">
          <label>Nachname</label>
          <input class="form-control" value="${c.last_name || '–'}" disabled>
        </div>
      </div>
      <div class="two-col">
        <div class="form-group">
          <label>E-Mail</label>
          <input class="form-control" value="${c.email || '–'}" disabled>
        </div>
        <div class="form-group">
          <label>Telefon</label>
          <input class="form-control" value="${c.phone || '–'}" disabled>
        </div>
      </div>
      <div class="form-group">
        <label>Adresse</label>
        <input class="form-control" value="${[c.street_address, c.postal_code, c.city].filter(Boolean).join(', ') || '–'}" disabled>
      </div>
      <div class="two-col">
        <div class="form-group">
          <label>Vertrag</label>
          <div style="padding:8px 0">${contractBadge}</div>
        </div>
        <div class="form-group">
          <label>Vertrag akzeptiert am</label>
          <input class="form-control" value="${contractDate}" disabled>
        </div>
      </div>
      ${c.notes ? `<div class="form-group"><label>Notizen</label><textarea class="form-control" disabled>${c.notes}</textarea></div>` : ''}
      <p class="text-muted" style="font-size:12px">Registriert: ${formatDateTime(c.created_at)} · ID: ${c.id}</p>

      <hr style="border-color:#2a2a2a;margin:20px 0">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Dokumente & Verträge</h3>
      <div id="customer-docs">
        ${renderDocList(c.document_files || [], c.id)}
      </div>
      <div style="margin-top:12px">
        <label class="btn btn-secondary btn-sm" style="cursor:pointer;display:inline-flex;align-items:center;gap:6px">
          <input type="file" id="customer-doc-upload" multiple accept=".pdf,.jpg,.jpeg,.png" style="display:none"
            onchange="uploadCustomerDoc('${c.id}')">
          + Dokument hochladen
        </label>
        <span id="customer-doc-status" style="font-size:12px;color:var(--text-muted);margin-left:8px">PDF, JPG, PNG – max 10 MB</span>
      </div>

      <hr style="border-color:#2a2a2a;margin:20px 0">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:16px">Buchungshistorie</h3>
      <div id="customer-bookings"><div class="loading-overlay"><span class="spinner"></span> Laden...</div></div>
    `;

    document.getElementById('detail-body').innerHTML = html;
    document.getElementById('detail-modal').classList.add('open');

    // Load customer bookings
    try {
      const res = await adminApi(`/api/admin?action=data&type=customer_bookings&customer_id=${encodeURIComponent(c.email || c.id)}`);
      const bookings = res.data || [];
      const bookingsEl = document.getElementById('customer-bookings');

      if (bookings.length === 0) {
        bookingsEl.innerHTML = '<p class="text-muted text-center" style="padding:12px">Keine Buchungen vorhanden.</p>';
      } else {
        bookingsEl.innerHTML = `
          <table>
            <thead><tr>
              <th>Datum</th>
              <th>Trainer</th>
              <th>Status</th>
              <th>Preis</th>
            </tr></thead>
            <tbody>
              ${bookings.map(b => `
                <tr>
                  <td>${formatDate(b.scheduled_date)}</td>
                  <td>${b.trainer_name || '–'}</td>
                  <td>${statusBadge(b.status)}</td>
                  <td class="text-accent">${formatEuro(b.price_cents || b.final_price_cents)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }
    } catch (err) {
      document.getElementById('customer-bookings').innerHTML =
        `<p class="text-error" style="font-size:13px">Buchungen konnten nicht geladen werden: ${err.message}</p>`;
    }
  }

  function closeDetailModal() {
    document.getElementById('detail-modal').classList.remove('open');
  }

  // Document helpers
  function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function renderDocList(files, customerId) {
    if (!files || files.length === 0) {
      return '<p style="color:var(--text-muted);font-size:13px">Keine Dokumente hochgeladen.</p>';
    }
    return files.map(f => {
      const date = f.uploaded_at ? new Date(f.uploaded_at).toLocaleDateString('de-DE') : '–';
      const size = f.size_bytes ? formatFileSize(f.size_bytes) : '–';
      const icon = (f.content_type === 'application/pdf' || (f.filename && f.filename.endsWith('.pdf'))) ? 'PDF' : 'IMG';
      return `
        <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#161625;border:1px solid rgba(255,255,255,0.06);border-radius:10px;margin-bottom:8px">
          <div style="width:36px;height:36px;border-radius:8px;background:rgba(46,117,182,0.12);color:#2E75B6;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0">${icon}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.filename}</div>
            <div style="font-size:11px;color:var(--text-muted)">${date} &middot; ${size}</div>
          </div>
          <button class="btn btn-secondary btn-sm" style="font-size:11px;padding:4px 10px" onclick="viewCustomerDoc('${f.path}')">Anzeigen</button>
          <button class="btn btn-danger btn-sm" style="font-size:11px;padding:4px 10px" onclick="deleteCustomerDoc('${customerId}','${f.path}')">L&ouml;schen</button>
        </div>
      `;
    }).join('');
  }

  async function viewCustomerDoc(path) {
    try {
      const res = await adminApi('/api/admin?action=get-file-url', {
        method: 'POST',
        body: JSON.stringify({ path, bucket: 'trainer-documents' }),
      });
      if (res.url) window.open(res.url, '_blank');
    } catch (err) {
      showAlert('alert-box', 'Fehler: ' + err.message, 'error');
    }
  }

  async function uploadCustomerDoc(customerId) {
    const input = document.getElementById('customer-doc-upload');
    const status = document.getElementById('customer-doc-status');
    const filesList = input.files;
    if (!filesList || filesList.length === 0) return;

    status.textContent = 'Hochladen...';

    try {
      const c = allCustomers.find(x => x.id === customerId);
      const existingDocs = c?.document_files || [];
      const newDocs = [];

      const token = (await getSupabase().auth.getSession()).data.session?.access_token;

      for (let i = 0; i < filesList.length; i++) {
        const file = filesList[i];
        if (file.size > 10 * 1024 * 1024) {
          showAlert('alert-box', `${file.name} ist zu groß (max 10 MB)`, 'error');
          continue;
        }

        const timestamp = Date.now();
        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
        const storagePath = `customers/${customerId}/${timestamp}_${safeName}`;

        // Upload directly via Supabase Storage REST
        const sb = getSupabase();
        const { error: uploadErr } = await sb.storage.from('trainer-documents').upload(storagePath, file, {
          contentType: file.type,
          upsert: false,
        });

        if (uploadErr) {
          showAlert('alert-box', `Upload-Fehler: ${uploadErr.message}`, 'error');
          continue;
        }

        newDocs.push({
          filename: file.name,
          path: storagePath,
          uploaded_at: new Date().toISOString(),
          size_bytes: file.size,
          content_type: file.type,
        });
      }

      if (newDocs.length > 0) {
        const updatedDocs = [...existingDocs, ...newDocs];
        await adminApi('/api/admin?action=customers', {
          method: 'PUT',
          body: JSON.stringify({ id: customerId, document_files: updatedDocs }),
        });

        showAlert('alert-box', `${newDocs.length} Dokument(e) hochgeladen!`, 'success');
        await loadCustomers();
        const updated = allCustomers.find(x => x.id === customerId);
        if (updated) {
          document.getElementById('customer-docs').innerHTML = renderDocList(updated.document_files || [], customerId);
        }
      }
    } catch (err) {
      showAlert('alert-box', 'Upload-Fehler: ' + err.message, 'error');
    }

    status.textContent = 'PDF, JPG, PNG – max 10 MB';
    input.value = '';
  }

  async function deleteCustomerDoc(customerId, path) {
    if (!confirm('Dokument wirklich löschen?')) return;
    try {
      const sb = getSupabase();
      await sb.storage.from('trainer-documents').remove([path]);

      const c = allCustomers.find(x => x.id === customerId);
      const updatedDocs = (c?.document_files || []).filter(f => f.path !== path);
      await adminApi('/api/admin?action=customers', {
        method: 'PUT',
        body: JSON.stringify({ id: customerId, document_files: updatedDocs }),
      });

      showAlert('alert-box', 'Dokument gelöscht!', 'success');
      await loadCustomers();
      const updated = allCustomers.find(x => x.id === customerId);
      if (updated) {
        document.getElementById('customer-docs').innerHTML = renderDocList(updated.document_files || [], customerId);
      }
    } catch (err) {
      showAlert('alert-box', 'Fehler: ' + err.message, 'error');
    }
  }

  // Modal overlay clicks
  document.querySelectorAll('.modal-overlay').forEach(o => {
    o.addEventListener('click', e => {
      if (e.target === o) o.classList.remove('open');
    });
  });
</script>

</body>
</html>
