<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnose – Projekt Fit</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/css/tabler.min.css">
  <link rel="stylesheet" href="../shared/tabler-custom.css">
  <style>
    .test-row { padding: 8px 0; border-bottom: 1px solid var(--tblr-border-color); }
    .test-ok { color: #27ae60; }
    .test-fail { color: #e74c3c; }
    .test-warn { color: #e8930a; }
    .test-info { color: var(--tblr-secondary-color); font-size: 12px; }
    pre { background: #111; padding: 12px; border-radius: 6px; font-size: 11px; overflow-x: auto; max-height: 200px; }
  </style>
</head>
<body class="page page-center">
<div class="container container-tight py-4">
  <div class="card card-md">
    <div class="card-body">
      <h2 class="text-center mb-4">Verbindungs-Diagnose</h2>
      <div id="results">
        <div class="text-center py-3"><div class="spinner-border spinner-border-sm me-2"></div> Tests laufen...</div>
      </div>
      <hr>
      <h4>localStorage (Supabase)</h4>
      <pre id="ls-data">Wird geladen...</pre>
      <hr>
      <h4>Console-Fehler</h4>
      <pre id="console-errors">Keine</pre>
      <hr>
      <button class="btn btn-primary w-100 mt-2" onclick="location.reload()">Tests wiederholen</button>
      <a href="/admin/" class="btn btn-ghost-secondary w-100 mt-2">Zurueck zum Login</a>
    </div>
  </div>
</div>

<script>
  // Capture all errors
  const capturedErrors = [];
  window.onerror = function(msg, url, line, col, err) {
    capturedErrors.push(`${msg} (${url}:${line}:${col})`);
  };
  window.addEventListener('unhandledrejection', function(e) {
    capturedErrors.push('Promise rejected: ' + (e.reason?.message || e.reason || 'unknown'));
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(async function() {
  const results = document.getElementById('results');
  const tests = [];

  function addTest(name, status, detail) {
    tests.push({ name, status, detail });
    renderTests();
  }

  function renderTests() {
    results.innerHTML = tests.map(t => {
      const cls = t.status === 'OK' ? 'test-ok' : t.status === 'FAIL' ? 'test-fail' : 'test-warn';
      return `<div class="test-row">
        <strong class="${cls}">${t.status}</strong> ${t.name}
        ${t.detail ? `<div class="test-info">${t.detail}</div>` : ''}
      </div>`;
    }).join('');
  }

  // ── Test 1: Supabase Global ────────────────────────────────
  if (typeof supabase !== 'undefined' && typeof supabase.createClient === 'function') {
    addTest('1. Supabase SDK geladen', 'OK', 'window.supabase.createClient verfuegbar');
  } else {
    addTest('1. Supabase SDK geladen', 'FAIL', 'window.supabase ist undefined oder hat kein createClient');
    renderDone(); return;
  }

  // ── Test 2: createClient ───────────────────────────────────
  const SUPABASE_URL = 'https://ahsjydgknmysircubjsk.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_8tZaFMrIrzJXjDbYAF2huw_ygDY9K2Q';
  let sb;
  try {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    addTest('2. createClient()', 'OK', `URL: ${SUPABASE_URL}, Key: ${SUPABASE_ANON_KEY.slice(0, 20)}...`);
  } catch (err) {
    addTest('2. createClient()', 'FAIL', err.message);
    renderDone(); return;
  }

  // ── Test 3: Auth Settings (Netzwerk-Test) ──────────────────
  try {
    const resp = await fetch(`${SUPABASE_URL}/auth/v1/settings`, {
      headers: { 'apikey': SUPABASE_ANON_KEY }
    });
    if (resp.ok) {
      addTest('3. Netzwerk → Supabase Auth', 'OK', `HTTP ${resp.status}`);
    } else {
      addTest('3. Netzwerk → Supabase Auth', 'FAIL', `HTTP ${resp.status} ${resp.statusText}`);
    }
  } catch (err) {
    addTest('3. Netzwerk → Supabase Auth', 'FAIL', `Fetch Error: ${err.message} — Moegliche Ursache: CORS, Netzwerk, Firewall`);
  }

  // ── Test 4: REST API (Datenbank-Test) ──────────────────────
  try {
    const { data, error } = await sb.from('trainer_profiles').select('id, full_name').limit(3);
    if (error) {
      addTest('4. Datenbank-Query (trainer_profiles)', 'FAIL', `Supabase Error: ${error.message} (Code: ${error.code})`);
    } else {
      addTest('4. Datenbank-Query (trainer_profiles)', 'OK', `${data.length} Trainer gefunden: ${data.map(t => t.full_name).join(', ')}`);
    }
  } catch (err) {
    addTest('4. Datenbank-Query (trainer_profiles)', 'FAIL', `Exception: ${err.message}`);
  }

  // ── Test 5: getSession (bestehende Session) ────────────────
  try {
    const { data: { session }, error } = await sb.auth.getSession();
    if (error) {
      addTest('5. getSession()', 'WARN', `Error: ${error.message}`);
    } else if (session) {
      const role = session.user?.user_metadata?.role || 'keine';
      addTest('5. getSession()', 'OK', `Eingeloggt als: ${session.user.email}, Role: ${role}, Expires: ${new Date(session.expires_at * 1000).toLocaleString('de-DE')}`);
    } else {
      addTest('5. getSession()', 'INFO', 'Keine aktive Session (normal wenn nicht eingeloggt)');
    }
  } catch (err) {
    addTest('5. getSession()', 'FAIL', `Exception: ${err.message}`);
  }

  // ── Test 6: signInWithPassword (absichtlich falsch) ────────
  try {
    const { data, error } = await sb.auth.signInWithPassword({
      email: 'diagnose-test@example.com',
      password: 'diagnose-test-' + Date.now()
    });
    if (error && error.message === 'Invalid login credentials') {
      addTest('6. signInWithPassword (Test)', 'OK', 'Auth-Endpunkt antwortet korrekt: "Invalid login credentials"');
    } else if (error) {
      addTest('6. signInWithPassword (Test)', 'WARN', `Unerwarteter Error: ${error.message} (Status: ${error.status})`);
    } else {
      addTest('6. signInWithPassword (Test)', 'WARN', 'Unerwartetes Ergebnis — kein Fehler bei Test-Credentials');
    }
  } catch (err) {
    addTest('6. signInWithPassword (Test)', 'FAIL', `Exception: ${err.message} — Auth-Endpunkt nicht erreichbar`);
  }

  // ── Test 7: Admin API (Vercel Serverless) ──────────────────
  try {
    const resp = await fetch('/api/admin?action=data&type=kpis');
    if (resp.status === 401) {
      addTest('7. Admin API (/api/admin)', 'OK', 'API antwortet mit 401 (erwartetes Verhalten ohne Auth-Token)');
    } else if (resp.ok) {
      addTest('7. Admin API (/api/admin)', 'OK', `HTTP ${resp.status}`);
    } else {
      const body = await resp.text();
      addTest('7. Admin API (/api/admin)', 'WARN', `HTTP ${resp.status}: ${body.slice(0, 200)}`);
    }
  } catch (err) {
    addTest('7. Admin API (/api/admin)', 'FAIL', `Fetch Error: ${err.message}`);
  }

  // ── Test 8: auth-guard.js Functions ────────────────────────
  try {
    // Load auth-guard.js and check if its functions are available
    const script = document.createElement('script');
    script.src = 'auth-guard.js';
    document.head.appendChild(script);
    await new Promise(r => { script.onload = r; script.onerror = () => r(); });

    if (typeof getSupabase === 'function') {
      const guardSb = getSupabase();
      const works = guardSb && typeof guardSb.auth === 'object';
      addTest('8. auth-guard.js', 'OK', `getSupabase() → ${works ? 'funktioniert' : 'DEFEKT'}`);
    } else {
      addTest('8. auth-guard.js', 'FAIL', 'getSupabase() ist nicht definiert nach Script-Load');
    }
  } catch (err) {
    addTest('8. auth-guard.js', 'FAIL', err.message);
  }

  // ── localStorage Dump ──────────────────────────────────────
  const lsData = document.getElementById('ls-data');
  const sbKeys = Object.keys(localStorage).filter(k => k.includes('supabase') || k.includes('sb-') || k.includes('auth'));
  if (sbKeys.length === 0) {
    lsData.textContent = 'Keine Supabase-Eintraege in localStorage gefunden.';
  } else {
    const dump = {};
    sbKeys.forEach(k => {
      try {
        const val = localStorage.getItem(k);
        dump[k] = val.length > 500 ? val.slice(0, 500) + '...' : val;
      } catch (e) {
        dump[k] = '[Fehler beim Lesen]';
      }
    });
    lsData.textContent = JSON.stringify(dump, null, 2);
  }

  // ── Console Errors ─────────────────────────────────────────
  setTimeout(() => {
    const errEl = document.getElementById('console-errors');
    if (capturedErrors.length > 0) {
      errEl.textContent = capturedErrors.join('\n');
      errEl.style.color = '#e74c3c';
    } else {
      errEl.textContent = 'Keine JavaScript-Fehler aufgetreten.';
      errEl.style.color = '#27ae60';
    }
  }, 500);
})();
</script>
</body>
</html>
