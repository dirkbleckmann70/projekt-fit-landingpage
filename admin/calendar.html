<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalender – Projekt Fit Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css">
  <link rel="stylesheet" href="../shared/tabler-custom.css">
</head>
<body class="page">
<script src="../shared/theme.js"></script>

<div id="sidebar"></div>

<div class="page-wrapper">
  <div class="page-header d-print-none" id="header"></div>
  <div class="page-body">
    <div class="container-fluid">

      <!-- Filter-Bar -->
      <div class="card mb-3">
        <div class="card-body py-2">
          <div class="row g-2 align-items-center">
            <div class="col-auto">
              <select class="form-select form-select-sm" id="trainer-filter" style="min-width:180px">
                <option value="">Alle Trainer</option>
              </select>
            </div>
            <div class="col-auto">
              <select class="form-select form-select-sm" id="city-filter" style="min-width:140px">
                <option value="">Alle Staedte</option>
              </select>
            </div>
            <div class="col-auto ms-auto">
              <div class="cal-legend">
                <span><span class="legend-dot" style="background:rgba(39,174,96,0.7)"></span> Verfuegbar</span>
                <span><span class="legend-dot" style="background:rgba(232,147,10,0.7)"></span> PT Ausstehend</span>
                <span><span class="legend-dot" style="background:rgba(64,145,108,0.85)"></span> PT Bestaetigt</span>
                <span><span class="legend-dot" style="background:rgba(155,89,182,0.7)"></span> Gruppentraining</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- FullCalendar -->
      <div class="card">
        <div class="card-body">
          <div id="calendar"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Event Detail Modal -->
<div class="modal modal-blur fade" id="event-modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="event-modal-title">Buchungsdetail</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="event-modal-body"></div>
      <div class="modal-footer">
        <button class="pf-btn pf-btn-neutral" data-bs-dismiss="modal">Schließen</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/js/tabler.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script src="../shared/design-tokens.js"></script>
<script src="../shared/constants.js"></script>
<script src="../shared/layout.js"></script>
<script src="../shared/toast.js"></script>
<script src="auth-guard.js"></script>
<script>
(async () => {
  var user = await checkAdminAuth();
  if (!user) return;
  document.getElementById('sidebar').innerHTML = renderAdminSidebar('calendar');
  document.getElementById('header').innerHTML  = renderAdminHeader('Kalender', user.email);
  initRealtimeToasts(getSupabase(), 'admin');

  // ─── State ──────────────────────────────────────────────────────
  var trainers = [];
  var calendar = null;

  // ─── Helpers ────────────────────────────────────────────────────
  function addHour(date, time) {
    var parts = time.split(':');
    var h = parseInt(parts[0], 10) + 1;
    return date + 'T' + String(h).padStart(2, '0') + ':' + parts[1];
  }

  function addMinutes(date, time, minutes) {
    var d = new Date(date + 'T' + time);
    d.setMinutes(d.getMinutes() + (minutes || 60));
    var y = d.getFullYear(); var m = String(d.getMonth()+1).padStart(2,'0'); var day = String(d.getDate()).padStart(2,'0');
    var hh = String(d.getHours()).padStart(2,'0'); var mm = String(d.getMinutes()).padStart(2,'0');
    return y + '-' + m + '-' + day + 'T' + hh + ':' + mm;
  }

  function addDay(dateStr) {
    var d = new Date(dateStr + 'T12:00:00');
    d.setDate(d.getDate() + 1);
    var y = d.getFullYear(); var m = String(d.getMonth()+1).padStart(2,'0'); var day = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + day;
  }

  function fmt(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  function toISODay(jsDay) {
    return jsDay === 0 ? 7 : jsDay;
  }

  // ─── Load Trainers ─────────────────────────────────────────────
  async function loadTrainers() {
    var res = await adminApi('/api/admin?action=data&type=calendar_trainers');
    trainers = res.data || [];
    var sel = document.getElementById('trainer-filter');
    var citySel = document.getElementById('city-filter');
    var cities = new Set();
    trainers.forEach(function(t) {
      // Mehr-Städte: alle zugewiesenen Städte (Fallback Einzelfeld city).
      var names = (t.cities && t.cities.length) ? t.cities.map(function(c){ return c.city; }) : (t.city ? [t.city] : []);
      var opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = t.full_name + (names.length ? ' (' + names.join(', ') + ')' : '');
      sel.appendChild(opt);
      names.forEach(function(n){ if (n) cities.add(n); });
    });
    Array.from(cities).sort().forEach(function(c) {
      var opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      citySel.appendChild(opt);
    });
  }

  // ─── Load Events for FullCalendar ──────────────────────────────
  async function loadEvents(info, success, failure) {
    try {
      var startDate = fmt(info.start);
      var endDate = fmt(info.end);
      var trainerId = document.getElementById('trainer-filter').value;
      var city = document.getElementById('city-filter').value;

      // Build trainer ID list (filter by city if set)
      var trainerIds = trainers.map(function(t) { return t.id; });
      if (city) trainerIds = trainers.filter(function(t) {
        // Mehr-Städte: Trainer matcht, wenn die Stadt in seinen Einsatzorten liegt (Fallback Einzelfeld).
        return (t.cities && t.cities.length) ? t.cities.some(function(c){ return c.city === city; }) : (t.city === city);
      }).map(function(t) { return t.id; });
      if (trainerId) trainerIds = [trainerId];
      if (trainerIds.length === 0) { success([]); return; }

      var idsParam = trainerIds.join(',');

      // Einzeln laden damit ein Fehler die anderen nicht blockiert
      var availRes = await adminApi('/api/admin?action=data&type=calendar_availability&trainer_ids=' + idsParam).catch(function(e) { console.error('Calendar availability:', e); return { data: [] }; });
      var bookingsRes = await adminApi('/api/admin?action=data&type=calendar_bookings&trainer_ids=' + idsParam + '&week_start=' + startDate + '&week_end=' + endDate).catch(function(e) { console.error('Calendar bookings:', e); return { data: [] }; });
      var gtRes = await adminApi('/api/admin?action=data&type=calendar_groups&trainer_ids=' + idsParam).catch(function(e) { console.error('Calendar groups:', e); return { data: [] }; });

      var events = [];

      // 1. Availability — normale Events (nicht background) damit sie nebeneinander stehen
      var availData = availRes.data || [];
      // Build trainer name lookup
      var trainerNameMap = {};
      trainers.forEach(function(t) {
        var parts = (t.full_name || '').split(' ');
        trainerNameMap[t.id] = parts[0] + (parts.length > 1 ? ' ' + parts[1].charAt(0) + '.' : '');
      });

      availData.forEach(function(a) {
        var tName = trainerNameMap[a.trainer_id] || 'Trainer';

        if (a.specific_date) {
          // Date-based entry: show on exact date
          if (a.specific_date >= startDate && a.specific_date <= endDate) {
            var st = a.start_time ? a.start_time.substring(0,5) : String(a.start_hour).padStart(2,'0') + ':00';
            var et = a.end_time ? a.end_time.substring(0,5) : String(a.end_hour).padStart(2,'0') + ':00';
            events.push({
              title: tName + ' ' + st + '–' + et,
              start: a.specific_date + 'T' + st,
              end: a.specific_date + 'T' + et,
              classNames: ['fc-event-available'],
              editable: false,
              extendedProps: { type: 'availability', trainerId: a.trainer_id }
            });
          }
        } else {
          // Legacy: day_of_week recurring — expand into visible range
          var current = new Date(info.start);
          var end = new Date(info.end);
          while (current < end) {
            var dateStr = fmt(current);
            var isoDay = toISODay(current.getDay());
            if (a.day_of_week === isoDay) {
              var startH = a.start_time ? a.start_time.substring(0,5) : String(a.start_hour).padStart(2,'0') + ':00';
              var endH = a.end_time ? a.end_time.substring(0,5) : String(a.end_hour).padStart(2,'0') + ':00';
              events.push({
                title: tName + ' ' + startH + '–' + endH,
                start: dateStr + 'T' + startH,
                end: dateStr + 'T' + endH,
                classNames: ['fc-event-available'],
                editable: false,
                extendedProps: { type: 'availability', trainerId: a.trainer_id }
              });
            }
            current.setDate(current.getDate() + 1);
          }
        }
      });

      // 2. PT Bookings
      (bookingsRes.data || []).forEach(function(b) {
        if (!b.scheduled_date || !b.scheduled_time) return;
        var isPending = b.status === 'pending';
        var isCancelled = ['cancelled', 'cancelled_by_trainer', 'cancelled_by_customer'].includes(b.status);
        var cls = isCancelled ? 'fc-event-cancelled' : (isPending ? 'fc-event-pt-pending' : 'fc-event-pt-confirmed');
        var statusLabel = isCancelled ? ' (Storniert)' : (isPending ? ' (Anfrage)' : '');
        events.push({
          title: 'PT: ' + (b.customer_name || 'Kunde') + statusLabel,
          start: b.scheduled_date + 'T' + b.scheduled_time,
          end: addHour(b.scheduled_date, b.scheduled_time),
          classNames: [cls],
          extendedProps: { type: 'pt', booking: b }
        });
      });

      // 3. GT Sessions
      (gtRes.data || []).forEach(function(g) {
        var time = g.scheduled_time || g.start_time;
        if (!time) return;

        // GT can be date-specific or recurring by day_of_week
        if (g.scheduled_date) {
          events.push({
            title: 'GT: ' + (g.title || g.name || 'Gruppe'),
            start: g.scheduled_date + 'T' + time,
            end: addMinutes(g.scheduled_date, time, g.duration_minutes || 60),
            classNames: ['fc-event-gt'],
            extendedProps: { type: 'gt', group: g }
          });
        } else if (g.day_of_week) {
          // Recurring: create events for each matching day in visible range
          var cur = new Date(info.start);
          var last = new Date(info.end);
          while (cur < last) {
            if (toISODay(cur.getDay()) === g.day_of_week) {
              var ds = fmt(cur);
              events.push({
                title: 'GT: ' + (g.title || g.name || 'Gruppe'),
                start: ds + 'T' + time,
                end: addMinutes(ds, time, g.duration_minutes || 60),
                classNames: ['fc-event-gt'],
                extendedProps: { type: 'gt', group: g }
              });
            }
            cur.setDate(cur.getDate() + 1);
          }
        }
      });

      // 4. Vacations (try loading, gracefully handle if table doesn't exist yet)
      try {
        var vacRes = await adminApi('/api/admin?action=data&type=trainer_vacations&trainer_ids=' + idsParam);
        (vacRes.data || []).forEach(function(v) {
          events.push({
            title: 'Urlaub' + (v.trainer_name ? ': ' + v.trainer_name : ''),
            start: v.start_date,
            end: addDay(v.end_date),
            allDay: true,
            classNames: ['fc-event-vacation'],
            extendedProps: { type: 'vacation', vacation: v }
          });
        });
      } catch(e) { /* trainer_vacations table may not exist yet */ }

      success(events);
    } catch(err) {
      console.error('Calendar load error:', err);
      failure(err);
    }
  }

  // ─── Event Click → Detail Modal ────────────────────────────────
  async function onEventClick(info) {
    var props = info.event.extendedProps;
    if (props.type === 'availability') return; // Availability blocks are info-only
    var titleEl = document.getElementById('event-modal-title');
    var bodyEl = document.getElementById('event-modal-body');

    if (props.type === 'pt' && props.booking) {
      var b = props.booking;

      // Load customer + trainer + health via API
      try {
        var detail = await adminApi('/api/admin?action=data&type=booking_detail&customer_id=' + b.customer_id + '&trainer_id=' + b.trainer_id);
        var cust = detail.customer || {};
        var trainer = detail.trainer || {};

        var healthNote = '–';
        if (detail.health) {
          var parts = [];
          if (detail.health.health_notes) parts.push(detail.health.health_notes);
          if (detail.health.limitations) parts.push(detail.health.limitations);
          if (parts.length) healthNote = parts.join(' | ');
        }

        var isCancelled = ['cancelled', 'cancelled_by_trainer', 'cancelled_by_customer'].includes(b.status);

        titleEl.textContent = isCancelled ? 'Buchung – STORNIERT' : 'Personal Training';
        bodyEl.innerHTML =
          (isCancelled ? '<div style="text-align:center;padding:10px 0"><span class="text-danger" style="font-size:18px;font-weight:700">STORNIERT</span></div>' : '') +
          '<div class="mb-2">' + statusBadge(b.status) + '</div>' +
          '<table class="table table-sm">' +
          '<tr><td class="text-secondary" style="width:140px">Kunde</td><td class="fw-bold">' + (cust.full_name || b.customer_name || '–') + '</td></tr>' +
          '<tr><td class="text-secondary">Kunde Tel.</td><td>' + (cust.phone || '–') + '</td></tr>' +
          '<tr><td class="text-secondary">Kunde E-Mail</td><td>' + (cust.email || '–') + '</td></tr>' +
          '<tr><td class="text-secondary">Trainer</td><td>' + (trainer.full_name || '–') + '</td></tr>' +
          '<tr><td class="text-secondary">Trainer Tel.</td><td>' + (trainer.phone || '–') + '</td></tr>' +
          '<tr><td class="text-secondary">Datum</td><td>' + formatDate(b.scheduled_date) + ' · ' + (b.scheduled_time || '–') + ' Uhr</td></tr>' +
          '<tr><td class="text-secondary">Kundenpreis</td><td class="fw-bold" style="color:var(--tblr-primary)">' + (isCancelled ? '0,00 €' : formatEuro(b.price_cents)) + '</td></tr>' +
          '<tr><td class="text-secondary">Trainer-Verguetung</td><td>' + (isCancelled ? '0,00 €' : formatEuro(b.trainer_payout_cents)) + '</td></tr>' +
          '<tr><td class="text-secondary">Gesundheitshinweise</td><td>' + healthNote + '</td></tr>' +
          '</table>';
      } catch(e) {
        titleEl.textContent = 'Personal Training';
        bodyEl.innerHTML =
          '<div class="mb-2">' + statusBadge(b.status) + '</div>' +
          '<table class="table table-sm">' +
          '<tr><td class="text-secondary" style="width:140px">Kunde</td><td class="fw-bold">' + (b.customer_name || '–') + '</td></tr>' +
          '<tr><td class="text-secondary">Datum</td><td>' + formatDate(b.scheduled_date) + ' · ' + (b.scheduled_time || '–') + ' Uhr</td></tr>' +
          '</table>';
      }
    } else if (props.type === 'gt' && props.group) {
      var g = props.group;

      var trainerName = '–';
      try {
        var gtDetail = await adminApi('/api/admin?action=data&type=booking_detail&trainer_id=' + g.trainer_id);
        trainerName = gtDetail.trainer?.full_name || '–';
      } catch(e) {}

      titleEl.textContent = 'Gruppentraining';
      bodyEl.innerHTML =
        '<table class="table table-sm">' +
        '<tr><td class="text-secondary" style="width:140px">Kurs</td><td class="fw-bold">' + (g.title || g.name || '–') + '</td></tr>' +
        '<tr><td class="text-secondary">Trainer</td><td>' + trainerName + '</td></tr>' +
        '<tr><td class="text-secondary">Datum</td><td>' + (g.scheduled_date ? formatDate(g.scheduled_date) : 'Wiederkehrend') + '</td></tr>' +
        '<tr><td class="text-secondary">Uhrzeit</td><td>' + (g.scheduled_time || g.start_time || '–') + ' Uhr</td></tr>' +
        '<tr><td class="text-secondary">Preis/Person</td><td>' + formatEuro(g.price_per_person_cents) + '</td></tr>' +
        '<tr><td class="text-secondary">Teilnehmer</td><td>' + (g.current_participants || 0) + ' / ' + (g.max_participants || '–') + '</td></tr>' +
        '</table>';
    } else if (props.type === 'vacation') {
      var v = props.vacation;
      titleEl.textContent = 'Urlaub';
      bodyEl.innerHTML =
        '<table class="table table-sm">' +
        '<tr><td class="text-secondary" style="width:140px">Trainer</td><td class="fw-bold">' + (v.trainer_name || '–') + '</td></tr>' +
        '<tr><td class="text-secondary">Von</td><td>' + formatDate(v.start_date) + '</td></tr>' +
        '<tr><td class="text-secondary">Bis</td><td>' + formatDate(v.end_date) + '</td></tr>' +
        (v.note ? '<tr><td class="text-secondary">Notiz</td><td>' + v.note + '</td></tr>' : '') +
        '</table>';
    } else {
      return; // Unknown type, do nothing
    }

    var modal = new bootstrap.Modal(document.getElementById('event-modal'));
    modal.show();
  }

  // ─── City Filter: Reset Trainer Dropdown ────────────────────────
  document.getElementById('city-filter').addEventListener('change', function() {
    var city = document.getElementById('city-filter').value;
    var tSel = document.getElementById('trainer-filter');
    tSel.innerHTML = '<option value="">Alle Trainer</option>';
    var filtered = city ? trainers.filter(function(t) {
      return (t.cities && t.cities.length) ? t.cities.some(function(c){ return c.city === city; }) : (t.city === city);
    }) : trainers;
    filtered.forEach(function(t) {
      var names = (t.cities && t.cities.length) ? t.cities.map(function(c){ return c.city; }) : (t.city ? [t.city] : []);
      var opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = t.full_name + (names.length ? ' (' + names.join(', ') + ')' : '');
      tSel.appendChild(opt);
    });
    calendar.refetchEvents();
  });

  document.getElementById('trainer-filter').addEventListener('change', function() {
    calendar.refetchEvents();
  });

  // ─── Init FullCalendar ─────────────────────────────────────────
  await loadTrainers();

  var calendarEl = document.getElementById('calendar');
  calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'timeGridWeek',
    locale: 'de',
    firstDay: 1,
    slotMinTime: '06:00:00',
    slotMaxTime: '22:00:00',
    slotDuration: '00:30:00',
    slotLabelInterval: '01:00',
    allDaySlot: true,
    expandRows: true,
    height: 'auto',
    nowIndicator: true,
    navLinks: true,
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'timeGridDay,timeGridWeek,dayGridMonth'
    },
    buttonText: {
      today: 'Heute',
      day: 'Tag',
      week: 'Woche',
      month: 'Monat'
    },
    events: function(info, success, failure) {
      loadEvents(info, success, failure);
    },
    eventClick: function(info) {
      onEventClick(info);
    },
    slotEventOverlap: false,
    eventDidMount: function(info) {
      if (info.event.extendedProps.type) {
        info.el.title = info.event.title;
      }
    }
  });
  calendar.render();
})();
</script>
</body>
</html>
