<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalender – Projekt Fit Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="../shared/tabler-custom.css">
  <style>
    /* ─── Calendar-Specific Styles ─────────────────────────────────── */
    .cal-toolbar {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .cal-toolbar select, .cal-toolbar button {
      font-family: inherit; font-size: 14px;
    }
    .cal-toolbar select {
      background: var(--tblr-bg-surface); color: var(--tblr-body-color); border: 1px solid var(--tblr-border-color);
      border-radius: 8px; padding: 8px 12px; min-width: 180px;
    }
    .cal-week-label {
      font-size: 15px; font-weight: 600; color: var(--tblr-body-color); min-width: 240px; text-align: center;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: 60px repeat(7, 1fr);
      border: 1px solid var(--tblr-border-color);
      border-radius: 12px;
      overflow: hidden;
      background: var(--tblr-bg-surface);
    }
    .cal-header {
      background: var(--tblr-bg-surface-secondary); font-weight: 600; font-size: 13px;
      padding: 10px 6px; text-align: center; border-bottom: 1px solid var(--tblr-border-color);
      color: var(--tblr-secondary);
    }
    .cal-header.today { color: var(--tblr-primary); }
    .cal-time {
      font-size: 12px; color: var(--tblr-muted); padding: 6px 8px;
      text-align: right; border-right: 1px solid var(--tblr-border-color);
      border-bottom: 1px solid var(--tblr-border-color-translucent);
      display: flex; align-items: center; justify-content: flex-end;
    }
    .cal-cell {
      min-height: 38px; border-bottom: 1px solid var(--tblr-border-color-translucent);
      border-right: 1px solid rgba(0,0,0,.05);
      cursor: pointer; position: relative; transition: filter .15s;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 500;
    }
    .cal-cell:hover { filter: brightness(1.25); }

    /* Farbcodierung */
    .cal-cell.available   { background: rgba(39,174,96,.22); }
    .cal-cell.pending     { background: rgba(243,156,18,.35); }
    .cal-cell.confirmed   { background: rgba(52,152,219,.4); }
    .cal-cell.gt          { background: rgba(155,89,182,.4); }
    .cal-cell.cancelled   { background: rgba(231,76,60,.2); text-decoration: line-through; color: var(--tblr-danger); }
    .cal-cell.empty       { background: transparent; }

    .cal-cell .cell-label {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      padding: 0 4px; max-width: 100%;
    }

    /* ─── Legende ──────────────────────────────────────────────────── */
    .cal-legend {
      display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px; font-size: 13px;
    }
    .cal-legend span { display: flex; align-items: center; gap: 6px; color: var(--tblr-secondary); }
    .legend-dot {
      width: 14px; height: 14px; border-radius: 4px; display: inline-block;
    }
  </style>
</head>
<body class="page">
<script src="../shared/theme.js"></script>

<div id="sidebar"></div>

<div class="page-wrapper">
  <div class="page-header d-print-none" id="header"></div>
  <div class="page-body">
    <div class="container-xl">

      <!-- Toolbar -->
      <div class="cal-toolbar">
        <select id="trainer-filter"><option value="">Alle Trainer</option></select>
        <select id="city-filter"><option value="">Alle Städte</option></select>
        <button class="btn btn-ghost-secondary btn-sm" id="prev-week">&larr; Vorherige</button>
        <div class="cal-week-label" id="week-label"></div>
        <button class="btn btn-ghost-secondary btn-sm" id="next-week">Nächste &rarr;</button>
        <button class="btn btn-secondary btn-sm" id="today-btn">Heute</button>
      </div>

      <!-- Grid -->
      <div class="cal-grid" id="cal-grid"></div>

      <!-- Legende -->
      <div class="cal-legend">
        <span><span class="legend-dot" style="background:rgba(39,174,96,.5)"></span> Verfügbar</span>
        <span><span class="legend-dot" style="background:rgba(243,156,18,.6)"></span> PT Ausstehend</span>
        <span><span class="legend-dot" style="background:rgba(52,152,219,.65)"></span> PT Bestätigt</span>
        <span><span class="legend-dot" style="background:rgba(155,89,182,.6)"></span> Gruppentraining</span>
        <span><span class="legend-dot" style="background:rgba(231,76,60,.45)"></span> Storniert</span>
        <span><span class="legend-dot" style="background:transparent;border:1px solid var(--tblr-border-color)"></span> Nicht verfügbar</span>
      </div>

    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal modal-blur fade" id="detail-modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-title">Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button class="btn btn-ghost-secondary btn-sm" data-bs-dismiss="modal">Schließen</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/js/tabler.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/constants.js"></script>
<script src="../shared/layout.js"></script>
<script src="../shared/toast.js"></script>
<script src="auth-guard.js"></script>
<script>
(async () => {
  const user = await checkAdminAuth();
  if (!user) return;
  document.getElementById('sidebar').innerHTML = renderAdminSidebar('calendar');
  document.getElementById('header').innerHTML  = renderAdminHeader('Kalender', user.email);
  initRealtimeToasts(getSupabase(), 'admin');

  // ─── State ──────────────────────────────────────────────────────
  let weekOffset = 0;
  let trainers = [];
  let allAvailability = [];
  let allBookings = [];
  let allGT = [];

  const HOURS_START = 6;
  const HOURS_END   = 22;
  const DAYS = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];

  // ─── Helpers ────────────────────────────────────────────────────
  function getWeekDates(offset) {
    const now = new Date();
    const day = now.getDay();                       // 0=So
    const diff = now.getDate() - day + (day === 0 ? -6 : 1); // Montag
    const monday = new Date(now.getFullYear(), now.getMonth(), diff + offset * 7);
    const dates = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      dates.push(d);
    }
    return dates;
  }

  function fmt(d) { return d.toISOString().split('T')[0]; }

  function fmtDE(d) {
    return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
  }

  function toISODay(jsDay) {
    return jsDay === 0 ? 7 : jsDay;
  }

  // ─── Load Trainers (über Admin-API) ───────────────────────────
  async function loadTrainers() {
    const { data } = await adminApi('/api/admin?action=data&type=calendar_trainers');
    trainers = data || [];
    const sel = document.getElementById('trainer-filter');
    const citySel = document.getElementById('city-filter');
    const cities = new Set();
    trainers.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.id; opt.textContent = t.full_name + (t.city ? ` (${t.city})` : '');
      sel.appendChild(opt);
      if (t.city) cities.add(t.city);
    });
    [...cities].sort().forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      citySel.appendChild(opt);
    });
  }

  // ─── Load Week Data (über Admin-API) ───────────────────────────
  async function loadWeekData() {
    const dates = getWeekDates(weekOffset);
    const weekStart = fmt(dates[0]);
    const weekEnd   = fmt(dates[6]);
    const trainerId = document.getElementById('trainer-filter').value;
    const city      = document.getElementById('city-filter').value;

    // Filter trainer IDs by city
    let trainerIds = trainers.map(t => t.id);
    if (city) trainerIds = trainers.filter(t => t.city === city).map(t => t.id);
    if (trainerId) trainerIds = [trainerId];
    if (trainerIds.length === 0) { allAvailability = []; allBookings = []; allGT = []; return; }

    const idsParam = trainerIds.join(',');

    const [availRes, bookingsRes, gtRes] = await Promise.all([
      adminApi(`/api/admin?action=data&type=calendar_availability&trainer_ids=${idsParam}`),
      adminApi(`/api/admin?action=data&type=calendar_bookings&trainer_ids=${idsParam}&week_start=${weekStart}&week_end=${weekEnd}`),
      adminApi(`/api/admin?action=data&type=calendar_groups&trainer_ids=${idsParam}`),
    ]);

    allAvailability = availRes.data || [];
    allBookings = bookingsRes.data || [];
    allGT = gtRes.data || [];
  }

  // ─── Render Grid ────────────────────────────────────────────────
  function renderGrid() {
    const dates = getWeekDates(weekOffset);
    const today = fmt(new Date());
    const grid = document.getElementById('cal-grid');

    // Week label
    document.getElementById('week-label').textContent =
      `${fmtDE(dates[0])} – ${fmtDE(dates[6])} ${dates[0].getFullYear()}`;

    // Header row
    let html = '<div class="cal-header"></div>'; // top-left corner
    dates.forEach((d, i) => {
      const isToday = fmt(d) === today;
      html += `<div class="cal-header${isToday ? ' today' : ''}">${DAYS[i]}<br>${fmtDE(d)}</div>`;
    });

    // Hour rows
    for (let h = HOURS_START; h <= HOURS_END; h++) {
      html += `<div class="cal-time">${String(h).padStart(2,'0')}:00</div>`;

      dates.forEach((d) => {
        const dateStr = fmt(d);
        const jsDay = d.getDay();
        const isoDay = toISODay(jsDay);

        // 1. Check availability for this hour
        const isAvail = allAvailability.some(a =>
          a.day_of_week === isoDay && h >= a.start_hour && h < a.end_hour
        );

        // 2. Check bookings for this cell
        const cellBookings = allBookings.filter(b =>
          b.scheduled_date === dateStr && b.scheduled_time &&
          parseInt(b.scheduled_time.split(':')[0], 10) === h
        );

        // 3. Check GT for this cell (by exact date OR recurring day)
        const cellGT = allGT.filter(gc => {
          const t = gc.scheduled_time || gc.start_time;
          if (!t) return false;
          const gcHour = parseInt(t.split(':')[0], 10);
          if (gcHour !== h) return false;
          return gc.scheduled_date === dateStr || (!gc.scheduled_date && gc.day_of_week === isoDay);
        });

        // Determine cell class & label
        let cls = 'empty';
        let label = '';
        let dataAttr = '';

        // Priority: Booking > GT > Available > Empty
        const activeBooking = cellBookings.find(b => ['pending','confirmed','checked_in'].includes(b.status));
        const cancelledBooking = cellBookings.find(b => ['cancelled','cancelled_by_trainer','cancelled_by_customer'].includes(b.status));

        if (activeBooking) {
          cls = activeBooking.status === 'pending' ? 'pending' : 'confirmed';
          label = activeBooking.status === 'pending' ? 'PT ⏳' : 'PT ✓';
          dataAttr = `data-booking-id="${activeBooking.id}"`;
        } else if (cellGT.length > 0) {
          cls = 'gt';
          label = 'GT';
          dataAttr = `data-gt-id="${cellGT[0].id}"`;
        } else if (cancelledBooking) {
          cls = 'cancelled';
          label = 'Storno';
          dataAttr = `data-booking-id="${cancelledBooking.id}"`;
        } else if (isAvail) {
          cls = 'available';
          label = '';
          dataAttr = `data-avail="1"`;
        }

        html += `<div class="cal-cell ${cls}" data-date="${dateStr}" data-hour="${h}" ${dataAttr}>
          <span class="cell-label">${label}</span>
        </div>`;
      });
    }

    grid.innerHTML = html;

    // Click handlers
    grid.querySelectorAll('.cal-cell').forEach(cell => {
      cell.addEventListener('click', () => onCellClick(cell));
    });
  }

  // ─── Cell Click → Modal (über Admin-API) ────────────────────────
  async function onCellClick(cell) {
    const bookingId = cell.dataset.bookingId;
    const gtId      = cell.dataset.gtId;
    const dateStr   = cell.dataset.date;
    const hour      = cell.dataset.hour;

    const modalEl = document.getElementById('detail-modal');
    const body  = document.getElementById('modal-body');
    const title = document.getElementById('modal-title');

    if (bookingId) {
      const booking = allBookings.find(b => b.id === bookingId);
      if (!booking) return;

      // Load customer + trainer + health via single API call
      const detail = await adminApi(`/api/admin?action=data&type=booking_detail&customer_id=${booking.customer_id}&trainer_id=${booking.trainer_id}`);
      const cust = detail.customer || {};
      const trainer = detail.trainer || {};

      let healthNote = '–';
      if (detail.health) {
        const parts = [];
        if (detail.health.health_notes) parts.push(detail.health.health_notes);
        if (detail.health.limitations) parts.push(detail.health.limitations);
        if (parts.length) healthNote = parts.join(' | ');
      }

      const isCancelled = ['cancelled','cancelled_by_trainer','cancelled_by_customer'].includes(booking.status);

      title.textContent = isCancelled ? 'Buchung – STORNIERT' : 'Buchungsdetails';
      body.innerHTML = `
        ${isCancelled ? '<div style="text-align:center;padding:10px 0"><span class="text-danger" style="font-size:18px;font-weight:700">STORNIERT</span></div>' : ''}
        <div class="row mb-2"><span class="col text-secondary">Datum</span><span class="col text-end fw-medium">${formatDate(booking.scheduled_date)}</span></div>
        <div class="row mb-2"><span class="col text-secondary">Uhrzeit</span><span class="col text-end fw-medium">${booking.scheduled_time || '–'} Uhr</span></div>
        <div class="row mb-2"><span class="col text-secondary">Status</span><span class="col text-end fw-medium">${statusBadge(booking.status)}</span></div>
        <div class="row mb-2"><span class="col text-secondary">Typ</span><span class="col text-end fw-medium">${booking.booking_type || 'PT'}</span></div>
        <div class="row mb-2"><span class="col text-secondary">Kunde</span><span class="col text-end fw-medium">${cust.full_name || '–'}</span></div>
        <div class="row mb-2"><span class="col text-secondary">Kunde Tel.</span><span class="col text-end fw-medium">${cust.phone || '–'}</span></div>
        <div class="row mb-2"><span class="col text-secondary">Kunde E-Mail</span><span class="col text-end fw-medium">${cust.email || '–'}</span></div>
        <div class="row mb-2"><span class="col text-secondary">Trainer</span><span class="col text-end fw-medium">${trainer.full_name || '–'}</span></div>
        <div class="row mb-2"><span class="col text-secondary">Trainer Tel.</span><span class="col text-end fw-medium">${trainer.phone || '–'}</span></div>
        <div class="row mb-2"><span class="col text-secondary">Kundenpreis</span><span class="col text-end fw-medium">${isCancelled ? '0,00 €' : formatEuro(booking.price_cents)}</span></div>
        <div class="row mb-2"><span class="col text-secondary">Trainer-Vergütung</span><span class="col text-end fw-medium">${isCancelled ? '0,00 €' : formatEuro(booking.trainer_payout_cents)}</span></div>
        <div class="row mb-2"><span class="col text-secondary">Gesundheitshinweise</span><span class="col text-end fw-medium">${healthNote}</span></div>
      `;
    } else if (gtId) {
      const gc = allGT.find(g => g.id === gtId);
      if (!gc) return;
      const detail = await adminApi(`/api/admin?action=data&type=booking_detail&trainer_id=${gc.trainer_id}`);
      const trainerName = detail.trainer?.full_name || '–';

      title.textContent = 'Gruppentraining';
      body.innerHTML = `
        <div class="row mb-2"><span class="col text-secondary">Kurs</span><span class="col text-end fw-medium">${gc.title || '–'}</span></div>
        <div class="row mb-2"><span class="col text-secondary">Datum</span><span class="col text-end fw-medium">${gc.scheduled_date ? formatDate(gc.scheduled_date) : 'Wiederkehrend'}</span></div>
        <div class="row mb-2"><span class="col text-secondary">Uhrzeit</span><span class="col text-end fw-medium">${gc.scheduled_time || gc.start_time || '–'} Uhr</span></div>
        <div class="row mb-2"><span class="col text-secondary">Trainer</span><span class="col text-end fw-medium">${trainerName}</span></div>
        <div class="row mb-2"><span class="col text-secondary">Preis/Person</span><span class="col text-end fw-medium">${formatEuro(gc.price_per_person_cents)}</span></div>
        <div class="row mb-2"><span class="col text-secondary">Teilnehmer</span><span class="col text-end fw-medium">${gc.current_participants || 0} / ${gc.max_participants || '–'}</span></div>
      `;
    } else {
      // Available or empty
      const isAvail = cell.dataset.avail === '1';
      title.textContent = isAvail ? 'Verfügbar' : 'Nicht verfügbar';
      body.innerHTML = `
        <div class="row mb-2"><span class="col text-secondary">Datum</span><span class="col text-end fw-medium">${formatDate(dateStr)}</span></div>
        <div class="row mb-2"><span class="col text-secondary">Uhrzeit</span><span class="col text-end fw-medium">${String(hour).padStart(2,'0')}:00 Uhr</span></div>
        <div class="row mb-2"><span class="col text-secondary">Status</span><span class="col text-end fw-medium">${isAvail ? 'Verfügbar, keine Buchung' : 'Keine Verfügbarkeit eingetragen'}</span></div>
      `;
    }

    new bootstrap.Modal(modalEl).show();
  }

  // ─── Events ─────────────────────────────────────────────────────
  document.getElementById('prev-week').addEventListener('click', () => { weekOffset--; refresh(); });
  document.getElementById('next-week').addEventListener('click', () => { weekOffset++; refresh(); });
  document.getElementById('today-btn').addEventListener('click', () => { weekOffset = 0; refresh(); });
  document.getElementById('trainer-filter').addEventListener('change', refresh);
  document.getElementById('city-filter').addEventListener('change', () => {
    // Reset trainer filter when city changes
    const city = document.getElementById('city-filter').value;
    const tSel = document.getElementById('trainer-filter');
    tSel.innerHTML = '<option value="">Alle Trainer</option>';
    const filtered = city ? trainers.filter(t => t.city === city) : trainers;
    filtered.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.id; opt.textContent = t.full_name + (t.city ? ` (${t.city})` : '');
      tSel.appendChild(opt);
    });
    refresh();
  });

  async function refresh() {
    await loadWeekData();
    renderGrid();
  }

  // ─── Init ───────────────────────────────────────────────────────
  await loadTrainers();
  await refresh();
})();
</script>
</body>
</html>
