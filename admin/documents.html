<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dokumente – Projekt Fit Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .folder-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .folder-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .folder-header:hover { background: rgba(255,255,255,0.02); }
    .folder-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      font-weight: 700;
    }
    .folder-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: rgba(232,147,10,0.12);
      color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .folder-count {
      font-size: 12px;
      color: var(--text-muted);
      background: rgba(255,255,255,0.06);
      padding: 2px 10px;
      border-radius: 50px;
    }
    .folder-chevron {
      color: var(--text-muted);
      transition: transform 0.2s;
      font-size: 18px;
    }
    .folder-card.open .folder-chevron { transform: rotate(90deg); }
    .folder-body {
      display: none;
      padding: 0 20px 16px;
      border-top: 1px solid var(--border);
    }
    .folder-card.open .folder-body { display: block; }
    .file-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .file-row:last-of-type { border-bottom: none; }
    .file-type-badge {
      width: 36px; height: 36px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
      flex-shrink: 0;
    }
    .file-type-pdf { background: rgba(231,76,60,0.12); color: #e74c3c; }
    .file-type-img { background: rgba(52,152,219,0.12); color: #3498db; }
    .file-type-doc { background: rgba(39,174,96,0.12); color: #27ae60; }
    .file-info { flex: 1; min-width: 0; }
    .file-name {
      font-size: 13px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .file-meta { font-size: 11px; color: var(--text-muted); }
    .file-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .folder-upload-area {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.04);
    }
    .empty-folder {
      padding: 20px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }
  </style>
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="header" id="header"></header>
    <div class="content">

      <div id="alert-box" class="alert"></div>

      <div class="table-header" style="background:var(--bg-card);border:1px solid var(--border);border-radius:14px;margin-bottom:20px">
        <div class="table-title">Dokumente</div>
        <div class="table-actions">
          <span class="text-muted" style="font-size:12px">Storage Bucket: admin-documents</span>
        </div>
      </div>

      <div id="folders-container">
        <div class="loading-overlay"><span class="spinner"></span> Dokumente werden geladen...</div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-guard.js"></script>
<script>
  const FOLDERS = [
    { id: 'vertraege', label: 'Verträge', icon: '&#x1F4DD;' },
    { id: 'agb-rechtliches', label: 'AGB & Rechtliches', icon: '&#x2696;' },
    { id: 'vorlagen', label: 'Vorlagen', icon: '&#x1F4CB;' },
    { id: 'sonstiges', label: 'Sonstiges', icon: '&#x1F4C1;' },
  ];

  let allDocuments = [];

  (async () => {
    const user = await checkAdminAuth();
    if (!user) return;

    document.getElementById('sidebar').innerHTML = renderSidebar('documents');
    document.getElementById('header').innerHTML = renderHeader('Dokumente');

    await loadDocuments();
  })();

  async function loadDocuments() {
    try {
      const res = await adminApi('/api/admin?action=documents');
      allDocuments = res.data || [];
      renderFolders();
    } catch (err) {
      document.getElementById('folders-container').innerHTML =
        `<p class="text-error" style="padding:20px">Fehler: ${err.message}</p>`;
    }
  }

  function renderFolders() {
    const container = document.getElementById('folders-container');

    container.innerHTML = FOLDERS.map(folder => {
      const files = allDocuments.filter(d => d.folder === folder.id);
      return `
        <div class="folder-card" id="folder-${folder.id}">
          <div class="folder-header" onclick="toggleFolder('${folder.id}')">
            <div class="folder-title">
              <div class="folder-icon">${folder.icon}</div>
              <span>${folder.label}</span>
              <span class="folder-count">${files.length} Datei${files.length !== 1 ? 'en' : ''}</span>
            </div>
            <span class="folder-chevron">&#x25B6;</span>
          </div>
          <div class="folder-body">
            ${files.length === 0
              ? '<div class="empty-folder">Keine Dokumente in diesem Ordner.</div>'
              : files.map(f => renderFileRow(f)).join('')}
            <div class="folder-upload-area">
              <label class="btn btn-secondary btn-sm" style="cursor:pointer;display:inline-flex;align-items:center;gap:6px">
                <input type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" style="display:none"
                  onchange="uploadFiles('${folder.id}', this)">
                + Datei hochladen
              </label>
              <span class="upload-status" id="status-${folder.id}" style="font-size:12px;color:var(--text-muted);margin-left:8px"></span>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderFileRow(f) {
    const date = f.created_at ? new Date(f.created_at).toLocaleDateString('de-DE') : '–';
    const size = f.size_bytes ? formatFileSize(f.size_bytes) : '–';
    const typeClass = getFileTypeClass(f.content_type, f.filename);
    const typeLabel = getFileTypeLabel(f.content_type, f.filename);
    const uploader = f.uploaded_by ? ` · ${f.uploaded_by}` : '';

    return `
      <div class="file-row">
        <div class="file-type-badge ${typeClass}">${typeLabel}</div>
        <div class="file-info">
          <div class="file-name" title="${f.filename}">${f.filename}</div>
          <div class="file-meta">${date} · ${size}${uploader}</div>
        </div>
        <div class="file-actions">
          <button class="btn btn-secondary btn-sm" style="font-size:11px;padding:4px 10px" onclick="viewDocument('${f.path}')">Anzeigen</button>
          <button class="btn btn-icon btn-icon-delete" onclick="deleteDocument('${f.id}','${f.path}','${f.filename.replace(/'/g, "\\'")}')">&#x1F5D1;</button>
        </div>
      </div>
    `;
  }

  function getFileTypeClass(contentType, filename) {
    if (contentType === 'application/pdf' || filename.endsWith('.pdf')) return 'file-type-pdf';
    if (contentType?.startsWith('image/')) return 'file-type-img';
    return 'file-type-doc';
  }

  function getFileTypeLabel(contentType, filename) {
    if (contentType === 'application/pdf' || filename.endsWith('.pdf')) return 'PDF';
    if (contentType?.startsWith('image/')) return 'IMG';
    if (filename.endsWith('.doc') || filename.endsWith('.docx')) return 'DOC';
    return 'FILE';
  }

  function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function toggleFolder(folderId) {
    document.getElementById('folder-' + folderId).classList.toggle('open');
  }

  async function viewDocument(path) {
    try {
      const res = await adminApi('/api/admin?action=get-file-url', {
        method: 'POST',
        body: JSON.stringify({ path, bucket: 'admin-documents' }),
      });
      if (res.url) window.open(res.url, '_blank');
    } catch (err) {
      showAlert('alert-box', 'Fehler: ' + err.message, 'error');
    }
  }

  async function deleteDocument(id, path, filename) {
    if (!confirm(`"${filename}" wirklich löschen?`)) return;
    try {
      // DELETE mit JSON body – adminApi setzt Content-Type
      const token = (await getSupabase().auth.getSession()).data.session?.access_token;
      const resp = await fetch('/api/admin?action=documents', {
        method: 'DELETE',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
        },
        body: JSON.stringify({ id, path }),
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Löschen fehlgeschlagen');

      showAlert('alert-box', 'Dokument gelöscht!', 'success');
      await loadDocuments();
    } catch (err) {
      showAlert('alert-box', 'Fehler: ' + err.message, 'error');
    }
  }

  async function uploadFiles(folder, input) {
    const files = input.files;
    if (!files || files.length === 0) return;

    const status = document.getElementById('status-' + folder);
    status.textContent = 'Hochladen...';

    const formData = new FormData();
    formData.append('folder', folder);
    for (let i = 0; i < files.length; i++) {
      formData.append('files', files[i]);
    }

    try {
      const token = (await getSupabase().auth.getSession()).data.session?.access_token;
      const resp = await fetch('/api/admin?action=documents', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` },
        body: formData,
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Upload fehlgeschlagen');

      status.textContent = '';
      showAlert('alert-box', `${result.files.length} Datei(en) hochgeladen!`, 'success');
      await loadDocuments();
      // Ordner offen lassen
      document.getElementById('folder-' + folder).classList.add('open');
    } catch (err) {
      status.textContent = '';
      showAlert('alert-box', 'Upload-Fehler: ' + err.message, 'error');
    }

    input.value = '';
  }
</script>

</body>
</html>
