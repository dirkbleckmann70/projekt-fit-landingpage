<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — Pulsly</title>
  <meta name="description" content="Pulsly Merchandise — T-Shirts, Jacken, Hosen und Trainingsgeräte. Kommt bald." />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="/shared/pulsly-styles.css" />
  <style>
    .coming-soon-wrapper {
      min-height: calc(100vh - 70px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .coming-soon {
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    .coming-soon-icon {
      font-size: 3.5rem;
      color: var(--orange);
      margin-bottom: 24px;
    }
    .coming-soon h1 {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 800;
      margin-bottom: 12px;
    }
    .coming-soon .subtitle {
      font-size: 1.05rem;
      color: var(--text-secondary);
      margin-bottom: 40px;
      line-height: 1.6;
    }
    .notify-form {
      display: flex;
      gap: 10px;
      width: 100%;
    }
    .notify-form input {
      flex: 1;
      padding: 14px 18px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.25s ease;
    }
    .notify-form input::placeholder {
      color: var(--text-muted);
    }
    .notify-form input:focus {
      border-color: var(--orange);
    }
    .notify-form button {
      padding: 14px 24px;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.25s ease, transform 0.25s ease;
      white-space: nowrap;
    }
    .notify-form button:hover {
      background: #c96a2f;
      transform: translateY(-1px);
    }
    .notify-success {
      display: none;
      color: var(--success);
      font-size: 0.95rem;
      margin-top: 16px;
    }
    @media (max-width: 480px) {
      .notify-form {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div id="pulsly-nav"></div>

  <div class="coming-soon-wrapper">
    <div class="coming-soon">
      <div class="coming-soon-icon">
        <i class="ti ti-shopping-bag"></i>
      </div>
      <h1>Pulsly Merchandise</h1>
      <p class="subtitle">Kommt bald — T-Shirts, Jacken, Hosen & Trainingsgeräte</p>
      <form class="notify-form" id="notify-form">
        <input type="email" placeholder="Deine E-Mail-Adresse" required />
        <button type="submit">Benachrichtigen</button>
      </form>
      <p class="notify-success" id="notify-success">Du wirst benachrichtigt, sobald der Shop live geht.</p>
    </div>
  </div>

  <div id="pulsly-footer"></div>

  <script src="/shared/pulsly-nav.js"></script>
  <script>
    renderPulslyNav('');
    renderPulslyFooter();

    document.getElementById('notify-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var email = this.querySelector('input').value;
      fetch('/api/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, list: 'shop-notify' })
      }).then(function() {
        document.getElementById('notify-form').style.display = 'none';
        document.getElementById('notify-success').style.display = 'block';
      }).catch(function() {
        document.getElementById('notify-form').style.display = 'none';
        document.getElementById('notify-success').style.display = 'block';
      });
    });
  </script>
</body>
</html>
